# ============================================
# MESH VALIDITY CHECK
# ============================================
# Vérification de la validité des mesh

[gcode_macro _CHECK_MESH_VALIDITY]
description: Check if mesh needs recalibration based on age and usage
variable_needs_recalibration: 0
gcode:
  {% set mesh_profile = params.PROFILE|string %}
  {% set svv = printer.save_variables.variables %}
  {% set recal_needed = 0 %}  # Variable locale pour calcul

  #  PRIORITÉ 1 : Vérifier le flag de forçage AVANT tout
  {% if printer["gcode_macro _MESH_TRACKING"].force_recalibrate == 1 %}
    M118 ========================================
    M118 MESH RECALIBRATION FORCED BY USER
    M118 ========================================
    {% set recal_needed = 1 %}
  # PRIORITÉ 1.5 : Vérifier si le hash correspond
  {% elif printer["gcode_macro _MESH_HASH_SETTINGS"].enable_hash == 1 and printer["gcode_macro _MESH_HASH_SETTINGS"].hash_match_found == 0 %}
    M118 ========================================
    M118 NO MESH MATCHING CURRENT HASH
    M118 Object size/position different from saved mesh
    M118 ========================================
    {% set recal_needed = 1 %}
  {% else %}
    # PRIORITÉ 2 : Vérifier d'abord le timestamp (si 0 = expiré, forcer recalibration)
    {% set mesh_key = "mesh_" + mesh_profile|lower %}
    {% set timestamp = svv.get(mesh_key + '_timestamp', 0) %}
    {% set count = svv.get(mesh_key + '_count', 0) %}

    {% if timestamp == 0 %}
      M118 Mesh {mesh_profile} EXPIRED (timestamp=0), forcing recalibration
      {% set recal_needed = 1 %}
    {% elif timestamp > 0 %}
      {% set age_days = ((printer.system_stats.cputime - timestamp) / 86400)|int %}
      {% set max_age = printer["gcode_macro _MESH_TRACKING"].mesh_max_age_days %}
      {% set max_prints = printer["gcode_macro _MESH_TRACKING"].mesh_max_prints %}

      M118 Mesh {mesh_profile}: {age_days} days old, {count} prints

      {% if age_days > max_age %}
        M118 MESH TOO OLD ({age_days} > {max_age} days), recalibrating
        {% set recal_needed = 1 %}
      {% elif count > max_prints %}
        M118 MESH OVERUSED ({count} > {max_prints} prints), recalibrating
        {% set recal_needed = 1 %}
      {% else %}
        M118 Mesh valid: {max_age - age_days} days, {max_prints - count} prints remaining
        {% set recal_needed = 0 %}
        
        # PRIORITÉ 3 : Si mesh valide, vérifier le hash pour optimisation
        {% if printer["gcode_macro _MESH_HASH_SETTINGS"].enable_hash == 1 %}
          MESH_FIND_MATCHING
          {% set hash_match = printer["gcode_macro _MESH_HASH_SETTINGS"].hash_match_found %}
          {% if hash_match == 1 %}
            M118 Hash match found, can reuse existing mesh
          {% endif %}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}
  
  # Définir la variable UNE SEULE FOIS à la fin
  SET_GCODE_VARIABLE MACRO=_CHECK_MESH_VALIDITY VARIABLE=needs_recalibration VALUE={recal_needed}
  M118 DEBUG: _CHECK_MESH_VALIDITY result: needs_recalibration={recal_needed}

[gcode_macro _UPDATE_MESH_METADATA]
description: Update mesh timestamp and print count
gcode:
  {% set profile = params.PROFILE|string %}
  {% set action = params.ACTION|default('use')|string %}
  {% set svv = printer.save_variables.variables %}
  {% set key = "mesh_" + profile|lower %}

  {% if action == 'create' %}
    {% set current_time = printer.system_stats.cputime|int %}
    SAVE_VARIABLE VARIABLE={key}_timestamp VALUE={current_time}
    SAVE_VARIABLE VARIABLE={key}_count VALUE=0
    M118 Mesh {profile} created and tracked
    
    # Save mesh hash if enabled
    {% if printer["gcode_macro _MESH_HASH_SETTINGS"].enable_hash == 1 %}
      MESH_SAVE_HASH PROFILE={profile}
    {% endif %}
  {% else %}
    {% set current_count = svv.get(key + '_count', 0) %}
    {% set new_count = current_count + 1 %}
    SAVE_VARIABLE VARIABLE={key}_count VALUE={new_count}
    M118 Mesh {profile} usage count: {new_count}
  {% endif %}
