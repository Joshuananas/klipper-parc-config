# ============================================
# MESH VALIDITY CHECK
# ============================================
# Vérification de la validité des mesh

[gcode_macro _CHECK_MESH_VALIDITY]
description: Check verified mesh context, print limit and explicit invalidation
variable_needs_recalibration: 0
gcode:
  {% set mesh_profile = params.PROFILE|string %}
  {% set svv = printer.save_variables.variables %}
  {% set recal_needed = 0 %}  # Variable locale pour calcul

  #  PRIORITÉ 1 : Vérifier le flag de forçage AVANT tout
  {% if printer["gcode_macro _MESH_TRACKING"].force_recalibrate == 1 or svv.get('mesh_force_recalibrate', 0)|int == 1 %}
    M118 ========================================
    M118 MESH RECALIBRATION FORCED BY USER
    M118 ========================================
    {% set recal_needed = 1 %}
  # PRIORITÉ 1.5 : Vérifier si le hash correspond
  {% elif printer["gcode_macro _MESH_HASH_SETTINGS"].hash_match_found != 1 or printer['gcode_macro _MESH_HASH_SETTINGS'].matched_profile != mesh_profile %}
    M118 ========================================
    M118 NO MESH MATCHING CURRENT HASH
    M118 Object size/position different from saved mesh
    M118 ========================================
    {% set recal_needed = 1 %}
  {% else %}
    # PRIORITÉ 2 : Vérifier d'abord le timestamp (si 0 = expiré, forcer recalibration)
    {% set mesh_key = "mesh_" + mesh_profile|lower %}
    {% set entry = svv.get('mesh_cache_v1', {}).get(mesh_profile, {}) %}
    {% set count = entry.get('count', 0) %}
    {% set max_prints = printer['gcode_macro _MESH_TRACKING'].mesh_max_prints|int %}
    {% if max_prints < 1 %}
      {action_raise_error('Mesh print limit must be positive')}
    {% endif %}
    {% if count is not number or count < 1 or count != count|int or count >= max_prints %}
      M118 Mesh {mesh_profile}: missing or exhausted print counter, recalibrating
      {% set recal_needed = 1 %}
    {% else %}
      M118 Mesh {mesh_profile}: {count}/{max_prints} prints, no calendar expiry
      {% set recal_needed = 0 %}

      # PRIORITÉ 3 : Si mesh valide, vérifier le hash pour optimisation
      M118 Verified context match found, can reuse existing mesh
    {% endif %}
  {% endif %}
  
  # Définir la variable UNE SEULE FOIS à la fin
  SET_GCODE_VARIABLE MACRO=_CHECK_MESH_VALIDITY VARIABLE=needs_recalibration VALUE={recal_needed}
  M118 DEBUG: _CHECK_MESH_VALIDITY result: needs_recalibration={recal_needed}

[gcode_macro _UPDATE_MESH_METADATA]
description: Update mesh timestamp and print count
gcode:
  {% set profile = params.PROFILE|string %}
  {% set action = params.ACTION|default('use')|string %}
  {% set svv = printer.save_variables.variables %}
  {% set key = "mesh_" + profile|lower %}

  {% if action == 'create' %}
    SAVE_VARIABLE VARIABLE={key}_count VALUE=1
    M118 Mesh {profile} created and tracked
    
    # Save mesh hash if enabled
    {% if printer["gcode_macro _MESH_HASH_SETTINGS"].enable_hash == 1 %}
      MESH_SAVE_HASH PROFILE={profile}
    {% endif %}
  {% else %}
    {% set cache = dict(svv.get('mesh_cache_v1', {})) %}
    {% set entry = dict(cache.get(profile, {})) %}
    {% set count = entry.get('count', 0) %}
    {% set limit = printer['gcode_macro _MESH_TRACKING'].mesh_max_prints|int %}
    {% set measured = printer.bed_mesh.profiles.get(profile, {}) %}
    {% set matrix = namespace(rows=[]) %}
    {% for row in measured.get('points', []) %}
      {% set matrix.rows = matrix.rows + [row|map('round', 6)|list] %}
    {% endfor %}
    {% set snapshot = {'points': matrix.rows, 'mesh_params': dict(measured.get('mesh_params', {}))} %}
    {% if action != 'use' or entry.get('schema') != 1 or entry.get('mesh') != snapshot or count is not number or not 1 <= count < limit or count != count|int %}
      {action_raise_error('Cannot count use of an unverified or exhausted mesh')}
    {% endif %}
    {% set new_count = count|int + 1 %}
    {% set unused = entry.update({'count': new_count}) %}
    {% set unused = cache.update({profile: entry}) %}
    SAVE_VARIABLE VARIABLE=mesh_cache_v1 VALUE="{cache}"
    SAVE_VARIABLE VARIABLE={key}_count VALUE={new_count}
    M118 Mesh {profile} usage count: {new_count}
  {% endif %}
