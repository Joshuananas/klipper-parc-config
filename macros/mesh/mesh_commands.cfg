# ============================================
# MESH USER COMMANDS
# ============================================
# Commandes utilisateur pour gestion mesh

[gcode_macro MESH_FORCE_RECALIBRATION]
description: Force mesh recalibration on next print
gcode:
  SET_GCODE_VARIABLE MACRO=_MESH_TRACKING VARIABLE=force_recalibrate VALUE=1
  M118 ========================================
  M118 MESH RECALIBRATION FORCED
  M118 Next print will recalibrate mesh
  M118 ========================================
  M117 Next print: FORCE MESH RECAL

[gcode_macro MESH_CLEAR_FORCE]
description: Clear forced mesh recalibration flag
gcode:
  SET_GCODE_VARIABLE MACRO=_MESH_TRACKING VARIABLE=force_recalibrate VALUE=0
  M118 Mesh force flag cleared

[gcode_macro MESH_CLEAR_PROFILE]
description: Delete a specific mesh profile
gcode:
  {% set PROFILE = params.PROFILE|default('')|string %}
  
  {% if PROFILE == '' %}
    M118 Error: PROFILE parameter required
    M118 Usage: CLEAR_MESH PROFILE=mesh_name
  {% elif printer.bed_mesh.profiles[PROFILE] is defined %}
    BED_MESH_PROFILE REMOVE={PROFILE}
    M118 Mesh profile '{PROFILE}' deleted
  {% else %}
    M118 Error: Mesh profile '{PROFILE}' not found
  {% endif %}

[gcode_macro MESH_CLEAR_ALL]
description: Delete all saved mesh profiles
gcode:
  {% set profiles = printer.bed_mesh.profiles %}
  {% set count = 0 %}
  
  M118 ========================================
  M118 CLEARING ALL MESH PROFILES
  M118 ========================================
  
  {% for profile_name in profiles %}
    {% if profile_name != 'default' %}
      BED_MESH_PROFILE REMOVE={profile_name}
      M118 Deleted: {profile_name}
      {% set count = count + 1 %}
    {% endif %}
  {% endfor %}
  
  M118 ========================================
  M118 Cleared {count} mesh profile(s)
  M118 ========================================
  M117 Mesh force cleared

[gcode_macro MESH_SHOW_STATUS]
description: Display status of all mesh profiles
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set force_flag = printer["gcode_macro _MESH_TRACKING"].force_recalibrate %}
  
  M118 ========================================
  M118 MESH STATUS REPORT
  M118 ========================================
  
  {% if force_flag == 1 %}
    M118   FORCE RECALIBRATION ACTIVE
    M118 Next print will recalibrate mesh
    M118 ========================================
  {% endif %}
  
  {% set materials = ['PLA', 'PETG', 'ABS', 'TPU'] %}
  {% set surfaces = ['PEI', 'SMOOTH', 'ENG', 'COOL'] %}
  
  {% for material in materials %}
    {% for surface in surfaces %}
      {% set profile = material + "_" + surface %}
      {% set key = "mesh_" + profile|lower %}
      {% set timestamp = svv.get(key + '_timestamp', 0) %}
      {% set count = svv.get(key + '_count', 0) %}
      
      {% if timestamp > 0 %}
        {% set age_days = ((printer.system_stats.cputime - timestamp) / 86400)|int %}
        M118 {profile}: {age_days}d old, {count} prints
      {% endif %}
    {% endfor %}
  {% endfor %}
  
  M118 ========================================
