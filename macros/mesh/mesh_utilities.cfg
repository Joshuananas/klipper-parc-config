# ============================================
# MESH HASH SYSTEM
# ============================================
# Systeme de hash pour reutiliser les mesh identiques

[gcode_macro _MESH_HASH_SETTINGS]
description: Mesh hash system configuration
variable_max_age_days: 0              # Age maximum du mesh (jours)
variable_max_stored_meshes: 10        # Nombre max de mesh stockes
variable_position_tolerance: 5        # Tolerance position (mm)
variable_size_tolerance: 2            # Tolerance taille (mm)
variable_enable_hash: 1               # Activer/desactiver le systeme
variable_current_hash: ""             # Hash actuel
variable_hash_match_found: 0          # Match trouve
variable_matched_profile: ""          # Profil correspondant
variable_current_profile: ""
variable_current_bed: 0
variable_current_bounds: []
variable_current_config: {}
variable_current_limits: []
gcode:

[gcode_macro _MESH_PREPARE]
gcode:
  MESH_CALCULATE_HASH {rawparams}
  MESH_FIND_MATCHING {rawparams}
  _CHECK_MESH_VALIDITY {rawparams}

[gcode_macro MESH_CALCULATE_HASH]
description: Calculate mesh hash from object geometry
gcode:
  {% set material = params.MATERIAL|default("PLA")|string %}
  {% set surface = params.SURFACE|default("PEI")|string %}
  {% set profile = params.PROFILE|default(material ~ '_' ~ surface)|lower %}
  {% for name in [material, surface, profile] %}
    {% if not name.replace('_', '').replace('-', '').replace('+', '').isalnum() %}
      {action_raise_error('Invalid mesh material, surface or profile name')}
    {% endif %}
  {% endfor %}
  {% set bed = params.BED|default(printer.heater_bed.target)|float(none) %}
  {% if bed is none or not 0 < bed < printer.configfile.settings.heater_bed.max_temp|float %}
    {action_raise_error('Mesh context requires a valid positive bed target')}
  {% endif %}
  {% set cfg = printer.configfile.settings %}
  {% set probe = cfg.get('bltouch', cfg.get('probe', {})) %}
  {% set limits = [cfg.bed_mesh.mesh_min[0], cfg.bed_mesh.mesh_min[1], cfg.bed_mesh.mesh_max[0], cfg.bed_mesh.mesh_max[1]] %}
  {% if 'gcode_macro _MESH_PROFILE_SETTINGS' in printer %}
    {% set margins = printer['gcode_macro _MESH_PROFILE_SETTINGS'] %}
    {% set ox = probe.get('x_offset', 0)|float %}
    {% set oy = probe.get('y_offset', 0)|float %}
    {% set limits = [margins.margin_min + [ox, 0]|max, margins.margin_min + [oy, 0]|max, cfg.stepper_x.position_max - margins.margin_max - ox|abs, cfg.stepper_y.position_max - margins.margin_max - oy|abs] %}
  {% endif %}
  {% set fingerprint = {'bed_mesh': cfg.bed_mesh, 'probe': probe, 'stepper_z': cfg.stepper_z, 'limits': limits, 'hardware': printer['gcode_macro _HARDWARE_CONFIG'].active_profile} %}
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_limits VALUE="{limits}"
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_profile VALUE='"{profile}"'
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_bed VALUE={bed}
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_config VALUE="{fingerprint}"
  
  # Get object bounds from exclude_object
  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  
  {% if all_points|length > 0 %}
    {% set bounds = [all_points|map(attribute=0)|min|float, all_points|map(attribute=1)|min|float, all_points|map(attribute=0)|max|float, all_points|map(attribute=1)|max|float] %}
    SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_bounds VALUE="{bounds}"
    # Calculate bounding box
    {% set x_min = (all_points | map(attribute=0) | min)|round(0)|int %}
    {% set x_max = (all_points | map(attribute=0) | max)|round(0)|int %}
    {% set y_min = (all_points | map(attribute=1) | min)|round(0)|int %}
    {% set y_max = (all_points | map(attribute=1) | max)|round(0)|int %}
    
    {% set size_x = (x_max - x_min)|round(0)|int %}
    {% set size_y = (y_max - y_min)|round(0)|int %}
    
    # Round position to tolerance
    {% set tolerance = printer["gcode_macro _MESH_HASH_SETTINGS"].position_tolerance|int %}
    {% set pos_x = ((x_min / tolerance)|round(0) * tolerance)|int %}
    {% set pos_y = ((y_min / tolerance)|round(0) * tolerance)|int %}
    
    # Round size to tolerance
    {% set size_tol = printer["gcode_macro _MESH_HASH_SETTINGS"].size_tolerance|int %}
    {% set size_x_rounded = ((size_x / size_tol)|round(0) * size_tol)|int %}
    {% set size_y_rounded = ((size_y / size_tol)|round(0) * size_tol)|int %}
    
    # Create hash: MATERIAL_SURFACE_SIZExSIZE_POSxPOS (lowercase)
    {% set hash = (material + "_" + surface + "_" + size_x_rounded|string + "x" + size_y_rounded|string + "_" + pos_x|string + "x" + pos_y|string)|lower %}
    
    SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_hash VALUE='"{hash}"'
    
    M118 ========================================
    M118 MESH HASH CALCULATED
    M118 ========================================
    M118 Material: {material}
    M118 Surface: {surface}
    M118 Size: {size_x_rounded}x{size_y_rounded}mm
    M118 Position: {pos_x}x{pos_y}mm
    M118 Hash: {hash}
    M118 ========================================
    
  {% else %}
    # No object data, use material + surface only (lowercase)
    {% set hash = (material + "_" + surface + "_FULL")|lower %}
    SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_bounds VALUE="[]"
    SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_hash VALUE='"{hash}"'
    M118 No object data, using full bed mesh: {hash}
  {% endif %}

[gcode_macro MESH_FIND_MATCHING]
description: Find existing mesh matching current hash
gcode:
  {% set current_hash = printer["gcode_macro _MESH_HASH_SETTINGS"].current_hash %}
  {% set max_age = printer["gcode_macro _MESH_HASH_SETTINGS"].max_age_days|int %}
  {% set enable_hash = printer["gcode_macro _MESH_HASH_SETTINGS"].enable_hash|int %}
  {% set context = printer['gcode_macro _MESH_HASH_SETTINGS'] %}
  {% set profile = params.PROFILE|default(context.current_profile)|lower %}
  {% set cache = printer.save_variables.variables.get('mesh_cache_v1', {}) %}
  {% set entry = cache.get(profile, {}) if cache is mapping else {} %}
  {% set measured = printer.bed_mesh.profiles.get(profile, {}) %}
  {% set matrix = namespace(rows=[]) %}
  {% for row in measured.get('points', []) %}
    {% set matrix.rows = matrix.rows + [row|map('round', 6)|list] %}
  {% endfor %}
  {% set snapshot = {'points': matrix.rows, 'mesh_params': dict(measured.get('mesh_params', {}))} %}
  {% set match = entry is mapping and entry.get('schema') == 1 and profile == context.current_profile and entry.get('hash') == current_hash and entry.get('bed') == context.current_bed and entry.get('bounds') == context.current_bounds and entry.get('config') == context.current_config and measured and entry.get('mesh') == snapshot %}
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=matched_profile VALUE='""'
  
  {% if enable_hash == 0 %}
    M118 Mesh hash system disabled
    SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=hash_match_found VALUE=0
  {% elif current_hash == "" %}
    M118 No hash calculated
    SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=hash_match_found VALUE=0
  {% else %}
    # Database feature not implemented - always create new mesh
    {% if match %}
      SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=hash_match_found VALUE=1
      SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=matched_profile VALUE='"{profile}"'
      M118 Verified saved mesh matches geometry, temperature and configuration: {profile}
    {% else %}
      SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=hash_match_found VALUE=0
      M118 No verified mesh matches current context: {current_hash}
    {% endif %}
  {% endif %}

[gcode_macro MESH_SAVE_HASH]
description: Save current mesh with hash
gcode:
  {% set current_hash = printer["gcode_macro _MESH_HASH_SETTINGS"].current_hash %}
  {% set profile = params.PROFILE|string %}
  
  {% if current_hash != "" %}
    # Save to database (disabled - database not implemented)
    # _ADD_MESH_TO_DATABASE HASH={current_hash} PROFILE={profile}
    {% set context = printer['gcode_macro _MESH_HASH_SETTINGS'] %}
    {% if profile != context.current_profile or profile not in printer.bed_mesh.profiles %}
      {action_raise_error('Mesh metadata does not match the prepared profile')}
    {% endif %}
    {% set measured = printer.bed_mesh.profiles[profile] %}
    {% set matrix = namespace(rows=[]) %}
    {% for row in measured.points %}
      {% set matrix.rows = matrix.rows + [row|map('round', 6)|list] %}
    {% endfor %}
    {% set snapshot = {'points': matrix.rows, 'mesh_params': dict(measured.mesh_params)} %}
    {% set grid = measured.mesh_params %}
    {% set limits = context.current_limits %}
    {% set bounds = context.current_bounds if context.current_bounds else limits %}
    {% set tol_x = 0.01 * (measured.points[0]|length - 1) + 0.000001 %}
    {% set tol_y = 0.01 * (measured.points|length - 1) + 0.000001 %}
    {% set covered = grid.min_x <= [bounds[0], limits[0]]|max + 0.000001 and grid.min_y <= [bounds[1], limits[1]]|max + 0.000001 and grid.max_x + tol_x >= [bounds[2], limits[2]]|min and grid.max_y + tol_y >= [bounds[3], limits[3]]|min %}
    {% set stable = context.current_bed > 0 and context.current_bed - 2 <= printer.heater_bed.temperature <= context.current_bed + 2 %}
    {% set source = printer.save_variables.variables.get('mesh_cache_v1', {}) %}
    {% set cache = dict(source) if source is mapping else {} %}
    {% set unused = cache.pop(profile, none) %}
    {% if covered and stable %}
      {% set record = {'schema': 1, 'hash': current_hash, 'bed': context.current_bed, 'bounds': context.current_bounds, 'config': context.current_config, 'mesh': snapshot, 'count': 1} %}
      {% set unused = cache.update({profile: record}) %}
      M118 Verified mesh cached: {profile}, print 1
    {% else %}
      M118 Mesh saved but not eligible for reuse: coverage or temperature unverified
    {% endif %}
    SAVE_VARIABLE VARIABLE=mesh_cache_v1 VALUE="{cache}"
    SAVE_VARIABLE VARIABLE=mesh_force_recalibrate VALUE=0
    SET_GCODE_VARIABLE MACRO=_MESH_TRACKING VARIABLE=force_recalibrate VALUE=0
  {% endif %}

[gcode_macro MESH_CLEAR_OLD_HASHES]
description: Clean up old mesh hashes
gcode:
  {% set source = printer.save_variables.variables.get('mesh_cache_v1', {}) %}
  {% set cache = {} %}
  {% for profile, entry in source.items() if source is mapping %}
    {% if profile in printer.bed_mesh.profiles %}
      {% set unused = cache.update({profile: entry}) %}
    {% endif %}
  {% endfor %}
  SAVE_VARIABLE VARIABLE=mesh_cache_v1 VALUE="{cache}"
  M118 Removed metadata for absent profiles; measured profiles unchanged

[gcode_macro MESH_GET_HASH_STATUS]
description: Display mesh hash system status
gcode:
  {% set enable = printer["gcode_macro _MESH_HASH_SETTINGS"].enable_hash %}
  {% set max_age = printer["gcode_macro _MESH_HASH_SETTINGS"].max_age_days %}
  {% set max_stored = printer["gcode_macro _MESH_HASH_SETTINGS"].max_stored_meshes %}
  {% set current_hash = printer["gcode_macro _MESH_HASH_SETTINGS"].current_hash %}
  
  M118 ========================================
  M118 MESH HASH SYSTEM STATUS
  M118 ========================================
  M118 Enabled: {enable}
  M118 Calendar expiry: disabled
  M118 Print limit: {printer['gcode_macro _MESH_TRACKING'].mesh_max_prints}
  M118 Current hash: {current_hash}
  M118 Verified cache entries: {printer.save_variables.variables.get('mesh_cache_v1', {})|length}
  M118 ========================================

# ============================================
# CONSOLIDATED MESH UTILITIES
# ============================================
# Macros consolidées depuis: system/mesh_database.cfg, 
# macros/utilities/maintenance.cfg, macros/mesh/mesh_adaptive_profile.cfg

[gcode_macro LIST_MESH_DATABASE]
description: List all stored mesh profiles in database
# Source: system/mesh_database.cfg
gcode:
  M118 ========================================
  M118 MESH DATABASE
  M118 ========================================
  
  {% set profiles = printer.bed_mesh.profiles %}
  {% if profiles|length > 0 %}
    M118 Stored profiles: {profiles|length}
    {% for profile in profiles %}
      M118 - {profile}
    {% endfor %}
  {% else %}
    M118 No mesh profiles stored
  {% endif %}
  M118 ========================================

[gcode_macro CLEAR_MESH_DATABASE]
description: Clear all mesh profiles from database
# Source: system/mesh_database.cfg
gcode:
  EXPIRE_ALL_MESHES
  M118 ⚠️  Clearing all mesh profiles...
  
  {% set profiles = printer.bed_mesh.profiles %}
  {% for profile in profiles %}
    BED_MESH_PROFILE REMOVE={profile}
    M118 Removed: {profile}
  {% endfor %}
  
  M118 ✅ Mesh database cleared
  SAVE_CONFIG

[gcode_macro EXPIRE_ALL_MESHES]
description: Mark all meshes as expired for recalibration
# Source: macros/utilities/maintenance.cfg
gcode:
  M118 ========================================
  M118 EXPIRE ALL MESHES
  M118 ========================================
  M118 Marking all mesh profiles as expired
  M118 Next print will trigger mesh recalibration
  
  # Reset hash state
  SAVE_VARIABLE VARIABLE=mesh_cache_v1 VALUE="{dict()}"
  SAVE_VARIABLE VARIABLE=mesh_force_recalibrate VALUE=1
  SET_GCODE_VARIABLE MACRO=_MESH_TRACKING VARIABLE=force_recalibrate VALUE=1
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=current_hash VALUE='""'
  SET_GCODE_VARIABLE MACRO=_MESH_HASH_SETTINGS VARIABLE=hash_match_found VALUE=0
  
  M118 ✅ All meshes expired
  M118 ========================================

