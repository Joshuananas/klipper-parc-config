# ============================================
# ADAPTIVE BED MESH UNIVERSEL
# ============================================
# Calcule automatiquement les limites mesh pour N'IMPORTE quelle machine
# basé sur position_max et probe_offset
#
# AVANTAGES:
# - Fonctionne sur toutes les machines (Genius Pro, SWX2, Ender, Voron, etc.)
# - Pas de dimensions en dur
# - Prend en compte l'offset du palpeur
# - Marges de sécurité configurables
# ============================================

[gcode_macro _MESH_PROFILE_SETTINGS]
description: Marges de sécurité pour le mesh (en mm)
variable_margin_min: 15    # Marge depuis les bords min (X=0, Y=0)
variable_margin_max: 15    # Marge avant les bords max (position_max)
gcode:
  # Variables seulement

[gcode_macro GET_MESH_LIMITS_FOR_PROFILE]
description: Calcule et affiche les limites mesh pour la machine actuelle
gcode:
  {% set settings = printer["gcode_macro _MESH_PROFILE_SETTINGS"] %}
  
  # Récupérer dimensions du plateau
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  
  # Récupérer offset du palpeur (bltouch, probe, etc.)
  {% if 'bltouch' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.bltouch.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.bltouch.y_offset|float %}
  {% elif 'probe' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.probe.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.probe.y_offset|float %}
  {% else %}
    {% set probe_x_offset = 0 %}
    {% set probe_y_offset = 0 %}
  {% endif %}
  
  # Calculer limites mesh avec marges de sécurité
  # Pour mesh_min : si offset positif, on doit partir plus loin
  # Pour mesh_max : on doit toujours soustraire la valeur absolue de l'offset
  {% set mesh_min_x = settings.margin_min + (probe_x_offset if probe_x_offset > 0 else 0) %}
  {% set mesh_min_y = settings.margin_min + (probe_y_offset if probe_y_offset > 0 else 0) %}
  {% set mesh_max_x = x_max - settings.margin_max - (probe_x_offset if probe_x_offset > 0 else -probe_x_offset) %}
  {% set mesh_max_y = y_max - settings.margin_max - (probe_y_offset if probe_y_offset > 0 else -probe_y_offset) %}
  
  M118 ═══════════════════════════════════════
  M118 📏 MESH LIMITS (AUTO-CALCULATED)
  M118 ═══════════════════════════════════════
  M118 Plateau: {x_max}x{y_max}mm
  M118 Probe offset: X{probe_x_offset} Y{probe_y_offset}
  M118 Marges: min={settings.margin_min}mm max={settings.margin_max}mm
  M118 ───────────────────────────────────────
  M118 Mesh min: [{mesh_min_x|round(1)}, {mesh_min_y|round(1)}]
  M118 Mesh max: [{mesh_max_x|round(1)}, {mesh_max_y|round(1)}]
  M118 ═══════════════════════════════════════

# ============================================
# OVERRIDE KAMP POUR ADAPTATION PROFIL
# ============================================

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _KAMP_BED_MESH_CALIBRATE
gcode:
  {% set settings = printer["gcode_macro _MESH_PROFILE_SETTINGS"] %}
  
  # Récupérer dimensions du plateau
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  
  # Récupérer offset du palpeur (bltouch, probe, etc.)
  {% if 'bltouch' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.bltouch.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.bltouch.y_offset|float %}
  {% elif 'probe' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.probe.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.probe.y_offset|float %}
  {% else %}
    {% set probe_x_offset = 0 %}
    {% set probe_y_offset = 0 %}
  {% endif %}
  
  # Calculer limites mesh avec marges de sécurité
  # Pour mesh_min : si offset positif, on doit partir plus loin
  # Pour mesh_max : on doit toujours soustraire la valeur absolue de l'offset
  {% set mesh_min_x = settings.margin_min + (probe_x_offset if probe_x_offset > 0 else 0) %}
  {% set mesh_min_y = settings.margin_min + (probe_y_offset if probe_y_offset > 0 else 0) %}
  {% set mesh_max_x = x_max - settings.margin_max - (probe_x_offset if probe_x_offset > 0 else -probe_x_offset) %}
  {% set mesh_max_y = y_max - settings.margin_max - (probe_y_offset if probe_y_offset > 0 else -probe_y_offset) %}
  
  M118 🔍 Plateau: {x_max}x{y_max}mm | Probe offset: X{probe_x_offset} Y{probe_y_offset}
  M118 📐 Mesh limits: [{mesh_min_x|round(1)},{mesh_min_y|round(1)}] → [{mesh_max_x|round(1)},{mesh_max_y|round(1)}]
  
  # Appeler KAMP avec les limites calculées
  _KAMP_BED_MESH_CALIBRATE MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} {rawparams}
