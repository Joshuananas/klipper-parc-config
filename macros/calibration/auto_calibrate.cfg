# ============================================
# AUTO CALIBRATE ALL
# ============================================
# Orchestrateur de calibration automatique complete

[gcode_macro AUTO_CALIBRATE_ALL]
description: Fully automated PID calibration (no manual intervention)
gcode:
  {% set force = params.FORCE|default(0)|int %}
  {% set skip_pid = params.SKIP_PID|default(0)|int %}
  
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  M118 Auto Calibrate All: ~2h30 | PID + Thermal + Mesh (PLA/PETG/ABS)
  M118 ENSURE BED IS CLEAR | Press CANCEL to abort | Starting in 10s...
  
  # Verification etat imprimante
  {% if printer.print_stats.state == "printing" %}
    M118 ERROR: Cannot calibrate during print
    {action_raise_error("Print in progress")}
  {% endif %}
  
  # Pause 10 secondes pour permettre annulation
  G4 P10000
  
  # Determiner quelles calibrations sont necessaires
  {% set tracker = printer["gcode_macro _CALIBRATION_TRACKER"] %}
  {% set now = printer.system_stats.cputime|int %}
  
  {% set needs_pid = force == 1 %}
  {% if tracker.last_pid_extruder == 0 or ((now - tracker.last_pid_extruder) / 86400)|int >= tracker.interval_pid %}
    {% set needs_pid = 1 %}
  {% endif %}
  
  {% set needs_zoffset = force == 1 %}
  {% if tracker.last_zoffset == 0 or ((now - tracker.last_zoffset) / 86400)|int >= tracker.interval_zoffset %}
    {% set needs_zoffset = 1 %}
  {% endif %}
  
  {% set needs_thermal = force == 1 %}
  {% if tracker.last_thermal_benchmark == 0 or ((now - tracker.last_thermal_benchmark) / 86400)|int >= 90 %}
    {% set needs_thermal = 1 %}
  {% endif %}
  
  {% set needs_mesh = force == 1 %}
  {% if tracker.last_bed_mesh == 0 or ((now - tracker.last_bed_mesh) / 86400)|int >= 30 %}
    {% set needs_mesh = 1 %}
  {% endif %}
  
  {% set total_steps = 0 %}
  {% if needs_pid and not skip_pid %}{% set total_steps = total_steps + 2 %}{% endif %}
  {% if needs_thermal %}{% set total_steps = total_steps + 1 %}{% endif %}
  {% if needs_mesh %}{% set total_steps = total_steps + 3 %}{% endif %}
  
  M118 Steps: {total_steps}
  
  {% set current_step = 0 %}
  
  # ETAPE 1 : HOMING INITIAL
  M118 [0/{total_steps}] Homing
  G28
  SAFE_POSITION
  
  # ETAPE 2 : PID BED
  {% if needs_pid and not skip_pid %}
    {% set current_step = current_step + 1 %}
    M118 [{current_step}/{total_steps}] PID Bed
    _AUTO_PID_BED
    LED_CALIBRATION  # Restaurer effet orchestration
    G28
    SAFE_POSITION
  {% endif %}
  
  # ETAPE 3 : PID EXTRUDER
  {% if needs_pid and not skip_pid %}
    {% set current_step = current_step + 1 %}
    M118 [{current_step}/{total_steps}] PID Extruder
    _AUTO_PID_EXTRUDER
    LED_CALIBRATION  # Restaurer effet orchestration
    G28
    SAFE_POSITION
  {% endif %}
  
  # ETAPE 4 : THERMAL DEFORMATION BENCHMARK
  {% if needs_thermal %}
    {% set current_step = current_step + 1 %}
    M118 [{current_step}/{total_steps}] Thermal Benchmark (~60 min)
    M118 Cooling bed to 30°C for baseline...
    TURN_OFF_HEATERS
    M118 Waiting for passive cooling (no heating)...
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=30  # Attente passive (pas de régulation)
    G4 P60000  # Stabilisation 60s
    THERMAL_DEFORMATION_BENCHMARK
    LED_CALIBRATION  # Restaurer effet orchestration
    G28
    SAFE_POSITION
    TURN_OFF_HEATERS
    G4 P60000
  {% endif %}
  
  # ETAPE 5 : BED MESH CALIBRATIONS (PLA, PETG, ABS)
  {% if needs_mesh %}
    # Mesh PLA (60°C)
    {% set current_step = current_step + 1 %}
    M118 [{current_step}/{total_steps}] Mesh PLA
    BED_MESH_CALIBRATE_HEATED MATERIAL=PLA
    LED_CALIBRATION  # Restaurer effet orchestration
    G28
    SAFE_POSITION
    
    # Mesh PETG (80°C)
    {% set current_step = current_step + 1 %}
    M118 [{current_step}/{total_steps}] Mesh PETG
    BED_MESH_CALIBRATE_HEATED MATERIAL=PETG
    LED_CALIBRATION  # Restaurer effet orchestration
    G28
    SAFE_POSITION
    
    # Mesh ABS (100°C)
    {% set current_step = current_step + 1 %}
    M118 [{current_step}/{total_steps}] Mesh ABS
    BED_MESH_CALIBRATE_HEATED MATERIAL=ABS
    LED_CALIBRATION  # Restaurer effet orchestration
    G28
    SAFE_POSITION
  {% endif %}
  
  
  # ETAPE FINALE : Cleanup
  M118 Calibration Complete!
  LED_SUCCESS
  G4 P2000
  G28
  SAFE_POSITION
  TURN_OFF_HEATERS
  M84
  STOP_LED_EFFECTS
  _SET_LED_IDLE
  
  {% if needs_pid and not skip_pid %}M118 ✅ PID: Bed + Extruder (3 temps each){% endif %}
  {% if needs_thermal %}M118 ✅ Thermal Benchmark{% endif %}
  {% if needs_mesh %}M118 ✅ Mesh: PLA/PETG/ABS{% endif %}
  M118 Manual: Z-Offset, Input Shaper, PA, Flow | GET_CALIBRATION_STATUS
  M118 Saving config, restarting in 5s...
  G4 P5000
  SAVE_CONFIG

