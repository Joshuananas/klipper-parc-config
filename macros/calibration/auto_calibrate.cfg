gcode:
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  M118 Quick Calibrate: ~40min | PID + PLA Mesh | Starting in 10s...
  
  {% if printer.print_stats.state == "printing" %}
    M118 ERROR: Cannot calibrate during print
    {action_raise_error("Print in progress")}
  {% endif %}
  
  G4 P10000
  
  # Homing
  G28
  SAFE_POSITION
  
  M118 [1/3] PID Bed 60°C
  PID_TUNE_BED TEMP=60
  G28
  SAFE_POSITION
  
  M118 [2/3] PID Extruder 200°C
  PID_TUNE_EXTRUDER TEMP=200
  G28
  SAFE_POSITION
  
  M118 [3/3] Mesh PLA
  BED_MESH_CALIBRATE_HEATED MATERIAL=PLA
  
  G28
  SAFE_POSITION
  TURN_OFF_HEATERS
  M84
  
  M118 Quick Calibration Complete |  M118 PID calibration complete!
  LED_SUCCESS
  G4 P2000
  STOP_LED_EFFECTS
  _SET_LED_IDLE
  M118 Saving config, restarting in 5s...
  G4 P5000
  SAVE_CONFIG

