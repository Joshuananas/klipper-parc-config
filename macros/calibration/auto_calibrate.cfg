# ============================================
# AUTO CALIBRATE - OPTION MAINTENANCE
# ============================================

[gcode_macro AUTO_CALIBRATE_MAINTENANCE]
description: Calibration intelligente selon intervalles (uniquement ce qui est nécessaire)
gcode:
  M118 Smart Maintenance: Checking calibration intervals...
  
  {% if printer.print_stats.state == "printing" %}
    M118 ERROR: Cannot calibrate during print
    {action_raise_error("Print in progress")}
  {% endif %}
  
  # Vérifier les intervalles
  {% set tracker = printer["gcode_macro _CALIBRATION_TRACKER"] %}
  {% set now = printer.system_stats.cputime|int %}
  
  {% set needs_pid = 0 %}
  {% if tracker.last_pid_extruder == 0 or ((now - tracker.last_pid_extruder) / 86400)|int >= tracker.interval_pid %}
    {% set needs_pid = 1 %}
  {% endif %}
  
  {% set needs_thermal = 0 %}
  {% if tracker.last_thermal_benchmark == 0 or ((now - tracker.last_thermal_benchmark) / 86400)|int >= tracker.interval_thermal_benchmark %}
    {% set needs_thermal = 1 %}
  {% endif %}
  
  {% set needs_mesh = 0 %}
  {% if tracker.last_bed_mesh == 0 or ((now - tracker.last_bed_mesh) / 86400)|int >= tracker.interval_bed_mesh %}
    {% set needs_mesh = 1 %}
  {% endif %}
  
  {% if needs_pid == 0 and needs_thermal == 0 and needs_mesh == 0 %}
    M118 ✅ All calibrations up to date | No maintenance needed
  {% else %}
    M118 Needed:{% if needs_pid %} PID{% endif %}{% if needs_thermal %} Thermal{% endif %}{% if needs_mesh %} Mesh{% endif %} | Starting in 10s...
    G4 P10000
    
    G28
    SAFE_POSITION
    
    {% if needs_pid %}
      M118 [PID] Calibrating...
      _AUTO_PID_BED
      G28
      SAFE_POSITION
      _AUTO_PID_EXTRUDER
      G28
      SAFE_POSITION
    {% endif %}
    
    {% if needs_thermal %}
      M118 [Thermal] Benchmark...
      THERMAL_DEFORMATION_BENCHMARK
      G28
      SAFE_POSITION
      TURN_OFF_HEATERS
      G4 P60000
    {% endif %}
    
    {% if needs_mesh %}
      M118 [Mesh] Calibrating all materials...
      BED_MESH_CALIBRATE_HEATED MATERIAL=PLA
      G28
      SAFE_POSITION
      BED_MESH_CALIBRATE_HEATED MATERIAL=PETG
      G28
      SAFE_POSITION
      BED_MESH_CALIBRATE_HEATED MATERIAL=ABS
      G28
      SAFE_POSITION
    {% endif %}
    
    TURN_OFF_HEATERS
    M84
    
    M118 Maintenance Complete | Saving config, restarting in 5s...
    G4 P5000
    SAVE_CONFIG
  {% endif %}