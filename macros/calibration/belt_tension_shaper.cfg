#################################################
# BELT TENSION DIAGNOSTIC (MÉTHODE VORON)
#################################################
# Guide pour vérifier la tension des courroies
# selon la méthode Voron (mesure acoustique)
#
# MÉTHODE:
# - Mesure manuelle avec app spectromètre audio
# - Fréquence cible: ~110 Hz (100-120 Hz)
# - Portée de mesure: 150mm
#
# WORKFLOW RECOMMANDÉ:
# 1. BELT_TENSION_POSITION AXIS=X  # Positionne pour mesure
# 2. Mesurer avec app smartphone   # Pincer courroie
# 3. BELT_TENSION_CHECK AXIS=X     # Consulter guide
# 4. BELT_TENSION_ADJUST           # Ajuster si nécessaire
# 5. Répéter pour axe Y
# 6. SHAPER_CALIBRATE              # Input Shaper après
#
# COMMANDES DISPONIBLES:
# - BELT_TENSION_POSITION       : Positionne machine
# - BELT_TENSION_CHECK          : Guide détaillé
# - BELT_TENSION_ADJUST         : Guide ajustement
# - BELT_TENSION_COMPARE        : Workflow avant/après
# - BELT_TENSION_RESONANCE_TEST : Test résonance adaptatif (±15%)
# - BELT_TENSION_HELP           : Aide complète
#################################################

# ============================================
# POSITIONNEMENT POUR MESURE
# ============================================

# ============================================
# DIAGNOSTIC TENSION COURROIES
# ============================================

[gcode_macro BELT_TENSION_POSITION]
description: Positionne pour mesure tension courroie (AXIS=X/Y)
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  
  # Vérifier axe valide
  {% if axis not in ['X', 'Y'] %}
    M118 ERREUR: Axe invalide '{axis}'
    M118 Axes valides: X, Y
    {action_raise_error("Axe invalide")}
  {% endif %}
  
  M118 
  M118 ========================================
  M118 POSITIONNEMENT POUR MESURE - AXE {axis}
  M118 ========================================
  
  # Homing si nécessaire
  {% if not printer.toolhead.homed_axes %}
    M118 Homing automatique...
    G28
    G4 P1000
  {% endif %}
  
  G90
  
  {% if axis == 'X' %}
    # Position pour mesure courroie X
    # Centre approximatif pour avoir ~150mm de portée
    G1 Z50 F3000
    G1 Y150 F6000
    G1 X150 F3000
    
    M118 
    M118 POSITION AXE X:
    M118 - Extrudeur positionné au centre
    M118 - Portée courroie: ~150mm
    M118 
    M118 MESURE:
    M118 1. Pincez la courroie X entre:
    M118    - Poulie moteur X (arrière)
    M118    - Point d'attache chariot
    M118 2. Vérifiez que la portée libre ≈ 150mm
    M118 3. Plumez la courroie comme une guitare
    M118 4. Lisez la fréquence sur l'app
    
  {% elif axis == 'Y' %}
    # Position pour mesure courroie Y
    G1 Z50 F3000
    G1 X150 F6000
    G1 Y150 F3000
    
    M118 
    M118 POSITION AXE Y:
    M118 - Plateau positionné au centre
    M118 - Portée courroie: ~150mm
    M118 
    M118 MESURE:
    M118 1. Pincez la courroie Y entre:
    M118    - Poulie moteur Y (gauche/droite)
    M118    - Point d'attache plateau
    M118 2. Vérifiez que la portée libre ≈ 150mm
    M118 3. Plumez la courroie comme une guitare
    M118 4. Lisez la fréquence sur l'app
  {% endif %}
  
  M118 
  M118 FRÉQUENCE CIBLE: ~110 Hz (100-120 Hz)
  M118 
  M118 Après mesure:
  M118   BELT_TENSION_CHECK AXIS={axis}
  M118 ========================================

[gcode_macro BELT_TENSION_CHECK]
description: Guide pour vérifier tension courroie (AXIS=X/Y)
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  
  # Vérifier axe valide
  {% if axis not in ['X', 'Y'] %}
    M118 ERREUR: Axe invalide '{axis}'
    M118 Axes valides: X, Y
    {action_raise_error("Axe invalide")}
  {% endif %}
  
  M118 
  M118 ========================================
  M118 DIAGNOSTIC TENSION COURROIE - AXE {axis}
  M118 ========================================
  M118 
  M118 MÉTHODE VORON (RECOMMANDÉE):
  M118 
  M118 1. POSITIONNEMENT:
  M118    Déplacez la tête pour avoir une portée
  M118    de 150mm de courroie libre
  M118 
  M118 2. MESURE:
  M118    - Installez une app spectromètre audio:
  M118      * iOS: Sound Spectrum Analysis
  M118      * Android: Spectroid
  M118      * Les deux: Gates Carbon Drive
  M118    - Pincez/plumez la courroie comme
  M118      une corde de guitare
  M118    - Lisez la fréquence dominante
  M118 
  M118 3. FRÉQUENCE CIBLE:
  M118    - Optimale: ~110 Hz (courroies 6mm)
  M118    - Plage acceptable: 100-120 Hz
  M118    - Équivaut à ~2 lbs de tension
  M118 
  M118 4. AJUSTEMENT:
  M118    - < 100 Hz: SERRER progressivement
  M118    - 100-120 Hz: TENSION OPTIMALE ✓
  M118    - > 120 Hz: DESSERRER légèrement
  M118 
  M118 IMPORTANT:
  M118 Les courroies X et Y s'affectent mutuellement
  M118 sur CoreXY. Ajustez alternativement jusqu'à
  M118 ce que les deux soient à ~110 Hz.
  M118 
  M118 ========================================
  M118 MÉTHODE ALTERNATIVE (SANS APP):
  M118 ========================================
  M118 
  M118 TEST VISUEL/TACTILE:
  M118 - Pincez la courroie au milieu
  M118 - Déflexion optimale: 5-8mm
  M118 - Résistance: Ferme mais pas dure
  M118 - Vibration: Retour rapide après pincement
  M118 
  M118 TEST SONORE:
  M118 - Son optimal: Note grave et courte
  M118 - Trop lâche: Son mou, long
  M118 - Trop tendu: Son aigu, métallique
  M118 
  M118 ========================================
  M118 POUR INPUT SHAPER (APRÈS TENSION OK):
  M118 Utilisez: SHAPER_CALIBRATE
  M118 ========================================

# ============================================
# GUIDE AJUSTEMENT TENSION
# ============================================

[gcode_macro BELT_TENSION_ADJUST]
description: Guide interactif ajustement tension
gcode:
  M118 
  M118 ========================================
  M118 GUIDE AJUSTEMENT TENSION COURROIES
  M118 ========================================
  M118 
  M118 MÉTHODE 1: AJUSTEMENT VISUEL
  M118 --------------------------------
  M118 1. Pincez la courroie au milieu
  M118 2. Déflexion optimale: 5-8mm
  M118 3. Résistance: Ferme mais pas dure
  M118 
  M118 MÉTHODE 2: TEST SONORE
  M118 --------------------------------
  M118 1. Pincez et relâchez la courroie
  M118 2. Son optimal: Note grave et courte
  M118 3. Trop lâche: Son mou, long
  M118 4. Trop tendu: Son aigu, métallique
  M118 
  M118 MÉTHODE 3: ADXL (PRÉCIS)
  M118 --------------------------------
  M118 1. Lancez: BELT_TENSION_CHECK AXIS=X
  M118 2. Ajustez selon recommandations
  M118 3. Relancez jusqu'à fréquence OK
  M118 
  M118 ========================================
  M118 PROCÉDURE AJUSTEMENT
  M118 ========================================
  M118 
  M118 AXE X (Artillery SWX2):
  M118 1. Dévisser légèrement vis tendeur arrière
  M118 2. Ajuster tension (tourner écrou)
  M118 3. Revisser vis de blocage
  M118 4. Vérifier: BELT_TENSION_CHECK AXIS=X
  M118 
  M118 AXEE Y (Artillery SWX2):
  M118 1. Dévisser légèrement vis tendeur gauche
  M118 2. Ajuster tension (tourner écrou)
  M118 3. Revisser vis de blocage
  M118 4. Vérifier: BELT_TENSION_CHECK AXIS=Y
  M118 
  M118 ========================================
  M118 ATTENTION
  M118 ========================================
  M118 - Ajuster par petits incréments (1/4 tour)
  M118 - Tester après chaque ajustement
  M118 - Tension égale des 2 côtés (Y)
  M118 - Ne pas trop serrer (usure roulements)
  M118 ========================================

# ============================================
# COMPARAISON AVANT/APRÈS
# ============================================

[gcode_macro BELT_TENSION_COMPARE]
description: Compare tension avant/après ajustement
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  
  M118 
  M118 ========================================
  M118 COMPARAISON AVANT/APRÈS - AXE {axis}
  M118 ========================================
  M118 
  M118 MESURE AVANT AJUSTEMENT:
  M118 1. Lancez: BELT_TENSION_CHECK AXIS={axis}
  M118 2. Notez fréquence principale: ___ Hz
  M118 
  M118 AJUSTEMENT:
  M118 3. Ajustez la courroie
  M118 
  M118 MESURE APRÈS AJUSTEMENT:
  M118 4. Relancez: BELT_TENSION_CHECK AXIS={axis}
  M118 5. Notez nouvelle fréquence: ___ Hz
  M118 
  M118 ÉVALUATION:
  M118 - Augmentation fréquence: Serrage OK
  M118 - Diminution fréquence: Desserrage OK
  M118 - Pas de changement: Ajuster davantage
  M118 ========================================

# ============================================
# TEST DE RÉSONANCE ADAPTATIF
# ============================================

[gcode_macro BELT_TENSION_RESONANCE_TEST]
description: Test de résonance avec vitesses adaptatives (±15% max_velocity)
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  M118 
  M118 ========================================
  M118 TEST RÉSONANCE COURROIE - AXE {axis}
  M118 ========================================
  M118 
  M118 Ce test effectue des mouvements à vitesses
  M118 variables pour identifier les résonances.
  M118 Écoutez les changements de fréquence sonore.
  M118 
  M118 ⚠️ SÉCURITÉ:
  M118 Vous pouvez ARRÊTER à tout moment via:
  M118 - Bouton EMERGENCY STOP (arrêt immédiat)
  M118 - Bouton PAUSE puis CANCEL (arrêt propre)
  M118 - Commande M112 (arrêt d'urgence)
  M118 ========================================
  
  # Vérifier axe valide
  {% if axis not in ['X', 'Y'] %}
    M118 ERREUR: Axe invalide '{axis}'
    {action_raise_error("Axe invalide")}
  {% endif %}
  
  # Homing si nécessaire
  {% if not printer.toolhead.homed_axes %}
    M118 Homing automatique...
    G28
    G4 P1000
  {% endif %}
  
  G90
  
  # Récupérer dimensions et vitesse max du profil hardware actif
  {% set active = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "gcode_macro _PROFILE_" ~ active.upper() %}
  {% if profile_macro in printer %}
    {% set config = printer[profile_macro].config %}
    {% set max_x = config.position_max_x|float %}
    {% set max_y = config.position_max_y|float %}
    {% set max_z = config.position_max_z|float %}
    {% set max_velocity = config.max_velocity|default(250)|float %}
    {% set center_x = (max_x / 2)|round(1) %}
    {% set center_y = (max_y / 2)|round(1) %}
    {% set safe_z = [50, max_z * 0.15]|max|round(1) %}
    # Positions min/max avec marge de sécurité
    {% set min_pos = 10 %}
    {% set max_pos_x = (max_x - 15)|round(1) %}
    {% set max_pos_y = (max_y - 10)|round(1) %}
  {% else %}
    # Valeurs par défaut Artillery SWX2
    {% set max_velocity = 250 %}
    {% set center_x = 150 %}
    {% set center_y = 150 %}
    {% set safe_z = 50 %}
    {% set min_pos = 10 %}
    {% set max_pos_x = 290 %}
    {% set max_pos_y = 290 %}
  {% endif %}
  
  # Calculer plage de vitesses: -15% à +15% de max_velocity
  {% set v_min = (max_velocity * 0.85)|round(0)|int %}
  {% set v_max = (max_velocity * 1.15)|round(0)|int %}
  {% set v_step = ((v_max - v_min) / 5)|round(0)|int %}
  
  # Générer 6 paliers de vitesse
  {% set speeds = [] %}
  {% for i in range(6) %}
    {% set speed = (v_min + (i * v_step))|int %}
    {% set _ = speeds.append(speed) %}
  {% endfor %}
  
  M118 
  M118 Configuration machine:
  M118 - Vitesse max: {max_velocity} mm/s
  M118 - Plage test: {v_min}-{v_max} mm/s (±15%)
  M118 - Paliers: {speeds|join(', ')} mm/s
  M118 
  
  # Position de départ sécurisée
  G1 Z{safe_z} F3000
  
  M118 
  M118 ========================================
  M118 DÉBUT TEST - Écoutez les fréquences
  M118 ========================================
  M118 
  
  # Tests progressifs avec paliers adaptatifs
  {% for speed in speeds %}
    M118 
    M118 Palier {loop.index}/6: {speed} mm/s ({(speed/max_velocity*100)|round(0)|int}% max)
    
    {% if axis == 'X' %}
      G1 Y{center_y} F6000
      {% for i in range(3) %}
        G1 X{min_pos} F{speed * 60}
        G1 X{max_pos_x} F{speed * 60}
      {% endfor %}
    {% elif axis == 'Y' %}
      G1 X{center_x} F6000
      {% for i in range(3) %}
        G1 Y{min_pos} F{speed * 60}
        G1 Y{max_pos_y} F{speed * 60}
      {% endfor %}
    {% endif %}
    
    G4 P2000  # Pause 2s entre paliers
  {% endfor %}
  
  M118 
  M118 ========================================
  M118 TEST TERMINÉ
  M118 ========================================
  M118 
  M118 ANALYSE:
  M118 - Fréquence sonore constante → Tension OK ✓
  M118 - Fréquence variable/vibrations → Ajuster tension
  M118 - Bruit aigu à haute vitesse → Trop tendu
  M118 - Vibrations à basse vitesse → Trop lâche
  M118 
  M118 Pour mesure précise:
  M118   BELT_TENSION_POSITION AXIS={axis}
  M118 ========================================
  
  # Retour à l'état idle
  _SET_LED_IDLE

# ============================================
# DIAGNOSTIC RAPIDE (SANS ADXL)
# ============================================

[gcode_macro BELT_TENSION_QUICK_TEST]
description: Test rapide tension sans ADXL
gcode:
  {% set axis = params.AXIS|default('X')|upper %}
  
  M118 
  M118 ========================================
  M118 TEST RAPIDE TENSION - AXE {axis}
  M118 ========================================
  M118 
  M118 Ce test effectue des mouvements rapides
  M118 pour détecter les vibrations visuellement.
  M118 
  M118 OBSERVEZ:
  M118 - Vibrations de la courroie
  M118 - Bruit anormal
  M118 - Oscillations après arrêt
  M118 ========================================
  
  # Homing si nécessaire
  {% if not printer.toolhead.homed_axes %}
    M118 Homing automatique...
    G28
    G4 P1000
  {% endif %}
  
  G90
  G1 Z50 F3000
  
  M118 
  M118 Test en cours...
  M118 
  
  # Tests progressifs
  {% set speeds = [100, 150, 200, 250] %}
  {% for speed in speeds %}
    M118 Vitesse: {speed} mm/s
    
    {% if axis == 'X' %}
      G1 Y150 F6000
      {% for i in range(3) %}
        G1 X10 F{speed * 60}
        G1 X290 F{speed * 60}
      {% endfor %}
    {% elif axis == 'Y' %}
      G1 X150 F6000
      {% for i in range(3) %}
        G1 Y10 F{speed * 60}
        G1 Y290 F{speed * 60}
      {% endfor %}
    {% endif %}
    
    G4 P2000
  {% endfor %}
  
  M118 
  M118 ========================================
  M118 ÉVALUATION VISUELLE
  M118 ========================================
  M118 
  M118 Si courroie vibre visiblement:
  M118 → TROP LÂCHE - Serrer
  M118 
  M118 Si bruit aigu ou claquement:
  M118 → TROP TENDUE - Desserrer
  M118 
  M118 Si mouvement fluide et silencieux:
  M118 → TENSION OK ✓
  M118 ========================================

# ============================================
# AIDE
# ============================================

[gcode_macro BELT_TENSION_HELP]
description: Affiche aide diagnostic tension courroies
gcode:
  M118 ========================================
  M118 BELT TENSION DIAGNOSTIC - AIDE
  M118 ========================================
  M118 
  M118 MÉTHODE VORON (RECOMMANDÉE):
  M118 1. BELT_TENSION_POSITION AXIS=X
  M118    → Positionne pour mesure 150mm
  M118 2. Installer app spectromètre audio:
  M118    - iOS: Sound Spectrum Analysis
  M118    - Android: Spectroid
  M118    - Les deux: Gates Carbon Drive
  M118 3. Pincer/plumer la courroie
  M118 4. Lire fréquence: cible ~110 Hz
  M118 5. BELT_TENSION_ADJUST si nécessaire
  M118 6. Répéter pour axe Y
  M118 
  M118 AUTRES COMMANDES:
  M118 - BELT_TENSION_CHECK AXIS=X
  M118   Guide complet méthode Voron
  M118 - BELT_TENSION_RESONANCE_TEST AXIS=X
  M118   Test résonance adaptatif (±15% vitesse max)
  M118 - BELT_TENSION_COMPARE AXIS=X
  M118   Comparer avant/après ajustement
  M118 
  M118 FRÉQUENCE CIBLE (MÉTHODE VORON):
  M118 - Optimale: ~110 Hz (courroies 6mm)
  M118 - Plage acceptable: 100-120 Hz
  M118 - Portée de mesure: 150mm
  M118 - Équivaut à ~2 lbs de tension
  M118 
  M118 SIGNES DE MAUVAISE TENSION:
  M118 - Ghosting/ringing sur impressions
  M118 - Courroies qui vibrent
  M118 - Bruit anormal à haute vitesse
  M118 - Imprécision dimensionnelle
  M118 
  M118 WORKFLOW COMPLET:
  M118 1. Vérifier tension courroies (~110 Hz)
  M118 2. Ajuster si nécessaire
  M118 3. SHAPER_CALIBRATE (Input Shaper)
  M118 4. SAVE_CONFIG
  M118 5. Test impression
  M118 ========================================