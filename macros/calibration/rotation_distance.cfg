# ============================================
# ROTATION DISTANCE CALIBRATION SYSTEM
# ============================================
# Calibration précise du rotation_distance de l'extruder
# avec mesures multiples, calcul automatique et validation
#
# WORKFLOW:
# 1. Lancer: CALIBRATE_ROTATION_DISTANCE
# 2. Marquer le filament à 120mm
# 3. Lancer: ROTATION_DISTANCE_CONTINUE (extrude 120mm)
# 4. Mesurer le reste
# 5. Lancer: ROTATION_DISTANCE_MEASURE REMAINING=XX.X (calcule)
# 6. Lancer: ROTATION_DISTANCE_VERIFY (test de vérification 50mm)
# 7. Lancer: ROTATION_DISTANCE_TEST_EXTRUDE (extrude 50mm)
# 8. Si bon: ROTATION_DISTANCE_SAVE (permanent)
#    Si mauvais: ROTATION_DISTANCE_RETRY (recommence)
#
# IMPORTANT: Ne PAS utiliser PAUSE/RESUME classiques
# qui rétractent 30mm et fausseraient la mesure !

[gcode_macro _ROTATION_DISTANCE_STATE]
description: Variables d'état pour calibration rotation distance
variable_current_rotation_distance: 0.0
variable_test_extrusion_length: 120.0    # Longueur test en mm
variable_measurement_1: 0.0
variable_measurement_2: 0.0
variable_measurement_3: 0.0
variable_average_measurement: 0.0
variable_new_rotation_distance: 0.0
variable_calibration_temp: 200           # Temp par défaut
variable_calibration_count: 0            # Nombre de calibrations effectuées
variable_iteration_count: 0              # Nombre d'affinages dans la session actuelle
variable_last_calibration_date: "Never"
gcode:

# ============================================
# CALIBRATION PRINCIPALE
# ============================================

[gcode_macro CALIBRATE_ROTATION_DISTANCE]
description: Calibration complète du rotation distance (TEMP=200)
gcode:
  {% set TEMP = params.TEMP|default(200)|int %}
  
  M118 ========================================
  M118 ROTATION DISTANCE CALIBRATION
  M118 ========================================
  M118 This will help you calibrate your extruder
  M118 Temperature: {TEMP}°C
  M118 Test length: 120mm
  M118 
  M118 To cancel at any time:
  M118   ROTATION_DISTANCE_CANCEL
  M118 ========================================
  
  # Sauvegarder température
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=calibration_temp VALUE={TEMP}
  
  # Récupérer rotation_distance actuel
  {% set current_rd = printer.configfile.settings.extruder.rotation_distance|float %}
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=current_rotation_distance VALUE={current_rd}
  
  M118 Current rotation_distance: {current_rd}
  M118 
  M118 STEP 1: Preparation
  M118 ========================================
  
  # Vérifier que l'imprimante est homed
  {% if printer.toolhead.homed_axes != 'xyz' %}
    M118 Homing all axes...
    G28
  {% endif %}
  
  # Calculer position centre et mi-hauteur
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}
  {% set x_center = x_max / 2 %}
  {% set y_center = y_max / 2 %}
  {% set z_mid = z_max / 2 %}
  
  # Positionner au centre et à mi-hauteur
  M118 Moving to center position (X{x_center|int} Y{y_center|int} Z{z_mid|int})...
  G90
  G1 Z{z_mid} F3000
  G1 X{x_center} Y{y_center} F6000
  
  # Chauffer extruder
  M118 Heating extruder to {TEMP}°C...
  M118 (Waiting for temperature, this may take a few minutes)
  M109 S{TEMP}  # Attend que la temp soit atteinte
  M118 ✓ Extruder ready at {TEMP}°C!
  
  M118 
  M118 STEP 2: Mark the filament
  M118 ========================================
  M118 1. Cut filament flush with extruder entry
  M118 2. Measure 120mm from entry point
  M118 3. Mark filament with permanent marker
  M118 4. Measure again to verify (should be 120mm)
  M118 
  {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
  {% set timeout_min = (timeout_sec / 60)|int %}
  {% set timeout_sec_remain = timeout_sec % 60 %}
  M118 ⏰ TIMEOUT WARNING: You have {timeout_min}min {timeout_sec_remain}s
  M118    After timeout, extruder will cool down
  M118    If timeout occurs, restart calibration
  M118 
  M118 ========================================
  M118 READY TO CONTINUE?
  M118 ========================================
  M118 When filament is marked, run this command:
  M118 
  M118   ROTATION_DISTANCE_CONTINUE
  M118 
  M118 (Find it in Mainsail macros or type in console)
  M118 ========================================
  # Ne pas utiliser PAUSE (rétracte 30mm) ni M0 (bugs Mainsail)
  # La macro se termine ici, l'utilisateur appelle ROTATION_DISTANCE_CONTINUE manuellement

[gcode_macro ROTATION_DISTANCE_CONTINUE]
description: Continue la calibration après marquage du filament
gcode:
  M118 Continuing calibration...
  _ROTATION_DISTANCE_EXTRUDE

[gcode_macro _ROTATION_DISTANCE_EXTRUDE]
description: Extrusion pour calibration (interne)
gcode:
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set test_length = rd_state.test_extrusion_length|float %}
  
  M118 
  M118 STEP 3: Extrusion Test
  M118 ========================================
  M118 Extruding {test_length}mm of filament...
  M118 This will take about 2 minutes
  M118 
  M118 To cancel: ROTATION_DISTANCE_CANCEL
  
  # Extrusion lente et précise
  M83  # Mode relatif
  G1 E{test_length} F60  # 60mm/min = 1mm/s (très lent et précis)
  M400  # Attendre que l'extrusion soit réellement terminée
  M82  # Mode absolu
  
  M118 
  M118 Extrusion complete!
  M118 
  M118 STEP 4: Measure remaining distance
  M118 ========================================
  M118 Measure the distance from extruder entry to your mark
  M118 
  {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
  {% set timeout_min = (timeout_sec / 60)|int %}
  {% set timeout_sec_remain = timeout_sec % 60 %}
  M118 ⏰ TIMEOUT: You have {timeout_min}min {timeout_sec_remain}s to measure
  M118 
  M118 Use command: ROTATION_DISTANCE_MEASURE REMAINING=XX.X
  M118 Example: ROTATION_DISTANCE_MEASURE REMAINING=25.5
  M118 
  M118 (Lower number = extruder over-extruding)
  M118 (Higher number = extruder under-extruding)

# ============================================
# MESURE ET CALCUL
# ============================================

[gcode_macro ROTATION_DISTANCE_MEASURE]
description: Enregistrer mesure (REMAINING=XX.X)
gcode:
  {% if 'REMAINING' not in params %}
    {action_raise_error("REMAINING parameter required. Example: ROTATION_DISTANCE_MEASURE REMAINING=25.5")}
  {% endif %}
  
  {% set REMAINING = params.REMAINING|float %}
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set test_length = rd_state.test_extrusion_length|float %}
  {% set current_rd = rd_state.current_rotation_distance|float %}
  
  # Vérifier que la calibration a été initialisée
  {% if current_rd == 0.0 %}
    {action_raise_error("Calibration not initialized! Please run CALIBRATE_ROTATION_DISTANCE first.")}
  {% endif %}
  
  # Calculer longueur réellement extrudée
  {% set actual_extruded = test_length - REMAINING %}
  
  M118 ========================================
  M118 MEASUREMENT RECORDED
  M118 ========================================
  M118 Target extrusion: {test_length}mm
  M118 Remaining to mark: {REMAINING}mm
  M118 Actually extruded: {actual_extruded}mm
  M118 Difference: {actual_extruded - test_length}mm
  
  # Détecter si un gear_ratio est configuré
  {% set has_gear_ratio = printer.configfile.settings.extruder.gear_ratio is defined %}
  
  # Calculer nouveau rotation_distance
  # Formule officielle Klipper: rotation_distance = previous_rd * actual_distance / requested_distance
  {% if has_gear_ratio %}
    # ATTENTION: SET_EXTRUDER_ROTATION_DISTANCE a un comportement inversé avec gear_ratio
    # On inverse la formule pour compenser ce bug
    {% set new_rd = (current_rd * actual_extruded) / test_length %}
  {% else %}
    # Comportement normal sans gear_ratio
    {% set new_rd = (current_rd * test_length) / actual_extruded %}
  {% endif %}
  
  M118 
  M118 CALCULATION
  M118 ========================================
  {% if has_gear_ratio %}
    M118 ⚠️ Gear ratio detected: {printer.configfile.settings.extruder.gear_ratio}
    M118 ⚠️ Using inverted formula to compensate SET_EXTRUDER_ROTATION_DISTANCE bug
    M118 
  {% endif %}
  M118 Current rotation_distance: {current_rd}
  M118 New rotation_distance: {new_rd|round(6)}
  M118 Change: {((new_rd - current_rd) / current_rd * 100)|round(2)}%
  
  # Sauvegarder
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=new_rotation_distance VALUE={new_rd}
  
  M118 
  M118 NEXT STEPS
  M118 ========================================
  M118 1. Run: ROTATION_DISTANCE_VERIFY (test with 50mm)
  M118 2. Then: ROTATION_DISTANCE_TEST_EXTRUDE
  M118 3. If good: ROTATION_DISTANCE_SAVE
  M118 4. If bad: ROTATION_DISTANCE_RETRY
  M118 5. To cancel: ROTATION_DISTANCE_CANCEL
  M118 ========================================
  
  # Réinitialiser temp pour sortir du mode calibration
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=calibration_temp VALUE=0

# ============================================
# APPLICATION ET SAUVEGARDE
# ============================================

[gcode_macro ROTATION_DISTANCE_VERIFY]
description: Vérifier le nouveau rotation_distance avec un test de 50mm
gcode:
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set new_rd = rd_state.new_rotation_distance|float %}
  {% set current_rd = printer.configfile.settings.extruder.rotation_distance|float %}
  
  {% if new_rd == 0 %}
    M118 ERROR: No calibration data available
    M118 Run CALIBRATE_ROTATION_DISTANCE first
  {% else %}
    # Réinitialiser compteur d'itérations
    SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=iteration_count VALUE=0
    
    M118 ========================================
    M118 VERIFICATION TEST
    M118 ========================================
    M118 Old rotation_distance: {current_rd}
    M118 New rotation_distance: {new_rd|round(6)}
    M118 Change: {((new_rd - current_rd) / current_rd * 100)|round(2)}%
    M118 
    M118 Applying new value temporarily...
    
    # Appliquer temporairement
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={new_rd}
    M118 Extruder 'extruder' rotation distance set to {new_rd}
    
    # Vérifier que la commande a fonctionné
    M118 ⚠️ WARNING: SET_EXTRUDER_ROTATION_DISTANCE may not work with gear_ratio!
    M118 ⚠️ RECOMMENDED: Use CALIBRATE_ROTATION_DISTANCE (120mm) instead of VERIFY (50mm)
    M118 ⚠️ Then edit printer.cfg manually + FIRMWARE_RESTART for each iteration.
    M118 ⚠️ This avoids divergence and gives more accurate results.
    
    M118 
    M118 STEP 1: Prepare for verification test
    M118 ========================================
    M118 ⚠️ CRITICAL: You MUST reset your reference point!
    M118 
    M118 1. CUT filament flush with extruder entry
    M118    → This creates a NEW reference point (0mm)
    M118    → Discard any old marks from 120mm test
    M118 
    M118 2. MEASURE exactly 50mm from extruder entry
    M118    → Use a ruler or caliper
    M118    → Measure from the entry point (where you cut)
    M118 
    M118 3. MARK the filament at exactly 50mm
    M118    → Use permanent marker clearly visible
    M118 
    M118 4. VERIFY your mark is at 50mm
    M118    → Measure again to confirm before continuing
    {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
    {% set timeout_min = (timeout_sec / 60)|int %}
    {% set timeout_sec_remain = timeout_sec % 60 %}
    M118 ⏰ TIMEOUT: You have {timeout_min}min {timeout_sec_remain}s to mark
    M118 
    M118 When ready, run: ROTATION_DISTANCE_TEST_EXTRUDE
    M118 ========================================
  {% endif %}

[gcode_macro ROTATION_DISTANCE_TEST_EXTRUDE]
description: Extrude 50mm pour vérification
gcode:
  M118 
  M118 STEP 2: Verification extrusion
  M118 ========================================
  M118 Extruding 50mm for verification...
  M118 This will take about 1 minute
  
  # Extrusion de vérification
  M83  # Mode relatif
  G1 E50 F60  # 50mm à 60mm/min
  M400  # Attendre que l'extrusion soit réellement terminée
  M82  # Mode absolu
  
  M118 
  M118 Extrusion complete!
  M118 
  M118 STEP 3: Measure the result
  M118 ========================================
  M118 Now measure where your mark ended up:
  M118 
  M118 📏 MEASUREMENT GUIDE:
  M118 
  M118 Case A: Mark is ABOVE extruder entry
  M118   → Under-extrusion (not enough filament)
  M118   → Measure distance from entry to mark
  M118   → Example: Mark is 3mm above → REMAINING=3.0
  M118 
  M118 Case B: Mark is EXACTLY at entry
  M118   → PERFECT calibration! 🎯
  M118   → REMAINING=0
  M118 
  M118 Case C: Mark is INSIDE extruder (disappeared)
  M118   → Over-extrusion (too much filament)
  M118   → Estimate how far inside (negative)
  M118   → Example: ~2mm inside → REMAINING=-2.0
  M118 
  {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
  {% set timeout_min = (timeout_sec / 60)|int %}
  {% set timeout_sec_remain = timeout_sec % 60 %}
  M118 ⏰ TIMEOUT: {timeout_min}min {timeout_sec_remain}s to measure
  M118 
  M118 ⚠️ EXPECTED: 0mm ± 1mm (perfect)
  M118 ⚠️ ACCEPTABLE: -2mm to +2mm (good)
  M118 ⚠️ BAD: > ±5mm (needs retry)
  M118 
  M118 If measurement is PERFECT (0mm ± 1mm):
  M118   ROTATION_DISTANCE_SAVE
  M118 
  M118 If measurement needs FINE-TUNING (±1-5mm):
  M118   ROTATION_DISTANCE_REFINE REMAINING=XX.X
  M118   (This will adjust and re-test)
  M118 
  M118 If measurement is BAD (>5mm off):
  M118   ROTATION_DISTANCE_RETRY
  M118   (Start over from scratch)
  M118 
  M118 To cancel:
  M118   ROTATION_DISTANCE_CANCEL
  M118 ========================================

[gcode_macro ROTATION_DISTANCE_REFINE]
description: Affiner la calibration avec une nouvelle mesure (REMAINING=XX.X)
gcode:
  {% set REMAINING = params.REMAINING|default(-999)|float %}
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set current_rd = printer.configfile.settings.extruder.rotation_distance|float %}
  {% set test_length = 50.0 %}  # Test de vérification = 50mm
  
  {% if REMAINING == -999 %}
    M118 ERROR: Missing REMAINING parameter
    M118 Usage: ROTATION_DISTANCE_REFINE REMAINING=XX.X
    M118 Example (under-extrusion): ROTATION_DISTANCE_REFINE REMAINING=2.5
    M118 Example (over-extrusion): ROTATION_DISTANCE_REFINE REMAINING=-3.0
  {% else %}
    # Incrémenter compteur d'itérations
    {% set iteration = rd_state.iteration_count|int + 1 %}
    SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=iteration_count VALUE={iteration}
    
    # Calculer longueur réellement extrudée
    {% set actual_extruded = test_length - REMAINING %}
    
    M118 ========================================
    M118 REFINING CALIBRATION (Iteration #{iteration})
    M118 ========================================
    M118 
    M118 MEASUREMENT DATA:
    M118 - Test length (target): {test_length}mm
    M118 - Remaining to mark: {REMAINING}mm
    M118 - Actually extruded: {actual_extruded}mm
    M118 - Error: {actual_extruded - test_length}mm
    M118 
    M118 ⚠️ DIAGNOSTIC:
    {% if actual_extruded|abs > 100 %}
      M118 ❌ ERROR: Extruded length ({actual_extruded}mm) is abnormal!
      M118 ❌ This suggests a measurement or calculation error.
      M118 ❌ Expected: ~50mm, Got: {actual_extruded}mm
      M118 ❌ Please verify your REMAINING measurement!
      M118 
    {% endif %}
    M118 Error: {actual_extruded - test_length}mm
    {% if REMAINING > 0 %}
      M118 Type: UNDER-EXTRUSION (not enough filament)
    {% elif REMAINING < 0 %}
      M118 Type: OVER-EXTRUSION (too much filament)
    {% else %}
      M118 Type: PERFECT (no error)
    {% endif %}
    M118 
    
    # Calculer le rotation_distance actuellement appliqué
    # Note: Après VERIFY, on a déjà appliqué le nouveau RD temporairement
    {% set applied_rd = rd_state.new_rotation_distance|float %}
    
    # Détecter si un gear_ratio est configuré
    {% set has_gear_ratio = printer.configfile.settings.extruder.gear_ratio is defined %}
    
    # Calculer le RD affiné
    # Formule officielle Klipper: rotation_distance = previous_rd * actual_distance / requested_distance
    {% if has_gear_ratio %}
      # ATTENTION: SET_EXTRUDER_ROTATION_DISTANCE a un comportement inversé avec gear_ratio
      # On inverse la formule pour compenser ce bug
      {% set refined_rd = (applied_rd * actual_extruded) / test_length %}
      M118 ⚠️ Gear ratio detected: {printer.configfile.settings.extruder.gear_ratio}
      M118 ⚠️ Using inverted formula to compensate SET_EXTRUDER_ROTATION_DISTANCE bug
    {% else %}
      # Comportement normal sans gear_ratio
      {% set refined_rd = (applied_rd * test_length) / actual_extruded %}
    {% endif %}
    M118 
    M118 Current applied RD: {applied_rd|round(6)}
    M118 Refined RD: {refined_rd|round(6)}
    M118 Adjustment: {((refined_rd - applied_rd) / applied_rd * 100)|round(2)}%
    
    # Sauvegarder le nouveau RD affiné
    SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=new_rotation_distance VALUE={refined_rd}
    
    # Appliquer immédiatement le nouveau RD affiné
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={refined_rd}
    
    # Petite extrusion de test pour forcer l'application
    M83  # Mode relatif
    G1 E0.1 F60  # Extrude 0.1mm pour activer le nouveau RD
    M400  # Attendre fin
    M82  # Mode absolu
    
    M118 
    M118 ========================================
    M118 REFINED VALUE APPLIED
    M118 ========================================
    M118 New rotation_distance: {refined_rd|round(6)}
    M118 ✓ Applied successfully (temporary until restart)
    M118 ✓ Test extrusion (0.1mm) completed to activate new RD
    M118 
    M118 NEXT: Test again to verify
    M118 ========================================
    {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
    {% set timeout_min = (timeout_sec / 60)|int %}
    {% set timeout_sec_remain = timeout_sec % 60 %}
    M118 ⏰ TIMEOUT: You have {timeout_min}min {timeout_sec_remain}s for next iteration
    M118 
    M118 1. Mark filament at 50mm
    M118 2. Run: ROTATION_DISTANCE_TEST_EXTRUDE
    M118 3. Measure and decide:
    M118    - Perfect? ROTATION_DISTANCE_SAVE
    M118    - Still off? ROTATION_DISTANCE_REFINE REMAINING=XX.X
    M118    - Too bad? ROTATION_DISTANCE_RETRY
    M118 ========================================
  {% endif %}

[gcode_macro ROTATION_DISTANCE_RETRY]
description: Recommencer la calibration avec les nouvelles données
gcode:
  M118 
  M118 4. Measure again to verify (should be 120mm)
  M118 
  {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
  {% set timeout_min = (timeout_sec / 60)|int %}
  {% set timeout_sec_remain = timeout_sec % 60 %}
  M118 ⏰ TIMEOUT WARNING: You have {timeout_min}min {timeout_sec_remain}s
  M118    After timeout, extruder will cool down
  M118    If timeout occurs, restart calibration
  M118 
  M118 ========================================
  M118 READY TO CONTINUE?
  M118 ========================================
  M118 The current value will be reverted
  M118 You can restart the full calibration
  M118 
  # Réinitialiser
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=new_rotation_distance VALUE=0
  
  M118 Run: CALIBRATE_ROTATION_DISTANCE
  M118 ========================================

# Note: Klipper ne permet pas de sauvegarder rotation_distance via SAVE_CONFIG
# depuis une macro G-code. Seules les commandes Python internes le peuvent.
# Cette macro guide l'utilisateur pour une sauvegarde manuelle.

[gcode_macro ROTATION_DISTANCE_SAVE]
description: Afficher les instructions pour sauvegarder le rotation_distance
gcode:
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set new_rd = rd_state.new_rotation_distance|float %}
  {% set current_rd = printer.configfile.settings.extruder.rotation_distance|float %}
  
  {% if new_rd == 0 %}
    M118 ERROR: No calibration data available
    M118 Run CALIBRATE_ROTATION_DISTANCE first
  {% else %}
    M118 ========================================
    M118 ROTATION DISTANCE CALIBRATION COMPLETE
    M118 ========================================
    M118 Old value: {current_rd}
    M118 New value: {new_rd|round(6)}
    M118 Change: {((new_rd - current_rd) / current_rd * 100)|round(2)}%
    M118 
    M118 💾 Applying temporarily...
    
    # Appliquer temporairement (actif jusqu'au prochain FIRMWARE_RESTART)
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={new_rd}
    
    M118 ✅ Applied temporarily: {new_rd|round(6)}
    M118 
    M118 ⚠️ MANUAL SAVE REQUIRED
    M118 ========================================
    M118 Klipper cannot auto-save rotation_distance to SAVE_CONFIG.
    M118 You must manually edit printer.cfg:
    M118 
    M118 1. Open printer.cfg in Mainsail
    M118 2. Find [extruder] section (around line 198)
    M118 3. Change this line:
    M118    FROM: rotation_distance: {current_rd}
    M118    TO:   rotation_distance: {new_rd|round(6)}
    M118 4. Save the file
    M118 5. Run: FIRMWARE_RESTART
    M118 
    M118 📋 VALUE TO SAVE: {new_rd|round(6)}
    M118 ========================================
    
    # Incrémenter compteur
    {% set count = rd_state.calibration_count + 1 %}
    SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=calibration_count VALUE={count}
    
    M118 
    M118 ✅ Calibration complete!
    M118 🔧 Waiting for manual save...
  {% endif %}

[gcode_macro ROTATION_DISTANCE_CANCEL]
description: Annuler la calibration en cours (même pendant extrusion)
gcode:
  M118 ========================================
  M118 CALIBRATION CANCELLED
  M118 ========================================
  
  # Arrêter tout mouvement en cours
  M410  # Quick stop
  M118 All movements stopped
  
  # Éteindre le chauffage
  M104 S0
  M118 Extruder heating stopped
  
  # Réinitialiser variables
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=new_rotation_distance VALUE=0
  SET_GCODE_VARIABLE MACRO=_ROTATION_DISTANCE_STATE VARIABLE=calibration_temp VALUE=0
  
  M118 
  M118 No changes were made to rotation_distance
  M118 You can restart calibration with:
  M118   CALIBRATE_ROTATION_DISTANCE
  M118 ========================================

# ============================================
# INFORMATIONS ET STATUT
# ============================================

[gcode_macro ROTATION_DISTANCE_MANUAL_APPLY]
description: Guide pour appliquer manuellement le RD dans printer.cfg
gcode:
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set new_rd = rd_state.new_rotation_distance|float %}
  {% set current_rd = printer.configfile.settings.extruder.rotation_distance|float %}
  
  {% if new_rd == 0 %}
    M118 ERROR: No calibration data available
    M118 Run CALIBRATE_ROTATION_DISTANCE first
  {% else %}
    M118 ========================================
    M118 MANUAL RD APPLICATION (Workaround)
    M118 ========================================
    M118 
    M118 ⚠️ SET_EXTRUDER_ROTATION_DISTANCE doesn't work!
    M118 Use this manual method instead:
    M118 
    M118 1. Open printer.cfg in Mainsail
    M118 2. Find [extruder] section
    M118 3. Change:
    M118    FROM: rotation_distance: {current_rd}
    M118    TO:   rotation_distance: {new_rd|round(6)}
    M118 4. Save file
    M118 5. Run: FIRMWARE_RESTART
    M118 6. Heat extruder to test temperature
    M118 7. Continue with: ROTATION_DISTANCE_VERIFY
    M118 
    M118 Value to apply: {new_rd|round(6)}
    M118 ========================================
  {% endif %}

[gcode_macro ROTATION_DISTANCE_INFO]
description: # IMPORTANT: Workflow de calibration
# 1. Lancer: CALIBRATE_ROTATION_DISTANCE
# 2. Marquer le filament à 120mm
# 3. Lancer: ROTATION_DISTANCE_CONTINUE (pour extruder)
# 4. Mesurer le reste
# 5. Lancer: ROTATION_DISTANCE_MEASURE REMAINING=XX.X
#
# Ne PAS utiliser PAUSE/RESUME classiques qui rétractent 30mm
# et fausseraient la mesure !
gcode:
  {% set rd_state = printer["gcode_macro _ROTATION_DISTANCE_STATE"] %}
  {% set current_rd = printer.configfile.settings.extruder.rotation_distance|float %}
  {% set new_rd = rd_state.new_rotation_distance|float %}
  
  M118 ========================================
  M118 ROTATION DISTANCE INFO
  M118 ========================================
  M118 Current value: {current_rd}
  {% if new_rd > 0 %}
    M118 Calibrated value: {new_rd|round(6)}
    M118 Difference: {((new_rd - current_rd) / current_rd * 100)|round(2)}%
  {% else %}
    M118 No calibration data available
  {% endif %}
  M118 Calibrations performed: {rd_state.calibration_count}
  M118 ========================================
  M118 
  M118 COMMANDS AVAILABLE:
  M118 - CALIBRATE_ROTATION_DISTANCE
  M118 - ROTATION_DISTANCE_INFO
  M118 ========================================