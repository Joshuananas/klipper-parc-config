#################################################
# SPEED TEST - Artillery Sidewinder X2
#################################################
# Test interactif de vitesse maximale avec calcul
# dynamique basé sur max_velocity configurée.
#
# IMPORTANT: Klipper bride les mouvements à max_velocity!
# Ce test explore de 50% à 100% de votre max_velocity.
# Si tous les paliers passent, augmentez max_velocity
# dans printer.cfg et relancez le test.
#
# ATTENTION: Ces tests sont agressifs!
# - Surveillez les moteurs (température, bruit)
# - Écoutez les vibrations et résonances
# - Arrêtez immédiatement si sauts de pas
#
# WORKFLOW RECOMMANDÉ:
# 1. SPEED_TEST_START [MIN_SPEED=XXX] [STEPS=XX] [AXIS=XY]
#    → MIN_SPEED: vitesse minimale (défaut: 50% de max_velocity)
#    → STEPS: nombre de paliers (défaut: 10, max: 20)
#    → AXIS: axes à tester (défaut: XY, options: XY, Z)
#    → Calcule les paliers de MIN_SPEED à max_velocity
#
# 2. SPEED_TEST_NEXT           # Exécute chaque palier
#    → Répéter jusqu'à trouver la limite
#
# 3. SPEED_TEST_FINISH         # Terminer (vitesse max trouvée)
#    OU
#    SPEED_TEST_CANCEL         # Annuler (limite dépassée)
#
# 4. Si tous paliers OK: augmentez max_velocity et recommencez
#
# 5. SPEED_TEST_HELP           # Affiche l'aide complète
#################################################

# ============================================
# TEST DE VITESSE INTERACTIF
# ============================================

[gcode_macro _SPEED_TEST_STATE]
description: Variables d'état pour test de vitesse (interne)
variable_current_speed_index: 0
variable_speeds: []  # Calculé dynamiquement depuis max_velocity
variable_axis: 'XY'  # Axes testés (XY ou Z)
variable_in_progress: False
gcode:

[gcode_macro SPEED_TEST_START]
description: Démarre le test de vitesse interactif (paramètres: MIN_SPEED, STEPS, AXIS)
gcode:
  # Paramètres configurables
  {% set min_speed_param = params.MIN_SPEED|default(0)|int %}
  {% set steps = params.STEPS|default(10)|int %}
  {% set axis = params.AXIS|default('XY')|upper %}
  
  # Récupérer max_velocity depuis printer.cfg
  {% if axis == 'Z' %}
    # Pour Z, vérifier max_z_velocity dans [printer], puis max_velocity dans [stepper_z]
    {% if 'max_z_velocity' in printer.configfile.settings.printer %}
      {% set max_vel = printer.configfile.settings.printer.max_z_velocity|float %}
      {% set vel_source = 'printer.max_z_velocity' %}
    {% elif 'max_velocity' in printer.configfile.settings.stepper_z %}
      {% set max_vel = printer.configfile.settings.stepper_z.max_velocity|float %}
      {% set vel_source = 'stepper_z.max_velocity' %}
    {% else %}
      {% set max_vel = 20.0 %}  # Valeur par défaut sécurisée pour Z
      {% set vel_source = 'par défaut (20 mm/s)' %}
    {% endif %}
  {% else %}
    {% set max_vel = printer.configfile.settings.printer.max_velocity|float %}
    {% set vel_source = 'printer.max_velocity' %}
  {% endif %}
  {% set max_speed = max_vel|round(0)|int %}
  
  # Calculer vitesse minimale (paramètre ou 50% de max_velocity)
  {% if min_speed_param > 0 %}
    {% set min_speed = min_speed_param %}
  {% else %}
    {% set min_speed = (max_vel * 0.5)|round(0)|int %}
  {% endif %}
  
  # Validation
  {% if axis not in ['XY', 'Z'] %}
    M118 ERREUR: AXIS doit être 'XY' ou 'Z' (reçu: {axis})
    {action_raise_error("AXIS invalide")}
  {% endif %}
  
  {% if min_speed >= max_speed %}
    M118 ERREUR: MIN_SPEED ({min_speed}) doit être < max_velocity ({max_speed})
    {action_raise_error("MIN_SPEED invalide")}
  {% endif %}
  
  {% if steps < 2 or steps > 20 %}
    M118 ERREUR: STEPS doit être entre 2 et 20 (reçu: {steps})
    {action_raise_error("STEPS invalide")}
  {% endif %}
  
  # Calculer step size
  {% set step = ((max_speed - min_speed) / (steps - 1))|int %}  # steps paliers = steps-1 intervalles
  
  # Générer liste des vitesses
  {% set speeds = [] %}
  {% for i in range(steps) %}
    {% set speed = (min_speed + (i * step))|int %}
    {% set _ = speeds.append(speed) %}
  {% endfor %}
  
  M118 
  M118 ========================================
  M118 TEST DE VITESSE INTERACTIF
  M118 ========================================
  M118 Vitesse max configurée: {max_vel|int} mm/s ({vel_source})
  M118 Plage de test: {min_speed} → {max_speed} mm/s
  M118 Nombre de paliers: {steps}
  M118 Incrément: ~{step} mm/s
  M118 Axes testés: {axis}
  {% if axis == 'Z' %}
    M118 ⚠️ Mode Z: course Z10-Z100
  {% endif %}
  M118 
  M118 ⚠️ IMPORTANT: Klipper bride à max_velocity!
  M118 Si tous paliers OK, augmentez max_velocity
  M118 dans printer.cfg et relancez le test.
  M118 
  M118 Mode: Interactif (commandes manuelles)
  M118 ========================================
  
  # Vérifications
  {% if not printer.toolhead.homed_axes %}
    M118 Homing automatique...
    G28
    G4 P1000
  {% endif %}
  
  # Position de sécurité
  G90
  {% if axis == 'XY' %}
    G1 Z50 F3000
  {% else %}
    G1 X150 Y150 F6000
    G1 Z50 F3000
  {% endif %}
  
  # Initialiser l'état avec les vitesses calculées
  SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=current_speed_index VALUE=0
  SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=speeds VALUE="{speeds}"
  SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=axis VALUE="'{axis}'"
  SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=in_progress VALUE=True
  
  M118 
  M118 ========================================
  M118 PRÊT À COMMENCER
  M118 ========================================
  M118 
  M118 {steps} paliers: {speeds|join(', ')} mm/s
  M118 
  M118 SURVEILLEZ:
  M118 - Vibrations/résonances
  M118 - Bruit anormal
  M118 - Sauts de courroie
  M118 - Stabilité mécanique
  M118 
  M118 Lancez le premier palier:
  M118   SPEED_TEST_NEXT
  M118 
  M118 Pour annuler:
  M118   SPEED_TEST_CANCEL
  M118 ========================================

[gcode_macro SPEED_TEST_NEXT]
description: Exécute le palier suivant du test de vitesse
gcode:
  {% set state = printer["gcode_macro _SPEED_TEST_STATE"] %}
  
  # Vérifier si benchmark démarré
  {% if not state.in_progress %}
    M118 
    M118 ========================================
    M118 ERREUR: Test non démarré
    M118 ========================================
    M118 Lancez d'abord:
    M118   SPEED_TEST_START
    M118 ========================================
    {action_raise_error("Test non démarré")}
  {% endif %}
  
  {% set speeds = state.speeds %}
  {% set index = state.current_speed_index %}
  {% set axis = state.axis %}
  
  # Vérifier si terminé
  {% if index >= speeds|length %}
    M118 
    M118 ========================================
    M118 TOUS LES PALIERS TERMINÉS!
    M118 ========================================
    M118 Lancez:
    M118   SPEED_TEST_FINISH
    M118 ========================================
    {action_raise_error("Tests terminés")}
  {% endif %}
  
  {% set speed = speeds[index] %}
  
  M118 
  M118 ========================================
  M118 PALIER {index + 1}/{speeds|length}: {speed} mm/s
  M118 ========================================
  
  {% if axis == 'XY' %}
    M118 Test X...
    G1 Y150 F6000
    {% for i in range(3) %}
      G1 X10 F{speed * 60}
      G1 X290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test Y...
    G1 X150 F6000
    {% for i in range(3) %}
      G1 Y10 F{speed * 60}
      G1 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test XY diagonal...
    {% for i in range(2) %}
      G1 X10 Y10 F{speed * 60}
      G1 X290 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% else %}
    M118 Test Z...
    {% for i in range(5) %}
      G1 Z10 F{speed * 60}
      G1 Z100 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% endif %}
  
  M118 
  M118 ========================================
  M118 ÉVALUATION {speed} mm/s
  M118 ========================================
  M118 
  M118 OBSERVEZ:
  {% if axis == 'XY' %}
    M118 - X: OK / Vibrations / Sauts
    M118 - Y: OK / Vibrations / Sauts
    M118 - XY: OK / Vibrations / Sauts
  {% else %}
    M118 - Z: OK / Vibrations / Sauts
    M118 - Bruit moteur: Normal / Anormal
    M118 - Stabilité plateau: OK / Oscillations
  {% endif %}
  M118 - Bruit: Normal / Élevé / Anormal
  M118 
  M118 Notez: {speed}mm/s = ___________
  M118 
  {% if index + 1 < speeds|length %}
    M118 ========================================
    M118 ACTIONS POSSIBLES
    M118 ========================================
    M118 
    M118 Si test OK et continuer:
    M118   SPEED_TEST_NEXT (palier suivant: {speeds[index + 1]} mm/s)
    M118 
    M118 Si besoin de retester:
    M118   SPEED_TEST_RETRY (reteste {speed} mm/s)
    M118 
    M118 Pour sauter à un palier:
    M118   SPEED_TEST_GOTO STEP=X (ex: STEP=5)
    M118 
    M118 Si vitesse max trouvée (arrêter ici):
    M118   SPEED_TEST_FINISH
    M118   Vitesse max recommandée: {speed - 10} mm/s
    M118 
    M118 Si limite dépassée (vibrations/sauts):
    M118   SPEED_TEST_CANCEL
    M118   Vitesse max sécurisée: {speeds[index - 1] - 10 if index > 0 else speed - 10} mm/s
    M118 ========================================
  {% else %}
    M118 ========================================
    M118 DERNIER PALIER TERMINÉ!
    M118 ========================================
    M118 Lancez: SPEED_TEST_FINISH
  {% endif %}
  
  # Incrémenter index
  SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=current_speed_index VALUE={index + 1}

[gcode_macro SPEED_TEST_RETRY]
description: Reteste le palier actuel (sans avancer)
gcode:
  {% set state = printer["gcode_macro _SPEED_TEST_STATE"] %}
  
  {% if not state.in_progress %}
    M118 
    M118 ========================================
    M118 ERREUR: Test non démarré
    M118 ========================================
    {action_raise_error("Test non démarré")}
  {% endif %}
  
  {% set speeds = state.speeds %}
  {% set index = state.current_speed_index %}
  {% set axis = state.axis %}
  
  # Vérifier si on a déjà commencé
  {% if index == 0 %}
    M118 
    M118 ========================================
    M118 ERREUR: Aucun palier testé encore
    M118 ========================================
    M118 Lancez d'abord: SPEED_TEST_NEXT
    M118 ========================================
    {action_raise_error("Aucun palier testé")}
  {% endif %}
  
  # Reculer d'un palier pour retester
  {% set retry_index = index - 1 %}
  {% set speed = speeds[retry_index] %}
  
  M118 
  M118 ========================================
  M118 RETEST PALIER {retry_index + 1}/{speeds|length}: {speed} mm/s
  M118 ========================================
  
  {% if axis == 'XY' %}
    M118 Test X...
    G1 Y150 F6000
    {% for i in range(3) %}
      G1 X10 F{speed * 60}
      G1 X290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test Y...
    G1 X150 F6000
    {% for i in range(3) %}
      G1 Y10 F{speed * 60}
      G1 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test XY diagonal...
    {% for i in range(2) %}
      G1 X10 Y10 F{speed * 60}
      G1 X290 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% else %}
    M118 Test Z...
    {% for i in range(5) %}
      G1 Z10 F{speed * 60}
      G1 Z100 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% endif %}
  
  M118 
  M118 ========================================
  M118 RETEST TERMINÉ: {speed} mm/s
  M118 ========================================
  M118 
  M118 SPEED_TEST_NEXT → Palier suivant
  M118 SPEED_TEST_RETRY → Retester encore
  M118 ========================================

[gcode_macro SPEED_TEST_GOTO]
description: Saute à un palier spécifique (paramètre: STEP)
gcode:
  {% set state = printer["gcode_macro _SPEED_TEST_STATE"] %}
  {% set target_step = params.STEP|default(0)|int %}
  
  {% if not state.in_progress %}
    M118 
    M118 ========================================
    M118 ERREUR: Test non démarré
    M118 ========================================
    {action_raise_error("Test non démarré")}
  {% endif %}
  
  {% set speeds = state.speeds %}
  
  # Validation
  {% if target_step < 1 or target_step > speeds|length %}
    M118 
    M118 ========================================
    M118 ERREUR: Palier invalide
    M118 ========================================
    M118 Paliers disponibles: 1 à {speeds|length}
    M118 Vous avez demandé: {target_step}
    M118 ========================================
    {action_raise_error("Palier invalide")}
  {% endif %}
  
  # Convertir numéro de palier en index (1-based → 0-based)
  {% set target_index = target_step - 1 %}
  {% set speed = speeds[target_index] %}
  {% set axis = state.axis %}
  
  M118 
  M118 ========================================
  M118 SAUT AU PALIER {target_step}/{speeds|length}: {speed} mm/s
  M118 ========================================
  
  {% if axis == 'XY' %}
    M118 Test X...
    G1 Y150 F6000
    {% for i in range(3) %}
      G1 X10 F{speed * 60}
      G1 X290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test Y...
    G1 X150 F6000
    {% for i in range(3) %}
      G1 Y10 F{speed * 60}
      G1 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test XY diagonal...
    {% for i in range(2) %}
      G1 X10 Y10 F{speed * 60}
      G1 X290 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% else %}
    M118 Test Z...
    {% for i in range(5) %}
      G1 Z10 F{speed * 60}
      G1 Z100 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% endif %}
  
  # Mettre à jour l'index pour le prochain SPEED_TEST_NEXT
  SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=current_speed_index VALUE={target_index + 1}
  
  M118 
  M118 ========================================
  M118 ÉVALUATION {speed} mm/s
  M118 ========================================
  M118 
  M118 SPEED_TEST_NEXT → Palier suivant ({target_step + 1}/{speeds|length})
  M118 SPEED_TEST_RETRY → Retester ce palier
  M118 SPEED_TEST_GOTO STEP=X → Sauter à un palier
  M118 ========================================

[gcode_macro SPEED_TEST_CUSTOM]
description: Teste une vitesse arbitraire (paramètres: SPEED, AXIS)
gcode:
  {% set speed = params.SPEED|default(0)|float %}
  {% set axis = params.AXIS|default('XY')|upper %}
  
  # Validation
  {% if speed <= 0 %}
    M118 
    M118 ========================================
    M118 ERREUR: Vitesse invalide
    M118 ========================================
    M118 Spécifiez une vitesse > 0 mm/s
    M118 Exemple: SPEED_TEST_CUSTOM SPEED=250 AXIS=XY
    M118 ========================================
    {action_raise_error("Vitesse invalide")}
  {% endif %}
  
  {% if axis not in ['XY', 'Z'] %}
    M118 
    M118 ========================================
    M118 ERREUR: Axe invalide
    M118 ========================================
    M118 AXIS doit être 'XY' ou 'Z' (reçu: {axis})
    M118 ========================================
    {action_raise_error("Axe invalide")}
  {% endif %}
  
  # Récupérer max_velocity pour avertissement
  {% if axis == 'Z' %}
    {% if 'max_z_velocity' in printer.configfile.settings.printer %}
      {% set max_vel = printer.configfile.settings.printer.max_z_velocity|float %}
    {% elif 'max_velocity' in printer.configfile.settings.stepper_z %}
      {% set max_vel = printer.configfile.settings.stepper_z.max_velocity|float %}
    {% else %}
      {% set max_vel = 20.0 %}
    {% endif %}
  {% else %}
    {% set max_vel = printer.configfile.settings.printer.max_velocity|float %}
  {% endif %}
  
  M118 
  M118 ========================================
  M118 TEST PERSONNALISÉ: {speed|int} mm/s
  M118 ========================================
  M118 Axe: {axis}
  {% if speed > max_vel %}
    M118 ⚠️ ATTENTION: {speed|int} mm/s > max_velocity ({max_vel|int} mm/s)
    M118 ⚠️ Klipper bridera à {max_vel|int} mm/s!
  {% endif %}
  M118 
  
  # Vérifier homing
  {% if not printer.toolhead.homed_axes %}
    M118 Homing automatique...
    G28
    G4 P1000
  {% endif %}
  
  # Position de sécurité
  G90
  {% if axis == 'XY' %}
    G1 Z50 F3000
  {% else %}
    G1 X150 Y150 F6000
    G1 Z50 F3000
  {% endif %}
  
  # Exécuter test
  {% if axis == 'XY' %}
    M118 Test X...
    G1 Y150 F6000
    {% for i in range(3) %}
      G1 X10 F{speed * 60}
      G1 X290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test Y...
    G1 X150 F6000
    {% for i in range(3) %}
      G1 Y10 F{speed * 60}
      G1 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
    
    M118 Test XY diagonal...
    {% for i in range(2) %}
      G1 X10 Y10 F{speed * 60}
      G1 X290 Y290 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% else %}
    M118 Test Z...
    {% for i in range(5) %}
      G1 Z10 F{speed * 60}
      G1 Z100 F{speed * 60}
    {% endfor %}
    G4 P1000
  {% endif %}
  
  M118 
  M118 ========================================
  M118 TEST TERMINÉ: {speed|int} mm/s
  M118 ========================================
  M118 
  M118 OBSERVEZ:
  {% if axis == 'XY' %}
    M118 - X: OK / Vibrations / Sauts
    M118 - Y: OK / Vibrations / Sauts
    M118 - XY: OK / Vibrations / Sauts
  {% else %}
    M118 - Z: OK / Vibrations / Sauts
    M118 - Bruit moteur: Normal / Anormal
    M118 - Stabilité plateau: OK / Oscillations
  {% endif %}
  M118 - Bruit: Normal / Élevé / Anormal
  M118 
  M118 Pour retester:
  M118   SPEED_TEST_CUSTOM SPEED={speed|int} AXIS={axis}
  M118 
  M118 Pour tester une autre vitesse:
  M118   SPEED_TEST_CUSTOM SPEED=XXX AXIS={axis}
  M118 ========================================

[gcode_macro SPEED_TEST_CANCEL]
description: Annule le test de vitesse en cours
gcode:
  {% set state = printer["gcode_macro _SPEED_TEST_STATE"] %}
  
  {% if not state.in_progress %}
    M118 Aucun test en cours
  {% else %}
    {% set speeds = state.speeds %}
    {% set index = state.current_speed_index %}
    {% set axis = state.axis %}
    {% set last_speed = speeds[index - 1] if index > 0 else 0 %}
    
    M118 
    M118 ========================================
    M118 TEST ANNULÉ
    M118 ========================================
    M118 Paliers effectués: {index}/{speeds|length}
    {% if index > 0 %}
      M118 Dernière vitesse testée: {last_speed} mm/s
      M118 
      M118 LIMITE ATTEINTE:
      M118 Vitesse max sécurisée: {last_speed - 10} mm/s
      M118 (Dernière vitesse OK -10 mm/s)
    {% endif %}
    M118 ========================================
    
    # Réinitialiser état
    SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=in_progress VALUE=False
    SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=current_speed_index VALUE=0
  {% endif %}

[gcode_macro SPEED_TEST_FINISH]
description: Affiche les résultats du test de vitesse
gcode:
  {% set state = printer["gcode_macro _SPEED_TEST_STATE"] %}
  
  {% if not state.in_progress %}
    M118 
    M118 ========================================
    M118 ERREUR: Aucun test en cours
    M118 ========================================
  {% else %}
    {% set speeds = state.speeds %}
    {% set index = state.current_speed_index %}
    {% set axis = state.axis %}
    
    # Récupérer la bonne max_velocity selon l'axe testé
    {% if axis == 'Z' %}
      {% if 'max_z_velocity' in printer.configfile.settings.printer %}
        {% set max_vel = printer.configfile.settings.printer.max_z_velocity|float|int %}
        {% set vel_source = 'printer.max_z_velocity' %}
      {% elif 'max_velocity' in printer.configfile.settings.stepper_z %}
        {% set max_vel = printer.configfile.settings.stepper_z.max_velocity|float|int %}
        {% set vel_source = 'stepper_z.max_velocity' %}
      {% else %}
        {% set max_vel = 20 %}
        {% set vel_source = 'par défaut (20 mm/s)' %}
      {% endif %}
    {% else %}
      {% set max_vel = printer.configfile.settings.printer.max_velocity|float|int %}
      {% set vel_source = 'printer.max_velocity' %}
    {% endif %}
    
    M118 
    M118 ========================================
    M118 TEST DE VITESSE TERMINÉ
    M118 ========================================
    M118 
    M118 Vitesse max configurée: {max_vel} mm/s ({vel_source})
    M118 Plage prévue: {speeds[0]} → {speeds[-1]} mm/s
    M118 Paliers testés: {index}/{speeds|length}
    M118 
    {% if index < speeds|length %}
      M118 ⚠️ Test arrêté avant la fin
      M118 Dernière vitesse testée: {speeds[index - 1] if index > 0 else 'Aucune'} mm/s
      M118 
    {% endif %}
    M118 RÉSULTATS (notez vos observations):
    {% for speed in speeds %}
      {% if loop.index0 < index %}
        M118 - {speed} mm/s: ___________ [✓ Testé]
      {% else %}
        M118 - {speed} mm/s: ___________ [Non testé]
      {% endif %}
    {% endfor %}
    M118 
    M118 ANALYSE:
    M118 Relire vos notes et identifier:
    M118 - Vitesse max sans vibrations: ___ mm/s
    M118 - Vitesse max acceptable: ___ mm/s
    M118 - Résonances détectées à: ___ mm/s
    M118 
    M118 RECOMMANDATION:
    M118 Utilisez vitesse max acceptable -10%
    M118 pour sécurité et longévité
    M118 
    M118 APPLIQUER DANS printer.cfg:
    M118 max_velocity: ___ mm/s
    M118 ========================================
    
    # Réinitialiser état
    SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=in_progress VALUE=False
    SET_GCODE_VARIABLE MACRO=_SPEED_TEST_STATE VARIABLE=current_speed_index VALUE=0
  {% endif %}

# ============================================
# AIDE
# ============================================

[gcode_macro SPEED_TEST_HELP]
description: Affiche aide test de vitesse
gcode:
  M118 ========================================
  M118 TEST DE VITESSE - AIDE
  M118 ========================================
  M118 
  M118 SYSTÈME INTERACTIF DYNAMIQUE:
  M118 Calcule automatiquement les paliers de test
  M118 basés sur votre max_velocity configurée
  M118 (paramètres: MIN_SPEED, STEPS, AXIS)
  M118 
  M118 ⚠️ Klipper bride les mouvements à max_velocity!
  M118 Impossible de tester au-dessus sans l'augmenter.
  M118 
  M118 ========================================
  M118 WORKFLOW COMPLET:
  M118 ========================================
  M118 
  M118 1. SPEED_TEST_START [MIN_SPEED=XXX] [STEPS=XX] [AXIS=XY]
  M118    → Démarre le test
  M118    → MIN_SPEED: vitesse min (défaut: 50% max_velocity)
  M118    → STEPS: nombre de paliers (défaut: 10, max: 20)
  M118    → AXIS: axes à tester (défaut: XY, options: XY, Z)
  M118    → Affiche les paliers calculés
  M118 
  M118 2. SPEED_TEST_NEXT
  M118    → Exécute le palier suivant
  M118    → Teste X, Y, XY à la vitesse
  M118    → Répéter jusqu'à trouver la limite
  M118 
  M118 3a. SPEED_TEST_FINISH
  M118    → Si vitesse max trouvée (arrêt volontaire)
  M118    → Affiche résultats avec paliers testés
  M118 
  M118 3b. SPEED_TEST_CANCEL
  M118    → Si limite dépassée (vibrations/sauts)
  M118    → Suggère vitesse palier précédent -10 mm/s
  M118 
  M118 ========================================
  M118 EXEMPLE D'UTILISATION:
  M118 ========================================
  M118 
  M118 Exemple 1 (défaut, max_velocity = 280 mm/s):
  M118   SPEED_TEST_START
  M118 → 10 paliers de 140 à 280 mm/s
  M118 
  M118 Exemple 2 (personnalisé):
  M118   SPEED_TEST_START MIN_SPEED=200 STEPS=5
  M118 → 5 paliers de 200 à 280 mm/s (XY)
  M118 
  M118 Exemple 3 (test Z):
  M118   SPEED_TEST_START AXIS=Z
  M118 → 10 paliers basés sur max_velocity de stepper_z
  M118 
  M118 Test palier 1 (140 mm/s): OK
  M118   SPEED_TEST_NEXT
  M118 Test palier 2 (155 mm/s): OK
  M118   SPEED_TEST_NEXT
  M118 ...
  M118 Test palier 8 (248 mm/s): OK mais vibrations
  M118   SPEED_TEST_FINISH
  M118 → Vitesse max recommandée: 238 mm/s
  M118 
  M118 Si tous paliers OK jusqu'à 280 mm/s:
  M118 → Augmentez max_velocity à 350 mm/s
  M118 → Relancez SPEED_TEST_START
  M118 
  M118 ========================================
  M118 SIGNES DE LIMITE ATTEINTE:
  M118 ========================================
  M118 - Vibrations/résonances fortes
  M118 - Bruit anormal (sifflement, claquement)
  M118 - Sauts de courroie
  M118 - Perte de précision
  M118 - Température moteur élevée
  M118 
  M118 ========================================
  M118 PROBLÈMES COURANTS:
  M118 ========================================
  M118 - Courroies vibrent: Tension insuffisante
  M118 - Sauts à vitesse élevée: Courant TMC faible
  M118 - Résonances: Vitesse dans zone critique
  M118 - Bruit plateau Y: Inertie/masse élevée
  M118 
  M118 ========================================
  M118 APPLIQUER LES RÉSULTATS:
  M118 ========================================
  M118 Dans printer.cfg, section [printer]:
  M118 max_velocity: XXX  # Vitesse max trouvée
  M118 
  M118 Puis: FIRMWARE_RESTART
  M118 ========================================