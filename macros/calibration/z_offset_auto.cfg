# ============================================
# Z-OFFSET AUTO CALIBRATION
# ============================================
# Calibration automatique du Z-offset avec sonde chauffee

[gcode_macro Z_CALIBRATE_OFFSET_AUTO]
description: Auto-calibrate Z-offset with heated bed
gcode:
  # Animation LED calibration
  LED_CALIBRATION
  
  M118 Z-Offset Calibration: Heated bed 60C (~10 min)
  
  # Reset tous les offsets pour calibration propre
  SET_GCODE_OFFSET Z=0 MOVE=0
  M118 All Z-offsets cleared for clean calibration
  
  # Verifier homing
  {% if printer.toolhead.homed_axes != 'xyz' %}
    STOP_LED_EFFECTS
    LED_HOMING
    G28
    STOP_LED_EFFECTS
    LED_CALIBRATION
  {% endif %}
  
  # Chauffer le lit pour conditions reelles
  M118 Heating bed to 60C...
  STOP_LED_EFFECTS
  START_LED_HEATING_TEMPLATE
  M190 S60
  STOP_LED_HEATING_TEMPLATE
  
  # Attendre stabilisation thermique (2 min)
  LED_CALIBRATION
  M118 Stabilizing (2 min)...
  G4 P120000
  
  # Calibration Z-offset
  M118 Starting Z-offset calibration...
  PROBE_CALIBRATE
  
  M118 Use: TESTZ Z=-0.01 (down) | TESTZ Z=+0.01 (up) | ACCEPT | ABORT
  M118 After ACCEPT, run: _SET_LED_IDLE then SAVE_CONFIG
  
  # Note: L'utilisateur doit faire ACCEPT manuellement
  # Puis _SET_LED_IDLE pour retourner en mode idle
  # Puis SAVE_CONFIG pour sauvegarder
  
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=zoffset

[gcode_macro Z_CHECK_OFFSET_QUICK]
description: Quick Z-offset verification with heated bed
gcode:
  # Animation LED calibration
  LED_CALIBRATION
  
  M118 Z-Offset Check: Heating to 60C...
  
  # Verifier homing
  {% if printer.toolhead.homed_axes != 'xyz' %}
    STOP_LED_EFFECTS
    LED_HOMING
    G28
    STOP_LED_EFFECTS
    LED_CALIBRATION
  {% endif %}
  
  # Chauffer le lit
  STOP_LED_EFFECTS
  START_LED_HEATING_TEMPLATE
  M190 S60
  STOP_LED_HEATING_TEMPLATE
  
  # Aller au centre (adaptatif)
  LED_CALIBRATION
  {% set x_center = printer.configfile.settings.stepper_x.position_max / 2 %}
  {% set y_center = printer.configfile.settings.stepper_y.position_max / 2 %}
  G90
  G1 X{x_center} Y{y_center} F6000
  
  # Probe au centre
  PROBE
  
  # Afficher Z actuel
  {% set z_pos = printer.toolhead.position.z %}
  M118 Z: {z_pos|round(3)}mm | Offset: {printer.configfile.settings.bltouch.z_offset|round(3)}mm
  
  # Retour position securisee
  G1 Z50 F1200
  
  # Retour idle
  _SET_LED_IDLE

# ============================================
# Z-OFFSET MULTI-POINT CALIBRATION
# ============================================

[gcode_macro Z_CALIBRATE_OFFSET_MULTIPOINT]
description: Calibration Z-offset multi-points avec analyse de répétabilité
gcode:
  {% set MATERIAL = params.MATERIAL|default('PLA')|string %}
  
  # Animation LED calibration
  LED_CALIBRATION
  
  M118 Z-Offset Multi-Point: {MATERIAL} | 5 points (~15 min)
  
  # Déterminer température selon matériau
  {% if MATERIAL == 'PLA' %}
    {% set bed_temp = 60 %}
  {% elif MATERIAL == 'PETG' %}
    {% set bed_temp = 80 %}
  {% elif MATERIAL == 'ABS' %}
    {% set bed_temp = 100 %}
  {% else %}
    {% set bed_temp = 60 %}
  {% endif %}
  
  # Homing
  {% if printer.toolhead.homed_axes != 'xyz' %}
    STOP_LED_EFFECTS
    LED_HOMING
    G28
    STOP_LED_EFFECTS
    LED_CALIBRATION
  {% endif %}
  
  # Chauffer le lit
  M118 Heating to {bed_temp}°C, stabilizing 3 min...
  STOP_LED_EFFECTS
  START_LED_HEATING_TEMPLATE
  M190 S{bed_temp}
  STOP_LED_HEATING_TEMPLATE
  LED_CALIBRATION
  M118 Stabilizing...
  G4 P180000
  
  # Définir les 5 points de test
  {% set x_center = printer.configfile.settings.stepper_x.position_max / 2 %}
  {% set y_center = printer.configfile.settings.stepper_y.position_max / 2 %}
  {% set x_min = printer.configfile.settings.bed_mesh.mesh_min[0] + 20 %}
  {% set x_max = printer.configfile.settings.bed_mesh.mesh_max[0] - 20 %}
  {% set y_min = printer.configfile.settings.bed_mesh.mesh_min[1] + 20 %}
  {% set y_max = printer.configfile.settings.bed_mesh.mesh_max[1] - 20 %}
  
  # Point 1 : Centre
  M118 [1/5] CENTER
  G90
  G1 X{x_center} Y{y_center} Z10 F6000
  PROBE_ACCURACY SAMPLES=10
  
  # Point 2 : Avant gauche
  M118 [2/5] FRONT LEFT
  G1 X{x_min} Y{y_min} Z10 F6000
  PROBE_ACCURACY SAMPLES=10
  
  # Point 3 : Avant droit
  M118 [3/5] FRONT RIGHT
  G1 X{x_max} Y{y_min} Z10 F6000
  PROBE_ACCURACY SAMPLES=10
  
  # Point 4 : Arrière gauche
  M118 [4/5] BACK LEFT
  G1 X{x_min} Y{y_max} Z10 F6000
  PROBE_ACCURACY SAMPLES=10
  
  # Point 5 : Arrière droit
  M118 [5/5] BACK RIGHT
  G1 X{x_max} Y{y_max} Z10 F6000
  PROBE_ACCURACY SAMPLES=10
  
  # Retour position sécurisée
  SAFE_POSITION
  
  M118 Multi-Point Complete | Compare median values
  M118 Diff <0.05mm=Good | >0.10mm=Adjust leveling
  M118 Range <0.025mm=Excellent | >0.050mm=Check probe
  M118 Next: PROBE_CALIBRATE or Z_TUNE_OFFSET
  
  # Retour idle
  _SET_LED_IDLE
  
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=zoffset

# ============================================
# Z-OFFSET FINE TUNING (Live adjust)
# ============================================

[gcode_macro Z_TUNE_OFFSET]
description: Ajustement fin du Z-offset avec test de première couche
gcode:
  {% set MATERIAL = params.MATERIAL|default('PLA')|string %}
  {% set SIZE = params.SIZE|default(50)|int %}  # Taille du carré de test
  
  # Animation LED calibration
  LED_CALIBRATION
  
  M118 Z-Offset Fine Tune: {MATERIAL} | {SIZE}x{SIZE}mm test square
  
  # Déterminer températures
  {% if MATERIAL == 'PLA' %}
    {% set bed_temp = 60 %}
    {% set extruder_temp = 200 %}
  {% elif MATERIAL == 'PETG' %}
    {% set bed_temp = 80 %}
    {% set extruder_temp = 240 %}
  {% elif MATERIAL == 'ABS' %}
    {% set bed_temp = 100 %}
    {% set extruder_temp = 250 %}
  {% else %}
    {% set bed_temp = 60 %}
    {% set extruder_temp = 200 %}
  {% endif %}
  
  # Homing
  {% if printer.toolhead.homed_axes != 'xyz' %}
    STOP_LED_EFFECTS
    LED_HOMING
    G28
    STOP_LED_EFFECTS
    LED_CALIBRATION
  {% endif %}
  
  # Chauffer plateau
  M118 Heating bed to {bed_temp}°C...
  STOP_LED_EFFECTS
  START_LED_HEATING_TEMPLATE
  M140 S{bed_temp}
  M190 S{bed_temp}
  STOP_LED_HEATING_TEMPLATE
  
  # Chauffer extruder
  LED_CALIBRATION
  M118 Heating extruder to {extruder_temp}°C...
  STOP_LED_EFFECTS
  START_LED_HEATING_TEMPLATE
  M104 S{extruder_temp}
  M109 S{extruder_temp}
  STOP_LED_HEATING_TEMPLATE
  
  # Charger bed mesh si disponible
  {% if 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default
    M118 Bed mesh loaded: default
  {% endif %}
  
  # LED impression
  _SET_LED_PRINTING
  
  # Calculer position centre
  {% set x_center = printer.configfile.settings.stepper_x.position_max / 2 %}
  {% set y_center = printer.configfile.settings.stepper_y.position_max / 2 %}
  {% set x_start = x_center - (SIZE / 2) %}
  {% set y_start = y_center - (SIZE / 2) %}
  
  M118 Use Baby Stepping to adjust | When perfect: Z_SAVE_ADJUSTMENT
  M118 Starting in 5s...
  G4 P5000
  
  # Préparer extruder
  G90
  M83  # Extruder relatif
  G92 E0
  
  # Purge line au bord
  G1 X10 Y10 Z0.3 F6000
  G1 Z0.2 F1200
  G1 X10 Y60 E8 F1200  # Purge line
  G1 X12 Y60 F6000
  G1 X12 Y10 E8 F1200  # Retour
  G92 E0
  
  # Aller au centre pour test
  G1 X{x_start} Y{y_start} Z0.3 F6000
  G1 Z0.2 F1200
  
  # Carré avec remplissage
  {% set x_end = x_start + SIZE %}
  {% set y_end = y_start + SIZE %}
  
  # Contour
  G1 X{x_end} Y{y_start} E{SIZE * 0.04} F1200
  G1 X{x_end} Y{y_end} E{SIZE * 0.04} F1200
  G1 X{x_start} Y{y_end} E{SIZE * 0.04} F1200
  G1 X{x_start} Y{y_start} E{SIZE * 0.04} F1200
  
  # Remplissage (lignes parallèles)
  {% for i in range(5, SIZE - 5, 5) %}
    {% if loop.index % 2 == 0 %}
      G1 X{x_start + i} Y{y_start + 5} E{(SIZE - 10) * 0.04} F1200
      G1 X{x_start + i} Y{y_end - 5} E{(SIZE - 10) * 0.04} F1200
    {% else %}
      G1 X{x_start + i} Y{y_end - 5} E{(SIZE - 10) * 0.04} F1200
      G1 X{x_start + i} Y{y_start + 5} E{(SIZE - 10) * 0.04} F1200
    {% endif %}
  {% endfor %}
  
  # Rétracter et monter
  G1 E-2 F1800
  G1 Z10 F1200
  
  M118 Test Complete | Inspect first layer
  M118 Good: Lines touch, smooth | Too high: Gaps | Too low: Scraping
  M118 Adjust with Baby Stepping | When perfect: Z_SAVE_ADJUSTMENT
  
  TURN_OFF_HEATERS
  
  # Retour idle
  _SET_LED_IDLE
  
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=zoffset