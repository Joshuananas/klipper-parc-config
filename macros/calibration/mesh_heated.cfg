# ============================================
# BED MESH CALIBRATE HEATED
# ============================================
# Calibration mesh avec préchauffage selon matériau

[gcode_macro BED_MESH_CALIBRATE_HEATED]
description: Performs calibration of bed mesh with proper preheating for a material
gcode:
  AMBIENT_REFRESH
  _BED_MESH_HEATED_PREPARE {rawparams}

[gcode_macro _BED_MESH_HEATED_PREPARE]
gcode:
  {% set material = params.MATERIAL|default('PLA')|upper %}
  {% set bed = params.BED_TEMP|default({'PLA': 60, 'PETG': 80, 'ABS': 110, 'PEI ABS': 110}.get(material, 60))|float %}
  {% set adjust = 0 if params.BED_TEMP is defined else params.AMBIENT_ADJUST|default(1)|int %}
  _AMBIENT_TARGETS BED_TEMP={bed} AMBIENT_ADJUST={adjust}
  _AMBIENT_REPORT
  _BED_MESH_HEATED_AMBIENT {rawparams}

[gcode_macro _BED_MESH_HEATED_AMBIENT]
gcode:
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  {% set MATERIAL = params.MATERIAL|default('PLA')|string %}

  {% set ambient = printer['gcode_macro _AMBIENT'] %}
  {% set BED_TEMP = ambient.bed_target|float %}

  {% if printer.toolhead.homed_axes != 'xyz' %}
    G28
  {% endif %}
  G90
  G1 Z50 F1200
  G1 X10 Y10 F9000

  {% set ambient_temp = ambient.temperature|float %}
  {% set ambient_valid = ambient.confidence|int >= 2 %}
  M118 Mesh ambient source={ambient.source} | Bed target={BED_TEMP}C

  M140 S{BED_TEMP}
  M117 Heating bed to {BED_TEMP} for {MATERIAL}
  START_LED_HEATING_TEMPLATE
  M190 S{BED_TEMP}
  STOP_LED_HEATING_TEMPLATE
  LED_CALIBRATION

  {% set current = printer.heater_bed.temperature %}

  {% if ambient_valid and ambient_temp < 20 %}
    {% if current < BED_TEMP - 20 %}
      M117 Waiting 7 min for thermal stabilization
      G4 P{7 * 60 * 1000}
    {% else %}
      M117 Waiting 2 min for thermal stabilization
      G4 P{2 * 60 * 1000}
    {% endif %}
  {% else %}
    {% if current < BED_TEMP - 20 %}
      M117 Waiting 5 min for thermal stabilization
      G4 P{5 * 60 * 1000}
    {% else %}
      M117 Waiting 1 min for thermal stabilization
      G4 P{1 * 60 * 1000}
    {% endif %}
  {% endif %}

  G28
  M117 Performing mesh calibration for {MATERIAL}
  BED_MESH_CALIBRATE
  M117 Saving mesh as {MATERIAL}
  BED_MESH_PROFILE SAVE={MATERIAL}
  M117 {MATERIAL} mesh saved successfully!
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=bed_mesh
  LED_SUCCESS
  G4 P2000
  M140 S0
  STOP_LED_EFFECTS
  _SET_LED_IDLE

