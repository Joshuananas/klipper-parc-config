# ============================================
# PID AUTOTUNE
# ============================================
# Calibration automatique PID pour extruder et bed

[gcode_macro _AUTO_PID_EXTRUDER]
description: Auto-tune PID extruder for common materials
gcode:
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  M118 ========================================
  M118 PID EXTRUDER CALIBRATION
  M118 ========================================
  M118 Tuning for PLA, PETG, ABS temperatures
  M118 Duration: ~15 minutes
  M118 ========================================
  
  # Position securisee (adaptative)
  SAFE_POSITION
  
  # PLA - 200C avec ventilation 100%
  M118 [1/3] Tuning for PLA (200C, fan 100%)...
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=200
  M118 PLA PID complete, waiting for cooldown...
  G4 P30000  # Attendre 30s refroidissement
  
  # PETG - 240C avec ventilation 50%
  M118 [2/3] Tuning for PETG (240C, fan 50%)...
  M106 S128
  PID_CALIBRATE HEATER=extruder TARGET=240
  M118 PETG PID complete, waiting for cooldown...
  G4 P30000
  
  # ABS - 250C sans ventilation
  M118 [3/3] Tuning for ABS (250C, fan 0%)...
  M106 S0
  PID_CALIBRATE HEATER=extruder TARGET=250
  M118 ABS PID complete
  
  # Cleanup
  M106 S0
  M104 S0
  
  M118 PID Extruder calibration complete
  LED_SUCCESS
  G4 P2000
  STOP_LED_EFFECTS
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=pid_extruder

[gcode_macro _AUTO_PID_BED]
description: Auto-tune PID bed for common materials
gcode:
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  M118 ========================================
  M118 PID BED CALIBRATION
  M118 ========================================
  M118 Tuning for PLA, PETG, ABS temperatures
  M118 Duration: ~30 minutes
  M118 ========================================
  
  # Position securisee (adaptative)
  SAFE_POSITION
  
  # PLA - 60C
  M118 [1/3] Tuning for PLA (60C)...
  PID_CALIBRATE HEATER=heater_bed TARGET=60
  M118 PLA bed PID complete, waiting for cooldown...
  G4 P60000  # Attendre 60s refroidissement
  
  # PETG - 80C
  M118 [2/3] Tuning for PETG (80C)...
  PID_CALIBRATE HEATER=heater_bed TARGET=80
  M118 PETG bed PID complete, waiting for cooldown...
  G4 P60000
  
  # ABS - 100C
  M118 [3/3] Tuning for ABS (100C)...
  PID_CALIBRATE HEATER=heater_bed TARGET=100
  M118 ABS bed PID complete
  
  # Cleanup
  M140 S0
  
  M118 PID Bed calibration complete
  LED_SUCCESS
  G4 P2000
  STOP_LED_EFFECTS
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=pid_bed

[gcode_macro PID_TUNE_EXTRUDER]
description: Manual PID tune for specific temperature
gcode:
  {% set temp = params.TEMP|default(200)|float %}
  {% set fan = params.FAN|default(100)|int %}
  
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  M118 ========================================
  M118 PID TUNING EXTRUDER
  M118 ========================================
  M118 Target: {temp}C
  M118 Fan: {fan}%
  M118 Duration: ~5 minutes
  M118 ========================================
  
  # Position securisee
  {% if printer.toolhead.homed_axes != 'xyz' %}
    G28
  {% endif %}
  
  # Position securisee (adaptative)
  SAFE_POSITION
  
  # Set fan speed
  M106 S{(fan * 255 / 100)|int}
  
  # Run PID autotune
  PID_CALIBRATE HEATER=extruder TARGET={temp}
  
  # Save results
  SAVE_CONFIG
  
  # Cleanup
  M106 S0
  M104 S0
  
  M118 PID tuning complete for {temp}C
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=pid_extruder
  LED_SUCCESS
  G4 P2000
  STOP_LED_EFFECTS
  _SET_LED_IDLE

