# ============================================
# MATERIAL PRESSURE ADVANCE
# ============================================
# Définit le Pressure Advance selon le matériau

[gcode_macro MATERIAL_PA]
description: Sets pressure advance based on material type
gcode:
  {% set MATERIAL = params.MATERIAL|default('PLA')|string %}

  {% if MATERIAL == 'PLA' %}
    SET_PRESSURE_ADVANCE ADVANCE=0.04
    M117 Set PLA pressure advance
  {% elif MATERIAL == 'PETG' %}
    SET_PRESSURE_ADVANCE ADVANCE=0.06
    M117 Set PETG pressure advance
  {% elif MATERIAL == 'ABS' or MATERIAL == 'PEI ABS' %}
    SET_PRESSURE_ADVANCE ADVANCE=0.055
    M117 Set ABS pressure advance
  {% else %}
    SET_PRESSURE_ADVANCE ADVANCE=0.04
    M117 Set default pressure advance
  {% endif %}
