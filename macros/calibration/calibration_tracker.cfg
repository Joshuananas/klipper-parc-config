# ============================================
# CALIBRATION TRACKER
# ============================================
# Suivi des calibrations et rappels intelligents

[gcode_macro _CALIBRATION_TRACKER]
description: Track calibration dates and remind user
# Timestamps des dernieres calibrations
variable_last_pid_extruder: 0
variable_last_pid_bed: 0
variable_last_input_shaper: 0
variable_last_zoffset: 0
variable_last_bed_mesh: 0
variable_last_thermal_benchmark: 0
variable_last_pa: 0
variable_last_flow: 0
variable_last_retraction: 0

# Intervalles recommandes (en jours)
variable_interval_pid: 90           # 3 mois
variable_interval_input_shaper: 180 # 6 mois
variable_interval_zoffset: 30       # 1 mois
variable_interval_bed_mesh: 30      # 1 mois
variable_interval_thermal_benchmark: 90  # 3 mois
variable_interval_pa: 90            # 3 mois
variable_interval_flow: 90          # 3 mois
variable_interval_retraction: 90    # 3 mois

gcode:

# ============================================
# NOTE: GET_CALIBRATION_STATUS moved to
# macros/utilities/info_utilities.cfg
# ============================================

[gcode_macro _UPDATE_CALIBRATION_TIMESTAMP]
description: Update calibration timestamp
gcode:
  {% set type = params.TYPE|string %}
  {% set now = printer.system_stats.cputime|int %}
  
  SET_GCODE_VARIABLE MACRO=_CALIBRATION_TRACKER VARIABLE=last_{type} VALUE={now}
  SAVE_VARIABLE VARIABLE=cal_{type} VALUE={now}
  
  M118 Calibration timestamp updated: {type}

[gcode_macro MARK_PA_CALIBRATED]
description: Mark Pressure Advance as calibrated
gcode:
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=pa
  M118 Pressure Advance marked as calibrated

[gcode_macro MARK_FLOW_CALIBRATED]
description: Mark Flow Rate as calibrated
gcode:
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=flow
  M118 Flow Rate marked as calibrated

[gcode_macro MARK_RETRACTION_CALIBRATED]
description: Mark Retraction as calibrated
gcode:
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=retraction
  M118 Retraction marked as calibrated