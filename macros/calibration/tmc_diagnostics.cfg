#################################################
# TMC2209 DIAGNOSTIC & CALIBRATION MACROS
#################################################

# ============================================
# DIAGNOSTIC COMPLET
# ============================================

[gcode_macro TMC_STATUS]
description: Affiche status de tous les drivers TMC
gcode:
  M118 ========================================
  M118 TMC2209 STATUS - ALL DRIVERS
  M118 ========================================
  
  M118 --- STEPPER X ---
  DUMP_TMC STEPPER=stepper_x
  
  M118 --- STEPPER Y ---
  DUMP_TMC STEPPER=stepper_y
  
  M118 --- STEPPER Z ---
  DUMP_TMC STEPPER=stepper_z
  
  M118 --- EXTRUDER ---
  DUMP_TMC STEPPER=extruder
  
  M118 ========================================

[gcode_macro TMC_CHECK_ERRORS]
description: Check TMC driver errors (safe if drivers absent)
gcode:
  {% for drv in ['tmc2209 stepper_x', 'tmc2209 stepper_y', 'tmc2209 stepper_z', 'tmc2209 extruder'] %}
    {% if drv in printer %}
      M118 {drv}: {printer[drv].drv_status}
    {% else %}
      M118 {drv}: ABSENT (standalone mode?)
    {% endif %}
  {% endfor %}
[gcode_macro TMC_SET_CURRENT_ALL]
description: Change courant de tous les steppers X/Y/Z
gcode:
  {% set current = params.CURRENT|default(0.580)|float %}
  
  M118 ========================================
  M118 TMC SET CURRENT ALL
  M118 ========================================
  M118 Nouveau courant: {current}A
  
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={current}
  M118 stepper_x: {current}A
  
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={current}
  M118 stepper_y: {current}A
  
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={current}
  M118 stepper_z: {current}A
  
  M118 Extruder non modifié (besoin courant différent)
  M118 ========================================

[gcode_macro TMC_RESET_TO_DEFAULT]
description: Restaure courants par défaut
gcode:
  M118 ========================================
  M118 TMC RESET TO DEFAULT
  M118 ========================================
  
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.580
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.580
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.580
  SET_TMC_CURRENT STEPPER=extruder CURRENT=0.650
  
  M118 Courants par défaut restaurés
  M118 ========================================

[gcode_macro TMC_APPLY_OPTIMAL]
description: Applique valeurs optimales (X= Y= Z= E=)
gcode:
  {% set current_x = params.X|default(0)|float %}
  {% set current_y = params.Y|default(0)|float %}
  {% set current_z = params.Z|default(0)|float %}
  {% set current_e = params.E|default(0)|float %}
  
  M118 
  M118 ========================================
  M118 TMC APPLY OPTIMAL CURRENT
  M118 ========================================
  
  # Appliquer immédiatement
  {% if current_x > 0 %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={current_x}
    M118 stepper_x: {current_x}A ✓
  {% endif %}
  {% if current_y > 0 %}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={current_y}
    M118 stepper_y: {current_y}A ✓
  {% endif %}
  {% if current_z > 0 %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={current_z}
    M118 stepper_z: {current_z}A ✓
  {% endif %}
  {% if current_e > 0 %}
    SET_TMC_CURRENT STEPPER=extruder CURRENT={current_e}
    M118 extruder: {current_e}A ✓
  {% endif %}
  
  M118 
  M118 Valeurs appliquées temporairement!
  M118 
  M118 ========================================
  M118 POUR ENREGISTRER DÉFINITIVEMENT:
  M118 ========================================
  M118 
  M118 1. Ouvrir: config/hardware/tmc2209_uart.cfg
  M118 
  M118 2. Modifier les lignes run_current:
  M118 
  {% if current_x > 0 %}
    M118 [tmc2209 stepper_x]
    M118 run_current: {current_x}
    M118 
  {% endif %}
  {% if current_y > 0 %}
    M118 [tmc2209 stepper_y]
    M118 run_current: {current_y}
    M118 
  {% endif %}
  {% if current_z > 0 %}
    M118 [tmc2209 stepper_z]
    M118 run_current: {current_z}
    M118 
  {% endif %}
  {% if current_e > 0 %}
    M118 [tmc2209 extruder]
    M118 run_current: {current_e}
    M118 
  {% endif %}
  M118 3. Sauvegarder le fichier (Ctrl+S)
  M118 
  M118 4. Redémarrer Klipper:
  M118    FIRMWARE_RESTART
  M118 
  M118 ========================================

# ============================================
# CALIBRATION UNIVERSELLE DU COURANT TMC
# ============================================

[gcode_macro _TMC_CALIBRATE_STATE]
description: Variables d'état pour calibration TMC (interne)
variable_stepper: ""
variable_method: ""
variable_current_step: 0              # Étape actuelle (0=non démarré, 1=en cours, 2=terminé)
variable_test_index: 0                # Index du test en cours
variable_num_tests: 0                 # Nombre total de tests
variable_current_value: 0.0           # Courant en cours de test
variable_start_current: 0.0
variable_max_current: 0.0
variable_step_size: 0.0
variable_duration: 0
variable_target_temp: 0
variable_max_safe_temp: 0
variable_cooldown_target: 0
variable_extrude_temp: 0
variable_speed_max: 0
variable_speed_normal: 0
variable_speed_min: 0
gcode:

[gcode_macro TMC_CALIBRATE_CURRENT]
description: Alias pour TMC_CALIBRATE_START (compatibilité)
gcode:
  M118 
  M118 ========================================
  M118 INFO: TMC_CALIBRATE_CURRENT est obsolète
  M118 ========================================
  M118 Utilisez le nouveau système:
  M118 1. TMC_CALIBRATE_START {rawparams}
  M118 2. TMC_CALIBRATE_NEXT (répéter)
  M118 3. TMC_CALIBRATE_FINISH
  M118 
  M118 Redirection automatique...
  M118 ========================================
  TMC_CALIBRATE_START {rawparams}
  
# ============================================
# NOUVELLE CALIBRATION (SANS PAUSE)
# ============================================

[gcode_macro TMC_CALIBRATE_START]
description: Démarre calibration TMC (STEPPER= METHOD=IR/THERMAL/TOUCH/WAX START= MAX= STEP= DURATION=)
gcode:
  {% set stepper = params.STEPPER|default('stepper_x')|string %}
  {% set method = params.METHOD|default('IR')|upper %}
  {% if method == 'CANDLE' %}
    {% set method = 'WAX' %}  # Alias pour compatibilité
  {% endif %}
  
  # Vérifications de sécurité
  M118 
  M118 Vérification configuration TMC...
  
  # Vérifier si le stepper existe
  {% if stepper not in ['stepper_x', 'stepper_y', 'stepper_z', 'extruder'] %}
    M118 
    M118 ========================================
    M118 ERREUR: Stepper invalide
    M118 ========================================
    M118 Stepper spécifié: {stepper}
    M118 
    M118 Steppers valides:
    M118 - stepper_x
    M118 - stepper_y
    M118 - stepper_z
    M118 - extruder
    M118 ========================================
    {action_raise_error("Stepper invalide: " + stepper)}
  {% endif %}
  
  # Vérifier si TMC2209 configuré en UART
  {% set tmc_name = "tmc2209 " + stepper %}
  {% if tmc_name not in printer.configfile.settings %}
    M118 
    M118 ========================================
    M118 ERREUR: TMC2209 non configuré
    M118 ========================================
    M118 Le stepper '{stepper}' n'a pas de
    M118 configuration TMC2209 en mode UART.
    M118 
    M118 Vérifier:
    M118 1. Fichier tmc2209_uart.cfg
    M118 2. Section [tmc2209 {stepper}]
    M118 3. uart_pin défini
    M118 
    M118 Si driver en mode standalone:
    M118 - Cette macro ne fonctionne PAS
    M118 - Utiliser potentiomètres physiques
    M118 ========================================
    {action_raise_error("TMC2209 UART non configuré pour " + stepper)}
  {% endif %}
  
  M118 TMC2209 UART détecté ✓
  
  # Valeurs par défaut adaptées selon le moteur
  {% if stepper == 'extruder' %}
    {% set start_current = params.START|default(0.60)|float %}
    {% set max_current = params.MAX|default(0.80)|float %}
  {% else %}
    {% set start_current = params.START|default(0.70)|float %}
    {% set max_current = params.MAX|default(1.10)|float %}
  {% endif %}
  {% set step = params.STEP|default(0.10)|float %}
  {% set duration = params.DURATION|default(300)|int %}
  {% set target_temp = params.TARGET_TEMP|default(45)|int %}
  {% set max_safe_temp = params.MAX_TEMP|default(65)|int %}
  {% set cooldown_target = params.COOLDOWN_TEMP|default(35)|int %}
  {% set extrude_temp = params.EXTRUDE_TEMP|default(200)|int %}
  
  # Vitesses depuis configuration imprimante
  {% set speed_max = printer.configfile.settings.printer.max_velocity|default(200) %}
  {% set speed_normal = (speed_max * 0.6)|int %}
  {% set speed_min = (speed_max * 0.3)|int %}
  
  # Calculer nombre de tests
  {% set num_tests = ((max_current - start_current) / step)|int + 1 %}
  
  # Sauvegarder dans l'état
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=stepper VALUE="'{stepper}'"
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=method VALUE="'{method}'"
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=start_current VALUE={start_current}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=max_current VALUE={max_current}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=step_size VALUE={step}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=duration VALUE={duration}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=target_temp VALUE={target_temp}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=max_safe_temp VALUE={max_safe_temp}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=cooldown_target VALUE={cooldown_target}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=extrude_temp VALUE={extrude_temp}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=speed_max VALUE={speed_max}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=speed_normal VALUE={speed_normal}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=speed_min VALUE={speed_min}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=num_tests VALUE={num_tests}
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=test_index VALUE=0
  SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=current_step VALUE=1
  
  # Homing automatique si nécessaire
  {% if stepper in ['stepper_x', 'stepper_y', 'stepper_z'] %}
    {% if not printer.toolhead.homed_axes %}
      M118 Homing automatique...
      G28
      G4 P1000
    {% else %}
      M118 Axes déjà homés ✓
    {% endif %}
  {% endif %}
  
  # Position de sécurité
  {% if stepper in ['stepper_x', 'stepper_y'] %}
    M118 Déplacement position sécurité (centre plateau Z50)...
    G90
    G1 Z50 F3000
    G1 X150 Y150 F6000
    G4 P500
  {% elif stepper == 'stepper_z' %}
    M118 Déplacement position sécurité (centre XY, Z milieu)...
    G90
    G1 X150 Y150 F6000
    G1 Z50 F3000
    G4 P500
  {% endif %}
  
  # Chauffe extruder si nécessaire
  {% if stepper == 'extruder' %}
    M118 Test extruder détecté
    M118 Température cible: {extrude_temp}°C
    {% if printer.extruder.temperature < (extrude_temp - 5) %}
      M118 Chauffe extruder en cours...
      M109 S{extrude_temp}
      M118 Température atteinte ✓
      G4 P2000
    {% else %}
      M118 Extruder déjà chaud ✓
    {% endif %}
  {% endif %}
  
  M118 
  M118 ========================================
  M118 TMC CALIBRATION - PRÉPARATION
  M118 ========================================
  M118 Stepper: {stepper}
  M118 Méthode: {method}
  M118 Range: {start_current}A - {max_current}A (step {step}A)
  M118 Nombre de tests: {num_tests}
  M118 Durée par test: {duration}s ({(duration/60)|round(1)}min)
  M118 Temp cible: {target_temp}°C | Max: {max_safe_temp}°C
  M118 
  M118 PROFIL VITESSE:
  M118 - Phase 1 (0-30s): {speed_max}mm/s (PLEINE PUISSANCE)
  M118 - Phase 2 (30-90s): {speed_max}-{speed_normal}mm/s (RALENTISSEMENT)
  M118 - Phase 3 (90-{duration}s): {speed_normal}mm/s (VITESSE IMPRESSION)
  M118 
  M118 MÉTHODE DE MESURE:
  {% if method == 'IR' %}
    M118 🌡️ THERMOMÈTRE INFRAROUGE
    M118 - Viser CORPS du moteur (pas l'arbre)
    M118 - Distance: 5-10cm | Émissivité: 0.95
  {% elif method == 'THERMAL' %}
    M118 📷 CAMÉRA THERMIQUE
    M118 - Cadrer le moteur complètement
    M118 - Identifier zone la plus chaude
  {% elif method == 'TOUCH' %}
    M118 ✋ TEST TACTILE
    M118 - Toucher BRIÈVEMENT le moteur
    M118 - Objectif: Tiède (peut tenir 2-3s)
  {% elif method == 'WAX' %}
    M118 🕯️ INDICATEUR CIRE (INNOVANT!)
    M118 - Placer grain de riz de cire paraffine
    M118 - Objectif: Ramolli mais PAS fondu (46-50°C)
  {% endif %}
  M118 
  {% set timeout_sec = printer.configfile.settings.idle_timeout.timeout|int %}
  {% set timeout_min = (timeout_sec / 60)|int %}
  M118 ⏰ TIMEOUT: {timeout_min} minutes
  M118 ========================================
  M118 
  M118 PRÊT À COMMENCER?
  M118 
  M118 Pour démarrer le premier test:
  M118   TMC_CALIBRATE_NEXT
  M118 
  M118 Pour annuler:
  M118   TMC_CALIBRATE_CANCEL
  M118 ========================================

[gcode_macro TMC_CALIBRATE_NEXT]
description: Exécute le test suivant de calibration TMC
gcode:
  {% set state = printer["gcode_macro _TMC_CALIBRATE_STATE"] %}
  
  # Vérifier qu'une calibration est en cours
  {% if state.current_step == 0 %}
    M118 
    M118 ========================================
    M118 ERREUR: Aucune calibration en cours
    M118 ========================================
    M118 Lancez d'abord: TMC_CALIBRATE_START
    M118 ========================================
    {action_raise_error("Aucune calibration en cours")}
  {% endif %}
  
  # Calculer le courant actuel
  {% set test_index = state.test_index + 1 %}
  {% set current = state.start_current + (test_index - 1) * state.step_size %}
  
  # Vérifier si on a dépassé le max
  {% if current > state.max_current %}
    M118 
    M118 ========================================
    M118 TOUS LES TESTS TERMINÉS!
    M118 ========================================
    M118 
    M118 Pour voir les résultats:
    M118   TMC_CALIBRATE_FINISH
    M118 ========================================
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=current_step VALUE=2
  {% else %}
    # Mettre à jour l'index
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=test_index VALUE={test_index}
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=current_value VALUE={current}
    
    M118 
    M118 ========================================
    M118 TEST {test_index}/{state.num_tests}: {current}A
    M118 ========================================
    
    # Appliquer le courant
    SET_TMC_CURRENT STEPPER={state.stepper} CURRENT={current}
    G4 P2000
    
    # Instructions de mesure initiale
    {% if state.method == 'IR' %}
      M118 🌡️ MESURER TEMP DÉPART (IR): ___°C
    {% elif state.method == 'THERMAL' %}
      M118 📷 PHOTO THERMIQUE DÉPART: ___°C
    {% elif state.method == 'TOUCH' %}
      M118 ✋ TEST TACTILE DÉPART: Froid/Tiède/Chaud
    {% elif state.method == 'WAX' %}
      M118 🕯️ PLACER CIRE SUR MOTEUR MAINTENANT
      M118 ÉTAT DÉPART: Solide/Ramolli/Fondu
    {% endif %}
    G4 P3000
    
    M118 
    M118 DÉMARRAGE RAMPE THERMIQUE ({state.duration}s)...
    M118 Surveillez température! PAUSE si trop chaud!
    M118 
    
    # PHASE 1: Pleine puissance (0-30s) - Mouvements complexes
    {% set phase1_duration = 30 %}
    
    M118 PHASE 1: Pleine puissance {state.speed_max}mm/s (30s, mouvements complexes)
    {% if state.stepper == 'stepper_x' %}
      # Simulation remplissage: aller-retours courts puis longs
      {% set speed_f = state.speed_max * 60 %}
      # Lignes courtes (20mm)
      {% for i in range(8) %}
        G1 X{50 + i * 20} F{speed_f}
        G1 X{70 + i * 20} F{speed_f}
      {% endfor %}
      # Lignes moyennes (50mm)
      {% for i in range(5) %}
        G1 X{40 + i * 40} F{speed_f}
        G1 X{90 + i * 40} F{speed_f}
      {% endfor %}
      # Lignes longues (100mm)
      {% for i in range(3) %}
        G1 X{20 + i * 80} F{speed_f}
        G1 X{120 + i * 80} F{speed_f}
      {% endfor %}
      # Retour pleine course
      G1 X10 F{speed_f}
      G1 X290 F{speed_f}
      G1 X10 F{speed_f}
    {% elif state.stepper == 'stepper_y' %}
      # Simulation remplissage Y: aller-retours courts puis longs
      {% set speed_f = state.speed_max * 60 %}
      # Lignes courtes (20mm)
      {% for i in range(8) %}
        G1 Y{50 + i * 20} F{speed_f}
        G1 Y{70 + i * 20} F{speed_f}
      {% endfor %}
      # Lignes moyennes (50mm)
      {% for i in range(5) %}
        G1 Y{40 + i * 40} F{speed_f}
        G1 Y{90 + i * 40} F{speed_f}
      {% endfor %}
      # Lignes longues (100mm)
      {% for i in range(3) %}
        G1 Y{20 + i * 80} F{speed_f}
        G1 Y{120 + i * 80} F{speed_f}
      {% endfor %}
      # Retour pleine course
      G1 Y10 F{speed_f}
      G1 Y290 F{speed_f}
      G1 Y10 F{speed_f}
    {% elif state.stepper == 'stepper_z' %}
      # Z: mouvements courts puis longs
      {% set speed_f = (state.speed_max / 3) * 60 %}
      {% for i in range(5) %}
        G1 Z{30 + i * 10} F{speed_f}
        G1 Z{40 + i * 10} F{speed_f}
      {% endfor %}
      {% for i in range(3) %}
        G1 Z20 F{speed_f}
        G1 Z80 F{speed_f}
      {% endfor %}
    {% elif state.stepper == 'extruder' %}
      # Extruder: extrusions courtes puis longues
      {% set speed_f = state.speed_max * 60 %}
      {% for i in range(10) %}
        G1 E10 F{speed_f}
        G1 E-10 F{speed_f}
      {% endfor %}
      {% for i in range(5) %}
        G1 E30 F{speed_f}
        G1 E-30 F{speed_f}
      {% endfor %}
    {% endif %}
    
    # PHASE 2: Ralentissement progressif (30-90s) - Mouvements variés
    {% set phase2_duration = 60 %}
    {% set num_segments = 20 %}
    
    M118 PHASE 2: Ralentissement progressif (60s, {num_segments} segments)
    {% for step_idx in range(num_segments) %}
      {% set speed_ratio = 1.0 - (step_idx / num_segments) %}
      {% set current_speed = state.speed_normal + (state.speed_max - state.speed_normal) * speed_ratio %}
      {% set speed_f = current_speed * 60 %}
      
      {% if state.stepper == 'stepper_x' %}
        # Mouvements variés: courts, moyens, longs
        {% if step_idx % 3 == 0 %}
          # Courts (30mm)
          G1 X{50 + (step_idx % 8) * 25} F{speed_f}
          G1 X{80 + (step_idx % 8) * 25} F{speed_f}
        {% elif step_idx % 3 == 1 %}
          # Moyens (80mm)
          G1 X{40 + (step_idx % 5) * 40} F{speed_f}
          G1 X{120 + (step_idx % 5) * 40} F{speed_f}
        {% else %}
          # Longs (pleine course)
          G1 X10 F{speed_f}
          G1 X290 F{speed_f}
        {% endif %}
      {% elif state.stepper == 'stepper_y' %}
        # Mouvements variés Y
        {% if step_idx % 3 == 0 %}
          G1 Y{50 + (step_idx % 8) * 25} F{speed_f}
          G1 Y{80 + (step_idx % 8) * 25} F{speed_f}
        {% elif step_idx % 3 == 1 %}
          G1 Y{40 + (step_idx % 5) * 40} F{speed_f}
          G1 Y{120 + (step_idx % 5) * 40} F{speed_f}
        {% else %}
          G1 Y10 F{speed_f}
          G1 Y290 F{speed_f}
        {% endif %}
      {% elif state.stepper == 'stepper_z' %}
        # Z: mouvements variés
        {% if step_idx % 2 == 0 %}
          G1 Z{30 + (step_idx % 6) * 10} F{(current_speed / 3) * 60}
          G1 Z{50 + (step_idx % 6) * 10} F{(current_speed / 3) * 60}
        {% else %}
          G1 Z20 F{(current_speed / 3) * 60}
          G1 Z80 F{(current_speed / 3) * 60}
        {% endif %}
      {% elif state.stepper == 'extruder' %}
        # Extruder: varié
        {% if step_idx % 2 == 0 %}
          G1 E20 F{speed_f}
          G1 E-20 F{speed_f}
        {% else %}
          G1 E40 F{speed_f}
          G1 E-40 F{speed_f}
        {% endif %}
      {% endif %}
    {% endfor %}
    
    # PHASE 3: Vitesse impression normale (90s-fin) - Simulation impression réelle
    {% set phase3_duration = state.duration - 90 %}
    {% if phase3_duration > 0 %}
      {% set num_patterns_calc = (phase3_duration / 20)|int %}  # Pattern de 20s
      {% set num_patterns = [num_patterns_calc, 10]|min %}  # Max 10 patterns
      {% set num_patterns = [num_patterns, 1]|max %}  # Min 1 pattern
    {% else %}
      {% set num_patterns = 1 %}
    {% endif %}
    
    M118 PHASE 3: Vitesse impression {state.speed_normal}mm/s ({phase3_duration}s, {num_patterns} patterns)
    {% set speed_f = state.speed_normal * 60 %}
    
    {% if state.stepper == 'stepper_x' %}
      # Simulation remplissage réaliste: lignes parallèles avec retours
      {% for pattern in range(num_patterns) %}
        # Remplissage linéaire (comme un vrai slice)
        {% for line in range(5) %}
          G1 X{30 + line * 40} F{speed_f}
          G1 X{260 - line * 40} F{speed_f}
        {% endfor %}
        # Inversion direction
        {% for line in range(5) %}
          G1 X{260 - line * 40} F{speed_f}
          G1 X{30 + line * 40} F{speed_f}
        {% endfor %}
      {% endfor %}
    {% elif state.stepper == 'stepper_y' %}
      # Simulation remplissage Y réaliste
      {% for pattern in range(num_patterns) %}
        # Remplissage linéaire Y
        {% for line in range(5) %}
          G1 Y{30 + line * 40} F{speed_f}
          G1 Y{260 - line * 40} F{speed_f}
        {% endfor %}
        # Inversion direction
        {% for line in range(5) %}
          G1 Y{260 - line * 40} F{speed_f}
          G1 Y{30 + line * 40} F{speed_f}
        {% endfor %}
      {% endfor %}
    {% elif state.stepper == 'stepper_z' %}
      # Z: mouvements réalistes (changements de couche)
      {% for pattern in range(num_patterns) %}
        # Petits mouvements (changement couche)
        {% for i in range(8) %}
          G1 Z{30 + i * 5} F{(state.speed_normal / 3) * 60}
          G1 Z{35 + i * 5} F{(state.speed_normal / 3) * 60}
        {% endfor %}
        # Retour position basse
        G1 Z25 F{(state.speed_normal / 3) * 60}
      {% endfor %}
    {% elif state.stepper == 'extruder' %}
      # Extruder: simulation extrusion réelle (variée)
      {% for pattern in range(num_patterns) %}
        # Extrusions courtes (périmètres)
        {% for i in range(5) %}
          G1 E15 F{speed_f}
          G1 E-15 F{speed_f}
        {% endfor %}
        # Extrusions longues (remplissage)
        {% for i in range(3) %}
          G1 E40 F{speed_f}
          G1 E-40 F{speed_f}
        {% endfor %}
      {% endfor %}
    {% endif %}
    
    G4 P3000
    M118 
    M118 ========================================
    M118 MESURE TEMPÉRATURE FINALE
    M118 ========================================
    M118 Test: {current}A | Durée: {state.duration}s
    M118 
    
    # Instructions de mesure finale
    {% if state.method == 'IR' %}
      M118 🌡️ MESURER TEMP FINALE (IR): ___°C
    {% elif state.method == 'THERMAL' %}
      M118 📷 PHOTO THERMIQUE FINALE: ___°C
    {% elif state.method == 'TOUCH' %}
      M118 ✋ TEST TACTILE FINAL: Froid/Tiède/Chaud
    {% elif state.method == 'WAX' %}
      M118 🕯️ OBSERVER ÉTAT CIRE MAINTENANT
      M118 ÉTAT FINAL: Solide/Ramolli/Fondu/Liquide
    {% endif %}
    
    M118 
    M118 Attendre 10s pour stabilisation...
    G4 P10000
    M118 
    
    # Évaluation selon méthode
    {% if state.method == 'TOUCH' %}
      M118 ÉVALUATION:
      M118 - Froid (>5s): Courant trop faible
      M118 - Tiède (2-3s): OPTIMAL ✓
      M118 - Chaud (<1s): Courant élevé
      M118 - Très chaud: TROP CHAUD ⚠️
    {% elif state.method == 'WAX' %}
      M118 ÉVALUATION CIRE:
      M118 - Solide: <40°C (trop faible)
      M118 - Ramolli: 40-50°C (OPTIMAL!) ✓
      M118 - Fondu: 50-55°C (acceptable)
      M118 - Liquide: >55°C (TROP CHAUD) ⚠️
    {% else %}
      M118 DÉCISION:
      M118 - Temp < 55°C: Continuer ✓
      M118 - Temp 55-65°C: Acceptable ⚠️
      M118 - Temp > 65°C: STOP! ❌
    {% endif %}
    
    M118 
    M118 📝 NOTEZ: {current}A = ___°C
    M118 
    M118 ========================================
    M118 REFROIDISSEMENT
    M118 ========================================
    M118 Temp cible: <{state.cooldown_target}°C
    M118 
    
    {% if state.method == 'WAX' %}
      M118 1. RETIRER la cire usée
      M118 2. Attendre refroidissement
      M118 3. PLACER nouvelle cire
      M118 4. Lancer: TMC_CALIBRATE_NEXT
    {% else %}
      M118 1. Mesurer température moteur
      M118 2. Si temp < {state.cooldown_target}°C:
      M118    Lancer: TMC_CALIBRATE_NEXT
      M118 3. Sinon: Attendre refroidissement
    {% endif %}
    
    M118 
    M118 Estimation refroidissement:
    M118 - 50°C → 35°C: ~2-3 min
    M118 - 55°C → 35°C: ~3-4 min
    M118 - 60°C → 35°C: ~4-5 min
    M118 ========================================
  {% endif %}

[gcode_macro TMC_CALIBRATE_CANCEL]
description: Annule la calibration TMC en cours
gcode:
  {% set state = printer["gcode_macro _TMC_CALIBRATE_STATE"] %}
  
  {% if state.current_step == 0 %}
    M118 Aucune calibration en cours
  {% else %}
    M118 
    M118 ========================================
    M118 CALIBRATION ANNULÉE
    M118 ========================================
    
    # Refroidir extruder si nécessaire
    {% if state.stepper == 'extruder' %}
      M118 Refroidissement extruder...
      M104 S0
    {% endif %}
    
    # Attendre fin des mouvements
    M400
    
    # Désactiver moteurs
    M84
    
    # Réinitialiser l'état
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=current_step VALUE=0
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=test_index VALUE=0
    
    M118 État réinitialisé
    M118 Retour en mode IDLE
    M118 ========================================
  {% endif %}

[gcode_macro TMC_CALIBRATE_FINISH]
description: Affiche les résultats de la calibration
gcode:
  {% set state = printer["gcode_macro _TMC_CALIBRATE_STATE"] %}
  
  {% if state.current_step != 2 %}
    M118 
    M118 ========================================
    M118 ERREUR: Calibration non terminée
    M118 ========================================
    M118 Continuez avec: TMC_CALIBRATE_NEXT
    M118 ========================================
  {% else %}
    M118 
    M118 ========================================
    M118 CALIBRATION TERMINÉE!
    M118 ========================================
    M118 Stepper: {state.stepper}
    M118 Méthode: {state.method}
    M118 Tests effectués: {state.test_index}
    M118 
    M118 RÉSULTATS:
    M118 Relire vos notes et choisir le courant
    M118 le plus proche de {state.target_temp}°C
    M118 
    M118 EXEMPLE:
    M118 - 0.70A = 38°C (trop froid)
    M118 - 0.80A = 42°C (bon)
    M118 - 0.90A = 46°C (OPTIMAL!) ✓
    M118 - 1.00A = 51°C (acceptable)
    M118 - 1.10A = 58°C (limite)
    M118 
    M118 → Choisir 0.90A (46°C proche de {state.target_temp}°C)
    M118 
    M118 ANALYSE AUTOMATIQUE:
    M118 TMC_ANALYZE_RESULTS C1=0.70 T1=38 C2=0.80 T2=42 \
    M118   C3=0.90 T3=46 C4=1.00 T4=51 TARGET={state.target_temp}
    M118 
    M118 APPLIQUER:
    M118 TMC_APPLY_OPTIMAL X=0.90 (ou Y=/Z=/E=)
    M118 ========================================
    
    # Refroidir extruder si nécessaire
    {% if state.stepper == 'extruder' %}
      M118 
      M118 Refroidissement extruder...
      M104 S0
    {% endif %}
    
    # Réinitialiser l'état
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=current_step VALUE=0
    SET_GCODE_VARIABLE MACRO=_TMC_CALIBRATE_STATE VARIABLE=test_index VALUE=0
  {% endif %}

# ============================================
# ANALYSE AUTOMATIQUE DES RÉSULTATS
# ============================================

[gcode_macro TMC_ANALYZE_RESULTS]
description: Analyse résultats et calcule courant optimal (C1= T1= C2= T2= ... TARGET=)
gcode:
  # Paramètres: jusqu'à 6 paires courant/température
  {% set c1 = params.C1|default(0)|float %}
  {% set t1 = params.T1|default(0)|float %}
  {% set c2 = params.C2|default(0)|float %}
  {% set t2 = params.T2|default(0)|float %}
  {% set c3 = params.C3|default(0)|float %}
  {% set t3 = params.T3|default(0)|float %}
  {% set c4 = params.C4|default(0)|float %}
  {% set t4 = params.T4|default(0)|float %}
  {% set c5 = params.C5|default(0)|float %}
  {% set t5 = params.T5|default(0)|float %}
  {% set c6 = params.C6|default(0)|float %}
  {% set t6 = params.T6|default(0)|float %}
  {% set target = params.TARGET|default(45)|float %}
  
  M118 
  M118 ========================================
  M118 TMC ANALYSE AUTOMATIQUE
  M118 ========================================
  M118 Température cible: {target}°C
  M118 
  M118 DONNÉES COLLECTÉES:
  {% if c1 > 0 %}
    M118 - {c1}A = {t1}°C
  {% endif %}
  {% if c2 > 0 %}
    M118 - {c2}A = {t2}°C
  {% endif %}
  {% if c3 > 0 %}
    M118 - {c3}A = {t3}°C
  {% endif %}
  {% if c4 > 0 %}
    M118 - {c4}A = {t4}°C
  {% endif %}
  {% if c5 > 0 %}
    M118 - {c5}A = {t5}°C
  {% endif %}
  {% if c6 > 0 %}
    M118 - {c6}A = {t6}°C
  {% endif %}
  M118 
  
  # Trouver les 2 points encadrant la température cible
  {% set found = false %}
  {% set optimal_current = 0 %}
  
  # Vérifier entre c1-c2
  {% if not found and c1 > 0 and c2 > 0 %}
    {% if (t1 <= target and t2 >= target) or (t1 >= target and t2 <= target) %}
      {% set optimal_current = c1 + (c2 - c1) * (target - t1) / (t2 - t1) %}
      {% set found = true %}
      M118 INTERPOLATION: Entre {c1}A ({t1}°C) et {c2}A ({t2}°C)
    {% endif %}
  {% endif %}
  
  # Vérifier entre c2-c3
  {% if not found and c2 > 0 and c3 > 0 %}
    {% if (t2 <= target and t3 >= target) or (t2 >= target and t3 <= target) %}
      {% set optimal_current = c2 + (c3 - c2) * (target - t2) / (t3 - t2) %}
      {% set found = true %}
      M118 INTERPOLATION: Entre {c2}A ({t2}°C) et {c3}A ({t3}°C)
    {% endif %}
  {% endif %}
  
  # Vérifier entre c3-c4
  {% if not found and c3 > 0 and c4 > 0 %}
    {% if (t3 <= target and t4 >= target) or (t3 >= target and t4 <= target) %}
      {% set optimal_current = c3 + (c4 - c3) * (target - t3) / (t4 - t3) %}
      {% set found = true %}
      M118 INTERPOLATION: Entre {c3}A ({t3}°C) et {c4}A ({t4}°C)
    {% endif %}
  {% endif %}
  
  # Vérifier entre c4-c5
  {% if not found and c4 > 0 and c5 > 0 %}
    {% if (t4 <= target and t5 >= target) or (t4 >= target and t5 <= target) %}
      {% set optimal_current = c4 + (c5 - c4) * (target - t4) / (t5 - t4) %}
      {% set found = true %}
      M118 INTERPOLATION: Entre {c4}A ({t4}°C) et {c5}A ({t5}°C)
    {% endif %}
  {% endif %}
  
  # Vérifier entre c5-c6
  {% if not found and c5 > 0 and c6 > 0 %}
    {% if (t5 <= target and t6 >= target) or (t5 >= target and t6 <= target) %}
      {% set optimal_current = c5 + (c6 - c5) * (target - t5) / (t6 - t5) %}
      {% set found = true %}
      M118 INTERPOLATION: Entre {c5}A ({t5}°C) et {c6}A ({t6}°C)
    {% endif %}
  {% endif %}
  
  M118 
  M118 ========================================
  {% if found %}
    M118 COURANT OPTIMAL CALCULÉ: {optimal_current|round(3)}A
    M118 ========================================
    M118 
    M118 RECOMMANDATION:
    M118 SET_TMC_CURRENT STEPPER=stepper_x CURRENT={optimal_current|round(3)}
    M118 
    M118 ARRONDI STANDARD: {optimal_current|round(2)}A
    M118 
    M118 CONFIANCE: Élevée (interpolation linéaire)
  {% else %}
    M118 ERREUR: Température cible hors plage
    M118 ========================================
    M118 
    M118 La température cible {target}°C n'est pas
    M118 entre les valeurs mesurées.
    M118 
    M118 SOLUTIONS:
    M118 - Augmenter plage de courants testés
    M118 - Vérifier valeurs entrées
  {% endif %}
  M118 ========================================

