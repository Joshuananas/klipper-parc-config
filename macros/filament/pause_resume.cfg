# ============================================
# PAUSE / RESUME / CANCEL
# ============================================
# Gestion des pauses avec purge adaptative et cooldown

[gcode_macro _RESUME_COMPENSATION_SETTINGS]
description: Centralized resume prime compensation settings
# Prime supplémentaire après compensation de rétraction de coupe
# Valeurs recommandées:
#   0mm = Pas de prime supplémentaire (compensation minimale)
#   1mm = Direct Drive (buse proche de l'extrudeur)
#   2mm = Direct Drive All-Metal ou Bowden court
#   3mm = Bowden standard (tube ~50cm)
#   4mm = Bowden long (tube >50cm)
variable_extra_prime: 0  # AJUSTER ICI selon votre extrudeur (0 = compensation minimale)

# Ratios de purge adaptatifs selon le contexte
variable_runout_ratio: 0.5   # 50% de la purge M600 pour runout
variable_pause_ratio: 0.2    # 20% de la purge M600 pour pause simple
gcode:

[gcode_macro SET_RESUME_COMPENSATION]
description: Adjust resume prime compensation | EXTRA_PRIME=1
gcode:
  {% set EXTRA_PRIME = params.EXTRA_PRIME|default(-1)|float %}
  
  {% if EXTRA_PRIME >= 0 %}
    SET_GCODE_VARIABLE MACRO=_RESUME_COMPENSATION_SETTINGS VARIABLE=extra_prime VALUE={EXTRA_PRIME}
    M118 Resume extra prime set to: {EXTRA_PRIME}mm
    M118 Total compensation will be: (cut_length - final_prime) + {EXTRA_PRIME}mm
  {% else %}
    M118 Current resume extra prime: {printer["gcode_macro _RESUME_COMPENSATION_SETTINGS"].extra_prime}mm
    M118 Usage: SET_RESUME_COMPENSATION EXTRA_PRIME=1
    M118 Recommended values:
    M118   0mm = Minimal compensation
    M118   1mm = Direct Drive
    M118   2mm = Direct Drive All-Metal / Bowden short
    M118   3mm = Bowden standard
    M118   4mm = Bowden long
  {% endif %}

[gcode_macro GET_RESUME_PURGE_AMOUNTS]
description: Display calculated purge amounts for current material
gcode:
  {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
  {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
  {% if material in profiles %}
    {% set profile = profiles[material] %}
  {% else %}
    {% set profile = profiles.default %}
  {% endif %}
  {% set runout_ratio = printer["gcode_macro _RESUME_COMPENSATION_SETTINGS"].runout_ratio|float %}
  {% set pause_ratio = printer["gcode_macro _RESUME_COMPENSATION_SETTINGS"].pause_ratio|float %}
  {% set m600_amount = profile.resume_amount|int %}
  {% set runout_amount = (profile.resume_amount * runout_ratio)|int %}
  {% set pause_amount = (profile.resume_amount * pause_ratio)|int %}
  
  M118 ========================================
  M118 RESUME PURGE AMOUNTS ({material})
  M118 ========================================
  M118 M600 Color Change: {m600_amount}mm (100%)
  M118 M600 Runout:       {runout_amount}mm (50%)
  M118 Pause Simple:      {pause_amount}mm (20%)
  M118 ========================================
  M118 Ratios: Runout={runout_ratio} Pause={pause_ratio}
  M118 ========================================

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause with unified parking position and auto-cooldown
variable_restore_x: 0  # Position d'impression X (avant parking)
variable_restore_y: 0  # Position d'impression Y (avant parking)
variable_restore_z: 0  # Position d'impression Z (avant parking)
variable_restore_e: 0  # Position d'impression E (avant parking)
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set idle_timeout = 604800 %}  # 7 jours pour pauses weekend
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = True %}
  {% set AUTO_COOLDOWN = params.AUTO_COOLDOWN|default(1)|int %}

  # Note: LED sera gérée par LED_PAUSE plus bas (évite redondance)

  M117 Pause - Temp saved
  RESPOND TYPE=echo MSG="Pause activated"

  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_temp VALUE={temp}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
  SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}

  # Sauvegarder positions d'impression AVANT le parking (pour power loss recovery)
  {% set pos = printer.gcode_move.gcode_position %}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_x VALUE={pos.x}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_y VALUE={pos.y}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_z VALUE={pos.z}
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=restore_e VALUE={pos.e}
  M118 Pause: saved print position X{pos.x} Y{pos.y} Z{pos.z} E{pos.e}

  PAUSE_BASE
  {client.user_pause_macro|default("")}
  
  # Rétraction importante pour éviter coulures et blob
  {% if printer.toolhead.homed_axes == 'xyz' %}
    {% set retract = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|float %}
    {% set speed = printer["gcode_macro _RETRACTION_SETTINGS"].retract_speed|float * 60 %}
    G91
    G1 E-{retract} F{speed}  # Rétraction adaptative (anti-oozing)
    G90
    M118 Filament retracted {retract}mm to prevent blob
  {% endif %}
  
  # Parking avec Z adaptatif
  _PARK_TOOLHEAD MODE=pause
  
  # LED orange pulsante
  LED_PAUSE

  # Sauvegarder l'état pause en cas de coupure
  POWER_SAVE_CHECKPOINT LAYER=0 STATE=paused
  
  {% if AUTO_COOLDOWN == 1 %}
    START_COOLDOWN SOURCE=pause DURATION=300
  {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print after pause with adaptive purge
variable_restore_temp: 200
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}

  # Arrêter le cooldown unifié
  STOP_COOLDOWN

  {% set extruder_temp = printer['gcode_macro RESUME'].restore_temp %}
  {% if extruder_temp < 180 %}
    {% set extruder_temp = 200 %}
  {% endif %}

  M117 Preparing resume...
  RESPOND TYPE=echo MSG="Preparing to resume"

  M104 S{extruder_temp}

  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}

  M117 Waiting for temp {extruder_temp}C...
  M109 S{extruder_temp}

  {client.user_resume_macro|default("")}

  # Gestion selon contexte
  {% set is_runout = printer["gcode_macro M600"].is_runout %}
  {% set is_m600 = printer["gcode_macro M600"].is_runout >= 0 %}
  {% set state_saved = printer["gcode_macro M600"].state_saved|int %}

  # Paramètres communs de purge
  {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
  {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
  {% if material in profiles %}
    {% set profile = profiles[material] %}
  {% else %}
    {% set profile = profiles.default %}
  {% endif %}
  {% set cut_length = profile.retract|float %}

  {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "_PROFILE_" ~ active_profile.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
  {% set config = printer[profile_macro_full].config %}
  {% set purge_x = config.purge_x|float %}
  {% set purge_y = config.purge_y|float %}

  {% set current_z = printer.toolhead.position.z|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set purge_percent = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].purge_height_percent|float %}
  {% set min_zhop = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].min_zhop_mm|float %}
  {% set safety_margin = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].safety_margin_mm|float %}
  {% set target_purge_height = (max_z * purge_percent)|round(1) %}
  {% if current_z < target_purge_height %}
    {% set purge_z = target_purge_height %}
  {% else %}
    {% set purge_z = current_z + min_zhop %}
  {% endif %}
  {% set purge_z = [purge_z, max_z - safety_margin]|min %}

  {% if is_m600 and is_runout == 1 %}
    # M600 runout : purge courte
    M118 Filament runout - short purge
    PURGE_RUNOUT
  {% elif is_m600 and is_runout == 0 %}
    # M600 color change : purge complete
    M118 Color change - full purge
    PURGE_ADVANCED
  {% else %}
    # Pause simple : purge adaptative (20% de M600)
    {% set pause_ratio = printer["gcode_macro _RESUME_COMPENSATION_SETTINGS"].pause_ratio|float %}
    {% set purge_amount = (profile.resume_amount * pause_ratio)|int %}
    {% set boost_length = printer["gcode_macro PURGE_SETTINGS"].boost_length_pause|float %}
    {% set boost_multiplier = printer["gcode_macro PURGE_SETTINGS"].boost_flow_multiplier|float %}
    {% set boost_pause = printer["gcode_macro PURGE_SETTINGS"].boost_pause_time|int %}

    G90  # Absolu
    G1 Z{purge_z} F1200  # Hauteur securisee adaptative
    G1 X{purge_x} Y{purge_y} F6000  # Position purge conventionnelle

    M83  # Extruder relatif
    G1 E{purge_amount - boost_length} F300
    G1 E{boost_length} F{300 * boost_multiplier}
    G4 P{boost_pause}
    M82  # Extruder absolu

    # Nettoyage unifie - MODE ADVANCED pour zig-zag
    _NOZZLE_CLEANING MODE=advanced

    # Reprime : compense le cut_length du nettoyage + extra_prime (ooze)
    {% set reprime = profile.retract|float + printer['gcode_macro _RESUME_COMPENSATION_SETTINGS'].extra_prime|float %}
    M83
    G1 E{reprime} F300
    M82
  {% endif %}

  # Reactiver LED blanche d'impression
  _SET_LED_PRINTING

  # Verifier si c'est une reprise power loss
  {% set is_power_loss = printer["gcode_macro _POWER_LOSS_RESTORE"].target_x|default(-1)|float >= 0 %}

  {% if is_power_loss %}
    # Reprise power loss : position E restauree directement
    M118 Power loss: restoring saved position
    _POWER_LOSS_RESTORE_POSITION
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_x VALUE=-1
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_y VALUE=-1
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_z VALUE=-1
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_e VALUE=-1
  {% else %}
    # RESUME_BASE (RESTORE_GCODE_STATE NAME=PAUSE_STATE) restaure deja tout seul
    # le mode d'extrusion (M82/M83) ET la position E logique exactement comme
    # au moment de la pause, quel que soit le filament physiquement extrude/
    # retracte entre-temps (purge, wipe, etc.). Aucune compensation manuelle
    # n'est necessaire ni souhaitable ici : un G92/M82 fait APRES RESUME_BASE
    # ecraserait le mode d'extrusion restaure (catastrophique si le fichier
    # trancheur utilise l'extrusion relative M83, cf. erreur
    # "Extrude only move too long").
    RESUME_BASE
  {% endif %}

  # Reinitialiser l'etat M600 apres reprise
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=is_runout VALUE=-1
  {% if state_saved == 1 %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=state_saved VALUE=0
  {% endif %}

  M117 Print resumed

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Cancel print with proper cleanup and feedback
gcode:
  # Verifier si impression en cours
  {% if printer.print_stats.state not in ["printing", "paused"] %}
    M118 No print to cancel
    RESPOND TYPE=error MSG="No active print"
    {action_respond_info("CANCEL_PRINT called but no print active")}
  {% else %}
    M117 Cancelling print...
    M118 Print cancellation initiated
    
    # Réinitialiser le flag mesh_created pour éviter la sauvegarde
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=mesh_created VALUE=0
    M118 Mesh will NOT be saved (print cancelled)

    # Arreter monitoring thermique
    STOP_THERMAL_MONITORING
    
    # Nettoyer état power loss et arrêter monitoring
    POWER_STOP_MONITORING
    POWER_CLEAR_STATE

    # Arrêt du cooldown unifié
    STOP_COOLDOWN

    # Restauration idle timeout
    {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
      M118 Idle timeout restored
    {% endif %}

    # Séquence sécurisée (même ordre que PRINT_END)
    {% if printer.toolhead.homed_axes == 'xyz' %}
      # 1. Z-hop immédiat pour dégager la pièce
      G91
      G0 Z10 F3000  # Monte 10mm pour dégager l'objet
      G90
      M118 Z-hop +10mm to clear print
      
      # 2. Parking AVANT rétraction
      _PARK_TOOLHEAD MODE=cancel
      M117 Print cancelled - parking...
      
      # 3. Rétraction EN POSITION PARKING (seulement si pas en pause)
      {% if printer.print_stats.state != 'paused' %}
        {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
        {% set current_temp = printer.extruder.temperature|float %}
        
        {% if current_temp >= min_temp %}
          {% set retract = printer["gcode_macro _RETRACTION_SETTINGS"].cancel_retract|float %}
          {% set speed = printer["gcode_macro _RETRACTION_SETTINGS"].retract_speed|float * 60 %}
          M117 Cleaning nozzle...
          G91
          # Wipe interne de la buse (va-et-vient pour nettoyer)
          G1 E2 F300       # Avance 2mm lentement
          G1 E-2 F600      # Recule 2mm plus vite
          G1 E2 F300       # Avance 2mm lentement
          G1 E-2 F600      # Recule 2mm plus vite
          G1 E-{retract} F{speed}    # Retraction adaptative finale
          G90
          M118 Filament wiped and retracted {retract}mm (in parking position)
        {% else %}
          M118 Extruder too cold ({current_temp|int}C < {min_temp|int}C), skipping retraction
        {% endif %}
      {% else %}
        M118 Already paused, retraction already done (skipping)
      {% endif %}
    {% endif %}

    # Retirer compensation Z température ambiante (réinitialise l'offset à 0)
    SET_GCODE_OFFSET Z=0 MOVE=0
    M118 Ambient temperature Z compensation removed

    # Extinction chauffages APRÈS rétraction
    M140 S0    # Bed off
    M104 S0    # Extruder off
    M106 S0    # Fan off
    M118 Heaters and fans disabled
    
    M117 Print cancelled - parked

    # Feedback visuel LED (extinction rouge + marque non-printing)
    LED_CANCEL

    # Desactivation moteurs
    M84
    M118 Motors disabled

    # Appel base Klipper
    CANCEL_PRINT_BASE

    M117 Print cancelled
    M118 Print cancellation complete
    
    # Réactiver breathe idle après 10 secondes (laisser temps de voir l'extinction)
    # LED_CANCEL fait un timeout de 10s puis appelle LED_IDLE automatiquement
  {% endif %}

