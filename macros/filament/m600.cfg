# ============================================
# M600 - FILAMENT CHANGE
# ============================================
# Changement de filament avec detection couleur et cooldown automatique

[gcode_macro M600]
description: Filament change with color indication and unified parking
variable_saved_temp: 0
variable_current_tool: 0
variable_is_runout: -1
variable_state_saved: 0
variable_cooldown_active: 0
variable_restore_x: 0  # Position d'impression X (avant M600)
variable_restore_y: 0  # Position d'impression Y (avant M600)
variable_restore_z: 0  # Position d'impression Z (avant M600)
variable_restore_e: 0  # Position d'impression E (avant M600)
gcode:
  {% set park_x = printer["gcode_macro _PARK_SETTINGS"].park_x %}
  {% set park_y = printer["gcode_macro _PARK_SETTINGS"].park_y %}
  {% set park_z = printer["gcode_macro _PARK_SETTINGS"].park_z %}

  # M600 est un G-code "numerote" (comme M104) : Klipper n'active PAS le
  # parsing CLE=VALEUR pour ce type de commande (uniquement pour les macros
  # dont le nom n'est pas de la forme lettre+chiffres). Le dict `params`
  # standard est donc inutilisable ici (ex: params.IS_RUNOUT vaudrait "=1"
  # au lieu de "1", et |int echouerait silencieusement vers 0). On reparse
  # donc nous-memes rawparams pour recuperer les vrais CLE=VALEUR.
  {% set ns = namespace(kv={}) %}
  {% for token in rawparams.split() %}
    {% if '=' in token %}
      {% set kv_pair = token.split('=', 1) %}
      {% set _ = ns.kv.update({kv_pair[0]|upper: kv_pair[1]}) %}
    {% endif %}
  {% endfor %}

  {% set X = ns.kv.get('X', park_x|int)|int %}
  {% set Y = ns.kv.get('Y', park_y|int)|int %}
  {% set default_retract = printer["gcode_macro _RETRACTION_SETTINGS"].m600_retract|float %}
  {% set E = ns.kv.get('E', default_retract)|float %}
  {% set AUTO_COOLDOWN = ns.kv.get('AUTO_COOLDOWN', 0)|int %}
  {% set IS_RUNOUT = ns.kv.get('IS_RUNOUT', 0)|int %}
  {% set COLOR_PARAM = ns.kv.get('COLOR', "")|string %}
  {% set LAYER = ns.kv.get('LAYER', 0)|int %}
  {% set TOOL = ns.kv.get('T', 0)|int %}

  # Sauvegarder l'état M600 en cas de coupure
  POWER_SAVE_CHECKPOINT LAYER={LAYER} STATE=m600

  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=current_tool VALUE={TOOL}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=is_runout VALUE={IS_RUNOUT}

  {% set filament_colors = printer.print_stats.info.filament_colour|default("")|string %}
  {% set filament_types = printer.print_stats.info.filament_type|default("")|string %}
  {% set current_color = "Unknown" %}
  {% set current_type = "Unknown" %}

  {% if COLOR_PARAM != "" %}
    {% set current_color = COLOR_PARAM %}
  {% elif filament_colors != "" %}
    {% set color_list = filament_colors.split(';') %}
    {% if TOOL < color_list|length %}
      {% set current_color = color_list[TOOL] %}
    {% endif %}
  {% endif %}

  {% if filament_types != "" %}
    {% set type_list = filament_types.split(';') %}
    {% if TOOL < type_list|length %}
      {% set current_type = type_list[TOOL] %}
    {% endif %}
  {% endif %}

  {% set current_z = printer.toolhead.position.z|float %}
  {% set extruder_temp = printer.extruder.target %}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=saved_temp VALUE={extruder_temp}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=cooldown_active VALUE=0

  # Sauvegarder positions d'impression AVANT M600 (pour power loss recovery)
  {% set pos = printer.gcode_move.gcode_position %}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=restore_x VALUE={pos.x}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=restore_y VALUE={pos.y}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=restore_z VALUE={pos.z}
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=restore_e VALUE={pos.e}
  M118 M600: saved print position X{pos.x} Y{pos.y} Z{pos.z} E{pos.e}

  SAVE_GCODE_STATE NAME=M600_STATE
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=state_saved VALUE=1
  PAUSE X={X} Y={Y}

  {% set prime = printer["gcode_macro _RETRACTION_SETTINGS"].m600_prime|float %}
  {% set speed = printer["gcode_macro _RETRACTION_SETTINGS"].retract_speed|float * 60 %}
  G91
  G1 E{prime} F300
  G1 E-{E} F{speed}
  G90
  
  LED_FILAMENT_CHANGE

  {% if IS_RUNOUT == 1 %}
    M117 Filament runout - same color
    M118 ========================================
    M118 FIN DE FILAMENT DETECTEE
    M118 ========================================
    M118 Layer: {LAYER}
    M118 Remplacer par la meme couleur
    M118 Type: {current_type}
    M118 ========================================
    { action_respond_info("FILAMENT RUNOUT: Replace with same color") }
  {% elif current_color != "Unknown" %}
    M117 Load: {current_color}
    M118 ========================================
    M118 CHANGEMENT DE FILAMENT REQUIS
    M118 ========================================
    M118 Layer: {LAYER}
    M118 Couleur: {current_color}
    M118 Type: {current_type}
    M118 Outil: T{TOOL}
    M118 Steps:
    M118  1. Remove current filament
    M118  2. Load {current_color} filament
    M118  3. Purge until color is correct
    M118  4. Press RESUME to continue
    M118 ========================================
    { action_respond_info("FILAMENT CHANGE: Load " + current_color + " (" + current_type + ")") }
  {% else %}
    M117 Change filament
    M118 ========================================
    M118 CHANGEMENT DE FILAMENT
    M118 ========================================
    M118 Layer: {LAYER}
    M118 Please load new filament
    M118 ========================================
    { action_respond_info("FILAMENT CHANGE: Replace filament") }
  {% endif %}

  {% if AUTO_COOLDOWN == 1 and printer.pause_resume.is_paused %}
    # Obtenir le temps de cooldown selon le matériau
    {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
    {% set cooldown_time = printer["gcode_macro _COOLDOWN_PROFILES"][material]|default(300)|int %}
    START_COOLDOWN SOURCE=m600 DURATION={cooldown_time}
  {% elif AUTO_COOLDOWN == 1 %}
    M118 Warning: Cooldown not started - printer not paused
  {% endif %}
