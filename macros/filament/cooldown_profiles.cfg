# ============================================
# COOLDOWN PROFILES PAR MATERIAU (PHASE 2 OPTIMISATION)
# ============================================
# Temps de cooldown adaptatif selon le matériau
# Utilisé par le système de cooldown unifié

[gcode_macro _COOLDOWN_PROFILES]
description: Cooldown times per material (seconds)
variable_PLA: 300      # 5 minutes
variable_PETG: 180     # 3 minutes (reste fluide plus longtemps)
variable_ABS: 120      # 2 minutes (haute température)
variable_ASA: 120      # 2 minutes
variable_TPU: 240      # 4 minutes (flexible, refroidit lentement)
variable_NYLON: 150    # 2.5 minutes
variable_default: 300  # 5 minutes par défaut
gcode:

[gcode_macro GET_COOLDOWN_TIME]
description: Get cooldown time for current material
gcode:
  {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
  {% set profiles = printer["gcode_macro _COOLDOWN_PROFILES"] %}
  
  {% if material in profiles %}
    {% set cooldown_time = profiles[material] %}
  {% else %}
    {% set cooldown_time = profiles.default %}
    M118 Unknown material {material}, using default cooldown (5min)
  {% endif %}
  
  {% set mins = (cooldown_time // 60)|int %}
  {% set secs = (cooldown_time % 60)|int %}
  
  M118 Cooldown time for {material}: {mins}m {secs}s
  
  # Retourner la valeur pour M600
  SET_GCODE_VARIABLE MACRO=M600 VARIABLE=countdown VALUE={cooldown_time}