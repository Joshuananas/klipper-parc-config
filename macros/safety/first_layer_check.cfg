# ============================================
# VERIFICATION PREMIERE COUCHE
# ============================================
# Pause automatique apres couche 1 pour verification

[gcode_macro _FIRST_LAYER_CHECK]
description: First layer check settings
variable_enabled: 1
variable_check_pending: 0
variable_layer_height: 0.2
gcode:

[gcode_macro ENABLE_FIRST_LAYER_CHECK]
description: Enable first layer check
gcode:
  SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_CHECK VARIABLE=enabled VALUE=1
  M118 First layer check ENABLED

[gcode_macro DISABLE_FIRST_LAYER_CHECK]
description: Disable first layer check
gcode:
  SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_CHECK VARIABLE=enabled VALUE=0
  M118 First layer check DISABLED

[gcode_macro CHECK_FIRST_LAYER]
description: Check if first layer is complete and pause
gcode:
  {% set enabled = printer["gcode_macro _FIRST_LAYER_CHECK"].enabled %}
  {% set current_z = printer.toolhead.position.z %}
  {% set layer_height = printer["gcode_macro _FIRST_LAYER_CHECK"].layer_height %}
  
  # Detecter si on vient de finir la premiere couche
  # (Z > layer_height mais < 2 * layer_height)
  {% if enabled == 1 and current_z > layer_height and current_z < (layer_height * 2.5) %}
    {% if printer["gcode_macro _FIRST_LAYER_CHECK"].check_pending == 0 %}
      SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_CHECK VARIABLE=check_pending VALUE=1
      
      M118 ========================================
      M118 FIRST LAYER COMPLETE - INSPECTION
      M118 ========================================
      M118 Current Z: {current_z|round(2)}mm
      M118 Pausing for first layer inspection...
      M118 Check adhesion and quality
      M118 Click RESUME to continue or CANCEL to abort
      M118 ========================================
      
      PAUSE
      
      # LED jaune pour inspection
      SET_LED LED=extruder RED=1 GREEN=1 BLUE=0
      
      M117 Check first layer!
    {% endif %}
  {% endif %}

[gcode_macro FIRST_LAYER_APPROVED]
description: Approve first layer and continue
gcode:
  SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_CHECK VARIABLE=check_pending VALUE=0
  M118 First layer approved, continuing print
  SET_LED LED=extruder RED=0 GREEN=1 BLUE=0
  RESUME

[gcode_macro FIRST_LAYER_FAILED]
description: Reject first layer and cancel print
gcode:
  SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_CHECK VARIABLE=check_pending VALUE=0
  M118 First layer rejected, cancelling print
  SET_LED LED=extruder RED=1 GREEN=0 BLUE=0
  CANCEL_PRINT