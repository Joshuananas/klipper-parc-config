# ============================================
# PROTECTION THERMIQUE AVANCEE
# ============================================
# Monitoring temperature avec detection derive

[gcode_macro _THERMAL_MONITOR]
description: Monitor thermal stability during print
variable_monitoring_active: 0
variable_alert_threshold: 5.0
variable_extruder_alerts: 0
variable_bed_alerts: 0
variable_last_extruder_temp: 0
variable_last_bed_temp: 0
gcode:

[delayed_gcode THERMAL_CHECK]
initial_duration: 0
gcode:
  {% set ups_busy = 'gcode_macro _UPS_DATA' in printer and (printer['gcode_macro _UPS_DATA'].watch_active|int == 1 or printer['gcode_macro _UPS_DATA'].ol_since|int > 0) %}
  {% if printer["gcode_macro _THERMAL_MONITOR"].monitoring_active == 1 and not ups_busy %}
    {% set e_target = printer.extruder.target %}
    {% set e_temp = printer.extruder.temperature %}
    {% set b_target = printer.heater_bed.target %}
    {% set b_temp = printer.heater_bed.temperature %}
    {% set threshold = printer["gcode_macro _THERMAL_MONITOR"].alert_threshold %}
    
    # Verifier extrudeur
    {% if e_target > 0 %}
      {% set e_diff = (e_target - e_temp)|abs %}
      
      {% if e_diff > threshold %}
        SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=extruder_alerts VALUE={printer["gcode_macro _THERMAL_MONITOR"].extruder_alerts + 1}
        M118 WARNING: Extruder drift {e_diff|round(1)}C (target {e_target}C, actual {e_temp|round(1)}C)
        RESPOND TYPE=error MSG="Thermal drift detected on extruder"
        LED_WARNING
        
        # Si 3 alertes consecutives -> action critique
        {% if printer["gcode_macro _THERMAL_MONITOR"].extruder_alerts >= 3 %}
          M118 CRITICAL: Extruder thermal runaway detected!
          RESPOND TYPE=error MSG="CRITICAL: Thermal runaway - check thermistor"
          LED_ERROR
          # Option: PAUSE ou CANCEL_PRINT
        {% endif %}
      {% else %}
        # Reset compteur si temperature OK
        SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=extruder_alerts VALUE=0
      {% endif %}
    {% endif %}
    
    # Verifier lit
    {% if b_target > 0 %}
      {% set b_diff = (b_target - b_temp)|abs %}
      
      {% if b_diff > threshold %}
        SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=bed_alerts VALUE={printer["gcode_macro _THERMAL_MONITOR"].bed_alerts + 1}
        M118 WARNING: Bed drift {b_diff|round(1)}C (target {b_target}C, actual {b_temp|round(1)}C)
        RESPOND TYPE=error MSG="Thermal drift detected on bed"
        LED_WARNING
        
        {% if printer["gcode_macro _THERMAL_MONITOR"].bed_alerts >= 3 %}
          M118 CRITICAL: Bed thermal runaway detected!
          RESPOND TYPE=error MSG="CRITICAL: Bed thermal issue"
          LED_ERROR
        {% endif %}
      {% else %}
        SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=bed_alerts VALUE=0
      {% endif %}
    {% endif %}
    
    # Relancer check dans 30s
    UPDATE_DELAYED_GCODE ID=THERMAL_CHECK DURATION=30
  {% endif %}

[gcode_macro START_THERMAL_MONITORING]
description: Start thermal monitoring
gcode:
  SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=monitoring_active VALUE=1
  SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=extruder_alerts VALUE=0
  SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=bed_alerts VALUE=0
  UPDATE_DELAYED_GCODE ID=THERMAL_CHECK DURATION=30
  M118 Thermal monitoring started (check every 30s, threshold 5C)

[gcode_macro STOP_THERMAL_MONITORING]
description: Stop thermal monitoring
gcode:
  SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=monitoring_active VALUE=0
  UPDATE_DELAYED_GCODE ID=THERMAL_CHECK DURATION=0
  M118 Thermal monitoring stopped

[gcode_macro SET_THERMAL_THRESHOLD]
description: Set thermal alert threshold
gcode:
  {% set threshold = params.THRESHOLD|default(5.0)|float %}
  SET_GCODE_VARIABLE MACRO=_THERMAL_MONITOR VARIABLE=alert_threshold VALUE={threshold}
  M118 Thermal threshold set to {threshold}C