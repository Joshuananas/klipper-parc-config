# ============================================
# GESTION D'ERREURS ROBUSTE
# ============================================
# Verifications et protections avant actions critiques

[gcode_macro _ERROR_HANDLER]
description: Centralized error handling
variable_last_error: ""
variable_error_count: 0
gcode:
  {% set error_msg = params.MSG|default("Unknown error")|string %}
  {% set severity = params.SEVERITY|default("WARNING")|string %}
  
  # Incrementer compteur
  {% set count = printer["gcode_macro _ERROR_HANDLER"].error_count + 1 %}
  SET_GCODE_VARIABLE MACRO=_ERROR_HANDLER VARIABLE=error_count VALUE={count}
  SET_GCODE_VARIABLE MACRO=_ERROR_HANDLER VARIABLE=last_error VALUE='"{error_msg}"'
  
  # Logger
  M118 [{severity}] {error_msg}
  RESPOND TYPE=error MSG="{error_msg}"
  
  # LED rouge si erreur critique
  {% if severity == "CRITICAL" %}
    LED_ERROR
    # Retirer compensation Z température ambiante en cas d'erreur critique
    SET_GCODE_OFFSET Z=0 MOVE=0
    M118 Ambient temperature Z compensation removed (critical error)
  {% elif severity == "WARNING" %}
    LED_WARNING
  {% endif %}

[gcode_macro SAFE_MOVE]
description: Move with homing check
gcode:
  {% if printer.toolhead.homed_axes != 'xyz' %}
    _ERROR_HANDLER MSG="Cannot move: axes not homed" SEVERITY=CRITICAL
    {action_raise_error("Axes not homed - cannot move")}
  {% else %}
    G1 {rawparams}
  {% endif %}

[gcode_macro SAFE_HOME]
description: Home with verification
gcode:
  {% set axes = params.AXES|default("XYZ")|upper %}
  
  M118 Homing {axes}...
  
  {% if "X" in axes or "Y" in axes or "Z" in axes %}
    G28 {rawparams}
    
    # Verifier que le homing a reussi
    {% if printer.toolhead.homed_axes == 'xyz' %}
      M118 Homing successful: all axes homed
    {% else %}
      _ERROR_HANDLER MSG="Homing failed: {printer.toolhead.homed_axes}" SEVERITY=CRITICAL
    {% endif %}
  {% else %}
    _ERROR_HANDLER MSG="Invalid axes specified: {axes}" SEVERITY=WARNING
  {% endif %}

[gcode_macro SAFE_HEAT_EXTRUDER]
description: Heat extruder with timeout protection
gcode:
  {% set target = params.S|default(200)|float %}
  {% set timeout = params.TIMEOUT|default(300)|int %}
  {% set wait = params.WAIT|default(1)|int %}
  
  M118 Heating extruder to {target}C (timeout {timeout}s)
  M104 S{target}
  
  {% if wait == 1 %}
    M118 Waiting for extruder temperature...
    # Utiliser M109 avec timeout via delayed_gcode
    _WAIT_EXTRUDER_TEMP TARGET={target} TIMEOUT={timeout}
  {% endif %}

[gcode_macro _WAIT_EXTRUDER_TEMP]
gcode:
  {% set target = params.TARGET|float %}
  {% set timeout = params.TIMEOUT|default(300)|int %}
  
  # Attendre avec M109 (Klipper a son propre timeout)
  M109 S{target}
  
  # Verifier si atteint
  {% if printer.extruder.temperature >= (target - 2) %}
    M118 Extruder target reached: {printer.extruder.temperature|round(1)}C
  {% else %}
    _ERROR_HANDLER MSG="Extruder heating may have failed" SEVERITY=WARNING
  {% endif %}

[gcode_macro SAFE_HEAT_BED]
description: Heat bed with timeout protection
gcode:
  {% set target = params.S|default(60)|float %}
  {% set timeout = params.TIMEOUT|default(600)|int %}
  {% set wait = params.WAIT|default(1)|int %}
  
  M118 Heating bed to {target}C (timeout {timeout}s)
  M140 S{target}
  
  {% if wait == 1 %}
    M118 Waiting for bed temperature...
    _WAIT_BED_TEMP TARGET={target} TIMEOUT={timeout}
  {% endif %}

[gcode_macro _WAIT_BED_TEMP]
gcode:
  {% set target = params.TARGET|float %}
  {% set timeout = params.TIMEOUT|default(600)|int %}
  
  # Attendre avec M190
  M190 S{target}
  
  # Verifier si atteint
  {% if printer.heater_bed.temperature >= (target - 2) %}
    M118 Bed target reached: {printer.heater_bed.temperature|round(1)}C
  {% else %}
    _ERROR_HANDLER MSG="Bed heating may have failed" SEVERITY=WARNING
  {% endif %}

[gcode_macro SAFE_Z_MOVE]
description: Z move with bounds checking
gcode:
  {% set z = params.Z|default(0)|float %}
  {% set current_z = printer.toolhead.position.z %}
  {% set max_z = printer.toolhead.axis_maximum.z %}
  {% set min_z = printer.toolhead.axis_minimum.z %}
  
  {% if printer.toolhead.homed_axes != 'xyz' %}
    _ERROR_HANDLER MSG="Cannot move Z: not homed" SEVERITY=CRITICAL
    {action_raise_error("Z axis not homed")}
  {% elif z > max_z %}
    _ERROR_HANDLER MSG="Z move exceeds maximum ({z} > {max_z})" SEVERITY=CRITICAL
    {action_raise_error("Z move out of bounds")}
  {% elif z < min_z %}
    _ERROR_HANDLER MSG="Z move below minimum ({z} < {min_z})" SEVERITY=CRITICAL
    {action_raise_error("Z move out of bounds")}
  {% else %}
    G1 Z{z} {rawparams}
  {% endif %}

[gcode_macro GET_ERROR_STATUS]
description: Display error statistics
gcode:
  {% set error_count = printer["gcode_macro _ERROR_HANDLER"].error_count %}
  {% set last_error = printer["gcode_macro _ERROR_HANDLER"].last_error %}
  
  M118 ========================================
  M118 ERROR STATISTICS
  M118 ========================================
  M118 Total errors: {error_count}
  M118 Last error: {last_error}
  M118 ========================================

[gcode_macro RESET_ERROR_COUNT]
description: Reset error counter
gcode:
  SET_GCODE_VARIABLE MACRO=_ERROR_HANDLER VARIABLE=error_count VALUE=0
  SET_GCODE_VARIABLE MACRO=_ERROR_HANDLER VARIABLE=last_error VALUE='""'
  M118 Error counter reset