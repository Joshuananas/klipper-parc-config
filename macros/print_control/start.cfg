[gcode_macro _PRINT_STATE]
variable_mesh_created: 0
variable_power_loss_recovery_active: 0  # 1 = skip PRINT_START (déjà fait)
gcode:
  # Macro pour stocker l'état de l'impression

# ============================================
# KAMP MODE SWITCHING
# ============================================

[gcode_macro KAMP_MODE_NORMAL]
description: Mode KAMP normal (marge 10mm)
gcode:
  SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=mesh_margin VALUE=10
  M118 KAMP: Mode normal (marge 10mm)

[gcode_macro KAMP_MODE_CALIBRATION]
description: Mode KAMP calibration (marge 50mm pour PA)
gcode:
  SET_GCODE_VARIABLE MACRO=_KAMP_Settings VARIABLE=mesh_margin VALUE=50
  M118 KAMP: Mode calibration (marge 50mm)

[gcode_macro _CHECK_PRINT_STATE]
description: Check if print should continue or abort
gcode:
  {% if printer.print_stats.state == "cancelled" %}
    M118 Print cancelled, aborting PRINT_START
    M140 S0
    M104 S0
    { action_respond_info("PRINT_START interrupted by cancel") }
    { action_raise_error("Print cancelled") }
  {% endif %}

[include ../utilities/ambient_temperature.cfg]

[gcode_macro PRINT_START]
description: Start print sequence with adaptive mesh and thermal management
gcode:
  AMBIENT_REFRESH
  _PRINT_START_PREPARE {rawparams}

[gcode_macro _PRINT_START_PREPARE]
gcode:
  {% set recovery = printer['gcode_macro _PRINT_STATE'].power_loss_recovery_active|int == 1 and printer.save_variables.variables.power_loss_active|default(0)|int == 1 %}
  {% if not recovery %}
    {% if params.BED_TEMP|float <= 0 or params.EXTRUDER_TEMP|float <= 0 %}
      {action_raise_error('PRINT_START requires positive BED_TEMP and EXTRUDER_TEMP')}
    {% endif %}
    _AMBIENT_TARGETS {rawparams}
    _AMBIENT_REPORT
  {% endif %}
  _PRINT_START_AMBIENT {rawparams}

[gcode_macro _PRINT_START_AMBIENT]
gcode:
  # Vérifier si on est en mode power loss recovery
  {% set recovery_active = printer["gcode_macro _PRINT_STATE"].power_loss_recovery_active|int %}
  {% set svv = printer.save_variables.variables %}
  {% set power_loss_active = svv.power_loss_active|default(0)|int %}
  
  # Si recovery_active=1 ET power_loss_active=1 → Reprise en cours (skip PRINT_START)
  # Si recovery_active=1 ET power_loss_active=0 → Ancien flag oublié (réinitialiser)
  # Si recovery_active=0 → Nouveau fichier normal
  
  {% if recovery_active == 1 and power_loss_active == 0 %}
    # Ancien flag oublié: réinitialiser
    M118 ⚠️ Stale recovery flag detected, resetting
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=power_loss_recovery_active VALUE=0
    {% set recovery_active = 0 %}
  {% endif %}
  
  {% if recovery_active == 1 %}
    M118 ⚠️ PRINT_START skipped (power loss recovery active)
    M118 Print already prepared by power loss recovery system
    # Réinitialiser le flag
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=power_loss_recovery_active VALUE=0
    # Ne rien faire d'autre, sortir immédiatement
  {% else %}
    # PRINT_START normal
    {% set BED = params.BED_TEMP|int %}
    {% set EXTRUDER = params.EXTRUDER_TEMP|int %}
    {% set MATERIAL = params.MATERIAL|default('PLA')|string %}
    {% set BED_SURFACE = params.BED_SURFACE|default('PEI')|string %}
    {% set FORCE_MESH = params.FORCE_MESH|default(0)|int %}
    {% set COLOR = params.COLOR|default('unknown')|string %}
    {% set LAYER_HEIGHT = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set stabilization_time = 3 %}  # Valeur par défaut, sera ajustée selon conditions

    # Vérifications critiques AMDEC avant démarrage
    CHECK_CRITICAL_BEFORE_PRINT
  
  # Arrêter tous les effets LED (idle breathe, rotation, etc.)
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=current_state VALUE='"starting"'
  STOP_LED_EFFECTS
  UPDATE_DELAYED_GCODE ID=LED_IDLE_ROTATION DURATION=0
  
  # Réinitialiser les variables LED
  SET_GCODE_VARIABLE MACRO=_LED_HEATING_STATE VARIABLE=cooling_active VALUE=0
  SET_GCODE_VARIABLE MACRO=_LED_HEATING_STATE VARIABLE=heating_active VALUE=0
  # Note: printing=1 sera défini par _SET_LED_PRINTING à la fin
  
  # Réinitialiser le gcode_offset pour éviter accumulation entre impressions
  SET_GCODE_OFFSET Z=0 MOVE=0
  M118 Gcode Z-offset reset to 0 (probe z_offset preserved)
  
  # Appliquer les ajustements Z-offset sauvegardés des impressions précédentes
  Z_APPLY_ADJUSTMENT
  
  # Set material profile for adaptive purge and cooldown
  SET_MATERIAL_PROFILE MATERIAL={MATERIAL}
  
  # Calculate retraction distances based on hardware profile
  _CALCULATE_RETRACTION

  SET_FILAMENT_SENSOR SENSOR=filament ENABLE=0
  M118 Filament sensor disabled during startup

  M117 Starting print sequence...
  M118 Print Start: {MATERIAL} | Bed {BED}°C | Extruder {EXTRUDER}°C
  
  # Nettoyer tout checkpoint précédent (nouvelle impression)
  POWER_CLEAR_STATE

  {% set ambient = printer['gcode_macro _AMBIENT'] %}
  {% set ambient_temp = ambient.temperature|float %}
  {% set ambient_confidence = ambient.confidence|int %}
  
  # Compensation MCU adaptative selon activité du système
  # PLA typique: 50-65°C | PETG: 70-80°C | ABS: 90-110°C

  # Ajustements températures selon conditions ambiantes
  {% set BED = ambient.bed_target|float %}
  {% set EXTRUDER = ambient.extruder_target|float %}
  M118 Ambient source={ambient.source} confidence={ambient_confidence}/3 | Bed adjustment={ambient.bed_adjust}C | Nozzle adjustment={ambient.extruder_adjust}C

  {% if 'gcode_macro UPS_POWER_BUDGET' in printer %}
    UPS_POWER_BUDGET STAGE=bed TARGET={BED}
  {% endif %}
  M140 S{BED}
  M117 Bed heating: {BED}C

  _CHECK_PRINT_STATE

  # HOMING PARTIE 1 : X et Y uniquement (plateau froid OK)
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    M117 Homing X and Y...
    LED_HOMING
    G28 X Y
    STOP_LED_EFFECTS
  {% endif %}

  _CHECK_PRINT_STATE

  {% set mesh_profile_name = (MATERIAL + "_" + BED_SURFACE)|lower %}

  {% if MATERIAL == 'ABS' and BED_SURFACE == 'PEI' and ambient_confidence >= 2 and ambient_temp < 25 %}
    {% set mesh_profile_name = 'pei_abs' %}
    M117 Cold room, using PEI ABS mesh
  {% endif %}

  # Calculate mesh hash for intelligent reuse (includes dimensions)
  MESH_CALCULATE_HASH MATERIAL={MATERIAL} SURFACE={BED_SURFACE}
  
  # Find matching mesh by hash (checks size + position)
  MESH_FIND_MATCHING

  G90
  SET_GCODE_VARIABLE MACRO=VARIABLE_IDLE_TIMEOUT VARIABLE=idle_timeout VALUE=604800
  SET_IDLE_TIMEOUT TIMEOUT=604800

  {% set current_bed_temp = printer.heater_bed.temperature|float %}
  {% set bed_temp_diff = current_bed_temp - BED %}

  M117 Bed at {current_bed_temp}C (target: {BED}C)

  # CAS 1 : Plateau TROP CHAUD (> +5°C au-dessus de la cible)
  {% if bed_temp_diff > 5 %}
    M118 Bed cooling: {current_bed_temp|int}C → {BED}C
    M140 S0
    M117 Cooling bed to {BED}C...
    
    # Réinitialiser le flag mesh_created
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=mesh_created VALUE=0
  
  # Attendre refroidissement du plateau avec LED gradient
    START_LED_HEATING_TEMPLATE
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={BED + 2}
    STOP_LED_HEATING_TEMPLATE
    
    # Stabilisation courte après refroidissement
    {% set stabilization_time = 2 %}
    M117 Bed cooled, 2min stabilization
    
  # CAS 2 : Plateau PROCHE de la cible (80-100% de la temp)
  {% elif current_bed_temp >= (BED * 0.8) %}
    {% set stabilization_time = 1 %}
    M117 Bed hot, 1min stabilization
    
  # CAS 3 : Plateau TIÈDE (60-80% de la temp)
  {% elif current_bed_temp >= (BED * 0.6) %}
    {% set stabilization_time = 3 %}
    M117 Bed warm, 3min stabilization
    
  # CAS 4 : Plateau FROID (<60% de la temp)
  {% else %}
    {% set stabilization_time = 5 %}
    M117 Bed cold, 5min stabilization
  {% endif %}

  # Plateau vers l'avant pendant la chauffe : l'utilisateur peut nettoyer
  # le plateau pendant la montee en temperature (oubli frequent entre
  # deux prints). Y au fond = plateau sorti vers l'avant (bed-slinger).
  {% set y_front = printer.configfile.settings.stepper_y.position_max - 10 %}
  G90
  G1 Y{y_front} F6000
  M117 Bed forward - cleaning access during heating

  # Chauffer le plateau à la temp cible avec suivi LED gradient
  M117 Waiting for bed: {BED}C...
  START_LED_HEATING_TEMPLATE
  M140 S{BED}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED}
  LED_TEMP_REACHED

  _CHECK_PRINT_STATE

  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  {% if all_points|length > 0 %}
    {% set x_min = all_points | map(attribute=0) | min %}
    {% set y_min = all_points | map(attribute=1) | min %}
    # Limites adaptatives basées sur position_max
    {% set x_max_safe = printer.configfile.settings.stepper_x.position_max - 10 %}
    {% set y_max_safe = printer.configfile.settings.stepper_y.position_max - 10 %}
    {% set heat_x = ([x_min - 20, 10] | max, x_max_safe) | min %}
    {% set heat_y = ([y_min - 20, 10] | max, y_max_safe) | min %}
  {% else %}
    # Récupérer positions depuis profil hardware actif
    {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
    {% set profile_macro = "_PROFILE_" ~ active_profile.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
    {% set config = printer[profile_macro_full].config %}
    {% set heat_x = config.park_x|float %}
    {% set heat_y = config.park_y|float %}
  {% endif %}
  # Position d'attente chauffe : plateau vers l'avant (Y max - marge) pour
  # laisser l'acces nettoyage pendant les attentes de temperature
  {% set heat_y = printer.configfile.settings.stepper_y.position_max - 10 %}

  M117 Moving to heating position...
  G90
  
  # HOMING PARTIE 2 : Z avec plateau chaud (précision maximale)
  {% if 'z' not in printer.toolhead.homed_axes %}
    M117 Stabilizing BLTouch (30s)...
    LED_FLAME_START
    G4 P30000
    STOP_LED_EFFECTS
    M117 Homing Z with hot bed...
    LED_HOMING
    G28 Z
    STOP_LED_EFFECTS
  {% endif %}
  
  # Monter à Z100 et se positionner pour la chauffe/mesh
  G1 Z100 F1200
  G1 X{heat_x} Y{heat_y} F6000

  # Charger le mesh depuis la config sauvegardée si pas en RAM
  {% set mesh_in_config = mesh_profile_name in printer.configfile.config.get('bed_mesh', {}) %}
  {% set mesh_in_ram = printer.bed_mesh.profiles[mesh_profile_name] is defined %}
  
  {% if mesh_in_config and not mesh_in_ram %}
    M118 Loading {mesh_profile_name} from saved config...
    BED_MESH_PROFILE LOAD={mesh_profile_name}
    M118 Mesh {mesh_profile_name} loaded from disk
  {% endif %}

  _CHECK_MESH_VALIDITY PROFILE={mesh_profile_name}
  {% set needs_recal = printer["gcode_macro _CHECK_MESH_VALIDITY"].needs_recalibration|int %}
  
  {% if FORCE_MESH == 1 or needs_recal == 1 %}
    M118 Mesh needed | Stabilizing {stabilization_time}min...
    {% set total_seconds = stabilization_time * 60 %}
    M117 Bed stabilizing {stabilization_time}min (no extruder heat)...
    LED_FLAME_START
    {% set chunks = (total_seconds / 10)|int %}
    {% for i in range(chunks) %}
      _CHECK_PRINT_STATE
      G4 P10000
      {% set remaining = total_seconds - ((i + 1) * 10) %}
      M117 Stabilizing: {remaining}s (mesh pending)
    {% endfor %}
    
    _CHECK_PRINT_STATE
    
    {% if needs_recal == 1 %}
      M117 Mesh expired, recalibrating...
    {% else %}
      M117 KAMP adaptive mesh (forced)
    {% endif %}
    
    M117 Bed mesh calibration...
    LED_CALIBRATION
    {% if printer.exclude_object.objects|length > 0 %}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={printer['gcode_macro _KAMP_Settings'].mesh_margin|default(5)|float}
    {% else %}
    BED_MESH_CALIBRATE
    {% endif %}
    STOP_LED_EFFECTS
    BED_MESH_PROFILE SAVE={mesh_profile_name}
    _UPDATE_MESH_METADATA PROFILE={mesh_profile_name} ACTION=create
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=mesh_created VALUE=1
    M118 New mesh saved as {mesh_profile_name} (will be saved to disk at print end)
    
    _CHECK_PRINT_STATE
    
    # Repositionner à Z100 avant chauffe
    M117 Moving to heating position...
    G90
    G1 Z100 F1200
    G1 X{heat_x} Y{heat_y} F6000
    M118 At heating position (Z100) after mesh
    
    # Activer le suivi LED gradient pour l'extruder
    START_LED_HEATING_TEMPLATE
    M117 Heating extruder: {EXTRUDER}C...
    M118 Mesh complete, heating extruder to {EXTRUDER}C (LED gradient active)
    M104 S{EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER}
    LED_TEMP_REACHED
    M117 Extruder ready: {EXTRUDER}C
    
  {% elif (mesh_profile_name in printer.configfile.config.get('bed_mesh', {}) or printer.bed_mesh.profiles[mesh_profile_name] is defined) and needs_recal == 0 %}
    M118 Using existing valid mesh, parallel heating enabled
    
    {% set total_seconds = stabilization_time * 60 %}
    {% set extruder_heat_time = 60 %}
    
    M117 Bed stabilizing {stabilization_time}min...
    M118 Bed reached {BED}C, stabilizing for {stabilization_time} minute(s)
    LED_FLAME_START
    
    {% if total_seconds > extruder_heat_time %}
      {% set delay_before_heat = total_seconds - extruder_heat_time %}
      {% set chunks_before_heat = (delay_before_heat / 10)|int %}
      {% set chunks_after_heat = ((total_seconds - delay_before_heat) / 10)|int %}
      
      {% for i in range(chunks_before_heat) %}
        _CHECK_PRINT_STATE
        G4 P10000
        {% set remaining = total_seconds - ((i + 1) * 10) %}
        M117 Stabilizing: {remaining}s left
      {% endfor %}
      
      # Passer de LED flamme à LED gradient pour l'extruder
      START_LED_HEATING_TEMPLATE
      M104 S{EXTRUDER}
      M117 Extruder heating: {EXTRUDER}C (parallel)
      M118 Starting extruder heating in parallel (LED gradient active)
      
      {% for i in range(chunks_after_heat) %}
        _CHECK_PRINT_STATE
        G4 P10000
        {% set remaining = total_seconds - (chunks_before_heat * 10) - ((i + 1) * 10) %}
        M117 Stabilizing: {remaining}s, Extruder heating
      {% endfor %}
    {% else %}
      # Passer de LED flamme à LED gradient pour l'extruder
      START_LED_HEATING_TEMPLATE
      M104 S{EXTRUDER}
      M118 Short stabilization, heating extruder immediately (LED gradient active)
      
      {% set chunks = (total_seconds / 10)|int %}
      {% for i in range(chunks) %}
        _CHECK_PRINT_STATE
        G4 P10000
        {% set remaining = total_seconds - ((i + 1) * 10) %}
        M117 Stabilizing: {remaining}s, Extruder heating
      {% endfor %}
    {% endif %}
    
    _CHECK_PRINT_STATE
    
    # Load mesh from hash if found, otherwise use profile name
    {% set hash_match = printer["gcode_macro _MESH_HASH_SETTINGS"].hash_match_found %}
    {% if hash_match == 1 %}
      {% set matched_profile = printer["gcode_macro _MESH_HASH_SETTINGS"].matched_profile %}
      BED_MESH_PROFILE LOAD={matched_profile}
      M117 Loaded {matched_profile} mesh (hash match)
      M118 Using mesh from hash: {matched_profile}
      _UPDATE_MESH_METADATA PROFILE={matched_profile} ACTION=use
    {% else %}
      BED_MESH_PROFILE LOAD={mesh_profile_name}
      M117 Loaded {mesh_profile_name} mesh
      M118 Using saved mesh profile: {mesh_profile_name}
      _UPDATE_MESH_METADATA PROFILE={mesh_profile_name} ACTION=use
    {% endif %}
    
    _CHECK_PRINT_STATE
    
    # Finaliser chauffe extruder
    M117 Finalizing extruder heating...
    M104 S{EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER}
    LED_TEMP_REACHED
    M117 Extruder ready: {EXTRUDER}C
    
  {% else %}
    M118 No mesh found, creating new mesh (delaying extruder)
    
    {% set total_seconds = stabilization_time * 60 %}
    M117 Bed stabilizing {stabilization_time}min (no extruder heat)...
    LED_FLAME_START
    
    {% set chunks = (total_seconds / 10)|int %}
    {% for i in range(chunks) %}
      _CHECK_PRINT_STATE
      G4 P10000
      {% set remaining = total_seconds - ((i + 1) * 10) %}
      M117 Stabilizing: {remaining}s (mesh pending)
    {% endfor %}
    
    _CHECK_PRINT_STATE
    STOP_LED_EFFECTS
    
    M117 No profile for {mesh_profile_name}, KAMP meshing...
    M118 No saved mesh for {mesh_profile_name}, performing adaptive calibration
    LED_CALIBRATION
    {% if printer.exclude_object.objects|length > 0 %}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={printer['gcode_macro _KAMP_Settings'].mesh_margin|default(5)|float}
    {% else %}
    BED_MESH_CALIBRATE
    {% endif %}
    STOP_LED_EFFECTS
    BED_MESH_PROFILE SAVE={mesh_profile_name}
    _UPDATE_MESH_METADATA PROFILE={mesh_profile_name} ACTION=create
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=mesh_created VALUE=1
    M118 New mesh saved as {mesh_profile_name} (will be saved to disk at print end)
    
    _CHECK_PRINT_STATE
    
    # ✅ FIX PROBLÈME 1 : Repositionner à Z100 avant chauffe
    M117 Moving to heating position...
    G90
    G1 Z100 F1200
    G1 X{heat_x} Y{heat_y} F6000
    M118 At heating position (Z100) after mesh
    
    # Reprendre suivi température pour extruder
    START_LED_HEATING_TEMPLATE
    M117 Heating extruder: {EXTRUDER}C...
    M118 Mesh complete, heating extruder to {EXTRUDER}C
    M104 S{EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER}
    LED_TEMP_REACHED
    M117 Extruder ready: {EXTRUDER}C
  {% endif %}

  # Ajustement automatique du Z-offset selon températures plateau et ambiante
  # Prend en compte l'expansion thermique du plateau + température ambiante
  THERMAL_COMPENSATE_Z AMBIENT_TEMP={ambient_temp} AMBIENT_CONFIDENCE={ambient_confidence}

  _CHECK_PRINT_STATE
  
  # LED verte pour la purge
  LED_PURGE

  M117 Adaptive purging...
  M118 Executing LINE_PURGE_SAFE (adaptive or default)
  LINE_PURGE_SAFE

  SET_FILAMENT_SENSOR SENSOR=filament ENABLE=1
  M118 Filament sensor re-enabled

  # Transition vers LED blanche d'impression
  G4 P200

  # Passer en mode impression
  _SET_LED_PRINTING

  M117 Starting print!
  M118 PRINT_START sequence completed successfully

  # Demarrer monitoring thermique
  START_THERMAL_MONITORING
  
  # Démarrer monitoring automatique des couches pour power loss recovery
  POWER_START_MONITORING
  
  # Sauvegarder checkpoint initial immédiatement (CRITIQUE pour détection précoce)
  POWER_SAVE_CHECKPOINT LAYER=0 STATE=printing
  M118 ✅ Initial power loss checkpoint saved (Layer 0)
  {% endif %}  # Fin du bloc else (power_loss_recovery_active)
