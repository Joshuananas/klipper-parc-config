[delayed_gcode _SAVE_MESH_AFTER_PRINT]
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    UPDATE_DELAYED_GCODE ID=_SAVE_MESH_AFTER_PRINT DURATION=2
  {% else %}
    M118 ========================================
    M118 NEW MESH CREATED - SAVING TO DISK
    M118 ========================================
    M118 Virtual SD print completed, saving mesh...
    SAVE_CONFIG
  {% endif %}

[gcode_macro PRINT_END]
gcode:
  # Arrêter tous les effets LED
  STOP_LED_EFFECTS
  
  # Arreter monitoring thermique
  STOP_THERMAL_MONITORING
  
  # Nettoyer état power loss et arrêter monitoring
  POWER_STOP_MONITORING
  POWER_CLEAR_STATE

  # Parking unifié : même hauteur adaptative que PAUSE/CANCEL (~30% Z_max)
  # au lieu du simple +10mm qui laissait la buse à ras du plateau
  _PARK_TOOLHEAD MODE=end
  
  # Wipe interne de la buse EN POSITION DE PARK (buse encore chaude)
  M117 Cleaning nozzle...
  G91  ;Relatif pour wipe
  G1 E2 F300   ;Avance 2mm lentement
  G1 E-2 F600  ;Recule 2mm plus vite
  G1 E2 F300   ;Avance 2mm lentement
  G1 E-2 F600  ;Recule 2mm plus vite
  G1 E-30 F1800  ;Retract filament finale
  G90  ;Absolu
  
  TURN_OFF_HEATERS  ;Turn off heaters APRÈS le wipe
  M106 S0  ;Part cooling fan speed
  
  M84  ;Disable motors
  
  # Marquer comme non-printing (sera fait par LED_SUCCESS)
  
  # Sauvegarder les ajustements Z-offset faits pendant l'impression
  Z_SAVE_ADJUSTMENT
  
  # Retirer compensation Z température (réinitialise l'offset à 0)
  SET_GCODE_OFFSET Z=0 MOVE=0
  
  # Restaurer idle timeout à 5 minutes
  SET_IDLE_TIMEOUT TIMEOUT=300
  
  # Animation LED verte clignotante de succès (10 secondes)
  LED_SUCCESS
  
  # Sauvegarder les profils de mesh après la libération complète de Virtual SD
  {% if printer["gcode_macro _PRINT_STATE"].mesh_created == 1 %}
    M118 New mesh will be saved after Virtual SD completion
    UPDATE_DELAYED_GCODE ID=_SAVE_MESH_AFTER_PRINT DURATION=2
  {% endif %}
