# ============================================
# PROFILS DE RÉTRACTION ADAPTATIFS
# ============================================
# Adaptation automatique selon type d'extruder, hotend et buse

[gcode_macro _RETRACTION_PROFILES]
description: Retraction profiles by extruder type
variable_bowden_stock: {"pause_retract": 30, "m600_retract": 30, "m600_prime": 12, "cancel_retract": 30, "retract_speed": 30, "prime_speed": 5, "notes": "Bowden standard"}
variable_bowden_long: {"pause_retract": 40, "m600_retract": 40, "m600_prime": 15, "cancel_retract": 40, "retract_speed": 35, "prime_speed": 5, "notes": "Bowden long tube"}
variable_direct_drive_standard: {"pause_retract": 6, "m600_retract": 8, "m600_prime": 3, "cancel_retract": 6, "retract_speed": 35, "prime_speed": 5, "notes": "Direct Drive standard"}
variable_direct_drive_all_metal: {"pause_retract": 4, "m600_retract": 6, "m600_prime": 2, "cancel_retract": 4, "retract_speed": 30, "prime_speed": 5, "notes": "Direct Drive all-metal"}
variable_direct_drive_volcano: {"pause_retract": 6, "m600_retract": 8, "m600_prime": 3, "cancel_retract": 6, "retract_speed": 30, "prime_speed": 5, "notes": "Direct Drive Volcano"}
gcode:
  # Variables seulement

# ============================================
# PARAMÈTRES DE RÉTRACTION CALCULÉS
# ============================================

[gcode_macro _RETRACTION_SETTINGS]
description: Calculated retraction settings (updated at startup)
variable_pause_retract: 30
variable_m600_retract: 30
variable_m600_prime: 12
variable_cancel_retract: 30
variable_retract_speed: 30
variable_prime_speed: 5
variable_last_calculated: ""
gcode:
  # Variables seulement

# ============================================
# CALCUL AUTOMATIQUE DES RÉTRACTIONS
# ============================================

[gcode_macro _CALCULATE_RETRACTION]
description: Calculate retraction distances based on hardware profile
gcode:
  # Récupérer le profil actif
  {% set active_profile_name = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "_PROFILE_" ~ active_profile_name.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
  
  # Vérifier si la macro du profil existe
  {% if profile_macro_full not in printer %}
    M118 WARNING: Profile macro {profile_macro} not found
    M118 Using default Direct Drive profile (6mm)
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE=6
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE=8
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_prime VALUE=3
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=cancel_retract VALUE=6
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=retract_speed VALUE=35
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=prime_speed VALUE=5
  {% else %}
    {% set profile = printer[profile_macro_full].config %}
    
    # Vérifier si extruder_config existe dans le profil
    {% if "extruder_config" not in profile %}
      M118 WARNING: No extruder_config in profile {active_profile_name}
      M118 Using default Direct Drive profile (6mm)
      SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE=6
      SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE=8
      SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_prime VALUE=3
      SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=cancel_retract VALUE=6
      SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=retract_speed VALUE=35
      SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=prime_speed VALUE=5
    {% else %}
      {% set extruder = profile.extruder_config %}
    {% set profiles = printer["gcode_macro _RETRACTION_PROFILES"] %}
    
    # Sélectionner le profil de base selon type d'extruder
    {% if extruder.type == "bowden" %}
      {% if extruder.bowden_length|default(0)|int > 600 %}
        {% set base = profiles.bowden_long %}
        {% set profile_name = "Bowden Long" %}
      {% else %}
        {% set base = profiles.bowden_stock %}
        {% set profile_name = "Bowden Standard" %}
      {% endif %}
    {% elif extruder.type == "direct_drive_all_metal" %}
      {% if extruder.hotend|default("stock") == "volcano" %}
        {% set base = profiles.direct_drive_volcano %}
        {% set profile_name = "Direct Drive Volcano" %}
      {% else %}
        {% set base = profiles.direct_drive_all_metal %}
        {% set profile_name = "Direct Drive All-Metal" %}
      {% endif %}
    {% else %}
      {% set base = profiles.direct_drive_standard %}
      {% set profile_name = "Direct Drive Standard" %}
    {% endif %}
    
    # Ajustements selon hotend
    {% set hotend_adjust = 0 %}
    {% set hotend = extruder.hotend|default("stock")|lower %}
    {% if hotend == "volcano" %}
      {% set hotend_adjust = 2 %}
    {% elif hotend == "cht" %}
      {% set hotend_adjust = 1 %}
    {% elif hotend == "mosquito" %}
      {% set hotend_adjust = -1 %}
    {% elif hotend == "dragon" %}
      {% set hotend_adjust = 0 %}
    {% endif %}
    
    # Ajustements selon taille de buse
    {% set nozzle_adjust = 0 %}
    {% set nozzle = extruder.nozzle_diameter|default(0.4)|float %}
    {% if nozzle <= 0.2 %}
      {% set nozzle_adjust = -1 %}
    {% elif nozzle >= 0.6 and nozzle < 0.8 %}
      {% set nozzle_adjust = 1 %}
    {% elif nozzle >= 0.8 %}
      {% set nozzle_adjust = 2 %}
    {% endif %}
    
    # Calcul final
    {% set pause_retract = (base.pause_retract + hotend_adjust + nozzle_adjust)|int %}
    {% set m600_retract = (base.m600_retract + hotend_adjust + nozzle_adjust)|int %}
    {% set m600_prime = (base.m600_prime + (hotend_adjust / 2)|int)|int %}
    {% set cancel_retract = (base.cancel_retract + hotend_adjust + nozzle_adjust)|int %}
    
    # Limites de sécurité
    {% if pause_retract < 2 %}
      {% set pause_retract = 2 %}
    {% endif %}
    {% if m600_retract < 3 %}
      {% set m600_retract = 3 %}
    {% endif %}
    {% if m600_prime < 1 %}
      {% set m600_prime = 1 %}
    {% endif %}
    
    # Sauvegarder les valeurs calculées
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE={pause_retract}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE={m600_retract}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_prime VALUE={m600_prime}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=cancel_retract VALUE={cancel_retract}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=retract_speed VALUE={base.retract_speed}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=prime_speed VALUE={base.prime_speed}
    
    # Timestamp
    {% set timestamp = printer.system_stats.cputime|int %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=last_calculated VALUE='"{timestamp}"'
    
    # Afficher résumé
    M118 ========================================
    M118 RETRACTION CALCULATED
    M118 ========================================
    M118 Profile: {profile_name}
    M118 Extruder: {extruder.type}
    M118 Hotend: {hotend}
    M118 Nozzle: {nozzle}mm
    M118 ----------------------------------------
    M118 PAUSE retract: {pause_retract}mm
    M118 M600 retract: {m600_retract}mm
    M118 M600 prime: {m600_prime}mm
    M118 CANCEL retract: {cancel_retract}mm
    M118 ----------------------------------------
    M118 Adjustments:
    M118   Hotend: {hotend_adjust}mm
    M118   Nozzle: {nozzle_adjust}mm
    M118 ========================================
    {% endif %}
  {% endif %}

# ============================================
# AFFICHER PARAMÈTRES ACTUELS
# ============================================

[gcode_macro GET_RETRACTION_SETTINGS]
description: Display current retraction settings
gcode:
  {% set settings = printer["gcode_macro _RETRACTION_SETTINGS"] %}
  
  M118 ========================================
  M118 CURRENT RETRACTION SETTINGS
  M118 ========================================
  M118 PAUSE retract: {settings.pause_retract}mm
  M118 M600 retract: {settings.m600_retract}mm
  M118 M600 prime: {settings.m600_prime}mm
  M118 CANCEL retract: {settings.cancel_retract}mm
  M118 Retract speed: {settings.retract_speed}mm/s
  M118 Prime speed: {settings.prime_speed}mm/s
  M118 ----------------------------------------
  M118 Last calculated: {settings.last_calculated}
  M118 ========================================

# ============================================
# OVERRIDE MANUEL (pour tests)
# ============================================

[gcode_macro SET_RETRACTION_OVERRIDE]
description: Manually override retraction settings (for testing)
gcode:
  {% set PAUSE = params.PAUSE|default(-1)|int %}
  {% set M600 = params.M600|default(-1)|int %}
  {% set CANCEL = params.CANCEL|default(-1)|int %}
  
  {% if PAUSE >= 0 %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE={PAUSE}
    M118 PAUSE retract override: {PAUSE}mm
  {% endif %}
  
  {% if M600 >= 0 %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE={M600}
    M118 M600 retract override: {M600}mm
  {% endif %}
  
  {% if CANCEL >= 0 %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=cancel_retract VALUE={CANCEL}
    M118 CANCEL retract override: {CANCEL}mm
  {% endif %}
  
  M118 Use _CALCULATE_RETRACTION to restore automatic values

# ---- RENOMME depuis info_utilities.cfg (dedup audit) ----

[gcode_macro GET_FIRMWARE_RETRACTION]
description: Display firmware retraction settings (guarded)
gcode:
  {% if 'firmware_retraction' in printer %}
    {% set fr = printer.firmware_retraction %}
    M118 FW retract: {fr.retract_length}mm @ {fr.retract_speed}mm/s | prime +{fr.unretract_extra_length}mm @ {fr.unretract_speed}mm/s
  {% else %}
    M118 firmware_retraction: NOT CONFIGURED
  {% endif %}
