# ============================================
# WIZARD INTERACTIF DE CALIBRATION SWEET SPOT
# ============================================
# Version corrigée avec interactions utilisateur et conventions LED

[gcode_macro _RETRACTION_WIZARD_STATE]
description: State tracking for wizard
variable_step: 0
variable_pause_sweetspot: 0
variable_m600_sweetspot: 0
variable_resume_prime_sweetspot: 0
variable_current_test: 0
variable_heating: 0
gcode:
  # Variables seulement

# ============================================
# MENU DE SÉLECTION
# ============================================

[gcode_macro RETRACTION_WIZARD_MENU]
description: Display calibration menu
gcode:
  M118 
  M118 ╔════════════════════════════════════════╗
  M118 ║   RETRACTION CALIBRATION WIZARD        ║
  M118 ╚════════════════════════════════════════╝
  M118 
  M118 Select calibration to perform:
  M118 
  M118 1. PAUSE retraction (anti-oozing)
  M118    → RETRACTION_CALIBRATE_SWEETSPOT MODE=pause
  M118 
  M118 2. RESUME prime (gap-free restart)
  M118    → RETRACTION_CALIBRATE_SWEETSPOT MODE=resume
  M118 
  M118 3. M600 retraction (clean cut)
  M118    → RETRACTION_CALIBRATE_SWEETSPOT MODE=m600
  M118 
  M118 4. ALL (complete calibration)
  M118    → RETRACTION_CALIBRATE_SWEETSPOT MODE=all
  M118 
  M118 5. Current settings
  M118    → RETRACTION_GET_SETTINGS
  M118 
  M118 ========================================

# ============================================
# MACRO PRINCIPALE
# ============================================

[gcode_macro RETRACTION_CALIBRATE_SWEETSPOT]
description: Retraction wizard | MODE=pause|resume|m600|all | Default: menu
gcode:
  {% set MODE = params.MODE|default('menu')|string|lower %}
  
  {% if MODE == 'menu' %}
    RETRACTION_WIZARD_MENU
  {% elif MODE == 'all' %}
    RETRACTION_WIZARD_START
  {% elif MODE == 'pause' %}
    RETRACTION_WIZARD_START_PAUSE
  {% elif MODE == 'resume' %}
    RETRACTION_WIZARD_START_RESUME
  {% elif MODE == 'm600' %}
    RETRACTION_WIZARD_START_M600
  {% elif MODE == 'test' %}
    {% set DISTANCE = params.DISTANCE|default(6)|int %}
    RETRACTION_WIZARD_TEST DISTANCE={DISTANCE}
  {% elif MODE == 'apply' %}
    {% set PAUSE = params.PAUSE|default(-1)|int %}
    {% set M600 = params.M600|default(-1)|int %}
    _RETRACTION_APPLY_RESULTS PAUSE={PAUSE} M600={M600}
  {% else %}
    M118 ERROR: Invalid MODE
    M118 Use: MODE=all (default) | MODE=test DISTANCE=X | MODE=apply PAUSE=X M600=Y
  {% endif %}

# ============================================
# DÉMARRAGE DU WIZARD
# ============================================

[gcode_macro RETRACTION_WIZARD_START]
description: Start interactive retraction calibration wizard
gcode:
  # LED: Calibration en cours (orange)
  SET_LED LED=extruder RED=1 GREEN=0.5 BLUE=0
  
  # Reset state
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=step VALUE=1
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=current_test VALUE=0
  
  M118 ╔════════════════════════════════════════╗
  M118 ║   RETRACTION SWEET SPOT WIZARD         ║
  M118 ╚════════════════════════════════════════╝
  M118 
  M118 This wizard will calibrate:
  M118 1. PAUSE retraction (anti-oozing)
  M118 2. M600 retraction (clean cut)
  M118 3. RESUME prime (gap-free restart)
  M118 
  M118 Estimated time: 20-25 minutes
  M118 You will interact at each step
  M118 
  M118 ========================================
  M118 STEP 1: PREPARATION
  M118 ========================================
  
  # Home si nécessaire avec LED  # Homing si nécessaire
  {% if printer.toolhead.homed_axes != 'xyz' %}
    M118 → Homing axes...
    LED_HOMING
    G28
    M118 ✓ Axes homed
  {% else %}
    M118 ✓ Axes already homed
  {% endif %}
  
  # Position safe AVANT de chauffer
  M118 → Moving to safe position...
  SAFE_POSITION
  M118 ✓ Safe position reached
  
  # Vérifier filament sensor
  M118 → Checking filament sensor...
  {% if printer['filament_switch_sensor filament'].filament_detected %}
    M118 ✓ Filament detected
  {% else %}
    M118 ❌ ERROR: No filament detected!
    M118 Please insert filament and try again
    LED_ERROR
    { action_raise_error("No filament detected") }
  {% endif %}
  
  # Chauffer extruder
  {% if printer.extruder.temperature < 180 %}
    M118 → Heating extruder to 200°C...
    M118 ⏳ Please wait (2-3 minutes)
    
    # Arrêter LED homing avant template chauffe
    STOP_LED_EFFECTS
    
    # LED: Gradient de chauffe (bleu→vert→jaune→rouge)
    START_LED_HEATING_TEMPLATE HEATER=extruder TARGET=200
    
    M109 S200
    
    # LED: Température atteinte (3 flashs verts)
    LED_TEMP_REACHED
    
    M118 ✓ Extruder heated to {printer.extruder.temperature|round(1)}°C
  {% else %}
    M118 ✓ Extruder already hot ({printer.extruder.temperature|round(1)}°C)
  {% endif %}
  
  # Purge initiale importante (50mm = 5cm)
  M118 
  M118 ========================================
  M118 INITIAL PURGE
  M118 ========================================
  M118 Purging 50mm to ensure proper pressure
  M118 This ensures filament is ready for testing
  M118 If you just inserted filament, this purges it completely
  M118 ⏳ Please wait...
  M118 
  M83
  G1 E50 F300
  M82
  G4 P3000
  M118 ✓ Nozzle fully primed and ready
  
  M118 
  M118 ✓ Preparation complete!
  M118 
  M118 ========================================
  M118 STEP 2: PAUSE RETRACTION CALIBRATION
  M118 ========================================
  M118 
  M118 OBJECTIVE: Find minimum distance with NO oozing
  M118 
  M118 METHOD:
  M118 1. We will test ONE distance at a time
  M118 2. You OBSERVE oozing for 30 seconds
  M118 3. You DECIDE: perfect / need more / need less
  M118 4. We adjust and continue until perfect
  M118 
  M118 Current value: {printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract}mm
  M118 (This is your starting point, can go up or down)
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 READY TO START
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 NEXT: Test first distance
  M118 Command: RETRACTION_WIZARD_TEST_PAUSE
  M118 ========================================

# ============================================
# TEST PAUSE (INTERACTIF)
# ============================================

[gcode_macro RETRACTION_WIZARD_TEST_PAUSE]
description: Test current PAUSE retraction distance | Optional: ADJUST=+1 or ADJUST=-2
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  {% set adjust = params.ADJUST|default(0)|int %}
  {% set test_num = printer["gcode_macro _RETRACTION_WIZARD_STATE"].current_test + 1 %}
  
  # Appliquer ajustement si demandé
  {% if adjust != 0 %}
    {% set new_value = current + adjust %}
    {% if new_value < 1 %}
      M118 ❌ ERROR: Cannot go below 1mm
      { action_raise_error("Minimum retraction is 1mm") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE={new_value}
    {% set current = new_value %}
    M118 → Adjusted: {current - adjust}mm → {current}mm
  {% endif %}
  
  # Vérifier filament sensor
  {% if not printer['filament_switch_sensor filament'].filament_detected %}
    M118 ❌ ERROR: Filament runout detected!
    M118 Please check filament and restart wizard
    LED_ERROR
    { action_raise_error("Filament runout during test") }
  {% endif %}
  
  # LED: Calibration (violet breathe)
  LED_CALIBRATION
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=current_test VALUE={test_num}
  
  M118 
  M118 ╔════════════════════════════════════════╗
  M118 ║   PAUSE TEST #{test_num}: {current}mm{' ' * (18 - current|string|length)}║
  M118 ╚════════════════════════════════════════╝
  M118 
  M117 Testing PAUSE {current}mm...
  
  # Position safe
  SAFE_POSITION
  
  # Prime (simuler état d'impression)
  M118 → Priming nozzle (5mm)...
  M83
  G1 E5 F300
  M82
  G4 P1000
  
  # Rétraction test
  M118 → Retracting {current}mm...
  M83
  G1 E-{current} F1800
  M82
  
  # LED: Blanc fixe pour observation
  _SET_LED_PRINTING
  
  # Attendre et observer
  M118 
  M118 ⏱️  OBSERVE OOZING FOR 30 SECONDS
  M118 Testing distance: {current}mm
  M118 
  M117 Test {current}mm - Observe oozing...
  G4 P30000
  
  # LED: Attente décision (violet)
  LED_CALIBRATION
  
  M118 
  M118 ========================================
  M118 EVALUATION
  M118 ========================================
  M118 
  M118 Did you see oozing?
  M118 
  M118 SCORE:
  M118   0 = NO oozing (PERFECT!) ✅
  M118   1 = Very slight oozing
  M118   2 = Slight oozing
  M118   3 = Medium oozing
  M118   4 = Heavy oozing
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 DECISION
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 If Score 0 (NO oozing):
  M118   → RETRACTION_WIZARD_PAUSE_FOUND
  M118   → Sweet spot found! ✅
  M118 
  M118 If Score 1-4 (oozing present):
  M118   → RETRACTION_WIZARD_PAUSE_INCREASE (or ADJUST=+2)
  M118   → Will test again with +1mm (or custom)
  M118 
  M118 If you think LESS retraction would work:
  M118   → RETRACTION_WIZARD_PAUSE_DECREASE (or ADJUST=-1)
  M118   → Will test again with -1mm (or custom)
  M118 
  M118 Custom adjustment:
  M118   → RETRACTION_WIZARD_PAUSE_ADJUST AMOUNT=+3
  M118   → RETRACTION_WIZARD_PAUSE_ADJUST AMOUNT=-2
  M118 
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_PAUSE_FOUND]
description: PAUSE sweet spot found - Continue to RESUME
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  
  # Reprime d'abord (compenser test précédent)
  {% set reprime = current + 2 %}
  M118 
  M118 → Re-priming nozzle ({reprime}mm)...
  M83
  G1 E{reprime} F300
  M82
  G4 P1000
  M118 ✓ Nozzle back to pressure
  M118 
  
  # LED: Succès (vert)
  LED_SUCCESS
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=pause_sweetspot VALUE={current}
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=step VALUE=2
  
  M118 
  M118 ✅ PAUSE SWEET SPOT FOUND: {current}mm
  M118 
  M118 ========================================
  M118 STEP 3: RESUME PRIME CALIBRATION
  M118 ========================================
  M118 
  M118 OBJECTIVE: Find prime amount for gap-free restart
  M118 
  M118 METHOD:
  M118 1. We simulate PAUSE → RESUME cycle
  M118 2. You OBSERVE if there's a gap or blob
  M118 3. You DECIDE: perfect / need more / need less
  M118 4. We adjust until perfect
  M118 
  M118 Current purge: 2mm (Direct Drive)
  M118 Current compensation: {current - 2}mm
  M118 Total prime on RESUME: {current}mm
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 READY TO START RESUME TESTS
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 NEXT: Test RESUME prime
  M118 Command: RETRACTION_WIZARD_TEST_RESUME
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_PAUSE_INCREASE]
description: Increase PAUSE retraction by 1mm and auto-test
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  
  # Reprime d'abord (compenser test précédent)
  {% set reprime = current + 2 %}
  M118 
  M118 → Re-priming nozzle ({reprime}mm)...
  M83
  G1 E{reprime} F300
  M82
  G4 P1000
  M118 ✓ Nozzle back to pressure
  M118 
  
  # Lancer test avec +1mm
  RETRACTION_WIZARD_TEST_PAUSE ADJUST=1

[gcode_macro RETRACTION_WIZARD_PAUSE_DECREASE]
description: Decrease PAUSE retraction by 1mm and auto-test
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  
  # Reprime d'abord (compenser test précédent)
  {% set reprime = current + 2 %}
  M118 
  M118 → Re-priming nozzle ({reprime}mm)...
  M83
  G1 E{reprime} F300
  M82
  G4 P1000
  M118 ✓ Nozzle back to pressure
  M118 
  
  # Lancer test avec -1mm
  RETRACTION_WIZARD_TEST_PAUSE ADJUST=-1

[gcode_macro RETRACTION_WIZARD_PAUSE_ADJUST]
description: Adjust PAUSE retraction by custom amount | AMOUNT=+3 or AMOUNT=-2
gcode:
  {% set amount = params.AMOUNT|default(1)|int %}
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  
  # Reprime d'abord (compenser test précédent)
  {% set reprime = current + 2 %}
  M118 
  M118 → Re-priming nozzle ({reprime}mm)...
  M83
  G1 E{reprime} F300
  M82
  G4 P1000
  M118 ✓ Nozzle back to pressure
  M118 
  
  # Lancer test avec ajustement personnalisé
  RETRACTION_WIZARD_TEST_PAUSE ADJUST={amount}

# ============================================
# TEST M600 (INTERACTIF)
# ============================================

[gcode_macro RETRACTION_WIZARD_TEST_M600]
description: Test current M600 retraction distance
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].m600_retract|int %}
  {% set test_num = printer["gcode_macro _RETRACTION_WIZARD_STATE"].current_test + 1 %}
  
  # Vérifier filament sensor
  {% if not printer['filament_switch_sensor filament'].filament_detected %}
    M118 ❌ ERROR: Filament runout detected!
    M118 Please check filament and restart wizard
    SET_LED LED=extruder RED=1 GREEN=0 BLUE=0
    { action_raise_error("Filament runout during test") }
  {% endif %}
  
  # LED: Test en cours (bleu)
  SET_LED LED=extruder RED=0 GREEN=0.5 BLUE=1
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=current_test VALUE={test_num}
  
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 M600 TEST #{test_num}: {current}mm
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  # Position safe haute pour retirer filament
  SAFE_POSITION Z=150
  
  # Prime (simuler état d'impression)
  M118 → Priming nozzle (12mm)...
  M83
  G1 E12 F300
  M82
  G4 P1000
  
  # Rétraction M600
  M118 → Retracting {current}mm...
  M83
  G1 E-{current} F1800
  M82
  
  # Wipe pour casser le filament
  M118 → Wipe movement...
  {% set x_pos = printer.toolhead.position.x %}
  {% set y_pos = printer.toolhead.position.y %}
  G1 X{x_pos + 10} Y{y_pos} F9000
  G1 X{x_pos - 10} Y{y_pos} F9000
  G1 X{x_pos} Y{y_pos} F9000
  
  # LED: Attente interaction (violet)
  SET_LED LED=extruder RED=1 GREEN=0 BLUE=1
  
  M118 
  M118 ========================================
  M118 USER ACTION REQUIRED
  M118 ========================================
  M118 
  M118 1. REMOVE filament from hotend
  M118 2. OBSERVE the cut quality at the tip
  M118 3. EVALUATE the cut (see scores below)
  M118 
  M118 SCORE:
  M118   0 = Clean cut, no string (PERFECT!) ✅
  M118   1 = Very slight string (acceptable)
  M118   2 = Thin string (borderline)
  M118   3 = Thick string or blob
  M118   4 = Very long string
  M118 
  M118 ⏸️  PAUSED - Waiting for your action
  M118 
  M118 When ready, continue with:
  M118   RETRACTION_WIZARD_M600_CONTINUE
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_M600_CONTINUE]
description: Continue after M600 observation
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].m600_retract|int %}
  
  # LED: Attente filament (cyan)
  SET_LED LED=extruder RED=0 GREEN=1 BLUE=1
  
  M118 
  M118 ========================================
  M118 RE-INSERT FILAMENT
  M118 ========================================
  M118 
  M118 1. RE-INSERT filament into hotend
  M118 2. Push until you feel resistance
  M118 3. We will re-prime the nozzle
  M118 
  M118 When filament is inserted, continue with:
  M118   RETRACTION_WIZARD_M600_REPRIME
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_M600_REPRIME]
description: Re-prime after filament re-insertion
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].m600_retract|int %}
  
  # LED: Reprime (orange)
  SET_LED LED=extruder RED=1 GREEN=0.5 BLUE=0
  
  M118 
  M118 → Re-priming nozzle...
  M83
  G1 E{current + 5} F300  # Reprime: retraction + 5mm
  M82
  G4 P2000
  M118 ✓ Nozzle re-primed
  
  # LED: Attente décision (violet)
  SET_LED LED=extruder RED=1 GREEN=0 BLUE=1
  
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 DECISION
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 Based on cut quality you observed:
  M118 
  M118 If Score 0-1 (clean cut):
  M118   → RETRACTION_WIZARD_M600_FOUND
  M118   → Sweet spot found! ✅
  M118 
  M118 If Score 2-4 (string/blob):
  M118   → RETRACTION_WIZARD_M600_INCREASE
  M118   → Will increase by 1mm and test again
  M118 
  M118 If you think LESS retraction would work:
  M118   → RETRACTION_WIZARD_M600_DECREASE
  M118   → Will decrease by 1mm and test again
  M118 
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_M600_FOUND]
description: M600 sweet spot found - Finish wizard
gcode:
  {% set pause = printer["gcode_macro _RETRACTION_WIZARD_STATE"].pause_sweetspot|int %}
  {% set m600 = printer["gcode_macro _RETRACTION_SETTINGS"].m600_retract|int %}
  
  # LED: Succès (vert)
  SET_LED LED=extruder RED=0 GREEN=1 BLUE=0
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=m600_sweetspot VALUE={m600}
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=step VALUE=3
  
  M118 
  M118 ✅ M600 SWEET SPOT FOUND: {m600}mm
  M118 
  M118 ╔════════════════════════════════════════╗
  M118 ║   CALIBRATION COMPLETE!                ║
  M118 ╚════════════════════════════════════════╝
  M118 
  M118 ========================================
  M118 RESULTS
  M118 ========================================
  M118 PAUSE retract: {pause}mm
  M118 RESUME prime: {pause}mm (purge 2mm + compensation {pause - 2}mm)
  M118 M600 retract: {m600}mm
  M118 ========================================
  M118 
  M118 → Applying values...
  
  _RETRACTION_APPLY_RESULTS PAUSE={pause} M600={m600}
  
  # LED: Idle (blanc)
  _SET_LED_IDLE
  
  M118 
  M118 ✓ Values applied successfully!
  M118 
  M118 ========================================
  M118 NEXT STEPS
  M118 ========================================
  M118 
  M118 ⚠️  IMPORTANT: Values are in RAM only!
  M118 They will be LOST on Klipper restart.
  M118 
  M118 TO SAVE PERMANENTLY:
  M118 
  M118 1. Edit: hardware/profiles.cfg (line ~297)
  M118 
  M118 2. Add to "extruder_config":
  M118    "pause_retract": {pause},
  M118    "m600_retract": {m600},
  M118    "m600_prime": 3,
  M118 
  M118 3. Restart Klipper:
  M118    sudo systemctl restart klipper
  M118 
  M118 4. Verify:
  M118    RETRACTION_GET_SETTINGS
  M118 
  M118 📖 Full guide: CALIBRATION_SAVE_GUIDE.md
  M118 
  M118 ========================================
  M118 
  M118 Continue calibration?
  M118 → RETRACTION_WIZARD_MENU (show menu)
  M118 → RETRACTION_CALIBRATE_SWEETSPOT MODE=pause
  M118 → RETRACTION_CALIBRATE_SWEETSPOT MODE=resume
  M118 → RETRACTION_CALIBRATE_SWEETSPOT MODE=m600
  M118 
  M118 🎉 Wizard complete! Happy printing!

[gcode_macro RETRACTION_WIZARD_M600_INCREASE]
description: Increase M600 retraction and test again
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].m600_retract|int %}
  {% set new_value = current + 1 %}
  
  # LED: Ajustement (orange)
  SET_LED LED=extruder RED=1 GREEN=0.5 BLUE=0
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE={new_value}
  
  M118 
  M118 → Increasing M600 retraction: {current}mm → {new_value}mm
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 NEXT TEST
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 Command: RETRACTION_WIZARD_TEST_M600
  M118 ========================================

