  M118 NEXT TEST
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 Command: RETRACTION_WIZARD_TEST_M600
  M118 ========================================

# ============================================
# TEST RESUME (INTERACTIF)
# ============================================

[gcode_macro RETRACTION_WIZARD_TEST_RESUME]
description: Test current RESUME prime amount
gcode:
  {% set pause_retract = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  {% set purge = 2 %}  # Direct Drive purge
  {% set compensation = pause_retract - purge %}
  {% set total_prime = purge + compensation %}
  {% set test_num = printer["gcode_macro _RETRACTION_WIZARD_STATE"].current_test + 1 %}
  
  # Vérifier filament sensor
  {% if not printer['filament_switch_sensor filament'].filament_detected %}
    M118 ❌ ERROR: Filament runout detected!
    M118 Please check filament and restart wizard
    SET_LED LED=extruder RED=1 GREEN=0 BLUE=0
    { action_raise_error("Filament runout during test") }
  {% endif %}
  
  # LED: Test en cours (bleu)
  SET_LED LED=extruder RED=0 GREEN=0.5 BLUE=1
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=current_test VALUE={test_num}
  
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 RESUME TEST #{test_num}
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 PAUSE retract: {pause_retract}mm
  M118 Purge: {purge}mm
  M118 Compensation: {compensation}mm
  M118 Total prime: {total_prime}mm
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  # Position safe
  SAFE_POSITION
  
  # Simuler cycle PAUSE → RESUME
  M118 → Simulating print extrusion (10mm)...
  M83
  G1 E10 F300
  M82
  G4 P1000
  
  # PAUSE retraction
  M118 → PAUSE retraction ({pause_retract}mm)...
  M83
  G1 E-{pause_retract} F1800
  M82
  G4 P2000
  
  # RESUME prime (purge + compensation)
  M118 → RESUME prime ({total_prime}mm)...
  M83
  G1 E{purge} F300  # Purge lente
  G1 E{compensation} F300  # Compensation
  M82
  G4 P1000
  
  # Extrusion test pour voir gap/blob
  M118 → Test extrusion (10mm)...
  M83
  G1 E10 F300
  M82
  
  # LED: Attente interaction (violet)
  SET_LED LED=extruder RED=1 GREEN=0 BLUE=1
  
  M118 
  M118 ========================================
  M118 EVALUATION
  M118 ========================================
  M118 
  M118 Observe the extrusion:
  M118 
  M118 SCORE:
  M118   0 = Perfect! No gap, no blob ✅
  M118   1 = Very slight gap (need more prime)
  M118   2 = Visible gap (need more prime)
  M118   3 = Slight blob (need less prime)
  M118   4 = Big blob (need less prime)
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 DECISION
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 If Score 0 (perfect):
  M118   → RETRACTION_WIZARD_RESUME_FOUND
  M118   → Sweet spot found! ✅
  M118 
  M118 If Score 1-2 (gap):
  M118   → RETRACTION_WIZARD_RESUME_INCREASE
  M118   → Will increase prime by 1mm
  M118 
  M118 If Score 3-4 (blob):
  M118   → RETRACTION_WIZARD_RESUME_DECREASE
  M118   → Will decrease prime by 1mm
  M118 
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_RESUME_FOUND]
description: RESUME sweet spot found - Continue to M600
gcode:
  {% set pause = printer["gcode_macro _RETRACTION_WIZARD_STATE"].pause_sweetspot|int %}
  {% set purge = 2 %}
  {% set compensation = pause - purge %}
  
  # LED: Succès (vert)
  SET_LED LED=extruder RED=0 GREEN=1 BLUE=0
  
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=resume_prime_sweetspot VALUE={pause}
  SET_GCODE_VARIABLE MACRO=_RETRACTION_WIZARD_STATE VARIABLE=step VALUE=3
  
  M118 
  M118 ✅ RESUME SWEET SPOT FOUND!
  M118 
  M118 Purge: {purge}mm
  M118 Compensation: {compensation}mm
  M118 Total prime: {pause}mm
  M118 
  M118 ========================================
  M118 STEP 4: M600 RETRACTION CALIBRATION
  M118 ========================================
  M118 
  M118 OBJECTIVE: Find distance for CLEAN filament cut
  M118 
  M118 METHOD:
  M118 1. We retract and wipe to cut filament
  M118 2. You REMOVE filament from hotend
  M118 3. You OBSERVE the cut quality
  M118 4. You RE-INSERT filament
  M118 5. We re-prime and continue or stop
  M118 
  M118 Recommended: PAUSE + 2mm = {pause + 2}mm
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 READY TO START M600 TESTS
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 NEXT: Test M600 cut quality
  M118 Command: RETRACTION_WIZARD_TEST_M600
  M118 ========================================
  
  # Mettre à jour M600 retract à PAUSE + 2mm
  {% set m600_start = pause + 2 %}
  SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE={m600_start}

[gcode_macro RETRACTION_WIZARD_RESUME_INCREASE]
description: Increase RESUME prime and test again
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  {% set new_value = current + 1 %}
  
  # LED: Ajustement (orange)
  SET_LED LED=extruder RED=1 GREEN=0.5 BLUE=0
  
  # Augmenter pause_retract augmente automatiquement le prime
  SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE={new_value}
  
  M118 
  M118 → Increasing RESUME prime: {current}mm → {new_value}mm
  M118 (Increased PAUSE retract to match)
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 NEXT TEST
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 Command: RETRACTION_WIZARD_TEST_RESUME
  M118 ========================================

[gcode_macro RETRACTION_WIZARD_RESUME_DECREASE]
description: Decrease RESUME prime and test again
gcode:
  {% set current = printer["gcode_macro _RETRACTION_SETTINGS"].pause_retract|int %}
  {% set new_value = current - 1 %}
  
  {% if new_value < 2 %}
    M118 ERROR: Cannot decrease below 2mm
    { action_raise_error("Minimum prime is 2mm") }
  {% endif %}
  
  # LED: Ajustement (orange)
  SET_LED LED=extruder RED=1 GREEN=0.5 BLUE=0
  
  # Diminuer pause_retract diminue automatiquement le prime
  SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE={new_value}
  
  M118 
  M118 → Decreasing RESUME prime: {current}mm → {new_value}mm
  M118 (Decreased PAUSE retract to match)
  M118 
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 NEXT TEST
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 
  M118 Command: RETRACTION_WIZARD_TEST_RESUME
  M118 ========================================

# ============================================
# TEST MANUEL (MODE AVANCÉ)
# ============================================

[gcode_macro RETRACTION_WIZARD_TEST]
description: Manual test mode (advanced)
gcode:
  {% set DISTANCE = params.DISTANCE|default(6)|int %}
  
  # LED: Test manuel (bleu)
  SET_LED LED=extruder RED=0 GREEN=0.5 BLUE=1
  
  # Home si nécessaire
  {% if printer.toolhead.homed_axes != 'xyz' %}
    M118 → Homing...
    G28
  {% endif %}
  
  # Chauffer si nécessaire
  {% if printer.extruder.temperature < 180 %}
    M118 → Heating to 200°C...
    M109 S200
  {% endif %}
  
  M118 ========================================
  M118 MANUAL TEST: {DISTANCE}mm
  M118 ========================================
  
  # Position safe
  SAFE_POSITION
  
  # Prime
  M118 → Priming...
  M83
  G1 E5 F300
  M82
  G4 P1000
  
  # Retract
  M118 → Retracting {DISTANCE}mm...
  M83
  G1 E-{DISTANCE} F1800
  M82
  
  # Observe
  M118 → Observing 30s...
  G4 P30000
  
  # LED: Idle
  _SET_LED_IDLE
  
  M118 ✓ Test complete

# ============================================
# APPLY RESULTS
# ============================================

[gcode_macro _RETRACTION_APPLY_RESULTS]
description: Internal - Apply calibrated values
gcode:
  {% set PAUSE = params.PAUSE|default(-1)|int %}
  {% set M600 = params.M600|default(-1)|int %}
  
  {% if PAUSE < 0 and M600 < 0 %}
    M118 ERROR: No values provided
    { action_raise_error("Missing calibration values") }
  {% endif %}
  
  M118 ========================================
  M118 APPLYING CALIBRATION RESULTS
  M118 ========================================
  
  {% if PAUSE >= 0 %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=pause_retract VALUE={PAUSE}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=cancel_retract VALUE={PAUSE}
    M118 PAUSE retract: {PAUSE}mm ✓
  {% endif %}
  
  {% if M600 >= 0 %}
    SET_GCODE_VARIABLE MACRO=_RETRACTION_SETTINGS VARIABLE=m600_retract VALUE={M600}
    M118 M600 retract: {M600}mm ✓
  {% endif %}
  
  M118 ========================================

