# ============================================
# PROFILS DE PURGE PAR MATERIAU
# ============================================
# Configuration adaptative selon le type de filament

[gcode_macro _MATERIAL_PURGE_PROFILES]
description: Material-specific purge parameters
# Format: {"start_amount": XX, "resume_amount": XX, "runout_amount": XX, "temp_boost": XX, "flow_rate": XX, "retract": XX}
variable_pla: {"start_amount": 100, "resume_amount": 100, "runout_amount": 30, "temp_boost": 0, "flow_rate": 24, "retract": 12}
variable_petg: {"start_amount": 120, "resume_amount": 100, "runout_amount": 35, "temp_boost": 5, "flow_rate": 20, "retract": 15}
variable_abs: {"start_amount": 140, "resume_amount": 120, "runout_amount": 40, "temp_boost": 10, "flow_rate": 20, "retract": 15}
variable_asa: {"start_amount": 140, "resume_amount": 120, "runout_amount": 40, "temp_boost": 10, "flow_rate": 20, "retract": 15}
variable_tpu: {"start_amount": 150, "resume_amount": 150, "runout_amount": 50, "temp_boost": 0, "flow_rate": 16, "retract": 8}
variable_nylon: {"start_amount": 130, "resume_amount": 110, "runout_amount": 40, "temp_boost": 8, "flow_rate": 18, "retract": 12}
variable_default: {"start_amount": 100, "resume_amount": 100, "runout_amount": 35, "temp_boost": 5, "flow_rate": 24, "retract": 12}
variable_current_material: "PLA"
gcode:

[gcode_macro SET_MATERIAL_PROFILE]
description: Set current material for purge profiles
gcode:
  {% set material = params.MATERIAL|default("PLA")|upper %}
  SET_GCODE_VARIABLE MACRO=_MATERIAL_PURGE_PROFILES VARIABLE=current_material VALUE='"{material}"'
  M118 Material profile set to: {material}

[gcode_macro GET_PURGE_PARAMS]
description: Get purge parameters for current material
gcode:
  {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|upper %}
  {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
  
  {% if material in profiles %}
    {% set profile = profiles[material] %}
  {% else %}
    {% set profile = profiles.default %}
    M118 Unknown material {material}, using default profile
  {% endif %}
  
  M118 ========================================
  M118 PURGE PROFILE: {material}
  M118 ========================================
  M118 Start purge: {profile.start_amount}mm
  M118 Resume purge: {profile.resume_amount}mm
  M118 Runout purge: {profile.runout_amount}mm
  M118 Temp boost: +{profile.temp_boost}C
  M118 Flow rate: {profile.flow_rate}mm3/s
  M118 Retraction: {profile.retract}mm
  M118 ========================================