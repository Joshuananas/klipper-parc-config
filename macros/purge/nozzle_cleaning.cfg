# ============================================
# NETTOYAGE BUSE UNIFIÉ (RÉFÉRENCE M600)
# ============================================
# Macro centralisée pour nettoyage après purge
# Compatible avec toutes les purges (M600, Runout, Pause)
# Date: 2025-11-23

[gcode_macro _NOZZLE_CLEANING]
description: Unified nozzle cleaning sequence (reference M600)
gcode:
    {% set MODE = params.MODE|default("advanced")|string %}  # advanced, standard, minimal
    
    # Récupérer dimensions du plateau pour calcul adaptatif
    {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
    {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
    
    # Récupérer paramètres de nettoyage
    {% set purge_x_setting = printer["gcode_macro PURGE_SETTINGS"].purge_x_position %}
    {% set purge_y_setting = printer["gcode_macro PURGE_SETTINGS"].purge_y_position %}
    {% set wipe_radius = printer["gcode_macro PURGE_SETTINGS"].wipe_radius %}
    {% set wipe_speed = printer["gcode_macro PURGE_SETTINGS"].wipe_speed %}
    {% set z_lift = printer["gcode_macro PURGE_SETTINGS"].z_lift_after_purge %}
    {% set wipe_pause = printer["gcode_macro PURGE_SETTINGS"].wipe_pause_time %}
    {% set brush_passes = printer["gcode_macro PURGE_SETTINGS"].brush_passes %}
    
    # Calculer position de purge adaptative (si 0, utiliser marge de 10mm)
    {% set purge_x = purge_x_setting if purge_x_setting > 0 else (wipe_radius + 10) %}
    {% set purge_y = purge_y_setting if purge_y_setting > 0 else (wipe_radius + 10) %}
    
    # Récupérer profil matériau pour rétraction
    {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
    {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
    {% if material in profiles %}
        {% set profile = profiles[material] %}
    {% else %}
        {% set profile = profiles.default %}
    {% endif %}
    {% set cut_length = profile.retract | float %}
    {% set cut_speed = printer["gcode_macro PURGE_SETTINGS"].cut_retraction_speed %}
    
    # Position Z actuelle pour calculs
    {% set current_z = printer.toolhead.position.z|float %}
    
    # ========================================
    # MODE ADVANCED (M600 Color Change)
    # ========================================
    {% if MODE == "advanced" %}
        M118 Nozzle cleaning: ADVANCED mode (wipe + brush)
        
        # 1. Rétraction de coupe
        G91
        G1 E-{cut_length} F{cut_speed}
        G90
        
        # 2. Wipe circulaire (4 directions)
        G1 X{purge_x + wipe_radius} Y{purge_y} F{wipe_speed}      # Droite
        G1 X{purge_x} Y{purge_y + wipe_radius} F{wipe_speed}      # Haut
        G1 X{purge_x - wipe_radius} Y{purge_y} F{wipe_speed}      # Gauche
        G1 X{purge_x} Y{purge_y - wipe_radius} F{wipe_speed}      # Bas
        G1 X{purge_x} Y{purge_y} F{wipe_speed}                    # Centre
        
        # 3. Brosse virtuelle PENDANT le Z-hop (5 passes)
        {% set z_step = z_lift / brush_passes %}
        {% for i in range(brush_passes) %}
            {% set target_z = current_z + ((i + 1) * z_step) %}
            G1 X{purge_x + 10} Z{target_z} F{wipe_speed}
            G1 X{purge_x} Z{target_z} F{wipe_speed}
        {% endfor %}
        
        # 4. Pause pour laisser le filament se casser
        G4 P{wipe_pause}
        
        # 5. Mouvement final rapide pour détacher
        G1 X{purge_x + 15} Y{purge_y + 15} F{wipe_speed}
    
    # ========================================
    # MODE STANDARD (M600 Runout / Pause)
    # ========================================
    {% elif MODE == "standard" %}
        M118 Nozzle cleaning: STANDARD mode (wipe simple)
        
        # 1. Rétraction de coupe
        G91
        G1 E-{cut_length} F{cut_speed}
        G90
        
        # 2. Wipe simple (2 passes)
        G1 X{purge_x + wipe_radius} Y{purge_y} F{wipe_speed}
        G1 X{purge_x} Y{purge_y} F{wipe_speed}
        
        # 3. Z-hop avec mouvement
        G1 X{purge_x + 10} Z{current_z + z_lift} F{wipe_speed}
        
        # 4. Pause pour casser le filament
        G4 P{wipe_pause / 2}
        
        # 5. Mouvement final
        G1 X{purge_x + 15} Y{purge_y + 10} F{wipe_speed}
    
    # ========================================
    # MODE MINIMAL (Pause courte)
    # ========================================
    {% elif MODE == "minimal" %}
        M118 Nozzle cleaning: MINIMAL mode (wipe rapide)
        
        # 1. Rétraction légère
        G91
        G1 E-{cut_length / 2} F{cut_speed}
        G90
        
        # 2. Wipe minimal (1 passe)
        G1 X{purge_x + wipe_radius} Y{purge_y} F{wipe_speed}
        G1 X{purge_x} Y{purge_y} F{wipe_speed}
        
        # 3. Z-hop simple
        G1 Z{current_z + (z_lift / 2)} F{wipe_speed}
    
    {% endif %}
    
    M117 Nozzle cleaning complete

# ============================================
# MACROS UTILISATEUR
# ============================================

[gcode_macro CLEAN_NOZZLE_ADVANCED]
description: Advanced nozzle cleaning (M600 reference)
gcode:
    _NOZZLE_CLEANING MODE=advanced

[gcode_macro CLEAN_NOZZLE_STANDARD]
description: Standard nozzle cleaning (runout/pause)
gcode:
    _NOZZLE_CLEANING MODE=standard

[gcode_macro CLEAN_NOZZLE_MINIMAL]
description: Minimal nozzle cleaning (quick pause)
gcode:
    _NOZZLE_CLEANING MODE=minimal

# ============================================
# DOCUMENTATION
# ============================================
#
# MODES DE NETTOYAGE:
#
# ADVANCED (M600 Color Change):
#   - Rétraction coupe complète
#   - Wipe circulaire 4 directions
#   - Brosse virtuelle 5 passes pendant Z-hop
#   - Pause 1000ms
#   - Détachement X+15 Y+15
#   - Temps: ~15 secondes
#
# STANDARD (M600 Runout / Pause):
#   - Rétraction coupe complète
#   - Wipe simple 2 passes
#   - Z-hop avec mouvement
#   - Pause 500ms
#   - Détachement X+15 Y+10
#   - Temps: ~8 secondes
#
# MINIMAL (Pause courte):
#   - Rétraction légère (50%)
#   - Wipe minimal 1 passe
#   - Z-hop réduit (50%)
#   - Temps: ~3 secondes
#
# UTILISATION:
#   _NOZZLE_CLEANING MODE=advanced   # Nettoyage complet
#   _NOZZLE_CLEANING MODE=standard   # Nettoyage standard
#   _NOZZLE_CLEANING MODE=minimal    # Nettoyage rapide
#
# ============================================
