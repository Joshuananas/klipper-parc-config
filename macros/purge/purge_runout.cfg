# ============================================
# PURGE RUNOUT - Same Color (30mm)
# ============================================
# Purge courte pour fin de filament (même couleur)

[gcode_macro PURGE_RUNOUT]
description: Short purge for filament runout (same color)
gcode:
    # Get material-specific purge parameters
    {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
    {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
    {% if material in profiles %}
        {% set profile = profiles[material] %}
    {% else %}
        {% set profile = profiles.default %}
    {% endif %}
    
    # Récupérer positions de purge depuis profil hardware actif
    {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
    {% set profile_macro = "_PROFILE_" ~ active_profile.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
    {% set config = printer[profile_macro_full].config %}
    {% set purge_x = config.purge_x|float %}
    {% set purge_y = config.purge_y|float %}
    # Calculer 50% de resume_amount au lieu de runout_amount fixe
    {% set runout_ratio = printer["gcode_macro _RESUME_COMPENSATION_SETTINGS"].runout_ratio|float %}
    {% set runout_amount = (profile.resume_amount * runout_ratio)|int %}
    {% set cut_length = profile.retract | float %}
    {% set cut_speed = printer["gcode_macro PURGE_SETTINGS"].cut_retraction_speed %}
    {% set wipe_radius = printer["gcode_macro PURGE_SETTINGS"].wipe_radius %}
    {% set wipe_speed = printer["gcode_macro PURGE_SETTINGS"].wipe_speed %}
    {% set z_lift = printer["gcode_macro PURGE_SETTINGS"].z_lift_after_purge %}
    {% set final_prime = printer["gcode_macro PURGE_SETTINGS"].final_prime_amount %}
    {% set prime_speed = printer["gcode_macro PURGE_SETTINGS"].final_prime_speed %}
    {% set wipe_pause = printer["gcode_macro PURGE_SETTINGS"].wipe_pause_time %}
    {% set boost_length = printer["gcode_macro PURGE_SETTINGS"].boost_length_runout %}
    {% set boost_multiplier = printer["gcode_macro PURGE_SETTINGS"].boost_flow_multiplier %}
    {% set boost_pause = printer["gcode_macro PURGE_SETTINGS"].boost_pause_time %}

    SAVE_GCODE_STATE NAME=PURGE_RUNOUT_STATE

    # Calculer hauteur de purge adaptative (pourcentage de Z_max)
    {% set current_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set purge_percent = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].purge_height_percent|float %}
    {% set min_zhop = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].min_zhop_mm|float %}
    {% set safety_margin = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].safety_margin_mm|float %}
    
    # Hauteur cible = pourcentage de Z_max
    {% set target_purge_height = (max_z * purge_percent)|round(1) %}
    {% if current_z < target_purge_height %}
      {% set purge_z = target_purge_height %}
      M117 Moving to purge height: {purge_z}mm ({(purge_percent * 100)|int}% of Z_max)
    {% else %}
      {% set purge_z = current_z + min_zhop %}
      M117 Purging at current height + Z-hop: {purge_z}mm
    {% endif %}
    {% set purge_z = [purge_z, max_z - safety_margin]|min %}

    G90
    G1 Z{purge_z} F1200
    G1 X{purge_x} Y{purge_y} F6000

    G91
    G92 E0
    G1 E{runout_amount - boost_length} F150
    
    G1 E{boost_length} F{150 * boost_multiplier}  # Boost débit pour créer blob lourd
    G4 P{boost_pause}  # Pause pour laisser le blob se former

    # Nettoyage unifié (référence M600) - MODE ADVANCED pour zig-zag
    _NOZZLE_CLEANING MODE=advanced

    RESTORE_GCODE_STATE NAME=PURGE_RUNOUT_STATE MOVE=0
    
    G91
    G92 E0
    G1 E{final_prime} F{prime_speed}
    G90

    M117 Purge complete

# ============================================
# BED MESH CALIBRATION (Heated)
# ============================================
