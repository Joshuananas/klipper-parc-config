# ============================================
# PURGE LINE (Basic) - ADAPTATIF
# ============================================
# Purge simple en ligne pour démarrage d'impression
# Positions adaptées selon profil hardware actif

[gcode_macro _PURGE_LINE]
gcode:
  # Récupérer dimensions depuis profil hardware actif
  {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "_PROFILE_" ~ active_profile.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
  {% set config = printer[profile_macro_full].config %}
  {% set bed_y = config.bed_size_y|float %}
  
  # Calculer positions adaptatives (10mm du bord, ligne sur 60% de Y)
  {% set start_x = 10 %}
  {% set start_y = 20 %}
  {% set end_y = (bed_y * 0.6)|round(1) %}
  
  G92 E0
  G90
  G1 Z2.0 F3000
  G1 X{start_x} Y{start_y} Z0.3 F5000.0
  G1 E20 F1800                              # Prime réduit: 30→20mm
  G4 P1500                                  # Pause réduite: 2s→1.5s
  G1 X{start_x} Y{end_y} Z0.3 F1500.0 E35   # Extrusion réduite: 45→35mm
  G1 X{start_x + 0.4} Y{end_y} Z0.3 F5000.0
  G1 X{start_x + 0.4} Y{start_y} Z0.3 F1500.0 E50  # Extrusion réduite: 60→50mm
  G92 E0
  M82
  G1 Z2.0 F3000
