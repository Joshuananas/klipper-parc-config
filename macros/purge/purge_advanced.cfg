# ============================================
# PURGE ADVANCED - Color Change (100mm)
# ============================================
# Purge complète avec brosse virtuelle pendant Z-hop

[gcode_macro PURGE_ADVANCED]
description: Hybrid purge with Z-hop wipe for clean nozzle
gcode:
    _PURGE_RESUME KIND=advanced

# ============================================
# _PURGE_RESUME - MOTEUR UNIFIÉ DES PURGES DE REPRISE
# ============================================
# Squelette commun : hauteur adaptative -> position purge -> extrusion+boost
# -> nettoyage buse -> prime de reprise. Les seules différences entre les cas
# (pause simple / runout même couleur / changement couleur M600) sont les
# paramètres ci-dessous.
#
# KIND      | quantité              | vitesse  | boost                 | temp | prime reprise
# pause     | resume_amount x pause_ratio  | F300 | boost_length_pause    | non  | retract + extra_prime
# runout    | resume_amount x runout_ratio | F150 | boost_length_runout   | non  | final_prime_amount
# advanced  | resume_amount (100%)  | initial_purge_speed | boost_length_advanced | +temp_boost | final_prime_amount

[gcode_macro _PURGE_RESUME]
description: Purge de reprise unifiée | KIND=pause|runout|advanced
gcode:
    _ADAPTIVE_Z MODE=purge
    _PURGE_RESUME_EXECUTE {rawparams}

[gcode_macro _PURGE_RESUME_EXECUTE]
gcode:
    {% set KIND = params.KIND|default("pause")|string %}
    {% if KIND not in ['pause', 'runout', 'advanced'] %}
        {action_raise_error('Unknown resume purge kind')}
    {% endif %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error('Resume purge requires homed axes')}
    {% endif %}

    # Paramètres matériau
    {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
    {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
    {% if material in profiles %}
        {% set profile = profiles[material] %}
    {% else %}
        {% set profile = profiles.default %}
    {% endif %}

    # Positions de purge depuis profil hardware actif
    {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
    {% set profile_macro = "_PROFILE_" ~ active_profile.upper() %}
    {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
    {% set config = printer[profile_macro_full].config %}
    {% set purge_x = config.purge_x|float %}
    {% set purge_y = config.purge_y|float %}

    {% set s = printer["gcode_macro PURGE_SETTINGS"] %}
    {% set comp = printer["gcode_macro _RESUME_COMPENSATION_SETTINGS"] %}
    {% set current_temp = printer.extruder.target %}

    # Paramètres par cas
    {% if KIND == "advanced" %}
        {% set amount = profile.resume_amount|float %}
        {% set speed = s.initial_purge_speed|float %}
        {% set boost_length = s.boost_length_advanced|float %}
        {% set temp_boost = profile.temp_boost|float %}
        {% set reprime = s.final_prime_amount|float %}
        {% set reprime_speed = s.final_prime_speed|float %}
    {% elif KIND == "runout" %}
        {% set amount = profile.resume_amount|float * comp.runout_ratio|float %}
        {% set speed = 150 %}
        {% set boost_length = s.boost_length_runout|float %}
        {% set temp_boost = 0 %}
        {% set reprime = s.final_prime_amount|float %}
        {% set reprime_speed = s.final_prime_speed|float %}
    {% else %}
        {% set amount = profile.resume_amount|float * comp.pause_ratio|float %}
        {% set speed = 300 %}
        {% set boost_length = s.boost_length_pause|float %}
        {% set temp_boost = 0 %}
        {% set reprime = profile.retract|float + comp.extra_prime|float %}
        {% set reprime_speed = 300 %}
    {% endif %}

    SAVE_GCODE_STATE NAME=PURGE_RESUME_STATE

    # Hauteur de purge adaptative (source unique : _ADAPTIVE_Z)
    {% set purge_z = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].computed_z|float %}
    {% set ceiling = printer.toolhead.axis_maximum.z|float - printer['gcode_macro _ADAPTIVE_HEIGHT_SETTINGS'].safety_margin_mm|float %}
    {% if not printer.toolhead.position.z|float <= purge_z <= ceiling or not 0 <= s.z_lift_after_purge|float <= ceiling - purge_z %}
        {action_raise_error('Insufficient clearance for purge and nozzle cleaning')}
    {% endif %}
    {% if not 0 <= boost_length <= amount or not 0 < speed or not 0 <= reprime %}
        {action_raise_error('Invalid resume purge recipe')}
    {% endif %}
    M117 Purging at Z{purge_z|round(1)}mm ({KIND})

    {% if temp_boost > 0 %}
        M109 S{current_temp + temp_boost}
    {% endif %}

    G90
    G1 Z{purge_z} F1200
    G1 X{purge_x} Y{purge_y} F6000

    G91
    G92 E0
    G1 E{amount - boost_length} F{speed}
    G1 E{boost_length} F{speed * s.boost_flow_multiplier}  # Boost débit pour créer blob lourd
    G4 P{s.boost_pause_time}  # Pause pour laisser le blob se former

    # Nettoyage unifié - MODE ADVANCED pour zig-zag
    _NOZZLE_CLEANING MODE=advanced

    {% if temp_boost > 0 %}
        M104 S{current_temp}
    {% endif %}


    # Prime de reprise (compense le cut du nettoyage / restaure pression)
    {% if reprime > 0 %}
        M83
        G1 E{reprime} F{reprime_speed}
    {% endif %}
    RESTORE_GCODE_STATE NAME=PURGE_RESUME_STATE MOVE=0

    M117 Purge complete ({KIND})

# ============================================
# PURGE_RUNOUT (Purge courte pour fin de filament)
# ============================================
