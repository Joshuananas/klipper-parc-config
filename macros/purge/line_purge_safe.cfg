# KAMP Line Purge with Safe Fallback
# Works with or without object data

[gcode_macro LINE_PURGE_SAFE]
description: KAMP line purge with fallback to default position
gcode:
    # Get relevant printer params
    {% set travel_speed = (printer.toolhead.max_velocity) * 60 | float %}
    {% set cross_section = printer.configfile.settings.extruder.max_extrude_cross_section | float %}

    # Use firmware retraction if it is defined
    {% if printer.firmware_retraction is defined %}
        {% set RETRACT = 'G10' | string %}
        {% set UNRETRACT = 'G11' | string %}
    {% else %}
        {% set RETRACT = 'G1 E-.5 F2100' | string %}
        {% set UNRETRACT = 'G1 E.5 F2100' | string %}
    {% endif %}

    # Get purge settings from _KAMP_Settings
    {% set verbose_enable = printer["gcode_macro _KAMP_Settings"].verbose_enable | default(True) | abs %}
    {% set purge_height = printer["gcode_macro _KAMP_Settings"].purge_height | default(0.8) | float %}
    {% set tip_distance = printer["gcode_macro _KAMP_Settings"].tip_distance | default(10) | float %}
    # Override purge_margin to 20mm (2cm) to prevent part cooling fan from hitting purge line
    {% set purge_margin = 20 | float %}
    
    # Get material-specific purge parameters
    {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
    {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
    {% if material in profiles %}
        {% set profile = profiles[material] %}
    {% else %}
        {% set profile = profiles.default %}
    {% endif %}
    
    {% set purge_amount = profile.start_amount | float %}
    {% set flow_rate = profile.flow_rate | float %}

    # Get bed limits
    {% set x_max = printer.toolhead.axis_maximum.x | float %}
    {% set y_max = printer.toolhead.axis_maximum.y | float %}
    
    # Calculate purge origins from objects or use defaults
    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    
    {% if all_points|length > 0 %}
        # Use object data (adaptive mesh was performed)
        {% set purge_x_min = (all_points | map(attribute=0) | min) %}
        {% set purge_y_min = (all_points | map(attribute=1) | min) %}
        {% set purge_x_origin = ([purge_x_min - purge_margin, 10] | max) %}
        {% set purge_y_origin = ([purge_y_min - purge_margin, 10] | max) %}
        
        # Limit purge end to stay within bed
        {% set purge_x_end = ([purge_x_origin + purge_amount, x_max - 10] | min) %}
        {% set purge_amount_adjusted = purge_x_end - purge_x_origin %}
        
        {% if verbose_enable %}
            M118 KAMP adaptive purge: X{purge_x_origin} Y{purge_y_origin} (near object)
            {% if purge_amount_adjusted < purge_amount %}
                M118 ⚠️ Purge shortened to {purge_amount_adjusted|round(1)}mm (bed limit)
            {% endif %}
        {% endif %}
        
        {% set purge_amount = purge_amount_adjusted %}
    {% else %}
        # Use default position (loaded mesh profile, no object data)
        {% set purge_x_origin = 10 %}
        {% set purge_y_origin = 20 %}
        
        {% if verbose_enable %}
            M118 KAMP default purge: X{purge_x_origin} Y{purge_y_origin} (no object data)
        {% endif %}
    {% endif %}

    # Calculate purge speed
    {% set purge_move_speed = (flow_rate / 5.0) * 60 | float %}

    {% if cross_section < 5 %}
        {action_respond_info("[Extruder] max_extrude_cross_section insufficient for purge (need >= 5)")}
        M118 ERROR: Purge skipped, max_extrude_cross_section < 5
    {% else %}
        {% if verbose_enable %}
            M118 Purging {purge_amount}mm at flow rate {flow_rate}mm3/s
        {% endif %}

        SAVE_GCODE_STATE NAME=LINE_PURGE_STATE

        G90                                                         # Absolute positioning
        G0 X{purge_x_origin} Y{purge_y_origin} F{travel_speed}     # Move to purge start
        G0 Z{purge_height} F{travel_speed}                         # Move to purge height
        M83                                                         # Relative extrusion
        
        # PRIME DE NETTOYAGE (buse fixe pour englober la tête)
        G1 E25 F300                                                 # 25mm @ 5mm/s (réduit pour moins de prime)
        G4 P1500                                                    # Pause 1.5 secondes
        
        G1 X{purge_x_origin + purge_amount} E{purge_amount} F{purge_move_speed}  # Purge line
        {RETRACT}                                                   # Retract
        G0 Z{purge_height + 5} F{travel_speed}                     # Z hop
        M82                                                         # Absolute extrusion

        RESTORE_GCODE_STATE NAME=LINE_PURGE_STATE

        # Prime final pour restaurer la pression
        M83                                                         # Relative extrusion
        G92 E0                                                      # Reset position E
        G1 E1.5 F300                                                # Prime 1.5mm lentement (réduit)
        M82                                                         # Absolute extrusion

        {% if verbose_enable %}
            M118 Purge completed successfully (primed 2mm)
        {% endif %}
    {% endif %}