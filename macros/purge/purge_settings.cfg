# ============================================
# PURGE GLOBAL SETTINGS - ADAPTATIF
# ============================================
# Configuration centralisée pour tous les systèmes de purge
# Positions XY adaptées automatiquement selon profil machine actif

[gcode_macro PURGE_SETTINGS]
variable_initial_purge_length: 100           # Longueur purge complète (mm)
variable_initial_purge_speed: 450            # Vitesse purge (mm/min) - 3x plus rapide pour reprise
variable_cut_retraction_length: 15           # Rétraction pour couper le fil (mm)
variable_cut_retraction_speed: 3000          # Vitesse rétraction (mm/min)
variable_purge_temperature_boost: 5          # Boost température pour purge (°C)
variable_purge_x_position: 0                 # Position X de purge (depuis profil machine)
variable_purge_y_position: 0                 # Position Y de purge (depuis profil machine)
variable_wipe_radius: 5                      # Rayon des mouvements de nettoyage (mm)
variable_wipe_speed: 9000                    # Vitesse des mouvements de nettoyage (mm/min)
variable_brush_passes: 3                     # Nombre de passages de brosse virtuelle
variable_z_lift_after_purge: 10              # Hauteur de Z-hop après purge (mm)
variable_final_prime_amount: 14               # Prime finale pour restaurer pression (mm)
variable_final_prime_speed: 300              # Vitesse du prime final (mm/min)
variable_wipe_pause_time: 500                # Pause pour casser le filament (ms)
variable_boost_length_advanced: 15           # Longueur boost pour PURGE_ADVANCED (mm)
variable_boost_length_runout: 10             # Longueur boost pour PURGE_RUNOUT (mm)
variable_boost_length_pause: 3               # Longueur boost pour PAUSE simple (mm) - 15% de 20mm
variable_boost_flow_multiplier: 2.0          # Multiplicateur de débit pour boost (2x = double débit)
variable_boost_pause_time: 1500              # Pause après boost pour former blob (ms)
gcode:
