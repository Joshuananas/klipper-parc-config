# ============================================
# CALIBRATION INFO
# ============================================

[gcode_macro GET_CALIBRATION_STATUS]
description: Display calibration status and reminders
gcode:
  {% set tracker = printer["gcode_macro _CALIBRATION_TRACKER"] %}
  {% set now = printer.system_stats.cputime|int %}
  
  # Démarrer effet LED info (cyan breathe)
  STOP_LED_EFFECTS
  G4 P200
  SET_LED_EFFECT EFFECT=led_effect_breathe_cyan
  
  M118 ========================================
  M118 CALIBRATION STATUS
  M118 ========================================
  M118 AUTOMATED CALIBRATIONS
  M118 ========================================
  
  # PID Extruder
  {% if tracker.last_pid_extruder > 0 %}
    {% set age = ((now - tracker.last_pid_extruder) / 86400)|int %}
    {% set remaining = tracker.interval_pid - age %}
    {% if age < tracker.interval_pid %}
      M118 PID Extruder: OK ({age} days, {remaining} days remaining)
    {% else %}
      M118 PID Extruder:  NEEDS CALIBRATION ({age} days old)
    {% endif %}
  {% else %}
    M118 PID Extruder:  NEVER CALIBRATED
  {% endif %}
  
  # PID Bed
  {% if tracker.last_pid_bed > 0 %}
    {% set age = ((now - tracker.last_pid_bed) / 86400)|int %}
    {% set remaining = tracker.interval_pid - age %}
    {% if age < tracker.interval_pid %}
      M118 PID Bed: OK ({age} days, {remaining} days remaining)
    {% else %}
      M118 PID Bed:  NEEDS CALIBRATION ({age} days old)
    {% endif %}
  {% else %}
    M118 PID Bed:  NEVER CALIBRATED
  {% endif %}
  
  # Input Shaper
  {% if tracker.last_input_shaper > 0 %}
    {% set age = ((now - tracker.last_input_shaper) / 86400)|int %}
    {% set remaining = tracker.interval_input_shaper - age %}
    {% if age < tracker.interval_input_shaper %}
      M118 Input Shaper: OK ({age} days, {remaining} days remaining)
    {% else %}
      M118 Input Shaper:  NEEDS CALIBRATION ({age} days old)
    {% endif %}
  {% else %}
    M118 Input Shaper:  NEVER CALIBRATED
  {% endif %}
  
  # Z-Offset
  {% if tracker.last_zoffset > 0 %}
    {% set age = ((now - tracker.last_zoffset) / 86400)|int %}
    {% set remaining = tracker.interval_zoffset - age %}
    {% if age < tracker.interval_zoffset %}
      M118 Z-Offset: OK ({age} days, {remaining} days remaining)
    {% else %}
      M118 Z-Offset:  NEEDS CALIBRATION ({age} days old)
    {% endif %}
  {% else %}
    M118 Z-Offset:  NEVER CALIBRATED
  {% endif %}
  
  M118 ========================================
  M118 MANUAL CALIBRATIONS (Print Required)
  M118 ========================================
  
  # Pressure Advance
  {% if tracker.last_pa > 0 %}
    {% set age = ((now - tracker.last_pa) / 86400)|int %}
    {% set remaining = tracker.interval_pa - age %}
    {% if age < tracker.interval_pa %}
      M118 Pressure Advance: OK ({age} days, {remaining} days remaining)
    {% else %}
      M118 Pressure Advance:  NEEDS CALIBRATION ({age} days old)
    {% endif %}
  {% else %}
    M118 Pressure Advance:  NEVER CALIBRATED
  {% endif %}
  
  # Flow Rate
  {% if tracker.last_flow > 0 %}
    {% set age = ((now - tracker.last_flow) / 86400)|int %}
    {% set remaining = tracker.interval_flow - age %}
    {% if age < tracker.interval_flow %}
      M118 Flow Rate: OK ({age} days, {remaining} days remaining)
    {% else %}
      M118 Flow Rate:  NEEDS CALIBRATION ({age} days old)
    {% endif %}
  {% else %}
    M118 Flow Rate:  NEVER CALIBRATED
  {% endif %}
  
  M118 ========================================
  M118 RECOMMENDATIONS
  M118 ========================================
  
  {% set needs_auto = 0 %}
  {% if tracker.last_pid_extruder == 0 or ((now - tracker.last_pid_extruder) / 86400)|int >= tracker.interval_pid %}
    {% set needs_auto = 1 %}
  {% endif %}
  {% if tracker.last_pid_bed == 0 or ((now - tracker.last_pid_bed) / 86400)|int >= tracker.interval_pid %}
    {% set needs_auto = 1 %}
  {% endif %}
  {% if tracker.last_zoffset == 0 or ((now - tracker.last_zoffset) / 86400)|int >= tracker.interval_zoffset %}
    {% set needs_auto = 1 %}
  {% endif %}
  
  {% if needs_auto == 1 %}
    M118  Run AUTO_CALIBRATE_ALL (automated, ~1h)
  {% else %}
    M118  All automated calibrations up to date
  {% endif %}
  
  {% set needs_manual = 0 %}
  {% if tracker.last_pa == 0 or ((now - tracker.last_pa) / 86400)|int >= tracker.interval_pa %}
    {% set needs_manual = 1 %}
  {% endif %}
  {% if tracker.last_flow == 0 or ((now - tracker.last_flow) / 86400)|int >= tracker.interval_flow %}
    {% set needs_manual = 1 %}
  {% endif %}
  
  {% if needs_manual == 1 %}
    M118  Manual calibrations needed (see above)
  {% endif %}
  
  M118 ========================================
  
  # Effet LED selon statut global
  {% if needs_auto == 1 or needs_manual == 1 %}
    # Calibrations nécessaires - LED warning (orange breathe)
    STOP_LED_EFFECTS
    G4 P200
    SET_LED_EFFECT EFFECT=led_effect_breathe_orange
    G4 P3000
    M118 ⚠️  Calibrations nécessaires - LED Orange
  {% else %}
    # Tout est OK - LED success (vert blink)
    LED_SUCCESS
    G4 P3000
    M118 ✅ Toutes calibrations OK - LED Verte
  {% endif %}
  
  # Retour à l'état idle
  STOP_LED_EFFECTS
  G4 P200
  _SET_LED_IDLE

# ============================================
# MACHINE INFO
# ============================================

[gcode_macro GET_MACHINE_PROFILE]
description: Display current machine profile information
# Source: macros/utilities/hardware_manager.cfg
gcode:
  {% set active = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "gcode_macro _PROFILE_" ~ active.upper() %}
  
  M118 ========================================
  M118 MACHINE PROFILE
  M118 ========================================
  M118 Active Profile: {active}
  
  {% if profile_macro in printer %}
    {% set config = printer[profile_macro].config %}
    M118 
    M118 DIMENSIONS:
    M118 - X: {config.position_max_x}mm
    M118 - Y: {config.position_max_y}mm
    M118 - Z: {config.position_max_z}mm
    M118 
    M118 SPEEDS:
    M118 - Max Velocity: {config.max_velocity}mm/s
    M118 - Max Accel: {config.max_accel}mm/s²
    M118 
    M118 PROBE:
    M118 - Type: {config.probe_type}
    M118 - Offset X: {config.probe_x_offset}mm
    M118 - Offset Y: {config.probe_y_offset}mm
  {% else %}
    M118 ERROR: Profile {active} not found
  {% endif %}
  
  M118 ========================================

# ============================================
# RETRACTION INFO
# ============================================

[gcode_macro Z_INFO_OFFSET]
description: Display current Z-offset information
# Source: macros/utilities/z_offset_debug.cfg
gcode:
  {% set offset = printer.gcode_move.homing_origin.z %}
  
  M118 ========================================
  M118 Z-OFFSET INFORMATION
  M118 ========================================
  M118 Current Z-Offset: {offset}mm
  M118 
  {% if offset > 0 %}
    M118 Status: Nozzle further from bed
  {% elif offset < 0 %}
    M118 Status: Nozzle closer to bed
  {% else %}
    M118 Status: No offset applied
  {% endif %}
  M118 ========================================

