# ============================================
# SYSTÈME DE PARKING UNIFIÉ (PHASE 4 ADAPTATIF)
# ============================================
# Macro centralisée pour gérer le parking de la tête d'impression
# Compatible PAUSE, CANCEL_PRINT, PRINT_END
# Utilise hauteurs adaptatives en pourcentage de Z_max (portable)
# Date: 2025-11-22

[gcode_macro _PARK_TOOLHEAD]
description: Parker la tête d'impression de manière adaptative
gcode:
  {% set MODE = params.MODE|default("pause")|string %}  # pause, cancel, end
  
  {% if printer.toolhead.homed_axes == 'xyz' %}
    # Récupérer positions de parking depuis profil hardware actif
    {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
    {% set profile_macro = "_PROFILE_" ~ active_profile.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
    {% set config = printer[profile_macro_full].config %}
    {% set park_x = params.X|default(config.park_x)|float(none) %}
    {% set park_y = params.Y|default(config.park_y)|float(none) %}
    {% if park_x is none or park_y is none or not printer.toolhead.axis_minimum.x <= park_x <= printer.toolhead.axis_maximum.x or not printer.toolhead.axis_minimum.y <= park_y <= printer.toolhead.axis_maximum.y %}
      {action_raise_error('Parking XY is outside native limits')}
    {% endif %}
    {% set current_z = printer.toolhead.position.z|float %}

    # Calcul Z adaptatif centralisé (source unique : _ADAPTIVE_Z)
    # pause -> hop min au-dessus de la cible ; cancel/end -> reste si déjà haut
    {% set settings = printer['gcode_macro _ADAPTIVE_HEIGHT_SETTINGS'] %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set hop = settings.min_zhop_mm|float %}
    {% set percent = settings.park_height_percent|float %}
    {% set ceiling = max_z - settings.safety_margin_mm|float %}
    {% if not 0.5 <= percent <= 1 or not 0 < hop <= max_z %}
      {action_raise_error('Invalid parking height settings')}
    {% endif %}
    {% set minimum_z = params.MIN_Z|default(0)|float(none) %}
    {% if minimum_z is none or not 0 <= minimum_z <= ceiling %}
      {action_raise_error('Invalid minimum parking height')}
    {% endif %}
    {% set target_z = [max_z * percent, current_z + hop, minimum_z]|max %}
    {% if not current_z <= target_z <= ceiling %}
      {action_raise_error('Insufficient Z clearance for parking; XY movement refused')}
    {% endif %}
    {% if params.DRY_RUN|default(0)|int == 1 %}
      {action_respond_info('Parking preview: Z=%s then X=%s Y=%s' % (target_z, park_x, park_y))}
    {% else %}
      _PARK_TOOLHEAD_MOVE Z={target_z} X={park_x} Y={park_y}
    {% endif %}
  {% else %}
    {action_raise_error('Parking requires homed axes; no automatic homing performed')}
  {% endif %}

[gcode_macro _PARK_TOOLHEAD_MOVE]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
      {action_raise_error('Parking requires homed axes')}
    {% endif %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set target_z = params.Z|float %}
    {% set park_x = params.X|float %}
    {% set park_y = params.Y|float %}
    {% set MODE = 'unified' %}
    {% set limits = printer.toolhead %}
    {% set settings = printer['gcode_macro _ADAPTIVE_HEIGHT_SETTINGS'] %}
    {% if not [limits.axis_maximum.z|float * 0.5, current_z + settings.min_zhop_mm|float]|max <= target_z <= limits.axis_maximum.z|float - settings.safety_margin_mm|float %}
      {action_raise_error('Parking move has insufficient vertical clearance')}
    {% endif %}
    {% if not limits.axis_minimum.x <= park_x <= limits.axis_maximum.x or not limits.axis_minimum.y <= park_y <= limits.axis_maximum.y %}
      {action_raise_error('Parking move XY is outside native limits')}
    {% endif %}
    
    SAVE_GCODE_STATE NAME=UNIFIED_PARK_STATE
    # Z-hop si nécessaire
    {% if current_z < target_z %}
      G91
      G1 Z{target_z - current_z} F1200
      G90
      M118 Z-lifted to {target_z|round(1)}mm ({MODE} mode, {current_z|round(1)}→{target_z|round(1)})
    {% else %}
      M118 Z already at {current_z|round(1)}mm (no lift needed)
    {% endif %}
    
    # Parking XY
    G91
    G1 X{park_x - printer.toolhead.position.x|float} Y{park_y - printer.toolhead.position.y|float} F6000
    RESTORE_GCODE_STATE NAME=UNIFIED_PARK_STATE MOVE=0
    M118 Parked at X{park_x} Y{park_y}
