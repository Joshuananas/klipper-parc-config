# ============================================
# ADAPTIVE MOTION CONTROL
# ============================================
# Adaptation automatique des paramètres de mouvement selon la hauteur Z
# Optimisé pour les impressions hautes et la stabilité

[gcode_macro _ADAPTIVE_MOTION_STATE]
description: Variables d'état pour l'adaptation des mouvements
variable_enabled: 0
variable_base_accel: 3000
variable_base_velocity: 300
variable_base_square_corner_velocity: 5.0
variable_last_z_range: 0
variable_stability_mode: "balanced"  # conservative, balanced, aggressive
variable_object_width: 0  # Largeur estimée de l'objet (mm)
variable_object_depth: 0  # Profondeur estimée de l'objet (mm)
variable_use_geometry: 0  # Activer la prise en compte de la géométrie
variable_calibrated: 0  # Système calibré (0=non, 1=oui)
gcode:
  # Variables seulement

[gcode_macro _SAVE_OBJECT_DIMENSIONS]
description: Sauvegarder les dimensions de l'objet détectées par KAMP (macro interne)
gcode:
  {% set WIDTH = params.WIDTH|default(0)|float %}
  {% set DEPTH = params.DEPTH|default(0)|float %}
  
  {% if WIDTH > 0 and DEPTH > 0 %}
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=object_width VALUE={WIDTH}
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=object_depth VALUE={DEPTH}
    
    # Si adaptive motion est activé, activer automatiquement use_geometry
    {% set state = printer["gcode_macro _ADAPTIVE_MOTION_STATE"] %}
    {% set enabled = state.enabled|int %}
    {% if enabled == 1 %}
      SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=use_geometry VALUE=1
      M118 📊 Dimensions détectées par KAMP: {WIDTH|round(1)}x{DEPTH|round(1)}mm
      M118 ➡️ Adaptation intelligente activée automatiquement
    {% endif %}
  {% endif %}

[gcode_macro MOTION_ENABLE_ADAPTIVE]
description: Activer l'adaptation automatique des mouvements selon la hauteur
gcode:
  {% set BASE_ACCEL = params.BASE_ACCEL|default(3000)|int %}
  {% set BASE_VELOCITY = params.BASE_VELOCITY|default(300)|int %}
  {% set BASE_SCV = params.BASE_SCV|default(5.0)|float %}
  {% set STABILITY_MODE = params.STABILITY_MODE|default("balanced")|string %}
  {% set OBJECT_WIDTH = params.OBJECT_WIDTH|default(0)|int %}
  {% set OBJECT_DEPTH = params.OBJECT_DEPTH|default(0)|int %}
  {% set FORCE = params.FORCE|default(0)|int %}
  
  # Vérifier si le système a été calibré
  {% set svv = printer.save_variables.variables %}
  {% set is_calibrated = svv.adaptive_motion_calibrated|default(0)|int %}
  
  {% if is_calibrated == 0 and FORCE == 0 %}
    M118 ========================================
    M118 ⚠️ ADAPTIVE MOTION NON CALIBRÉ
    M118 ========================================
    M118 Ce système doit être calibré avant utilisation.
    M118 
    M118 Pour calibrer:
    M118   1. Tapez: MOTION_CALIBRATE_WIZARD
    M118   2. Suivez les instructions
    M118 
    M118 Pour forcer l'activation (non recommandé):
    M118   MOTION_ENABLE_ADAPTIVE FORCE=1
    M118 ========================================
    { action_respond_info("⚠️ Adaptive Motion non calibré. Lancez MOTION_CALIBRATE_WIZARD.") }
    {% else %}
    {% if FORCE == 1 %}
      M118 ⚠️ Activation forcée sans calibration
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=base_accel VALUE={BASE_ACCEL}
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=base_velocity VALUE={BASE_VELOCITY}
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=base_square_corner_velocity VALUE={BASE_SCV}
  
    M118 ========================================
    M118  ADAPTIVE MOTION ACTIVÉ
    M118 ========================================
    M118 Accélération de base: {BASE_ACCEL} mm/s²
    M118 Vitesse de base: {BASE_VELOCITY} mm/s
    M118 Square Corner Velocity: {BASE_SCV} mm/s
    M118 
    M118 Réduction progressive selon hauteur:
    M118  0-50mm   : 100% ({BASE_ACCEL} mm/s²)
    M118  50-100mm : 85% ({(BASE_ACCEL * 0.85)|int} mm/s²)
    M118  100-150mm: 70% ({(BASE_ACCEL * 0.70)|int} mm/s²)
    M118  150-200mm: 55% ({(BASE_ACCEL * 0.55)|int} mm/s²)
    M118  >200mm   : 40% ({(BASE_ACCEL * 0.40)|int} mm/s²)
    M118 ========================================
  
    # Démarrer le monitoring
    UPDATE_DELAYED_GCODE ID=ADAPTIVE_MOTION_MONITOR DURATION=2
    {% endif %}

[gcode_macro MOTION_DISABLE_ADAPTIVE]
description: Désactiver l'adaptation automatique des mouvements
gcode:
  SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=enabled VALUE=0
  UPDATE_DELAYED_GCODE ID=ADAPTIVE_MOTION_MONITOR DURATION=0
  M118 Adaptive motion désactivé

[delayed_gcode ADAPTIVE_MOTION_MONITOR]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _ADAPTIVE_MOTION_STATE"] %}
  {% set enabled = state.enabled|int %}
  
  {% if enabled == 1 and printer.print_stats.state == "printing" %}
    _UPDATE_MOTION_BY_Z
    UPDATE_DELAYED_GCODE ID=ADAPTIVE_MOTION_MONITOR DURATION=2
  {% endif %}

[gcode_macro _UPDATE_MOTION_BY_Z]
description: Mettre à jour les paramètres de mouvement selon Z (macro interne)
gcode:
  {% set state = printer["gcode_macro _ADAPTIVE_MOTION_STATE"] %}
  {% set current_z = printer.toolhead.position.z|float %}
  {% set base_accel = state.base_accel|int %}
  {% set base_velocity = state.base_velocity|int %}
  {% set base_scv = state.base_square_corner_velocity|float %}
  {% set last_z_range = state.last_z_range|int %}
  
  # Déterminer le palier actuel (tous les 50mm)
  {% set z_range = (current_z / 50)|int %}
  
  # Ne mettre à jour que si on change de palier
  {% if z_range != last_z_range %}
    # Calculer le facteur de réduction
    {% if current_z < 50 %}
      {% set factor = 1.0 %}
    {% elif current_z < 100 %}
      {% set factor = 0.85 %}
    {% elif current_z < 150 %}
      {% set factor = 0.70 %}
    {% elif current_z < 200 %}
      {% set factor = 0.55 %}
    {% else %}
      {% set factor = 0.40 %}
    {% endif %}
    
    {% set new_accel = (base_accel * factor)|int %}
    {% set new_velocity = (base_velocity * factor)|int %}
    {% set new_scv = (base_scv * factor)|round(1) %}
    
    # Appliquer les nouvelles valeurs
    SET_VELOCITY_LIMIT ACCEL={new_accel} VELOCITY={new_velocity} SQUARE_CORNER_VELOCITY={new_scv}
    
    # Sauvegarder le palier actuel
    SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=last_z_range VALUE={z_range}
    
    M118  Z={current_z|int}mm: Accel={new_accel} Vel={new_velocity} SCV={new_scv}
  {% endif %}

# ============================================
# CALIBRATION TOOLS
# ============================================

[gcode_macro MOTION_CALIBRATE_WIZARD]
description: Assistant de calibration complet pour l'adaptive motion
gcode:
  M118 ========================================
  M118 🧪 ASSISTANT DE CALIBRATION
  M118 ========================================
  M118 
  M118 Bienvenue dans l'assistant de calibration
  M118 de l'Adaptive Motion System.
  M118 
  M118 🎯 OBJECTIF:
  M118   Déterminer les valeurs optimales pour
  M118   votre imprimante afin d'améliorer la
  M118   qualité des impressions hautes.
  M118 
  M118 ========================================
  M118 ÉTAPE 1: IMPRESSION DE RÉFÉRENCE
  M118 ========================================
  M118 
  M118 1. Téléchargez une tour de calibration:
  M118    https://www.thingiverse.com/thing:2563909
  M118    (ou tout objet de 150-200mm de haut)
  M118 
  M118 2. Slicez avec vos paramètres NORMAUX:
  M118    - Vitesse: Votre vitesse habituelle
  M118    - Accélération: Votre accel habituelle
  M118    - PAS d'Adaptive Motion activé
  M118 
  M118 3. Imprimez et OBSERVEZ:
  M118    - À quelle hauteur le ringing apparaît?
  M118    - À quelle hauteur le wobble commence?
  M118    - Y a-t-il des layer shifts?
  M118 
  M118 4. NOTEZ la hauteur des défauts:
  M118    Exemple: "Ringing à partir de 80mm"
  M118 
  M118 ========================================
  M118 ÉTAPE 2: TEST AVEC ADAPTIVE MOTION
  M118 ========================================
  M118 
  M118 1. Activez Adaptive Motion AVANT l'impression:
  M118    MOTION_ENABLE_ADAPTIVE BASE_ACCEL=XXXX FORCE=1
  M118    (Remplacez XXXX par votre accel actuelle)
  M118 
  M118 2. Imprimez le MÊME objet
  M118 
  M118 3. Comparez la qualité:
  M118    - Les défauts sont-ils réduits?
  M118    - À quelle hauteur maintenant?
  M118    - Le temps d'impression est-il acceptable?
  M118 
  M118 ========================================
  M118 ÉTAPE 3: AJUSTEMENT (si nécessaire)
  M118 ========================================
  M118 
  M118 Si les défauts apparaissent AVANT 100mm:
  M118   → Éditez adaptive_motion.cfg
  M118   → Réduisez les paliers (50→80mm, etc.)
  M118 
  M118 Si la réduction est TROP agressive:
  M118   → Utilisez STABILITY_MODE=aggressive
  M118   → Ou ajustez les facteurs dans le fichier
  M118 
  M118 ========================================
  M118 ÉTAPE 4: VALIDATION
  M118 ========================================
  M118 
  M118 Une fois satisfait des résultats:
  M118   VALIDATE_ADAPTIVE_MOTION_CALIBRATION
  M118 
  M118 Cela marquera le système comme calibré
  M118 et vous pourrez l'utiliser normalement.
  M118 
  M118 ========================================
  M118 BESOIN D'AIDE?
  M118 ========================================
  M118 
  M118 Commandes utiles:
  M118   MOTION_TEST HEIGHT=200
  M118     → Test rapide sans impression
  M118 
  M118   MOTION_GET_STATUS
  M118     → Afficher l'état actuel
  M118 
  M118 ========================================

[gcode_macro MOTION_VALIDATE_CALIBRATION]
description: Marquer le système comme calibré
gcode:
  M118 ========================================
  M118 ✅ CALIBRATION VALIDÉE
  M118 ========================================
  
  SAVE_VARIABLE VARIABLE=adaptive_motion_calibrated VALUE=1
  SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=calibrated VALUE=1
  
  M118 Le système Adaptive Motion est maintenant
  M118 calibré et prêt à l'emploi.
  M118 
  M118 Vous pouvez l'activer avec:
  M118   MOTION_ENABLE_ADAPTIVE BASE_ACCEL=XXXX
  M118 
  M118 ========================================
  { action_respond_info("✅ Adaptive Motion calibré et validé.") }

[gcode_macro MOTION_RESET_CALIBRATION]
description: Réinitialiser la calibration (pour recalibrer)
gcode:
  M118 ========================================
  M118 🔄 RÉINITIALISATION CALIBRATION
  M118 ========================================
  
  SAVE_VARIABLE VARIABLE=adaptive_motion_calibrated VALUE=0
  SET_GCODE_VARIABLE MACRO=_ADAPTIVE_MOTION_STATE VARIABLE=calibrated VALUE=0
  
  M118 La calibration a été réinitialisée.
  M118 Relancez CALIBRATE_ADAPTIVE_MOTION_WIZARD
  M118 pour recalibrer le système.
  M118 ========================================

[gcode_macro MOTION_GET_STATUS]
description: Afficher l'état du système Adaptive Motion
gcode:
  {% set state = printer["gcode_macro _ADAPTIVE_MOTION_STATE"] %}
  {% set svv = printer.save_variables.variables %}
  {% set is_calibrated = svv.adaptive_motion_calibrated|default(0)|int %}
  {% set enabled = state.enabled|int %}
  
  M118 ========================================
  M118 📊 ADAPTIVE MOTION STATUS
  M118 ========================================
  M118 Calibré: {% if is_calibrated == 1 %}✅ OUI{% else %}❌ NON{% endif %}
  M118 Activé: {% if enabled == 1 %}✅ OUI{% else %}❌ NON{% endif %}
  {% if enabled == 1 %}
    M118 
    M118 Paramètres actuels:
    M118   Accel base: {state.base_accel} mm/s²
    M118   Velocity base: {state.base_velocity} mm/s
    M118   Mode: {state.stability_mode}
    {% if state.use_geometry == 1 %}
      M118   Géométrie: {state.object_width|round(1)}x{state.object_depth|round(1)}mm
    {% else %}
      M118   Géométrie: Désactivée
    {% endif %}
  {% endif %}
  M118 ========================================

[gcode_macro MOTION_TEST]
description: Test rapide de l'adaptive motion
gcode:
  {% set HEIGHT = params.HEIGHT|default(200)|int %}
  
  M118 ========================================
  M118  TEST ADAPTIVE MOTION
  M118 ========================================
  M118 Simulation montée à {HEIGHT}mm
  M118 
  
  G28
  G90
  
  {% for z in range(0, HEIGHT + 1, 50) %}
    G1 Z{z} F3000
    G4 P1000
    _UPDATE_MOTION_BY_Z
    M118 Test Z={z}mm - Vérifiez les valeurs ci-dessus
  {% endfor %}
  
  M118 ========================================
  M118 Test terminé
  M118 ========================================
