# ============================================
# COLOR MANAGEMENT & PRINT QUALITY ANALYSIS
# ============================================
# Système d'analyse de qualité et gestion des couleurs

[gcode_macro ANALYZE_PRINT_QUALITY]
description: Analyser paramètres impression et suggérer améliorations
gcode:
  {% set layer_height = params.LAYER_HEIGHT|default(0.2)|float %}
  {% set nozzle_temp = params.NOZZLE_TEMP|default(210)|int %}
  {% set bed_temp = params.BED_TEMP|default(65)|int %}
  {% set material = params.MATERIAL|default("PLA")|string %}
  
  M118 
  M118 ========================================
  M118  PRINT QUALITY ANALYSIS
  M118 ========================================
  
  # Analyse Layer Height
  {% if layer_height > 0.3 %}
    M118   Layer Height: {layer_height}mm (HIGH)
    M118     Reduce to 0.2mm for better quality
  {% elif layer_height < 0.1 %}
    M118   Layer Height: {layer_height}mm (VERY FINE)
    M118     Increase to 0.15mm for faster prints
  {% elif layer_height >= 0.15 and layer_height <= 0.25 %}
    M118  Layer Height: {layer_height}mm (OPTIMAL)
  {% else %}
    M118 ℹ  Layer Height: {layer_height}mm
  {% endif %}
  
  # Analyse Températures selon matériau
  {% if material == "PLA" %}
    {% if nozzle_temp > 220 %}
      M118   Nozzle: {nozzle_temp}°C (TOO HOT for PLA)
      M118     Reduce to 200-210°C
    {% elif nozzle_temp < 190 %}
      M118   Nozzle: {nozzle_temp}°C (TOO COLD for PLA)
      M118     Increase to 200-210°C
    {% else %}
      M118  Nozzle: {nozzle_temp}°C (OPTIMAL for PLA)
    {% endif %}
    
    {% if bed_temp > 70 %}
      M118   Bed: {bed_temp}°C (TOO HOT for PLA)
      M118     Reduce to 60-65°C
    {% elif bed_temp < 55 %}
      M118   Bed: {bed_temp}°C (TOO COLD for PLA)
      M118     Increase to 60-65°C
    {% else %}
      M118  Bed: {bed_temp}°C (OPTIMAL for PLA)
    {% endif %}
    
  {% elif material == "PETG" %}
    {% if nozzle_temp > 250 %}
      M118   Nozzle: {nozzle_temp}°C (TOO HOT for PETG)
      M118     Reduce to 230-245°C
    {% elif nozzle_temp < 220 %}
      M118   Nozzle: {nozzle_temp}°C (TOO COLD for PETG)
      M118     Increase to 230-245°C
    {% else %}
      M118  Nozzle: {nozzle_temp}°C (OPTIMAL for PETG)
    {% endif %}
    
    {% if bed_temp > 90 %}
      M118   Bed: {bed_temp}°C (TOO HOT for PETG)
      M118     Reduce to 75-85°C
    {% elif bed_temp < 70 %}
      M118   Bed: {bed_temp}°C (TOO COLD for PETG)
      M118     Increase to 75-85°C
    {% else %}
      M118  Bed: {bed_temp}°C (OPTIMAL for PETG)
    {% endif %}
    
  {% elif material == "ABS" %}
    {% if nozzle_temp > 260 %}
      M118   Nozzle: {nozzle_temp}°C (TOO HOT for ABS)
      M118     Reduce to 240-255°C
    {% elif nozzle_temp < 230 %}
      M118   Nozzle: {nozzle_temp}°C (TOO COLD for ABS)
      M118     Increase to 240-255°C
    {% else %}
      M118  Nozzle: {nozzle_temp}°C (OPTIMAL for ABS)
    {% endif %}
    
    {% if bed_temp > 110 %}
      M118   Bed: {bed_temp}°C (TOO HOT for ABS)
      M118     Reduce to 95-105°C
    {% elif bed_temp < 90 %}
      M118   Bed: {bed_temp}°C (TOO COLD for ABS)
      M118     Increase to 95-105°C
    {% else %}
      M118  Bed: {bed_temp}°C (OPTIMAL for ABS)
    {% endif %}
  {% endif %}
  
  M118 ========================================
  M118 

[gcode_macro GET_PRINT_INFO]
description: Afficher informations détaillées sur l'impression en cours
gcode:
  {% set stats = printer.print_stats %}
  {% set filament_colors = stats.filament_colour|default("Unknown")|string %}
  {% set filament_types = stats.filament_type|default("Unknown")|string %}
  
  M118 ========================================
  M118  PRINT INFORMATION
  M118 ========================================
  M118 Filename: {stats.filename}
  M118 State: {stats.state}
  {% if stats.state == "printing" %}
  M118 Progress: {(stats.print_duration / stats.total_duration * 100)|int}%
  M118 Layer: {stats.info.current_layer|default(0)} / {stats.info.total_layer|default(0)}
  {% endif %}
  M118 
  M118 FILAMENT:
  M118 Colors: {filament_colors}
  M118 Types: {filament_types}
  M118 
  M118 TEMPERATURES:
  M118 Extruder: {printer.extruder.temperature|int}°C / {printer.extruder.target|int}°C
  M118 Bed: {printer.heater_bed.temperature|int}°C / {printer.heater_bed.target|int}°C
  M118 ========================================

[gcode_macro GET_COLOR_INFO]
description: Afficher informations sur les couleurs utilisées
gcode:
  {% set stats = printer.print_stats %}
  {% set filament_colors = stats.filament_colour|default("")|string %}
  
  M118 ========================================
  M118  COLOR INFORMATION
  M118 ========================================
  
  {% if filament_colors != "" %}
    {% set color_list = filament_colors.split(';') %}
    M118 Total colors: {color_list|length}
    M118 
    {% for color in color_list %}
      M118 Tool {loop.index0}: {color}
    {% endfor %}
  {% else %}
    M118 No color information available
    M118 Configure in OrcaSlicer:
    M118  - Filament Settings  Color
    M118  - Printer Settings  Tool Change G-code
  {% endif %}
  
  M118 ========================================