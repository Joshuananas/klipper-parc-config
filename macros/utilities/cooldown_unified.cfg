# ============================================
# SYSTÈME DE COOLDOWN UNIFIÉ (PHASE 2 OPTIMISATION)
# ============================================
# Système centralisé pour gérer le cooldown automatique
# Compatible PAUSE et M600 tout en préservant leurs contextes
# Date: 2025-11-16

[gcode_macro _COOLDOWN_STATE]
description: État du système de cooldown unifié
variable_active: 0
variable_countdown: 0
variable_source: ""  # "pause" ou "m600"
gcode:

[gcode_macro START_COOLDOWN]
description: Démarrer le cooldown automatique
gcode:
  {% set SOURCE = params.SOURCE|default("pause")|string %}
  {% set DURATION = params.DURATION|default(300)|int %}
  
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=countdown VALUE={DURATION}
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=source VALUE='"{SOURCE}"'
  UPDATE_DELAYED_GCODE ID=UNIFIED_COOLDOWN_TIMER DURATION=1
  M118 Cooldown started: {DURATION}s ({SOURCE})

[gcode_macro STOP_COOLDOWN]
description: Arrêter le cooldown automatique
gcode:
  SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=active VALUE=0
  UPDATE_DELAYED_GCODE ID=UNIFIED_COOLDOWN_TIMER DURATION=0
  M118 Cooldown stopped

[delayed_gcode UNIFIED_COOLDOWN_TIMER]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _COOLDOWN_STATE"] %}
  {% set countdown = state.countdown|int %}
  {% set active = state.active|int %}
  
  {% if active == 1 and printer.pause_resume.is_paused %}
    {% set countdown = countdown - 1 %}
    {% set mins = (countdown // 60)|int %}
    {% set secs = (countdown % 60)|int %}
    
    SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=countdown VALUE={countdown}
    
    # Afficher message toutes les 60 secondes ou en dessous de 60s
    {% if countdown % 60 == 0 or countdown < 60 %}
      {% if countdown > 0 %}
        M117 Cooldown: {mins}m {secs}s
      {% endif %}
    {% endif %}
    
    # Cooldown terminé
    {% if countdown <= 0 %}
      M104 S0
      SET_GCODE_VARIABLE MACRO=_COOLDOWN_STATE VARIABLE=active VALUE=0
      M118 Extruder cooled down after 5 min pause
    {% else %}
      # Continuer le timer
      UPDATE_DELAYED_GCODE ID=UNIFIED_COOLDOWN_TIMER DURATION=1
    {% endif %}
  {% endif %}
