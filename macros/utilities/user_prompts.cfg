# Framework d'interactions utilisateur (portage de interface/notifications.cfg
# du projet Sidewinder IA, avec le NOTIFY manquant fourni).
#
# NOTIFY TYPE= MSG= COPY=   : message console+barre d'etat, commande copiable
# CONFIRM MSG=              : avertit puis M0 (pause -> l'utilisateur valide)
# INPUT_NUMBER MSG= MIN MAX DEFAULT : l'utilisateur ecrit dans _USER_INPUT.value
# CHOICE TITLE= OPTIONS=    : l'utilisateur ecrit dans _USER_INPUT.choice
# PROGRESS VALUE= MAX= TITLE= : barre de progression M117/console

[gcode_macro NOTIFY]
description: Notification unifiee console + barre d'etat (+ commande copiable)
gcode:
    {% set TYPE = params.TYPE|default("info")|lower %}
    {% set MSG = params.MSG|default("")|string %}
    {% set COPY = params.COPY|default("")|string %}
    {% set icons = {"info": "ℹ️", "warning": "⚠️", "error": "❌", "success": "✅", "command": "⚙️"} %}
    {% set icon = icons.get(TYPE, "🖨️") %}
    RESPOND MSG="{icon} {MSG}"
    M117 {MSG}
    {% if COPY != "" %}
      RESPOND MSG="--- commande a copier ---"
      RESPOND MSG="{COPY}"
      RESPOND MSG="---------------------------"
    {% endif %}

[gcode_macro CONFIRM]
description: Demande confirmation utilisateur (pause M0)
gcode:
    {% set MSG = params.MSG|default("Confirmation requise")|string %}
    {% set TYPE = params.TYPE|default("warning")|lower %}
    NOTIFY TYPE={TYPE} MSG="{MSG} — cliquez RESUME pour continuer" COPY="RESUME"
    M0

[gcode_macro _USER_INPUT]
variable_value: 0
variable_choice: 0
gcode:

[gcode_macro INPUT_NUMBER]
description: Demande une valeur numerique (resultat dans _USER_INPUT.value)
gcode:
    {% set MSG = params.MSG|default("Entrez une valeur")|string %}
    {% set MIN = params.MIN|default(0)|float %}
    {% set MAX = params.MAX|default(100)|float %}
    {% set DEFAULT = params.DEFAULT|default(0)|float %}
    NOTIFY TYPE=info MSG="{MSG} (entre {MIN} et {MAX})"
    RESPOND MSG="Format: SET_GCODE_VARIABLE MACRO=_USER_INPUT VARIABLE=value VALUE={DEFAULT}"
    RESPOND MSG="--- commande a copier ---"
    RESPOND MSG="SET_GCODE_VARIABLE MACRO=_USER_INPUT VARIABLE=value VALUE={DEFAULT}"
    RESPOND MSG="---------------------------"
    M0

[gcode_macro CHOICE]
description: Propose un choix numerote (resultat dans _USER_INPUT.choice)
gcode:
    {% set TITLE = params.TITLE|default("Choix requis")|string %}
    {% set OPTIONS = params.OPTIONS|default("1:Oui,2:Non")|string %}
    NOTIFY TYPE=warning MSG="{TITLE}"
    {% for option in OPTIONS.split(",") %}
      {% set num = option.split(":")[0] %}
      RESPOND MSG="{option}"
      RESPOND MSG="SET_GCODE_VARIABLE MACRO=_USER_INPUT VARIABLE=choice VALUE={num}"
      RESPOND MSG="---"
    {% endfor %}
    RESPOND MSG="Puis tapez RESUME pour valider"
    M0

[gcode_macro PROGRESS]
description: Barre de progression console + barre d'etat
gcode:
    {% set VALUE = params.VALUE|float %}
    {% set MAX = params.MAX|default(100)|float %}
    {% set TITLE = params.TITLE|default("Progression")|string %}
    {% set percent = (VALUE / MAX * 100)|round(1) %}
    {% set bars = (percent / 5)|round(0)|int %}
    {% set progress = "█" * bars + "░" * (20 - bars) %}
    M117 {TITLE}: {progress} {percent}%
