# ============================================
# MACROS LED CENTRALISÉES (PHASE 1 OPTIMISATION)
# ============================================
# Macros unifiées pour gérer l'état LED et éliminer les redondances
# Date: 2025-11-16
# Note: STOP_LED_EFFECTS est fournie par le module led_effect de Klipper

[gcode_macro _SET_LED_PRINTING]
description: Activer LED mode impression (centralisé)
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=printing VALUE=1
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=current_state VALUE='"printing"'
  UPDATE_DELAYED_GCODE ID=led_warning_timeout DURATION=0
  UPDATE_DELAYED_GCODE ID=LED_IDLE_ROTATION DURATION=0
  SET_LED_TEMPLATE LED=extruder TEMPLATE=""
  STOP_LED_EFFECTS
  G4 P100
  SET_LED_EFFECT EFFECT=led_effect_ignition
  UPDATE_DELAYED_GCODE ID=led_printing_settle DURATION=1.5
  #M118 LED: Print mode activated (white)

[delayed_gcode led_printing_settle]
initial_duration: 0
gcode:
  {% if printer["gcode_macro _LED_STATE"].current_state == "printing" %}
    SET_LED_EFFECT EFFECT=led_effect_printing
  {% endif %}

[gcode_macro _SET_LED_IDLE]
description: Activer LED mode idle (centralisé)
gcode:
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=printing VALUE=0
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=current_state VALUE='"idle"'
  SET_GCODE_VARIABLE MACRO=_LED_STATE VARIABLE=idle_breathe_enabled VALUE=1
  UPDATE_DELAYED_GCODE ID=led_warning_timeout DURATION=0
  SET_LED_TEMPLATE LED=extruder TEMPLATE=""
  STOP_LED_EFFECTS
  SET_LED LED=extruder RED=0.02 GREEN=0.06 BLUE=0.18
  G4 P50
  SET_LED_EFFECT EFFECT=led_effect_idle_breathe
  {% if printer["gcode_macro _LED_STATE"].rotation_enabled|int == 1 %}
    UPDATE_DELAYED_GCODE ID=LED_IDLE_ROTATION DURATION={printer["gcode_macro _LED_STATE"].rotation_interval|int}
  {% endif %}
  # M118 LED: Idle mode activated (blue breathe)  # Message désactivé
