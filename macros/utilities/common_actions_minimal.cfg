# ============================================
# COMMON ACTIONS - VERSION MINIMALE
# ============================================
# Macros communes nécessaires pour power_loss_recovery
# Date: 2025-11-27

[gcode_macro _COMMON_HOME_XY]
description: Homing XY centralisé avec vérification
variable_z_hop_applied: 0  # 1 si z_hop a été appliqué pendant le homing
gcode:
  {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
    M118 Homing X and Y...
    LED_HOMING
    
    # Sauvegarder Z actuel si connu
    {% if 'z' in printer.toolhead.homed_axes %}
      {% set current_z = printer.toolhead.position.z|float %}
      M118 Z before XY homing: {current_z}mm
    {% endif %}
    
    G28 X Y
    STOP_LED_EFFECTS
    M118 XY homed successfully
    
    # Marquer que z_hop a été appliqué (safe_z_home monte Z automatiquement)
    SET_GCODE_VARIABLE MACRO=_COMMON_HOME_XY VARIABLE=z_hop_applied VALUE=1
    
    {% if 'z' in printer.toolhead.homed_axes %}
      {% set new_z = printer.toolhead.position.z|float %}
      {% set z_hop = new_z - current_z %}
      M118 Z after XY homing: {new_z}mm (z_hop applied: {z_hop}mm)
    {% endif %}
  {% else %}
    M118 XY already homed
    SET_GCODE_VARIABLE MACRO=_COMMON_HOME_XY VARIABLE=z_hop_applied VALUE=0
  {% endif %}

[gcode_macro _COMMON_HOME_Z_PLUS]
description: Home Z avec position spécifique (sécurisé pour power loss)
gcode:
  {% set SAVED_Z = params.SAVED_Z|default(50)|float %}
  {% set SKIP_HOMING = params.SKIP_HOMING|default(0)|int %}
  
  {% if 'z' not in printer.toolhead.homed_axes %}
    # Si SKIP_HOMING=1, NE PAS faire de homing Z (power loss recovery)
    {% if SKIP_HOMING == 1 %}
      M118 ⚠️ Power loss recovery: SKIPPING Z homing to prevent collision
      
      # Récupérer le z_hop appliqué par G28 X Y (safe_z_home)
      {% set z_hop = printer.configfile.settings.safe_z_home.z_hop|default(10)|float %}
      {% set actual_z = SAVED_Z + z_hop %}
      
      M118 ⚠️ Saved Z: {SAVED_Z}mm
      M118 ⚠️ Z_hop from XY homing: {z_hop}mm
      M118 ⚠️ Actual physical Z: {actual_z}mm
      
      # Forcer Klipper à croire que Z est à la position RÉELLE (après z_hop)
      SET_KINEMATIC_POSITION Z={actual_z}
      M118 Z position set to {actual_z}mm (actual physical position after z_hop)
      
      # Monter légèrement pour clearance (depuis position réelle)
      G90
      G1 Z{actual_z + 10} F1200
      M118 Z raised to {actual_z + 10}mm for safety clearance
      
      # Marquer Z comme "homed" manuellement
      # Note: Z n'est pas vraiment homé au sens strict, mais on connaît sa position
      M118 ⚠️ Z marked as homed (position forced from saved state)
      M118 ⚠️ WARNING: Z is NOT homed to endstop, using saved position!
      
      # NE PAS redescendre à SAVED_Z - rester en clearance pour la purge
      M118 ✅ Z kept at clearance height for purge operation
      
    {% else %}
      # Homing Z normal (pas de power loss)
      M118 Homing Z...
      LED_HOMING
      G28 Z
      STOP_LED_EFFECTS
      M118 Z homed successfully
      
      # Move to saved Z position (seulement si homing normal)
      G90
      G1 Z{SAVED_Z} F1200
      M118 Moved to Z={SAVED_Z}mm
    {% endif %}
  {% else %}
    M118 Z already homed
    # Move to saved Z position si déjà homé
    G90
    G1 Z{SAVED_Z} F1200
    M118 Moved to Z={SAVED_Z}mm
  {% endif %}

[gcode_macro _COMMON_HEAT_PARALLEL]
description: Chauffage parallèle bed + extruder
gcode:
  {% set BED = params.BED|default(0)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(0)|float %}
  {% set STABILIZE = params.STABILIZE|default(0)|int %}
  
  M118 Heating bed to {BED}C and extruder to {EXTRUDER}C...
  
  # Start heating both
  {% if BED > 0 %}
    M140 S{BED}
  {% endif %}
  {% if EXTRUDER > 0 %}
    M104 S{EXTRUDER}
  {% endif %}
  
  # Wait for bed first
  {% if BED > 0 %}
    M190 S{BED}
    M118 Bed at temperature
  {% endif %}
  
  # Wait for extruder
  {% if EXTRUDER > 0 %}
    M109 S{EXTRUDER}
    M118 Extruder at temperature
  {% endif %}
  
  # Stabilization time
  {% if STABILIZE > 0 %}
    M118 Stabilizing for {STABILIZE}s...
    G4 P{STABILIZE * 1000}
  {% endif %}
  
  M118 Heating complete

[gcode_macro _COMMON_VALIDATE_RESUME]
description: Validation avant reprise après power loss
gcode:
  M118 ========================================
  M118 POWER LOSS RECOVERY - VALIDATION
  M118 ========================================
  M118 
  M118 ⚠️  ATTENTION: Vérifiez avant de continuer:
  M118 1. La buse est propre
  M118 2. Le plateau est dégagé
  M118 3. Le filament est chargé
  M118 4. Les températures sont correctes
  M118 
  M118 Tapez VALIDATE_RESUME_OK pour continuer
  M118 ========================================
