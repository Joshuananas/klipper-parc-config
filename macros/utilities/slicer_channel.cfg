# Canal slicer -> Klipper (OrcaSlicer & autres)
# Porte le concept de _SLICER_DATA du projet Sidewinder IA : le slicer
# declare dans son start G-code la matiere et la surface de la plaque,
# le checkpoint power-loss les capture, et la reprise adapte son
# comportement (ex : le PEI lache a froid -> avertissement adhesion).
#
# Usage slicer (start G-code OrcaSlicer, a ajouter par profil) :
#   SET_SURFACE TYPE=pei_textured
#   SET_MATERIAL NAME=PLA
#
# Surfaces connues (extensible, simple prefixe) :
#   pei_*     -> lache a froid : la reprise avertit si le lit a refroidi
#   ziflex_*  -> adherence conservée a froid
#   glass, peinture, buildtak, ...

[gcode_macro _SLICER_DATA]
description: Donnees declarees par le slicer (contrat, lecture macros)
variable_surface_type: "unknown"   # pei_textured | pei_smooth | ziflex_hightemp | ...
variable_material: "unknown"       # PLA | PETG | ABS | ASA | TPU | ...
variable_surface_cold_release: 0   # 1 si la surface lache l'objet a froid (PEI)
gcode:

[gcode_macro SET_SURFACE]
description: Declare le type de plaque utilisee (appele par le slicer ou a la main)
gcode:
    {% set t = params.TYPE|default("unknown")|string|lower %}
    SET_GCODE_VARIABLE MACRO=_SLICER_DATA VARIABLE=surface_type VALUE='"{t}"'
    {% set cold = 1 if t.startswith("pei") else 0 %}
    SET_GCODE_VARIABLE MACRO=_SLICER_DATA VARIABLE=surface_cold_release VALUE={cold}
    SAVE_VARIABLE VARIABLE=slicer_surface_type VALUE='"{t}"'
    M118 Surface declaree: {t} (cold_release={cold})

[gcode_macro SET_MATERIAL]
description: Declare le materiau utilise (appele par le slicer ou a la main)
gcode:
    {% set m = params.NAME|default("unknown")|string|upper %}
    SET_GCODE_VARIABLE MACRO=_SLICER_DATA VARIABLE=material VALUE='"{m}"'
    SAVE_VARIABLE VARIABLE=slicer_material VALUE='"{m}"'
    M118 Materiau declare: {m}
