# ============================================
# PARKING POSITIONS - ADAPTATIF
# ============================================
# Position unifiée pour parking (pause, M600, cancel)
# Utilise les profils machine pour adaptation automatique

[gcode_macro _PARK_SETTINGS]
description: Position de parking (auto-adaptée au profil machine actif)
# Ces variables sont des fallbacks, les vraies valeurs viennent de _MACHINE_PROFILES
variable_park_x: 0
variable_park_y: 0  # Sera calculé depuis profil machine
variable_park_z: 0  # Sera calculé depuis profil machine
gcode:
  # Cette macro ne fait rien, les valeurs sont lues directement depuis _GET_PARK_POSITION


[gcode_macro GET_PARK_POSITION]
description: Display calculated park position (from active hardware profile)
gcode:
  {% set active = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "gcode_macro _PROFILE_" ~ active.upper() %}
  {% if profile_macro in printer %}
    {% set config = printer[profile_macro].config %}
    {% set park_x = config.position_max_x - 10 %}
    {% set park_y = config.position_max_y - 10 %}
    {% set park_z = [config.position_max_z * 0.8, 200]|min %}
    M118 PARK POSITION: X:{park_x} Y:{park_y} Z:{park_z}
  {% else %}
    M118 ERROR: Cannot calculate park position
  {% endif %}
