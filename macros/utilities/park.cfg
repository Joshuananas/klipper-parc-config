# ============================================
# PARKING POSITIONS - DIAGNOSTIC
# ============================================
# La position de parking réelle est définie par config.park_x/park_y du profil
# hardware actif et la hauteur adaptative (_ADAPTIVE_Z / _PARK_TOOLHEAD).

[gcode_macro GET_PARK_POSITION]
description: Affiche la position de parking unifiée (profil hardware actif + hauteur adaptative)
gcode:
  {% set active = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "gcode_macro _PROFILE_" ~ active.upper() %}
  {% if profile_macro in printer %}
    {% set config = printer[profile_macro].config %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set park_percent = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].park_height_percent|float %}
    M118 PARK XY: X{config.park_x|float} Y{config.park_y|float} (profil {active})
    M118 PARK Z cible: {(max_z * park_percent)|round(1)}mm ({(park_percent * 100)|int}% de Z_max {max_z|round(1)})
  {% else %}
    M118 ERROR: Cannot calculate park position
  {% endif %}
