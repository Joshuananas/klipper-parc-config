# ============================================
# MOVEMENT UTILITIES
# ============================================
# MOVE_TO_NEUTRAL_POSITION et CENTER supprimées (jamais utilisées)
# Utiliser SAFE_POSITION à la place

# ============================================
# SAFE POSITION HELPER - Position sécurisée adaptative
# ============================================

[gcode_macro SAFE_POSITION]
description: Position de maintenance centrale, minimum mi-hauteur et dégagement vertical
gcode:
  {% set X_CENTER = params.X|default(-1)|float %}
  {% set Y_CENTER = params.Y|default(-1)|float %}
  {% set Z_SAFE = params.Z|default(-1)|float %}
  
  # Calculer centre si pas spécifié
  {% if X_CENTER == -1 %}
    {% set X_CENTER = printer.configfile.settings.stepper_x.position_max / 2 %}
  {% endif %}
  {% if Y_CENTER == -1 %}
    {% set Y_CENTER = printer.configfile.settings.stepper_y.position_max / 2 %}
  {% endif %}
  
  # Calculer Z sécurisé si pas spécifié
  {% if Z_SAFE == -1 %}
    {% set z_max = printer.configfile.settings.stepper_z.position_max|float %}
    # Z100 ou 25% de Z_max (le plus petit)
    {% set Z_SAFE = [100, z_max * 0.25]|min %}
  {% endif %}
  
  _PARK_TOOLHEAD MODE=maintenance X={X_CENTER} Y={Y_CENTER} MIN_Z={Z_SAFE}

# ============================================
# HOMING - Utiliser G28 standard
# ============================================
# HOMING_SMOOTH, HOMING_FAST, SMART_HOME, HOME supprimés (peu utilisés)
# Utiliser G28 directement pour le homing

# ============================================
# MESH_CALIBRATE_SMOOTH - SUPPRIMÉE (2025-11-16)
# ============================================
# Cette macro était inutile car elle n'appliquait aucune optimisation.
# Elle appelait simplement BED_MESH_CALIBRATE sans modifier les paramètres.
# 
# Pour optimiser le mesh, modifier directement les paramètres dans [bltouch]:
# - speed: Vitesse de descente du palpeur
# - lift_speed: Vitesse de remontée
# 
# Utiliser directement: BED_MESH_CALIBRATE

# ============================================
# KAMP PURGE DEBUG - Diagnostic position purge
# ============================================

[gcode_macro PURGE_DEBUG_POSITION]
description: Affiche où KAMP va placer la purge selon les objets détectés
gcode:
  {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
  {% set purge_margin = printer["gcode_macro _KAMP_Settings"].purge_margin | default(20) | float %}
  
  {% if all_points|length > 0 %}
    {% set purge_x_min = (all_points | map(attribute=0) | min) %}
    {% set purge_x_max = (all_points | map(attribute=0) | max) %}
    {% set purge_y_min = (all_points | map(attribute=1) | min) %}
    {% set purge_y_max = (all_points | map(attribute=1) | max) %}
    
    {% set purge_x_origin = ([purge_x_min - purge_margin, 0] | max) %}
    {% set purge_y_origin = ([purge_y_min - purge_margin, 0] | max) %}
    
    {% set purge_x_center = (purge_x_max + purge_x_min) / 2 %}
    {% set purge_y_center = (purge_y_max + purge_y_min) / 2 %}
    
    M118 ========================================
    M118 KAMP PURGE POSITION ANALYSIS
    M118 ========================================
    M118 Object bounds:
    M118 - X: {purge_x_min} to {purge_x_max} (width: {purge_x_max - purge_x_min}mm)
    M118 - Y: {purge_y_min} to {purge_y_max} (depth: {purge_y_max - purge_y_min}mm)
    M118 
    M118 Purge margin: {purge_margin}mm
    M118 
    {% if purge_y_origin > 0 %}
      M118 Purge mode: FRONT (along X axis)
      M118 Purge position: X={purge_x_center}, Y={purge_y_origin}
      M118 ✅ Purge will be in FRONT of object
    {% else %}
      M118 Purge mode: LEFT (along Y axis)
      M118 Purge position: X={purge_x_origin}, Y={purge_y_center}
      {% if purge_x_origin == 0 %}
        M118 ⚠️ WARNING: Purge at X=0 (object too wide!)
        M118 💡 Solution: Increase purge_margin to 20-30mm
      {% else %}
        M118 ✅ Purge will be to the LEFT of object
      {% endif %}
    {% endif %}
    M118 ========================================
  {% else %}
    M118 ❌ No objects detected in G-code!
    M118 Make sure EXCLUDE_OBJECT is enabled in slicer
  {% endif %}

# ============================================
# PROBE PROBLEM POINT - Diagnostic point difficile
# ============================================

[gcode_macro PROBE_TEST_POINT]
description: Teste un point spécifique avec diagnostic détaillé
gcode:
  {% set x = params.X|default(2.755)|float %}
  {% set y = params.Y|default(37.800)|float %}
  
  M118 ========================================
  M118 DIAGNOSTIC POINT PROBLÉMATIQUE
  M118 ========================================
  M118 Position: X={x}, Y={y}
  M118 
  
  G28
  G0 X{x} Y{y} F6000
  
  M118 Lancement de 10 mesures de test...
  PROBE_ACCURACY
  
  M118 
  M118 Analyse des résultats:
  M118 - Si range < 0.040mm: ✅ OK avec tolérance actuelle
  M118 - Si range > 0.040mm: ⚠️ Problème physique du lit
  M118 - Si standard deviation > 0.015mm: ⚠️ Instabilité mécanique
  M118 
  M118 Solutions possibles:
  M118 1. Nettoyer le lit à cette position
  M118 2. Vérifier le BLTouch (pin propre?)
  M118 3. Augmenter samples_tolerance si nécessaire
  M118 3. Si retry, la descente doit être PLUS LENTE
  M118 ========================================

# ============================================
# PROBE BENCHMARK - Optimisation tolérance/vitesse
# ============================================

[gcode_macro PROBE_BENCHMARK]
description: Benchmark pour déterminer le meilleur compromis tolérance/vitesse (adaptatif)
gcode:
  {% set test_points = params.POINTS|default(5)|int %}  # Nombre de points à tester
  
  # Détecter dimensions plateau automatiquement
  {% set bed_mesh = printer.configfile.settings.bed_mesh %}
  {% set mesh_x_min = bed_mesh.mesh_min.split(',')[0]|float %}
  {% set mesh_y_min = bed_mesh.mesh_min.split(',')[1]|float %}
  {% set mesh_x_max = bed_mesh.mesh_max.split(',')[0]|float %}
  {% set mesh_y_max = bed_mesh.mesh_max.split(',')[1]|float %}
  
  # Calculer points adaptatifs
  {% set x_25 = mesh_x_min + (mesh_x_max - mesh_x_min) * 0.25 %}
  {% set x_50 = mesh_x_min + (mesh_x_max - mesh_x_min) * 0.50 %}
  {% set x_75 = mesh_x_min + (mesh_x_max - mesh_x_min) * 0.75 %}
  {% set y_25 = mesh_y_min + (mesh_y_max - mesh_y_min) * 0.25 %}
  {% set y_50 = mesh_y_min + (mesh_y_max - mesh_y_min) * 0.50 %}
  {% set y_75 = mesh_y_min + (mesh_y_max - mesh_y_min) * 0.75 %}
  
  {% set points = [
    [x_50, y_50],
    [x_25, y_25],
    [x_75, y_25],
    [x_25, y_75],
    [x_75, y_75]
  ] %}
  
  M118 ========================================
  M118 PROBE BENCHMARK - OPTIMISATION
  M118 ========================================
  M118 
  M118 Ce benchmark va tester {test_points} points du lit
  M118 avec différentes combinaisons de paramètres.
  M118 
  M118 Zone mesh: X{mesh_x_min|int}-{mesh_x_max|int} Y{mesh_y_min|int}-{mesh_y_max|int}
  M118 Points testés (adaptatifs):
  M118 - Point 1: Centre (X={x_50|int}, Y={y_50|int})
  M118 - Point 2: Avant-gauche (X={x_25|int}, Y={y_25|int})
  M118 - Point 3: Avant-droit (X={x_75|int}, Y={y_25|int})
  M118 - Point 4: Arrière-gauche (X={x_25|int}, Y={y_75|int})
  M118 - Point 5: Arrière-droit (X={x_75|int}, Y={y_75|int})
  M118 
  M118 Durée estimée: ~5-10 minutes
  M118 ========================================
  M118 
  
  G28
  
  # Points déjà calculés ci-dessus (adaptatifs)
  
  M118 
  M118 ╔════════════════════════════════════════╗
  M118 ║  PHASE 1: ANALYSE DE VARIABILITÉ       ║
  M118 ╚════════════════════════════════════════╝
  M118 
  
  # Tester chaque point avec 10 mesures
  {% for point in points[:test_points] %}
    {% set x = point[0] %}
    {% set y = point[1] %}
    
    M118 
    M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    M118 📍 Point {loop.index}/{test_points}: X={x}, Y={y}
    M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    
    G0 X{x} Y{y} F6000
    PROBE_ACCURACY SAMPLES=10
    
    M118 
    M118 ⏸️  Pause 2s avant point suivant...
    G4 P2000
  {% endfor %}
  
  M118 
  M118 ╔════════════════════════════════════════╗
  M118 ║  RÉSULTATS ET RECOMMANDATIONS          ║
  M118 ╚════════════════════════════════════════╝
  M118 
  M118 Analyse des résultats ci-dessus:
  M118 
  M118 Pour chaque point, note le "range" (écart max-min):
  M118 
  M118 📊 INTERPRÉTATION:
  M118 ┌────────────────────────────────────────┐
  M118 │ Range moyen │ Tolérance recommandée  │
  M118 ├────────────────────────────────────────┤
  M118 │ < 0.010mm   │ 0.020mm (ultra-précis) │
  M118 │ 0.010-0.020 │ 0.030mm (précis)       │
  M118 │ 0.020-0.035 │ 0.040mm (bon)          │
  M118 │ 0.035-0.050 │ 0.050mm (standard)     │
  M118 │ 0.050-0.070 │ 0.070mm (tolérant)     │
  M118 │ > 0.070mm   │ Problème mécanique!    │
  M118 └────────────────────────────────────────┘
  M118 
  M118 🎯 RECOMMANDATIONS VITESSE:
  M118 ┌────────────────────────────────────────┐
  M118 │ Range moyen │ Vitesse recommandée    │
  M118 ├────────────────────────────────────────┤
  M118 │ < 0.020mm   │ 15 mm/s (rapide)       │
  M118 │ 0.020-0.040 │ 10 mm/s (standard)     │
  M118 │ 0.040-0.070 │ 5-7 mm/s (lent)        │
  M118 │ > 0.070mm   │ Nettoyer lit/BLTouch!  │
  M118 └────────────────────────────────────────┘
  M118 
  M118 💡 CALCUL DU TEMPS DE MESH:
  M118 
  M118 Formule: Temps ≈ (points × samples × 2) / speed
  M118 
  M118 Exemple pour mesh 25 points, 3 samples:
  M118 - Speed 15 mm/s: ~30-35s
  M118 - Speed 10 mm/s: ~45-50s
  M118 - Speed 5 mm/s:  ~90-100s
  M118 
  M118 ⚙️  CONFIGURATION SUGGÉRÉE:
  M118 
  M118 Si range moyen < 0.040mm:
  M118   speed: 10
  M118   samples_tolerance: 0.040
  M118   → Mesh rapide (~50s) et fiable
  M118 
  M118 Si range moyen 0.040-0.060mm:
  M118   speed: 10
  M118   samples_tolerance: 0.050
  M118   → Compromis robuste (~50s)
  M118 
  M118 Si range moyen > 0.060mm:
  M118   1. Nettoyer le lit et BLTouch
  M118   2. Relancer ce benchmark
  M118   3. Si toujours élevé:
  M118      speed: 7
  M118      samples_tolerance: 0.070
  M118 
  M118 ========================================
  M118 ✅ Benchmark terminé!
  M118 ========================================

# ============================================
# THERMAL Z COMPENSATION - Compensation thermique
# ============================================

[gcode_macro THERMAL_Z_COMPENSATION]
description: Stocke le coefficient d'expansion thermique calibré
variable_bed_expansion_coeff: 0.0  # mm par degré C (0.0 = désactivé, sera mis à jour après benchmark)
variable_ambient_expansion_coeff: 0.0
gcode:
  # Macro de stockage uniquement, ne rien faire
  {action_respond_info("THERMAL_Z_COMPENSATION: coefficient = %.6f mm/°C" % bed_expansion_coeff)}

[gcode_macro THERMAL_COMPENSATE_Z]
description: Calcule et applique la compensation thermique du Z selon température plateau
gcode:
  AMBIENT_REFRESH
  _THERMAL_COMPENSATE_Z_AMBIENT {rawparams}

[gcode_macro _THERMAL_COMPENSATE_Z_AMBIENT]
gcode:
  {% set bed_temp = printer.heater_bed.target|float %}
  {% set bed_current = printer.heater_bed.temperature|float %}
  
  # Vérifier si un capteur de chambre existe
  {% set ambient = printer['gcode_macro _AMBIENT'] %}
  {% set ambient_confidence = params.AMBIENT_CONFIDENCE|default(ambient.confidence)|int %}
  {% set ambient_temp = params.AMBIENT_TEMP|default(ambient.temperature)|float %}
  {% if ambient_confidence < 2 %}
    {% set ambient_temp = 0.0 %}  # Valeur par défaut si pas de capteur
  {% endif %}
  
  # Température de référence (plateau froid - correspond à la baseline du benchmark)
  {% set ref_temp = 30.0 %}
  
  # Coefficients de compensation
  {% set bed_expansion_coeff = printer["gcode_macro THERMAL_Z_COMPENSATION"].bed_expansion_coeff|float %}
  {% set ambient_coeff = printer['gcode_macro THERMAL_Z_COMPENSATION'].ambient_expansion_coeff|float if ambient_confidence >= 2 else 0.0 %}         # mm par degré C (température ambiante)
  
  # Calcul compensation plateau (expansion thermique)
  {% set bed_offset = (bed_current - ref_temp) * bed_expansion_coeff %}
  
  # Calcul compensation ambiante (BLTouch + structure)
  {% set ambient_offset = (ambient_temp - 22) * ambient_coeff %}
  
  # Compensation totale
  {% set total_offset = bed_offset + ambient_offset %}
  
  M118 ========================================
  M118 COMPENSATION THERMIQUE Z
  M118 ========================================
  
  {% if bed_expansion_coeff == 0.0 %}
    M118 ⚠️  Coefficient = 0.0 (compensation désactivée)
    M118 💡 Lancez THERMAL_DEFORMATION_BENCHMARK pour calibrer
  {% else %}
    M118 Températures:
    M118 - Plateau: {bed_current|round(1)}°C (cible: {bed_temp|round(1)}°C)
    {% if ambient_confidence >= 2 %}
      M118 - Ambiante: {ambient_temp|round(1)}C
    {% else %}
      M118 - Ambiante: reference fiable indisponible, contribution Z ambiante desactivee
    {% endif %}
    M118 - Référence: {ref_temp}°C
    M118 
    M118 Compensations:
    M118 - Expansion plateau: {bed_offset|round(4)}mm
    M118 - Température ambiante: {ambient_offset|round(4)}mm
    M118 - TOTAL: {total_offset|round(4)}mm
  {% endif %}
  M118 
  
  {% if bed_expansion_coeff != 0.0 %}
    {% if total_offset|abs > 0.001 %}
      SET_GCODE_OFFSET Z_ADJUST={total_offset} MOVE=1
      M118 ⚙️  Compensation appliquée: {total_offset|round(4)}mm
      {% if total_offset > 0 %}
        M118 → Plateau plus haut (buse plus loin)
      {% else %}
        M118 → Plateau plus bas (buse plus proche)
      {% endif %}
    {% else %}
      M118 ℹ️  Aucune compensation nécessaire
    {% endif %}
  {% endif %}
  M118 ========================================

[gcode_macro Z_SAVE_ADJUSTMENT]
description: Sauvegarde les ajustements Z-offset avec validation
variable_saved_adjustment: 0.0
gcode:
  {% set current_offset = printer.gcode_move.homing_origin.z|float %}
  {% set bltouch_offset = printer.configfile.settings.bltouch.z_offset|float %}
  
  {% if current_offset|abs > 0.001 %}
    # Calculer z_offset effectif résultant
    {% set effective_offset = bltouch_offset + current_offset %}
    
    # Validation : z_offset effectif doit rester positif
    {% if effective_offset > 0.1 %}
      SET_GCODE_VARIABLE MACRO=Z_SAVE_ADJUSTMENT VARIABLE=saved_adjustment VALUE={current_offset}
      M118 💾 Z-offset adjustment saved: {current_offset|round(4)}mm
      M118 📊 Current z_offset: {bltouch_offset|round(4)}mm
      M118 📊 Effective z_offset: {effective_offset|round(4)}mm (valid)
      M118 💡 To make permanent: Run PROBE_CALIBRATE and adjust by {current_offset|round(4)}mm
    {% elif effective_offset > 0 %}
      SET_GCODE_VARIABLE MACRO=Z_SAVE_ADJUSTMENT VARIABLE=saved_adjustment VALUE={current_offset}
      M118 ⚠️ Z-offset adjustment saved: {current_offset|round(4)}mm
      M118 📊 Current z_offset: {bltouch_offset|round(4)}mm
      M118 📊 Effective z_offset: {effective_offset|round(4)}mm (VERY LOW!)
      M118 🚨 CRITICAL: Run PROBE_CALIBRATE immediately to update permanent z_offset!
      M118 💡 In PROBE_CALIBRATE, adjust by {current_offset|round(4)}mm then ACCEPT
    {% else %}
      M118 ❌ ERROR: Adjustment {current_offset|round(4)}mm would create NEGATIVE z_offset!
      M118 📊 Current z_offset in printer.cfg: {bltouch_offset|round(4)}mm
      M118 📊 Effective would be: {effective_offset|round(4)}mm (INVALID - Klipper will reject)
      M118 🚨 Adjustment NOT saved!
      M118 💡 Solution: Run PROBE_CALIBRATE to recalibrate z_offset properly
      M118 💡 Your nozzle is too close to the bed, increase z_offset in PROBE_CALIBRATE
    {% endif %}
  {% else %}
    M118 ℹ️  No Z-offset adjustment to save
  {% endif %}

[gcode_macro Z_APPLY_ADJUSTMENT]
description: Applique l'ajustement Z-offset sauvegardé des impressions précédentes
gcode:
  {% set saved = printer["gcode_macro Z_SAVE_ADJUSTMENT"].saved_adjustment|float %}
  
  {% if saved|abs > 0.001 %}
    # MOVE=0 car les axes ne sont pas encore homés au début de PRINT_START
    SET_GCODE_OFFSET Z_ADJUST={saved} MOVE=0
    M118 🔄 Applied saved Z-adjustment: {saved|round(4)}mm (offset only)
  {% else %}
    M118 ℹ️  No saved Z-adjustment to apply
  {% endif %}

[gcode_macro Z_RESET_ADJUSTMENT]
description: Réinitialise l'ajustement Z-offset sauvegardé
gcode:
  SET_GCODE_VARIABLE MACRO=Z_SAVE_ADJUSTMENT VARIABLE=saved_adjustment VALUE=0.0
  M118 🗑️  Saved Z-adjustment reset to 0

# ============================================
# THERMAL DEFORMATION BENCHMARK
# ============================================

[gcode_macro THERMAL_DEFORMATION_BENCHMARK]
description: Benchmark autonome des déformations thermiques du plateau (adaptatif)
variable_test_points: [[75,75], [150,150], [225,225], [75,225], [225,75]]
variable_results: {}
variable_thermal_inertia: 0.0
variable_heating_rate: 0.0
variable_cooling_rate: 0.0
variable_calculated_coeff: 0.0
variable_expansion_total: 0.0
gcode:
  # LED calibration (violet pulsant)
  LED_CALIBRATION
  
  {% set mode = params.MODE|default('full')|string %}
  
  # Détecter dimensions plateau automatiquement
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  {% set bed_mesh = printer.configfile.settings.bed_mesh %}
  {% set mesh_x_min = bed_mesh.mesh_min[0]|float %}
  {% set mesh_y_min = bed_mesh.mesh_min[1]|float %}
  {% set mesh_x_max = bed_mesh.mesh_max[0]|float %}
  {% set mesh_y_max = bed_mesh.mesh_max[1]|float %}
  
  # Récupérer probe offset
  {% if 'bltouch' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.bltouch.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.bltouch.y_offset|float %}
  {% elif 'probe' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.probe.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.probe.y_offset|float %}
  {% else %}
    {% set probe_x_offset = 0 %}
    {% set probe_y_offset = 0 %}
  {% endif %}
  
  # Calculer points de test adaptatifs (25% et 75% de la zone utilisable)
  # Ces positions sont pour le PALPEUR
  {% set probe_x_25 = mesh_x_min + (mesh_x_max - mesh_x_min) * 0.25 %}
  {% set probe_x_50 = mesh_x_min + (mesh_x_max - mesh_x_min) * 0.50 %}
  {% set probe_x_75 = mesh_x_min + (mesh_x_max - mesh_x_min) * 0.75 %}
  {% set probe_y_25 = mesh_y_min + (mesh_y_max - mesh_y_min) * 0.25 %}
  {% set probe_y_50 = mesh_y_min + (mesh_y_max - mesh_y_min) * 0.50 %}
  {% set probe_y_75 = mesh_y_min + (mesh_y_max - mesh_y_min) * 0.75 %}
  
  # Calculer positions BUSE pour que le palpeur soit aux points voulus
  {% set x_25 = probe_x_25 - probe_x_offset %}
  {% set x_50 = probe_x_50 - probe_x_offset %}
  {% set x_75 = probe_x_75 - probe_x_offset %}
  {% set y_25 = probe_y_25 - probe_y_offset %}
  {% set y_50 = probe_y_50 - probe_y_offset %}
  {% set y_75 = probe_y_75 - probe_y_offset %}
  
  # Mettre à jour les points de test
  SET_GCODE_VARIABLE MACRO=THERMAL_DEFORMATION_BENCHMARK VARIABLE=test_points VALUE="[[{x_25},{y_25}], [{x_50},{y_50}], [{x_75},{y_75}], [{x_25},{y_75}], [{x_75},{y_25}]]"
  
  M118 ========================================
  M118 THERMAL DEFORMATION BENCHMARK
  M118 ========================================
  M118 Mode: {mode}
  M118 Plateau détecté: {x_max|int}x{y_max|int}mm
  M118 Zone mesh: X{mesh_x_min|int}-{mesh_x_max|int} Y{mesh_y_min|int}-{mesh_y_max|int}
  M118 Probe offset: X{probe_x_offset} Y{probe_y_offset}
  M118 Points testés: 5 (adaptatifs, positions buse)
  M118 Durée estimée:
  {% if mode == 'full' %}
    M118 - Mode complet: ~45-60 minutes
  {% elif mode == 'quick' %}
    M118 - Mode rapide: ~25-35 minutes
  {% else %}
    M118 - Mode custom: Variable
  {% endif %}
  M118 ========================================
  
  # Sauvegarder état initial
  {% set initial_bed_temp = printer.heater_bed.temperature %}
  
  # Vérifier température initiale (doit être proche de 30°C pour baseline)
  {% if initial_bed_temp > 35 %}
    M118 ⚠️  Bed too hot ({initial_bed_temp|round(1)}°C), cooling to 30°C...
    M140 S0  # Éteindre le chauffage
    M118 Waiting for passive cooling (no heating)...
    START_LED_HEATING_TEMPLATE
    _THERMAL_WAIT_PARK
    TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=30  # Attente passive (pas de régulation)
    STOP_LED_HEATING_TEMPLATE
    M118 ✅ Bed cooled to 30°C, waiting 60s for stabilization...
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=led_effect_stabilizing
    G4 P60000
    STOP_LED_EFFECTS
  {% endif %}
  
  {% if mode == 'full' %}
    _THERMAL_TEST_FULL
  {% elif mode == 'quick' %}
    _THERMAL_TEST_QUICK
  {% else %}
    M118 Modes disponibles: FULL, QUICK
  {% endif %}
  
  # Restaurer température initiale
  M140 S{initial_bed_temp}
  M118 Température plateau restaurée: {initial_bed_temp}°C
  
  # LED success
  M118 ✅ Thermal benchmark complete!
  LED_SUCCESS
  G4 P2000
  STOP_LED_EFFECTS

[gcode_macro _THERMAL_TEST_FULL]
gcode:
  M118 
  M118 🔬 PHASE 1: PLATEAU FROID (baseline)
  _THERMAL_MEASURE_PHASE PHASE="cold_baseline" TEMP=30 WAIT_TIME=0
  
  M118 
  M118 🔥 PHASE 2: PREMIÈRE CHAUFFE (froid → 60°C)
  _THERMAL_MEASURE_PHASE PHASE="first_heat" TEMP=60 WAIT_TIME=300
  
  M118 
  M118 ❄️ PHASE 3: REFROIDISSEMENT (60°C → 30°C)
  _THERMAL_COOLDOWN TEMP=30 MAX_WAIT=900
  
  M118 
  M118 🔥 PHASE 4: SECONDE CHAUFFE (30°C → 60°C)
  _THERMAL_MEASURE_PHASE PHASE="second_heat" TEMP=60 WAIT_TIME=180
  
  M118 
  M118 📊 ANALYSE DES RÉSULTATS
  _THERMAL_ANALYZE_RESULTS
  _PARK_TOOLHEAD MODE=maintenance

[gcode_macro _THERMAL_TEST_QUICK]
gcode:
  M118 
  M118 🔬 PHASE 1: PLATEAU FROID
  _THERMAL_MEASURE_PHASE PHASE="cold" TEMP=30 WAIT_TIME=0
  
  M118 
  M118 🔥 PHASE 2: CHAUFFE RAPIDE
  _THERMAL_MEASURE_PHASE PHASE="hot" TEMP=60 WAIT_TIME=180
  
  M118 
  M118 📊 ANALYSE RAPIDE
  _THERMAL_ANALYZE_QUICK
  _PARK_TOOLHEAD MODE=maintenance

[gcode_macro _THERMAL_WAIT_PARK]
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error('Thermal maintenance requires an idle printer and an empty bed')}
  {% endif %}
  {% if printer.toolhead.homed_axes != 'xyz' %}
    G28
  {% endif %}
  _PARK_TOOLHEAD MODE=maintenance

[gcode_macro _THERMAL_MEASURE_PHASE]
gcode:
  _THERMAL_WAIT_PARK
  {% set phase = params.PHASE %}
  {% set temp = params.TEMP|float %}
  {% set wait_time = params.WAIT_TIME|int %}
  
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  M118 📍 PHASE: {phase} - Target: {temp}°C
  M118 ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  
  # Mesurer vitesse de chauffe (inertie thermique)
  {% set start_temp = printer.heater_bed.temperature %}
  {% set start_time = printer.system_stats.cputime %}
  
  # Chauffer le plateau (avec LED selon direction)
  {% if temp > start_temp %}
    M118 🔥 Heating bed to {temp}°C...
    START_LED_HEATING_TEMPLATE
  {% else %}
    M118 ❄️ Cooling bed to {temp}°C...
    START_LED_HEATING_TEMPLATE
  {% endif %}
  M140 S{temp}
  M190 S{temp}
  STOP_LED_HEATING_TEMPLATE
  
  # Calculer vitesse de chauffe
  {% set end_time = printer.system_stats.cputime %}
  {% set heating_time = end_time - start_time %}
  {% set temp_delta = temp - start_temp %}
  {% if heating_time > 0 %}
    {% set heating_rate = temp_delta / (heating_time / 60) %}  # °C/min
    SET_GCODE_VARIABLE MACRO=THERMAL_DEFORMATION_BENCHMARK VARIABLE=heating_rate VALUE={heating_rate}
    M118 🔥 Vitesse de chauffe: {heating_rate|round(2)}°C/min
  {% else %}
    M118 🔥 Plateau déjà à température (pas de chauffe)
  {% endif %}
  
  # Attendre stabilisation
  {% if wait_time > 0 %}
    M118 ⏱️ Stabilisation {wait_time}s...
    STOP_LED_EFFECTS
    SET_LED_EFFECT EFFECT=led_effect_stabilizing
    G4 P{wait_time * 1000}
    STOP_LED_EFFECTS
  {% endif %}
  
  # Mesurer tous les points
  LED_HOMING
  G28
  STOP_LED_EFFECTS
  {% for point in printer["gcode_macro THERMAL_DEFORMATION_BENCHMARK"].test_points %}
    {% set x = point[0] %}
    {% set y = point[1] %}
    
    M118 📏 Point {loop.index}: X{x} Y{y}
    G0 X{x} Y{y} F6000
    PROBE_ACCURACY SAMPLES=5
    G4 P2000
  {% endfor %}

[gcode_macro _THERMAL_COOLDOWN]
variable_start_temp: 0.0
variable_start_time: 0.0
gcode:
  {% set target_temp = params.TEMP|float %}
  {% set max_wait = params.MAX_WAIT|default(3600)|int %}
  
  M118 ❄️ Refroidissement vers {target_temp}°C...
  
  # Sauvegarder température de départ
  SET_GCODE_VARIABLE MACRO=_THERMAL_COOLDOWN VARIABLE=start_temp VALUE={printer.heater_bed.temperature}
  SET_GCODE_VARIABLE MACRO=_THERMAL_COOLDOWN VARIABLE=start_time VALUE={printer.system_stats.cputime}
  
  # Éteindre le chauffage
  M140 S0
  
  # Attente passive (pas de régulation) avec LED gradient
  M118 Attente passive du refroidissement (pas de régulation)...
  START_LED_HEATING_TEMPLATE
  _THERMAL_WAIT_PARK
  TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM={target_temp}
  STOP_LED_HEATING_TEMPLATE
  
  # Calculer vitesse de refroidissement
  {% set end_time = printer.system_stats.cputime %}
  {% set cooling_time = end_time - printer["gcode_macro _THERMAL_COOLDOWN"].start_time %}
  {% set start_t = printer["gcode_macro _THERMAL_COOLDOWN"].start_temp %}
  {% set current_temp = printer.heater_bed.temperature %}
  {% set temp_delta = start_t - current_temp %}
  
  {% if cooling_time > 0 %}
    {% set cooling_rate = temp_delta / (cooling_time / 60) %}
    SET_GCODE_VARIABLE MACRO=THERMAL_DEFORMATION_BENCHMARK VARIABLE=cooling_rate VALUE={cooling_rate}
    M118 ❄️ Vitesse de refroidissement: {cooling_rate|round(2)}°C/min
  {% endif %}
  
  M118 ✅ Refroidissement terminé: {current_temp|round(1)}°C

[gcode_macro _THERMAL_ANALYZE_RESULTS]
gcode:
  {% set heating = printer["gcode_macro THERMAL_DEFORMATION_BENCHMARK"].heating_rate|float %}
  {% set cooling = printer["gcode_macro THERMAL_DEFORMATION_BENCHMARK"].cooling_rate|float %}
  {% set inertia = printer["gcode_macro THERMAL_DEFORMATION_BENCHMARK"].thermal_inertia|float %}
  
  M118 Thermal Benchmark Complete
  M118 Heating: {heating|round(2)}°C/min | Cooling: {cooling|round(2)}°C/min | Inertia: {inertia|round(3)}
  M118 Compare median values: expansion=hot-cold | hysteresis=2nd-1st
  M118 Typical: Expansion 0.10-0.20mm | Hysteresis <0.05mm
  M118 Next: APPLY_THERMAL_COEFFICIENT EXPANSION=<value>
  
  # Mettre à jour le timestamp de calibration
  _UPDATE_CALIBRATION_TIMESTAMP TYPE=thermal_benchmark

[gcode_macro APPLY_THERMAL_COEFFICIENT]
description: Calcule et applique automatiquement le coefficient d'expansion thermique
gcode:
  {% set expansion = params.EXPANSION|default(0)|float %}
  
  {% if expansion == 0 %}
    M118 ERROR: Specify EXPANSION=<value> | Ex: APPLY_THERMAL_COEFFICIENT EXPANSION=0.140
  {% else %}
    {% set delta_temp = 30.0 %}
    {% set coeff = (expansion / delta_temp)|round(6) %}
    
    SET_GCODE_VARIABLE MACRO=THERMAL_DEFORMATION_BENCHMARK VARIABLE=calculated_coeff VALUE={coeff}
    SET_GCODE_VARIABLE MACRO=THERMAL_DEFORMATION_BENCHMARK VARIABLE=expansion_total VALUE={expansion}
    SET_GCODE_VARIABLE MACRO=THERMAL_Z_COMPENSATION VARIABLE=bed_expansion_coeff VALUE={coeff}
    
    M118 ✅ Coefficient Applied: {coeff} mm/°C (Expansion: {expansion}mm / {delta_temp}°C)
    M118 Active in THERMAL_Z_COMPENSATION | Auto-applied at each print
    M118 ⚠️ Temporary (lost on reboot) | To save: add to movement.cfg
    M118 variable_bed_expansion_coeff: {coeff}
  {% endif %}

[gcode_macro _THERMAL_ANALYZE_QUICK]
gcode:
  M118 
  M118 ╔════════════════════════════════════════╗
  M118 ║           ANALYSE RAPIDE               ║
  M118 ╚════════════════════════════════════════╝
  M118 
  M118 📊 Comparez les valeurs 'median' froid vs chaud
  M118 Différence = Expansion thermique totale
  M118 
  M118 💡 Coefficient suggéré:
  M118 Expansion / 35°C = Coefficient par °C

# ============================================
# THERMAL INERTIA COMPENSATION
# ============================================

[gcode_macro THERMAL_INERTIA_COMPENSATION]
description: Compensation Z dynamique basée sur inertie thermique du plateau
gcode:
  {% set bed_target = printer.heater_bed.target|float %}
  {% set bed_current = printer.heater_bed.temperature|float %}
  {% set time_at_temp = params.TIME_AT_TEMP|default(0)|float %}  # Minutes à température
  
  # Inertie thermique mesurée (par défaut: plateau aluminium moyen)
  {% set thermal_inertia = printer["gcode_macro THERMAL_DEFORMATION_BENCHMARK"].thermal_inertia|default(2.0)|float %}
  
  # Coefficient d'expansion (par défaut)
  {% set expansion_coeff = 0.0035 %}
  
  # Température de référence
  {% set ref_temp = 20.0 %}
  
  # Calculer expansion théorique maximale
  {% set max_expansion = (bed_target - ref_temp) * expansion_coeff %}
  
  # Facteur de stabilisation (0-1) basé sur temps à température
  # Formule: 1 - exp(-t / tau) où tau = constante de temps thermique
  {% set tau = thermal_inertia * 2 %}  # Constante de temps en minutes
  {% set stabilization_factor = 1 - (2.718 ** (-(time_at_temp / tau))) %}
  
  # Expansion réelle = expansion max × facteur de stabilisation
  {% set actual_expansion = max_expansion * stabilization_factor %}
  
  # Compensation intermédiaire si plateau pas encore stabilisé
  {% set temp_diff = bed_target - bed_current %}
  {% if temp_diff|abs > 2 %}
    # Plateau en cours de chauffe/refroidissement
    {% set transient_factor = (bed_current - ref_temp) / (bed_target - ref_temp) %}
    {% set compensation = max_expansion * transient_factor * 0.8 %}  # 80% pendant transition
  {% else %}
    # Plateau à température cible
    {% set compensation = actual_expansion %}
  {% endif %}
  
  M118 ========================================
  M118 COMPENSATION INERTIE THERMIQUE
  M118 ========================================
  M118 Températures:
  M118 - Cible: {bed_target|round(1)}°C
  M118 - Actuelle: {bed_current|round(1)}°C
  M118 - Temps à temp: {time_at_temp|round(1)}min
  M118 
  M118 Inertie thermique:
  M118 - Ratio: {thermal_inertia|round(3)}
  M118 - Constante temps: {tau|round(1)}min
  M118 - Stabilisation: {(stabilization_factor * 100)|round(1)}%
  M118 
  M118 Compensations:
  M118 - Expansion max: {max_expansion|round(4)}mm
  M118 - Expansion réelle: {actual_expansion|round(4)}mm
  M118 - Appliquée: {compensation|round(4)}mm
  M118 
  
  {% if compensation|abs > 0.001 %}
    SET_GCODE_OFFSET Z_ADJUST={compensation} MOVE=1
    M118 ⚙️ Compensation appliquée: {compensation|round(4)}mm
  {% else %}
    M118 ℹ️ Aucune compensation nécessaire
  {% endif %}
  M118 ========================================

# ============================================
# SOFT PROBING - Palpage ultra-doux
# ============================================

[gcode_macro PROBE_SOFT]
description: Palpage Z ultra-doux avec décélération progressive
variable_last_z: 0
gcode:
  M118 Soft probing at current position...
  
  # Sauvegarder position actuelle
  SAVE_GCODE_STATE NAME=SOFT_PROBE_STATE
  
  # Palpage avec vitesse réduite (utilise les paramètres BLTouch optimisés)
  PROBE
  
  # Récupérer la position détectée
  {% set detected_z = printer.probe.last_z_result %}
  SET_GCODE_VARIABLE MACRO=PROBE_SOFT VARIABLE=last_z VALUE={detected_z}
  
  # Rebond fluide après détection
  M118 Detected Z: {detected_z}mm - Applying soft rebound
  {% set current_z = printer.toolhead.position.z %}
  G1 Z{current_z + 3} F300   # Rebond doux (5 mm/s)
  G1 Z{current_z + 5} F180   # Ralentissement (3 mm/s)
  
  RESTORE_GCODE_STATE NAME=soft_probe
  M118 Soft probe complete! Z={detected_z}mm
