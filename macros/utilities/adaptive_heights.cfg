# ============================================
# SYSTÈME DE HAUTEURS ADAPTATIVES (PORTABLE)
# ============================================
# Configuration centralisée pour hauteurs en pourcentage
# Compatible avec toutes les machines (Artillery, Voron, Ender, etc.)
# Date: 2025-11-22

[gcode_macro _ADAPTIVE_HEIGHT_SETTINGS]
description: Hauteurs adaptatives en pourcentage de Z_max (portable)
# Pourcentages de position_max Z pour portabilité
variable_purge_height_percent: 0.30      # 30% de Z_max pour purge (ex: 100mm sur 330mm)
variable_park_height_percent: 0.50       # 30% de Z_max pour parking (pause/cancel/end unifiés)
variable_min_zhop_mm: 10                 # Z-hop minimum absolu (mm)
variable_safety_margin_mm: 5             # Marge de sécurité sous Z_max (mm)
variable_computed_z: 0                   # Dernier résultat de _ADAPTIVE_Z
gcode:

[gcode_macro _ADAPTIVE_Z]
description: Calcule la hauteur adaptative et la stocke dans _ADAPTIVE_HEIGHT_SETTINGS.computed_z | MODE=park|end|purge
gcode:
  {% set MODE = params.MODE|default("park")|string %}
  {% if MODE not in ['park', 'end', 'purge'] %}
    {action_raise_error('Unknown adaptive height mode')}
  {% endif %}
  {% set s = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"] %}
  {% set percent = (s.purge_height_percent if MODE == "purge" else s.park_height_percent)|float %}
  {% set min_zhop = s.min_zhop_mm|float %}
  {% set safety_margin = s.safety_margin_mm|float %}
  {% set current_z = printer.toolhead.position.z|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% if not 0 <= percent <= 1 or not 0 < min_zhop <= max_z or not 0 <= safety_margin < max_z %}
    {action_raise_error('Invalid adaptive height settings')}
  {% endif %}
  {% set target = [max_z * percent, max_z * 0.5, current_z + min_zhop]|max %}
  {% if not current_z <= target <= max_z - safety_margin %}
    {action_raise_error('Insufficient Z clearance; downward clamp refused')}
  {% endif %}

  {% if current_z < target %}
    # Objet bas : monter à la hauteur cible
    {% set z = target %}
  {% elif MODE == "end" %}
    # Fin/annulation : déjà au-dessus de la cible, rester à hauteur actuelle
    {% set z = current_z %}
  {% else %}
    # park/purge au-dessus de la cible : simple Z-hop minimum
    {% set z = current_z + min_zhop %}
  {% endif %}

  # Sécurité : ne jamais dépasser Z_max - marge
  {% set z = [z, max_z - safety_margin]|min %}
  SET_GCODE_VARIABLE MACRO=_ADAPTIVE_HEIGHT_SETTINGS VARIABLE=computed_z VALUE={z}
  M118 Adaptive Z ({MODE}): {current_z|round(1)} -> {z|round(1)}mm (target {(percent * 100)|int}% of Z_max {max_z|round(1)})

[gcode_macro GET_ADAPTIVE_PURGE_HEIGHT]
description: Calcule hauteur de purge adaptative selon Z actuel et Z_max
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set purge_percent = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].purge_height_percent|float %}
  {% set min_zhop = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].min_zhop_mm|float %}
  {% set safety_margin = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].safety_margin_mm|float %}
  
  # Hauteur de purge cible = pourcentage de Z_max
  {% set target_purge_height = [max_z * purge_percent, max_z * 0.5, current_z + min_zhop]|max %}
  
  # Logique adaptative
  {% if current_z < target_purge_height %}
    # Objet bas : monter à hauteur de purge cible
    {% set purge_z = target_purge_height %}
  {% else %}
    # Objet haut : rester à hauteur actuelle + Z-hop minimum
    {% set purge_z = current_z + min_zhop %}
  {% endif %}
  
  # Sécurité : ne jamais dépasser Z_max - marge
  {% if not current_z <= purge_z <= max_z - safety_margin %}
    {action_raise_error('Insufficient Z clearance for purge')}
  {% endif %}
  
  M118 ========================================
  M118 ADAPTIVE PURGE HEIGHT
  M118 ========================================
  M118 Current Z: {current_z|round(1)}mm
  M118 Z_max: {max_z|round(1)}mm
  M118 Target purge height: {target_purge_height|round(1)}mm ({(purge_percent * 100)|int}% of Z_max)
  M118 Calculated purge Z: {purge_z|round(1)}mm
  M118 ========================================

[gcode_macro GET_ADAPTIVE_PARK_HEIGHT]
description: Calcule hauteur de parking adaptative selon Z actuel et Z_max
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set park_percent = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].park_height_percent|float %}
  {% set min_zhop = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].min_zhop_mm|float %}
  {% set safety_margin = printer["gcode_macro _ADAPTIVE_HEIGHT_SETTINGS"].safety_margin_mm|float %}
  
  # Hauteur de parking cible = pourcentage de Z_max
  {% set target_park_height = [max_z * park_percent, max_z * 0.5, current_z + min_zhop]|max %}
  
  # Logique adaptative
  {% if current_z < target_park_height %}
    # Objet bas : monter à hauteur de parking cible
    {% set park_z = target_park_height %}
  {% else %}
    # Objet haut : rester à hauteur actuelle + Z-hop minimum
    {% set park_z = current_z + min_zhop %}
  {% endif %}
  
  # Sécurité : ne jamais dépasser Z_max - marge
  {% if not current_z <= park_z <= max_z - safety_margin %}
    {action_raise_error('Insufficient Z clearance for parking')}
  {% endif %}
  
  M118 ========================================
  M118 ADAPTIVE PARK HEIGHT
  M118 ========================================
  M118 Current Z: {current_z|round(1)}mm
  M118 Z_max: {max_z|round(1)}mm
  M118 Target park height: {target_park_height|round(1)}mm ({(park_percent * 100)|int}% of Z_max)
  M118 Calculated park Z: {park_z|round(1)}mm
  M118 ========================================
