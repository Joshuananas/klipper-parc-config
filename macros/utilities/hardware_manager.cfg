#################################################
# HARDWARE PROFILE MANAGER
#################################################
# Macros pour afficher, comparer et gérer les profils hardware
#
# COMMANDES DISPONIBLES:
# - SHOW_HARDWARE_PROFILE          : Affiche le profil actif
# - LIST_HARDWARE_PROFILES         : Liste tous les profils
# - COMPARE_PROFILES               : Compare deux profils
# - SHOW_DRIVER_DIFFERENCES        : Affiche différences drivers
# - GET_PROFILE_INFO               : Info d'un profil spécifique
#################################################

[gcode_macro SHOW_HARDWARE_PROFILE]
description: Affiche le profil hardware actif
gcode:
  {% set active = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% set profile_macro = "_PROFILE_" ~ active.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
  
  {% if profile_macro_full in printer %}
    {% set config = printer[profile_macro_full].config %}
    
    M118 ========================================
    M118 PROFIL HARDWARE ACTIF
    M118 ========================================
    M118 
    M118 ID: {config.profile_id}
    M118 Nom: {config.name}
    M118 Fabricant: {config.manufacturer}
    M118 Modèle: {config.model}
    M118 Variant: {config.variant}
    M118 
    M118 DIMENSIONS:
    M118 - Plateau: {config.bed_size_x}x{config.bed_size_y}x{config.bed_size_z}mm
    M118 - Limites X: 0 → {config.position_max_x}mm
    M118 - Limites Y: 0 → {config.position_max_y}mm
    M118 - Limites Z: {config.position_min_z} → {config.position_max_z}mm
    M118 
    M118 DRIVERS:
    M118 - Type: {config.driver_type}
    M118 - Mode: {config.driver_mode}
    M118 - UART: {"Oui" if config.has_uart else "Non"}
    M118 
    M118 PINS DIRECTION:
    M118 - X: {config.dir_pin_x}
    M118 - Y: {config.dir_pin_y}
    M118 - Z: {config.dir_pin_z}
    M118 - E: {config.dir_pin_e}
    M118 
    M118 PALPEUR:
    M118 - Type: {config.probe_type if config.has_probe else "Aucun"}
    M118 - Offset X: {config.probe_x_offset if config.has_probe else "N/A"}
    M118 - Offset Y: {config.probe_y_offset if config.has_probe else "N/A"}
    M118 
    M118 EXTRUDER:
    M118 - Type: {config.extruder_type}
    M118 - Rétraction: {config.retract_length}mm @ {config.retract_speed}mm/min
    M118 
    M118 NOTES:
    {% for note in config.notes %}
      M118 - {note}
    {% endfor %}
    M118 ========================================
  {% else %}
    M118 ERREUR: Profil {active} introuvable!
  {% endif %}

[gcode_macro LIST_HARDWARE_PROFILES]
description: Liste tous les profils disponibles
gcode:
  M118 ========================================
  M118 PROFILS HARDWARE DISPONIBLES (20+)
  M118 ========================================
  M118 
  M118 ARTILLERY:
  M118 - artillery_swx2_stock # (TMC2100)
  M118 - artillery_swx2_tmc2209_standalone
  M118 - artillery_swx2_tmc2209_uart
  M118 - artillery_genius # (Direct Drive)
  M118 - artillery_genius_pro_stock # (TMC2208, BLTouch)
  M118 - artillery_genius_pro_standalone # (TMC2209, BLTouch)
  M118 - artillery_swx1 # (LED, pas de palpeur)
  M118 
  M118 CREALITY:
  M118 - ender3_stock # (220x220x250)
  M118 - ender3_v2 # (V2/Pro regroupés)
  M118 - ender3_s1 # (Direct Drive, CR Touch)
  M118 - cr10_stock # (300x300x400)
  M118 - cr10_v3, cr10_smart # (simplifiés)
  M118 
  M118 PRUSA:
  M118 - prusa_mk3s (TMC2130 SPI)
  M118 - prusa_mini, prusa_xl (simplifiés)
  M118 
  M118 VORON:
  M118 - voron_24_250 (CoreXY)
  M118 - voron_24_300, voron_24_350
  M118 - voron_01, voron_trident
  M118 
  M118 AUTRES:
  M118 - ratrig_vcore3, anycubic_kobra
  M118 - elegoo_neptune3
  M118 
  M118 Pour changer:
  M118 1. Éditer hardware/profiles.cfg
  M118 2. Modifier variable_active_profile
  M118 3. FIRMWARE_RESTART
  M118 ========================================

[gcode_macro COMPARE_PROFILES]
description: Compare deux profils (PROFILE1 et PROFILE2)
gcode:
  {% set profile1_name = params.PROFILE1|default('artillery_swx2_stock')|string %}
  {% set profile2_name = params.PROFILE2|default('artillery_swx2_tmc2209_standalone')|string %}
  
  {% set profile1_macro = "_PROFILE_" ~ profile1_name.upper() %}
  {% set profile2_macro = "_PROFILE_" ~ profile2_name.upper() %}
  {% set profile1_macro_full = "gcode_macro " ~ profile1_macro %}
  {% set profile2_macro_full = "gcode_macro " ~ profile2_macro %}
  
  {% if profile1_macro_full in printer and profile2_macro_full in printer %}
    {% set config1 = printer[profile1_macro_full].config %}
    {% set config2 = printer[profile2_macro_full].config %}
    
    M118 ========================================
    M118 COMPARAISON DE PROFILS
    M118 ========================================
    M118 
    M118 PROFIL 1: {config1.name}
    M118 PROFIL 2: {config2.name}
    M118 
    M118 DRIVERS:
    M118 - Type: {config1.driver_type} vs {config2.driver_type}
    M118 - Mode: {config1.driver_mode} vs {config2.driver_mode}
    M118 - UART: {config1.has_uart} vs {config2.has_uart}
    M118 
    M118 PINS DIRECTION (inversions):
    M118 - X: {config1.dir_pin_x} vs {config2.dir_pin_x}
    M118 - Y: {config1.dir_pin_y} vs {config2.dir_pin_y}
    M118 - Z: {config1.dir_pin_z} vs {config2.dir_pin_z}
    M118 - E: {config1.dir_pin_e} vs {config2.dir_pin_e}
    M118 
    {% if config1.dir_pin_x != config2.dir_pin_x %}
      M118 ⚠️ ATTENTION: Direction X différente!
    {% endif %}
    {% if config1.dir_pin_y != config2.dir_pin_y %}
      M118 ⚠️ ATTENTION: Direction Y différente!
    {% endif %}
    {% if config1.dir_pin_e != config2.dir_pin_e %}
      M118 ⚠️ ATTENTION: Direction E différente!
    {% endif %}
    M118 ========================================
  {% else %}
    M118 ERREUR: Un ou plusieurs profils introuvables
  {% endif %}

[gcode_macro SHOW_DRIVER_DIFFERENCES]
description: Affiche les différences entre drivers TMC2100 et TMC2209
gcode:
  M118 ========================================
  M118 DIFFÉRENCES TMC2100 vs TMC2209
  M118 ========================================
  M118 
  M118 INVERSION DES PINS:
  M118 - TMC2100: Pas d'inversion
  M118   X: PB13, Y: PB2, E: PA6
  M118 
  M118 - TMC2209: Inversion nécessaire!
  M118   X: !PB13, Y: !PB2, E: !PA6
  M118 
  M118 MODE STANDALONE:
  M118 - Courant: Potentiomètre
  M118 - Microsteps: Jumpers MS1/MS2
  M118 - Diagnostics: Aucun
  M118 
  M118 MODE UART (TMC2209 uniquement):
  M118 - Courant: Klipper (configurable)
  M118 - Microsteps: Klipper (jusqu'à 256)
  M118 - Diagnostics: Complets
  M118 - Température: Temps réel
  M118 - Sensorless: Possible
  M118 ========================================

[gcode_macro GET_PROFILE_INFO]
description: Obtenir info d'un profil spécifique (PROFILE=nom)
gcode:
  {% set profile_name = params.PROFILE|default('artillery_swx2_tmc2209_standalone')|string %}
  {% set profile_macro = "_PROFILE_" ~ profile_name.upper() %}
  {% set profile_macro_full = "gcode_macro " ~ profile_macro %}
  
  {% if profile_macro_full in printer %}
    {% set config = printer[profile_macro_full].config %}
    M118 Profil: {config.name}
    M118 Driver: {config.driver_type} ({config.driver_mode})
    M118 UART: {"Oui" if config.has_uart else "Non"}
  {% else %}
    M118 ERREUR: Profil {profile_name} introuvable
  {% endif %}