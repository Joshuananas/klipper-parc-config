# ============================================
# VALIDATION DE CONFIGURATION
# ============================================
# Macros pour valider la cohérence de la configuration au boot
# et détecter les problèmes potentiels

[gcode_macro VALIDATE_CONFIG]
description: Valider la cohérence complète de la configuration
gcode:
  M118 ========================================
  M118 VALIDATION DE CONFIGURATION
  M118 ========================================
  
  # Validation profil hardware
  _VALIDATE_HARDWARE_PROFILE
  
  # Validation profils multiples (NOUVEAU)
  _VALIDATE_NO_MULTIPLE_PROFILES
  
  # Validation cohérence hardware (NOUVEAU)
  _VALIDATE_HARDWARE_CONSISTENCY
  
  # Validation dimensions
  _VALIDATE_DIMENSIONS
  
  # Validation palpeur
  _VALIDATE_PROBE
  
  # Validation mesh
  _VALIDATE_MESH
  
  # Validation thermique
  _VALIDATE_THERMAL
  
  # Validation LED
  _VALIDATE_LED
  
  # Validation drivers (NOUVEAU)
  _VALIDATE_DRIVERS
  
  M118 ========================================
  M118 ✅ CONFIGURATION VALIDÉE
  M118 ========================================

[gcode_macro _VALIDATE_HARDWARE_PROFILE]
description: Vérifier profil hardware actif
gcode:
  {% if printer["gcode_macro _HARDWARE_CONFIG"] is defined %}
    {% set hw_config = printer["gcode_macro _HARDWARE_CONFIG"] %}
    {% set active = hw_config.active_profile %}
    
    {% if active == "" or active is none %}
      { action_raise_error("❌ ERREUR: Aucun profil hardware actif! Éditer hardware/profiles.cfg") }
    {% endif %}
    
    M118 ✅ Profil hardware: {active}
  {% else %}
    M118 ⚠️ WARNING: Système de profils hardware non configuré
  {% endif %}

[gcode_macro _VALIDATE_DIMENSIONS]
description: Vérifier dimensions et limites
gcode:
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  {% set z_max = printer.toolhead.axis_maximum.z %}
  {% set x_min = printer.toolhead.axis_minimum.x %}
  {% set y_min = printer.toolhead.axis_minimum.y %}
  {% set z_min = printer.toolhead.axis_minimum.z %}
  
  # Vérifier valeurs positives
  {% if x_max <= 0 or y_max <= 0 or z_max <= 0 %}
    { action_raise_error("❌ ERREUR: Dimensions invalides! X={} Y={} Z={}".format(x_max, y_max, z_max)) }
  {% endif %}
  
  # Vérifier cohérence min/max
  {% if x_min >= x_max or y_min >= y_max or z_min >= z_max %}
    { action_raise_error("❌ ERREUR: Limites incohérentes! Min >= Max") }
  {% endif %}
  
  # Vérifier dimensions raisonnables (entre 100mm et 1000mm)
  {% if x_max < 100 or x_max > 1000 or y_max < 100 or y_max > 1000 %}
    M118 ⚠️ WARNING: Dimensions inhabituelles X={x_max} Y={y_max}
  {% endif %}
  
  M118 ✅ Dimensions: X={x_max} Y={y_max} Z={z_max}mm

[gcode_macro _VALIDATE_PROBE]
description: Vérifier configuration palpeur
gcode:
  {% if printer.probe is not defined %}
    M118 ⚠️ WARNING: Pas de palpeur configuré (bed leveling manuel)
  {% else %}
    {% set x_offset = printer.configfile.settings.bltouch.x_offset|default(0)|float %}
    {% set y_offset = printer.configfile.settings.bltouch.y_offset|default(0)|float %}
    {% set z_offset = printer.configfile.settings.bltouch.z_offset|default(0)|float %}
    
    # Vérifier offsets raisonnables
    {% if x_offset|abs > 100 or y_offset|abs > 100 %}
      M118 ⚠️ WARNING: Offsets palpeur inhabituels X={x_offset} Y={y_offset}
    {% endif %}
    
    # Vérifier Z-offset calibré
    {% if z_offset == 0 %}
      M118 ⚠️ WARNING: Z-offset non calibré (0.000mm)
    {% endif %}
    
    M118 ✅ Palpeur: X={x_offset} Y={y_offset} Z={z_offset}mm
  {% endif %}

[gcode_macro _VALIDATE_MESH]
description: Vérifier configuration bed mesh
gcode:
  {% if printer.bed_mesh is defined %}
    {% set mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
    {% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}
    
    # Vérifier que mesh_min < mesh_max
    {% if mesh_min[0] >= mesh_max[0] or mesh_min[1] >= mesh_max[1] %}
      { action_raise_error("❌ ERREUR: Mesh min >= max!") }
    {% endif %}
    
    # Vérifier probe_count raisonnable (3-15)
    {% if probe_count[0] < 3 or probe_count[0] > 15 %}
      M118 ⚠️ WARNING: Probe count inhabituel: {probe_count[0]}x{probe_count[1]}
    {% endif %}
    
    M118 ✅ Bed mesh: {probe_count[0]}x{probe_count[1]} points
  {% else %}
    M118 ⚠️ WARNING: Bed mesh non configuré
  {% endif %}

[gcode_macro _VALIDATE_THERMAL]
description: Vérifier configuration thermique
gcode:
  {% set extruder_max = printer.configfile.settings.extruder.max_temp %}
  {% set bed_max = printer.configfile.settings.heater_bed.max_temp %}
  
  # Vérifier températures max raisonnables
  {% if extruder_max < 200 or extruder_max > 500 %}
    M118 ⚠️ WARNING: Temp max extruder inhabituelle: {extruder_max}°C
  {% endif %}
  
  {% if bed_max < 80 or bed_max > 200 %}
    M118 ⚠️ WARNING: Temp max plateau inhabituelle: {bed_max}°C
  {% endif %}
  
  # Vérifier PID calibré
  {% if printer.configfile.settings.extruder.control is not defined %}
    M118 ⚠️ WARNING: PID extruder non calibré
  {% endif %}
  
  {% if printer.configfile.settings.heater_bed.control is not defined %}
    M118 ⚠️ WARNING: PID plateau non calibré
  {% endif %}
  
  M118 ✅ Thermique: Extruder max={extruder_max}°C, Bed max={bed_max}°C

[gcode_macro _VALIDATE_LED]
description: Vérifier système LED
gcode:
  {% if printer["gcode_macro _LED_STATE"] is defined %}
    {% set led_state = printer["gcode_macro _LED_STATE"].current_state %}
    M118 ✅ Système LED: État={led_state}
  {% else %}
    M118 ⚠️ WARNING: Système LED non configuré
  {% endif %}

[gcode_macro SYSTEM_QUICK_CHECK]
description: Vérification rapide (sans erreurs bloquantes)
gcode:
  M118 ========================================
  M118 VÉRIFICATION RAPIDE
  M118 ========================================
  
  # Profil hardware
  {% if printer["gcode_macro _HARDWARE_CONFIG"] is defined %}
    {% set hw_config = printer["gcode_macro _HARDWARE_CONFIG"] %}
    {% set active = hw_config.active_profile %}
    M118 Profil: {active}
  {% else %}
    M118 Profil: Non configuré
  {% endif %}
  
  # Dimensions
  {% set x_max = printer.toolhead.axis_maximum.x %}
  {% set y_max = printer.toolhead.axis_maximum.y %}
  {% set z_max = printer.toolhead.axis_maximum.z %}
  M118 Dimensions: {x_max}x{y_max}x{z_max}mm
  
  # Palpeur
  {% if printer.probe is defined %}
    {% set z_offset = printer.configfile.settings.bltouch.z_offset|default(0) %}
    M118 Palpeur: Z-offset={z_offset}mm
  {% else %}
    M118 Palpeur: Non configuré
  {% endif %}
  
  # Températures
  {% set extruder_temp = printer.extruder.temperature %}
  {% set bed_temp = printer.heater_bed.temperature %}
  M118 Températures: Extruder={extruder_temp}°C, Bed={bed_temp}°C
  
  # État LED
  {% if printer["gcode_macro _LED_STATE"] is defined %}
    {% set led_state = printer["gcode_macro _LED_STATE"].current_state %}
    M118 LED: {led_state}
  {% endif %}
  
  M118 ========================================
  M118 ✅ VÉRIFICATION TERMINÉE
  M118 ========================================

# ============================================
# NOUVELLES VALIDATIONS (Phase 2.4)
# ============================================

[gcode_macro _VALIDATE_NO_MULTIPLE_PROFILES]
description: Détecter si plusieurs profils hardware sont actifs
gcode:
  # Compter le nombre de fichiers hardware inclus dans printer.cfg
  # Note: Cette validation est informative, Klipper détectera les doublons de sections
  
  {% set active_profile = "" %}
  {% if printer["gcode_macro _HARDWARE_CONFIG"] is defined %}
    {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
  {% endif %}
  
  # Vérifier cohérence entre profiles.cfg et includes
  {% if active_profile != "" %}
    # Vérifier que le profil actif correspond à un fichier inclus
    M118 ✅ Profil unique: {active_profile}
  {% else %}
    M118 ⚠️ WARNING: Impossible de vérifier unicité du profil
  {% endif %}

[gcode_macro _VALIDATE_HARDWARE_CONSISTENCY]
description: Vérifier cohérence entre profil déclaré et hardware réel
gcode:
  {% if printer["gcode_macro _HARDWARE_CONFIG"] is defined %}
    {% set active_profile = printer["gcode_macro _HARDWARE_CONFIG"].active_profile %}
    
    # Vérifier cohérence UART
    {% if "uart" in active_profile %}
      # Profil UART: Vérifier que tmc2209_uart.cfg est inclus
      # Note: Impossible de vérifier directement les includes, mais on peut vérifier les sections TMC
      {% if printer.configfile.settings["tmc2209 stepper_x"] is defined %}
        M118 ✅ Cohérence UART: Sections TMC2209 détectées
      {% else %}
        M118 ⚠️ WARNING: Profil UART mais pas de sections TMC2209 UART
      {% endif %}
    {% elif "standalone" in active_profile %}
      # Profil Standalone: Pas de sections TMC UART attendues
      {% if printer.configfile.settings["tmc2209 stepper_x"] is defined %}
        M118 ⚠️ WARNING: Profil Standalone mais sections TMC2209 UART présentes
      {% else %}
        M118 ✅ Cohérence Standalone: Pas de UART
      {% endif %}
    {% endif %}
    
    # Vérifier cohérence dimensions
    {% set x_max = printer.toolhead.axis_maximum.x %}
    {% set y_max = printer.toolhead.axis_maximum.y %}
    
    {% if "swx2" in active_profile or "sidewinder" in active_profile %}
      # Artillery Sidewinder X2: 300-305mm
      {% if x_max < 295 or x_max > 310 %}
        M118 ⚠️ WARNING: Dimensions X={x_max} inhabituelles pour SWX2 (attendu ~300-305)
      {% else %}
        M118 ✅ Cohérence dimensions SWX2
      {% endif %}
    {% elif "genius" in active_profile %}
      # Artillery Genius: 220mm
      {% if x_max < 215 or x_max > 225 %}
        M118 ⚠️ WARNING: Dimensions X={x_max} inhabituelles pour Genius (attendu ~220)
      {% else %}
        M118 ✅ Cohérence dimensions Genius
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _VALIDATE_DRIVERS]
description: Valider configuration des drivers
gcode:
  # Vérifier présence de sections stepper
  {% if printer.configfile.settings.stepper_x is not defined %}
    { action_raise_error("❌ ERREUR: Section [stepper_x] manquante!") }
  {% endif %}
  
  {% if printer.configfile.settings.stepper_y is not defined %}
    { action_raise_error("❌ ERREUR: Section [stepper_y] manquante!") }
  {% endif %}
  
  {% if printer.configfile.settings.stepper_z is not defined %}
    { action_raise_error("❌ ERREUR: Section [stepper_z] manquante!") }
  {% endif %}
  
  {% if printer.configfile.settings.extruder is not defined %}
    { action_raise_error("❌ ERREUR: Section [extruder] manquante!") }
  {% endif %}
  
  # Vérifier microsteps (doit être puissance de 2)
  {% set x_microsteps = printer.configfile.settings.stepper_x.microsteps %}
  {% if x_microsteps not in [1, 2, 4, 8, 16, 32, 64, 128, 256] %}
    M118 ⚠️ WARNING: Microsteps X={x_microsteps} inhabituel (attendu: 16 ou 32)
  {% endif %}
  
  # Vérifier rotation_distance raisonnable
  {% set x_rotation = printer.configfile.settings.stepper_x.rotation_distance %}
  {% if x_rotation < 20 or x_rotation > 80 %}
    M118 ⚠️ WARNING: Rotation distance X={x_rotation} inhabituelle (attendu: 32-40)
  {% endif %}
  
  M118 ✅ Drivers: Sections présentes et cohérentes

[gcode_macro _VALIDATE_KINEMATICS]
description: Valider cohérence cinématique
gcode:
  {% set kinematics = printer.configfile.settings.printer.kinematics %}
  
  {% if kinematics == "cartesian" %}
    # Cartesian: Vérifier endstops X, Y
    {% if printer.configfile.settings.stepper_x.endstop_pin is not defined %}
      M118 ⚠️ WARNING: Pas d'endstop X défini
    {% endif %}
    {% if printer.configfile.settings.stepper_y.endstop_pin is not defined %}
      M118 ⚠️ WARNING: Pas d'endstop Y défini
    {% endif %}
    M118 ✅ Cinématique: Cartesian valide
    
  {% elif kinematics == "corexy" %}
    # CoreXY: Vérifier que X et Y ont des endstops
    M118 ✅ Cinématique: CoreXY valide
    
  {% elif kinematics == "delta" %}
    # Delta: Vérifier 3 tours
    M118 ✅ Cinématique: Delta valide
    
  {% else %}
    M118 ⚠️ WARNING: Cinématique {kinematics} non reconnue
  {% endif %}

[gcode_macro _VALIDATE_SAFETY]
description: Valider paramètres de sécurité
gcode:
  # Vérifier températures max raisonnables
  {% set extruder_max = printer.configfile.settings.extruder.max_temp %}
  {% set bed_max = printer.configfile.settings.heater_bed.max_temp %}
  
  {% if extruder_max > 350 %}
    M118 ⚠️ WARNING: Temp max extruder très élevée: {extruder_max}°C
  {% endif %}
  
  {% if bed_max > 150 %}
    M118 ⚠️ WARNING: Temp max plateau très élevée: {bed_max}°C
  {% endif %}
  
  # Vérifier vitesses max raisonnables
  {% set max_velocity = printer.configfile.settings.printer.max_velocity %}
  {% set max_accel = printer.configfile.settings.printer.max_accel %}
  
  {% if max_velocity > 500 %}
    M118 ⚠️ WARNING: Vitesse max très élevée: {max_velocity}mm/s
  {% endif %}
  
  {% if max_accel > 10000 %}
    M118 ⚠️ WARNING: Accélération max très élevée: {max_accel}mm/s²
  {% endif %}
  
  M118 ✅ Sécurité: Paramètres dans limites raisonnables

# ============================================
# VALIDATION COMPLÈTE AVANCÉE
# ============================================

[gcode_macro VALIDATE_CONFIG_ADVANCED]
description: Validation complète avec toutes les vérifications
gcode:
  M118 ========================================
  M118 VALIDATION AVANCÉE
  M118 ========================================
  
  # Validations standard
  VALIDATE_CONFIG
  
  # Validations supplémentaires
  _VALIDATE_KINEMATICS
  _VALIDATE_SAFETY
  
  M118 ========================================
  M118 ✅ VALIDATION AVANCÉE TERMINÉE
  M118 ========================================

