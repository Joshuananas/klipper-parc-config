# ============================================
# DEBUG RESUME - Diagnostic des problèmes de reprise
# ============================================

[gcode_macro DEBUG_RESUME_STATE]
description: Affiche l'état complet pour diagnostiquer les problèmes de RESUME
gcode:
  M118 ========================================
  M118 DEBUG RESUME STATE
  M118 ========================================
  
  # État PAUSE
  {% set pause_state = printer["gcode_macro PAUSE"] %}
  M118 PAUSE State:
  M118   is_paused: {pause_state.is_paused|default(0)}
  M118   state_saved: {pause_state.state_saved|default(0)}
  M118   is_m600: {pause_state.is_m600|default(0)}
  M118   is_runout: {pause_state.is_runout|default(0)}
  
  # Rétractions configurées
  {% set retract = printer["gcode_macro _RETRACTION_SETTINGS"] %}
  M118 Retraction Settings:
  M118   pause_retract: {retract.pause_retract}mm
  M118   m600_retract: {retract.m600_retract}mm
  M118   m600_prime: {retract.m600_prime}mm
  
  # Matériau et profil de purge
  {% set material = printer["gcode_macro _MATERIAL_PURGE_PROFILES"].current_material|default("PLA")|upper %}
  {% set profiles = printer["gcode_macro _MATERIAL_PURGE_PROFILES"] %}
  {% if material in profiles %}
    {% set profile = profiles[material] %}
  {% else %}
    {% set profile = profiles.default %}
  {% endif %}
  M118 Purge Profile ({material}):
  M118   resume_amount: {profile.resume_amount}mm
  M118   runout_amount: {profile.runout_amount}mm
  M118   retract (cut): {profile.retract}mm
  
  # Settings de purge
  {% set purge_settings = printer["gcode_macro PURGE_SETTINGS"] %}
  M118 Purge Settings:
  M118   final_prime_amount: {purge_settings.final_prime_amount}mm
  
  # Calcul de compensation attendue
  {% set cut_length = profile.retract|float %}
  {% set final_prime = purge_settings.final_prime_amount|float %}
  {% set compensation = cut_length - final_prime %}
  M118 Expected Compensation:
  M118   cut_length - final_prime = {cut_length} - {final_prime} = {compensation}mm
  
  # État extrudeur
  M118 Extruder State:
  M118   temperature: {printer.extruder.temperature}°C
  M118   target: {printer.extruder.target}°C
  M118   can_extrude: {printer[printer.toolhead.extruder].can_extrude}
  
  # Position actuelle
  {% set pos = printer.gcode_move.gcode_position %}
  M118 Current Position:
  M118   X: {pos.x}, Y: {pos.y}, Z: {pos.z}
  M118   E: {printer.gcode_move.gcode_position.e}
  
  # Mode extrusion
  M118 Extrusion Mode:
  M118   absolute_extrude: {printer.gcode_move.absolute_extrude}
  
  M118 ========================================

[gcode_macro ENABLE_RESUME_DEBUG]
description: Active le mode debug pour RESUME (logs détaillés)
gcode:
  SET_GCODE_VARIABLE MACRO=_RESUME_DEBUG VARIABLE=enabled VALUE=1
  M118 ✅ RESUME Debug Mode ENABLED
  M118 Les prochaines opérations PAUSE/RESUME seront loggées en détail

[gcode_macro DISABLE_RESUME_DEBUG]
description: Désactive le mode debug pour RESUME
gcode:
  SET_GCODE_VARIABLE MACRO=_RESUME_DEBUG VARIABLE=enabled VALUE=0
  M118 ❌ RESUME Debug Mode DISABLED

[gcode_macro _RESUME_DEBUG]
variable_enabled: 0
gcode:
  # Variable container

[gcode_macro _DEBUG_LOG]
description: Log conditionnel si debug activé
gcode:
  {% set debug = printer["gcode_macro _RESUME_DEBUG"].enabled|default(0) %}
  {% if debug == 1 %}
    M118 [DEBUG] {params.MSG|default("No message")}
  {% endif %}
