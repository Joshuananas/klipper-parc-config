# ============================================
# MAINTENANCE MACROS
# ============================================

[gcode_macro PROBE_OFFSET]
description: Calibrate probe Z offset
gcode:
  PROBE_CALIBRATE

[gcode_macro _BED_TRAM_SETTINGS]
description: Configuration du tramming adaptatif
variable_margin_corner: 30    # Marge depuis les coins (en mm)
gcode:
  # Variables seulement

[gcode_macro BED_TRAM]
description: Bed tramming adaptatif (calcule positions automatiquement, deletes all meshes)
gcode:
  {% set settings = printer["gcode_macro _BED_TRAM_SETTINGS"] %}
  
  # Récupérer dimensions du plateau
  {% set x_max = printer.configfile.settings.stepper_x.position_max|float %}
  {% set y_max = printer.configfile.settings.stepper_y.position_max|float %}
  
  # Récupérer offset du palpeur (bltouch, probe, etc.)
  {% if 'bltouch' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.bltouch.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.bltouch.y_offset|float %}
  {% elif 'probe' in printer.configfile.settings %}
    {% set probe_x_offset = printer.configfile.settings.probe.x_offset|float %}
    {% set probe_y_offset = printer.configfile.settings.probe.y_offset|float %}
  {% else %}
    {% set probe_x_offset = 0 %}
    {% set probe_y_offset = 0 %}
  {% endif %}
  
  # Calculer positions des coins pour le PALPEUR
  # La buse doit être à : position_coin_palpeur - probe_offset
  # Pour que le palpeur soit exactement au coin voulu
  
  # Positions cibles pour le PALPEUR (avec marges)
  {% set probe_fl_x = settings.margin_corner %}
  {% set probe_fl_y = settings.margin_corner %}
  {% set probe_fr_x = x_max - settings.margin_corner %}
  {% set probe_fr_y = settings.margin_corner %}
  {% set probe_br_x = x_max - settings.margin_corner %}
  {% set probe_br_y = y_max - settings.margin_corner %}
  {% set probe_bl_x = settings.margin_corner %}
  {% set probe_bl_y = y_max - settings.margin_corner %}
  
  # Calculer positions de la BUSE pour que le palpeur soit aux coins
  # buse_pos = probe_target_pos - probe_offset
  {% set fl_x = probe_fl_x - probe_x_offset %}
  {% set fl_y = probe_fl_y - probe_y_offset %}
  {% set fr_x = probe_fr_x - probe_x_offset %}
  {% set fr_y = probe_fr_y - probe_y_offset %}
  {% set br_x = probe_br_x - probe_x_offset %}
  {% set br_y = probe_br_y - probe_y_offset %}
  {% set bl_x = probe_bl_x - probe_x_offset %}
  {% set bl_y = probe_bl_y - probe_y_offset %}
  
  M118 ═══════════════════════════════════════
  M118 🔧 BED TRAMMING ADAPTATIF
  M118 ═══════════════════════════════════════
  M118 Plateau: {x_max}x{y_max}mm
  M118 Probe offset: X{probe_x_offset} Y{probe_y_offset}
  M118 Marge coins: {settings.margin_corner}mm
  M118 ───────────────────────────────────────
  M118 Positions buse (pour déplacement):
  M118 - Front Left:  [{fl_x|round(1)}, {fl_y|round(1)}]
  M118 - Front Right: [{fr_x|round(1)}, {fr_y|round(1)}]
  M118 - Back Right:  [{br_x|round(1)}, {br_y|round(1)}]
  M118 - Back Left:   [{bl_x|round(1)}, {bl_y|round(1)}]
  M118 ───────────────────────────────────────
  M118 Positions palpeur (réelles):
  M118 - Front Left:  [{probe_fl_x|round(1)}, {probe_fl_y|round(1)}]
  M118 - Front Right: [{probe_fr_x|round(1)}, {probe_fr_y|round(1)}]
  M118 - Back Right:  [{probe_br_x|round(1)}, {probe_br_y|round(1)}]
  M118 - Back Left:   [{probe_bl_x|round(1)}, {probe_bl_y|round(1)}]
  M118 ═══════════════════════════════════════
  
  # Home conditionnel (seulement si nécessaire)
  {% if printer.toolhead.homed_axes != 'xyz' %}
    M118 ⚠️  Axes non homés, lancement du homing...
    LED_HOMING
    G28
    STOP_LED_EFFECTS
    M118 ✅ Homing terminé
  {% else %}
    M118 ✅ Axes déjà homés, homing ignoré
  {% endif %}
  
  # Utiliser SCREWS_TILT_CALCULATE (fenêtre interactive)
  M118 ───────────────────────────────────────
  M118 🔍 Lancement de SCREWS_TILT_CALCULATE...
  M118 (Fenêtre interactive dans Mainsail/Fluidd)
  M118 ═══════════════════════════════════════
  
  LED_CALIBRATION
  SCREWS_TILT_CALCULATE
  STOP_LED_EFFECTS
  
  M118 ═══════════════════════════════════════
  M118 ✅ Tramming terminé!
  M118 Ajustez les vis selon les indications
  M118 Relancez BED_TRAM pour vérifier
  M118 ═══════════════════════════════════════
  
  # Supprimer tous les meshes
  M118 Deleting all mesh profiles...
  CLEAR_MESH_DATABASE
  EXPIRE_ALL_MESHES
  
  M118 ═══════════════════════════════════════
  M118 All meshes deleted and expired
  M118 Next print will create new mesh
  M118 ═══════════════════════════════════════

[gcode_macro LOCK_Z_STEPPERS]
description: Lock Z steppers (prevent bed drop)
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1

[gcode_macro Z_UNLOCK_STEPPERS]
description: Unlock Z steppers
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
