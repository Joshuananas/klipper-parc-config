[gcode_macro _AMBIENT]
description: Shared ambient reference and conservative per-machine MCU learning
variable_temperature: 0.0
variable_source: 'unknown'
variable_confidence: 0
variable_reference_temp: 0.0
variable_reference_at: -1.0
variable_reference_ttl: 3600.0
variable_manual_temp: 0.0
variable_manual_at: -1.0
variable_delta: 0.0
variable_samples: 0
variable_sample_seconds: 30.0
variable_cold_seconds: 1800.0
variable_window_seconds: 600.0
variable_last_sample_at: -1.0
variable_last_hot_at: 0.0
variable_last_learn_at: -1.0
variable_window_started: -1.0
variable_window_min_bed: 0.0
variable_window_max_bed: 0.0
variable_window_min_nozzle: 0.0
variable_window_max_nozzle: 0.0
variable_window_min_mcu: 0.0
variable_window_max_mcu: 0.0
variable_bed_target: 0.0
variable_extruder_target: 0.0
variable_bed_adjust: 0.0
variable_extruder_adjust: 0.0
gcode:
  AMBIENT_STATUS

[delayed_gcode _AMBIENT_TIMER]
initial_duration: 30
gcode:
  AMBIENT_REFRESH
  UPDATE_DELAYED_GCODE ID=_AMBIENT_TIMER DURATION=30

[gcode_macro _AMBIENT_SAMPLE]
gcode:
  {% set a = printer['gcode_macro _AMBIENT'] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set bed = printer.heater_bed.temperature|float %}
  {% set nozzle = printer.extruder.temperature|float %}
  {% set mcu = printer['temperature_sensor mainboard'].temperature|float %}
  {% set active = printer.heater_bed.target|float > 0 or printer.extruder.target|float > 0 or printer.print_stats.state in ['printing', 'paused'] or printer.idle_timeout.state == 'Printing' %}
  {% set plausible = 5 <= bed <= 40 and 5 <= nozzle <= 40 and 5 <= mcu <= 65 %}
  {% if a.last_sample_at|float < 0 or active or not plausible or (bed - nozzle)|abs > 2.5 %}
    SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=last_hot_at VALUE={now}
    SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_started VALUE=-1.0
  {% endif %}
  {% if a.last_sample_at|float < 0 or now - a.last_sample_at|float >= a.sample_seconds|float %}
    SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=last_sample_at VALUE={now}
    {% if not active and plausible and (bed - nozzle)|abs <= 2.5 %}
      {% set bmin = [a.window_min_bed|float, bed]|min %}
      {% set bmax = [a.window_max_bed|float, bed]|max %}
      {% set nmin = [a.window_min_nozzle|float, nozzle]|min %}
      {% set nmax = [a.window_max_nozzle|float, nozzle]|max %}
      {% set mmin = [a.window_min_mcu|float, mcu]|min %}
      {% set mmax = [a.window_max_mcu|float, mcu]|max %}
      {% set restart_window = a.window_started|float < 0 or bmax - bmin > 0.5 or nmax - nmin > 0.5 or mmax - mmin > 1.0 %}
      {% if restart_window %}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_started VALUE={now}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_min_bed VALUE={bed}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_max_bed VALUE={bed}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_min_nozzle VALUE={nozzle}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_max_nozzle VALUE={nozzle}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_min_mcu VALUE={mcu}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_max_mcu VALUE={mcu}
      {% else %}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_min_bed VALUE={bmin}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_max_bed VALUE={bmax}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_min_nozzle VALUE={nmin}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_max_nozzle VALUE={nmax}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_min_mcu VALUE={mmin}
        SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=window_max_mcu VALUE={mmax}
        {% if now - a.last_hot_at|float >= a.cold_seconds|float and now - a.window_started|float >= a.window_seconds|float %}
          {% set reference = (bed + nozzle) / 2.0 %}
          {% set observed_delta = mcu - reference %}
          SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=reference_temp VALUE={reference}
          SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=reference_at VALUE={now}
          {% set model = printer.save_variables.variables.ambient_model|default({'delta': 0.0, 'samples': 0}) %}
          {% set count = model.samples|int %}
          {% set delta = model.delta|float %}
          {% if -5 <= observed_delta <= 30 and (count == 0 or (observed_delta - delta)|abs <= 5) and (a.last_learn_at|float < 0 or now - a.last_learn_at|float >= 3600) %}
            {% set step = [[(observed_delta - delta) * 0.2, -0.5]|max, 0.5]|min %}
            {% set learned = observed_delta if count == 0 else delta + step %}
            SAVE_VARIABLE VARIABLE=ambient_model VALUE="{{'delta': learned|round(3), 'samples': [count + 1, 10000]|min}}"
            SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=last_learn_at VALUE={now}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro AMBIENT_REFRESH]
description: Refresh ambient state without motion or heating
gcode:
  _AMBIENT_SAMPLE
  _AMBIENT_SELECT

[gcode_macro _AMBIENT_SELECT]
gcode:
  {% set a = printer['gcode_macro _AMBIENT'] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set model = printer.save_variables.variables.ambient_model|default({'delta': 0.0, 'samples': 0}) %}
  {% set delta = model.delta|float %}
  {% set count = model.samples|int %}
  {% set temperature = 0.0 %}
  {% set source = 'unknown' %}
  {% set confidence = 0 %}
  {% if a.manual_at|float >= 0 and 0 <= now - a.manual_at|float <= a.reference_ttl|float %}
    {% set temperature = a.manual_temp|float %}
    {% set source = 'manual' %}
    {% set confidence = 3 %}
  {% elif a.reference_at|float >= 0 and 0 <= now - a.reference_at|float <= a.reference_ttl|float %}
    {% set temperature = a.reference_temp|float %}
    {% set source = 'cold_reference' %}
    {% set confidence = 2 %}
  {% elif count > 0 and -5 <= delta <= 30 %}
    {% set estimate = printer['temperature_sensor mainboard'].temperature|float - delta %}
    {% if 5 <= estimate <= 40 %}
      {% set temperature = estimate %}
      {% set source = 'mcu_estimate' %}
      {% set confidence = 1 %}
    {% endif %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=temperature VALUE={temperature}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=source VALUE='"{source}"'
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=confidence VALUE={confidence}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=delta VALUE={delta}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=samples VALUE={count}

[gcode_macro AMBIENT_SET]
description: Supply a local thermometer reading, valid for one hour; CLEAR=1 removes it
gcode:
  {% if params.CLEAR|default(0)|int == 1 %}
    SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=manual_at VALUE=-1.0
  {% else %}
    {% set temperature = params.TEMP|float %}
    {% if not 5 <= temperature <= 40 %}
      {action_raise_error('Ambient TEMP must be between 5 and 40 C')}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=manual_temp VALUE={temperature}
    SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=manual_at VALUE={printer.toolhead.estimated_print_time|float}
  {% endif %}
  AMBIENT_STATUS

[gcode_macro AMBIENT_STATUS]
description: Show ambient source, confidence, age and learned MCU delta
gcode:
  AMBIENT_REFRESH
  _AMBIENT_REPORT

[gcode_macro _AMBIENT_REPORT]
gcode:
  {% set a = printer['gcode_macro _AMBIENT'] %}
  {% set now = printer.toolhead.estimated_print_time|float %}
  {% set stamp = a.manual_at|float if a.source == 'manual' else a.reference_at|float %}
  {% if a.confidence|int > 0 %}
    {action_respond_info('Ambient %.1f C | source=%s | confidence=%d/3 | reference age=%ds | MCU delta=%.2f C | learned samples=%d' % (a.temperature|float, a.source, a.confidence|int, (now - stamp)|int if stamp >= 0 else -1, a.delta|float, a.samples|int))}
  {% else %}
    {action_respond_info('Ambient unknown: waiting for cold stable sensors or AMBIENT_SET TEMP=...; no temperature correction')}
  {% endif %}

[gcode_macro _AMBIENT_TARGETS]
gcode:
  {% set a = printer['gcode_macro _AMBIENT'] %}
  {% set bed = params.BED_TEMP|default(0)|float %}
  {% set nozzle = params.EXTRUDER_TEMP|default(0)|float %}
  {% if bed < 0 or nozzle < 0 %}
    {action_raise_error('Heater targets must not be negative')}
  {% endif %}
  {% set bed_adjust = 0.0 %}
  {% set nozzle_adjust = 0.0 %}
  {% set ambient = a.temperature|float %}
  {% if params.AMBIENT_ADJUST|default(1)|int == 1 and a.confidence|int >= 2 %}
    {% if ambient < 5 %}
      {% set bed_adjust = 10.0 %}
      {% set nozzle_adjust = 15.0 %}
    {% elif ambient < 10 %}
      {% set bed_adjust = 7.0 %}
      {% set nozzle_adjust = 10.0 %}
    {% elif ambient < 15 %}
      {% set bed_adjust = 5.0 %}
      {% set nozzle_adjust = 8.0 %}
    {% elif ambient < 20 %}
      {% set bed_adjust = 3.0 %}
      {% set nozzle_adjust = 5.0 %}
    {% elif ambient > 30 %}
      {% set bed_adjust = -2.0 %}
      {% set nozzle_adjust = -3.0 %}
    {% endif %}
  {% endif %}
  {% set bed_target = bed + bed_adjust if bed > 0 else 0.0 %}
  {% set nozzle_target = nozzle + nozzle_adjust if nozzle > 0 else 0.0 %}
  {% if bed > 0 and not printer.configfile.settings.heater_bed.min_temp|float < bed_target < printer.configfile.settings.heater_bed.max_temp|float %}
    {action_raise_error('Ambient-adjusted bed target is outside configured heater limits')}
  {% endif %}
  {% if nozzle > 0 and not printer.configfile.settings.extruder.min_temp|float < nozzle_target < printer.configfile.settings.extruder.max_temp|float %}
    {action_raise_error('Ambient-adjusted nozzle target is outside configured heater limits')}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=bed_target VALUE={bed_target}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=extruder_target VALUE={nozzle_target}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=bed_adjust VALUE={bed_adjust if bed > 0 else 0.0}
  SET_GCODE_VARIABLE MACRO=_AMBIENT VARIABLE=extruder_adjust VALUE={nozzle_adjust if nozzle > 0 else 0.0}
