# ============================================
# POWER LOSS RECOVERY SYSTEM
# ============================================
# Système de reprise après coupure de courant

[gcode_shell_command sync_config]
command: sync
timeout: 5.0
verbose: False

[gcode_macro _POWER_LOSS_STATE]
description: Variables d'état pour la reprise (PHASE 3 OPTIMISÉ - runtime uniquement)
variable_auto_monitor: 0
variable_last_layer: 0
variable_last_z: 0.0
variable_auto_heat_countdown: 0
variable_auto_heat_enabled: 0
variable_monitor_ticks: 0
gcode:
  # Variables runtime uniquement - données persistantes dans SAVE_VARIABLE

[gcode_macro SAVE_PRINT_STATE]
description: Sauvegarder l'état actuel de l'impression
gcode:
  {% if printer.print_stats.state == "printing" %}
    {% set pos = printer.toolhead.position %}
    {% set extruder_temp = printer.extruder.target|int %}
    {% set bed_temp = printer.heater_bed.target|int %}
    {% set fan_speed = printer.fan.speed|float %}
    {% set feedrate = printer.gcode_move.speed|int %}
    {% set file_position = printer.virtual_sdcard.file_position|int %}
    {% set file_size = printer.virtual_sdcard.file_size|int %}
    {% set progress = (file_position / file_size * 100)|round(1) if file_size > 0 else 0 %}
    
    # Sauvegarder de manière persistante (UNIQUEMENT)
    SAVE_VARIABLE VARIABLE=power_loss_active VALUE=1
    SAVE_VARIABLE VARIABLE=power_loss_filename VALUE='"{printer.print_stats.filename}"'
    SAVE_VARIABLE VARIABLE=power_loss_file_position VALUE={file_position}
    SAVE_VARIABLE VARIABLE=power_loss_progress VALUE={progress}
    SAVE_VARIABLE VARIABLE=power_loss_x VALUE={pos.x}
    SAVE_VARIABLE VARIABLE=power_loss_y VALUE={pos.y}
    SAVE_VARIABLE VARIABLE=power_loss_z VALUE={pos.z}
    SAVE_VARIABLE VARIABLE=power_loss_e VALUE={printer.gcode_move.position.e}
    SAVE_VARIABLE VARIABLE=power_loss_extruder VALUE={extruder_temp}
    SAVE_VARIABLE VARIABLE=power_loss_bed VALUE={bed_temp}
    SAVE_VARIABLE VARIABLE=power_loss_fan VALUE={fan_speed}
    
    M118 Print state saved: Z={pos.z|round(2)}mm ({progress}%)
  {% endif %}

[delayed_gcode CHECK_POWER_LOSS_ON_STARTUP]
initial_duration: 10
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if svv.power_loss_active|default(0) == 1 %}
    # Vérifier si un fichier a été sauvegardé (seul indicateur fiable après reboot)
    {% set saved_filename = svv.power_loss_filename|default("")|string %}
    
    # Si PAS de fichier sauvegardé : FIRMWARE_RESTART volontaire (nettoyage silencieux)
    {% if saved_filename == "" %}
      # Redémarrage volontaire sans impression en cours : nettoyer silencieusement
      SAVE_VARIABLE VARIABLE=power_loss_active VALUE=0
      SAVE_VARIABLE VARIABLE=print_active VALUE=0
      M118 Power loss flags cleared (voluntary restart, no file saved)
    {% else %}
      # Fichier sauvegardé : VRAIE COUPURE DE COURANT pendant impression
      # Afficher l'alerte de récupération
    {% set bed_temp = svv.power_loss_bed|default(0)|int %}
    
    M118 ========================================
    M118 🔌 COUPURE DE COURANT DÉTECTÉE !
    M118 ========================================
    M118 Fichier: {svv.power_loss_filename|default("inconnu")}
    M118 Progression: {svv.power_loss_progress|default(0)}%
    M118 Couche: {svv.power_loss_layer|default(0)}
    M118 Position: X{svv.power_loss_x|default(0)|round(1)} Y{svv.power_loss_y|default(0)|round(1)} Z{svv.power_loss_z|default(0)|round(1)}mm
    M118 Temp Extruder: {svv.power_loss_extruder|default(0)}°C
    M118 Temp Bed: {bed_temp}°C
    M118 ========================================
    M118 
    M118 👉 Pour REPRENDRE l'impression:
    M118    Tapez: POWER_RESUME_PRINT
    M118    (L'impression reprendra automatiquement)
    M118 
    M118 👉 Pour ANNULER:
    M118    Tapez: POWER_CANCEL_RECOVERY
    M118 
    M118 ⚠️ ATTENTION: Si aucune action dans 5 minutes,
    M118    le plateau sera réchauffé automatiquement à {bed_temp}°C
    M118    pour éviter le décollement de l'objet.
    M118 
    M118 👉 Pour DÉSACTIVER le réchauffage auto:
    M118    Tapez: DISABLE_AUTO_HEAT
    M118 
    M118 ========================================
    { action_respond_info("🔌 COUPURE DÉTECTÉE ! Tapez RESUME_PRINT pour reprendre. Réchauffage auto dans 5 min.") }
    
    # Démarrer le timer de réchauffage automatique
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_countdown VALUE=300
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_enabled VALUE=1
    UPDATE_DELAYED_GCODE ID=AUTO_HEAT_TIMER DURATION=1
    {% endif %}
  {% endif %}

[gcode_macro CHECK_POWER_LOSS]
description: Vérifier manuellement si une reprise est disponible
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if svv.power_loss_active|default(0) == 1 %}
    M118 ========================================
    M118 🔌 REPRISE DISPONIBLE
    M118 ========================================
    M118 Fichier: {svv.power_loss_filename|default("inconnu")}
    M118 Couche: {svv.power_loss_layer|default(0)}
    M118 Position: X{svv.power_loss_x|default(0)|round(1)} Y{svv.power_loss_y|default(0)|round(1)} Z{svv.power_loss_z|default(0)|round(1)}mm
    M118 ========================================
    M118 Tapez: RESUME_PRINT
    M118 ========================================
  {% else %}
    M118 Aucune reprise disponible
  {% endif %}

[gcode_macro POWER_RESUME_PRINT]
description: Reprendre l'impression après coupure (commande simplifiée)
gcode:
  # Arrêter le timer de réchauffage automatique
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_enabled VALUE=0
  UPDATE_DELAYED_GCODE ID=AUTO_HEAT_TIMER DURATION=0
  
  _POWER_RESUME_AFTER_LOSS

[gcode_macro POWER_CANCEL_RECOVERY]
description: Annuler la reprise après coupure (commande simplifiée)
gcode:
  # Arrêter le timer de réchauffage automatique
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_enabled VALUE=0
  UPDATE_DELAYED_GCODE ID=AUTO_HEAT_TIMER DURATION=0
  
  POWER_CLEAR_STATE
  M118 Reprise annulée

[gcode_macro _POWER_RESUME_AFTER_LOSS]
description: Reprendre l'impression après coupure (macro interne)
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if svv.power_loss_active|default(0) != 1 %}
    M118 No power loss to resume
    { action_respond_info("ERROR: No saved state found") }
  {% else %}
    M118 ========================================
    M118 RESUMING PRINT AFTER POWER LOSS
    M118 ========================================
    
    # LED: Homing en cours (convention système)
    LED_HOMING
    
    # Récupérer les valeurs
    {% set saved_state = svv.power_loss_state|default("printing")|string %}
    {% set saved_layer = svv.power_loss_layer|default(0)|int %}
    {% set target_x = svv.power_loss_x|default(0)|float %}
    {% set target_y = svv.power_loss_y|default(0)|float %}
    {% set target_z = svv.power_loss_z|default(0)|float %}
    {% set target_e = svv.power_loss_e|default(0)|float %}
    {% set extruder_temp = svv.power_loss_extruder|default(200)|int %}
    {% set bed_temp = svv.power_loss_bed|default(60)|int %}
    {% set fan_speed = svv.power_loss_fan|default(0)|float %}
    
    M118 Resuming at Layer {saved_layer} (was: {saved_state})
    
    # Gestion selon l'état
    {% if saved_state == "m600" %}
      M118 ========================================
      M118 WARNING: M600 was in progress!
      M118 ========================================
      M118 A filament change was interrupted.
      M118 Please verify:
      M118  - Correct filament is loaded
      M118  - Nozzle is clean
      M118  - No clogs present
      M118 ========================================
      M118 Press CONTINUE to proceed
      M118 ========================================
      { action_respond_info("M600 interrupted - verify filament!") }
      PAUSE
    {% elif saved_state == "paused" %}
      M118 ========================================
      M118 Print was PAUSED during power loss
      M118 ========================================
      M118 Resuming to paused state.
      M118 You can inspect before continuing.
      M118 ========================================
    {% endif %}
    
    # REFLEXE ANTI-LABOURAGE : si la coupure a laisse la buse basse (1ere
    # couche), le homing XY la trainerait sur la piece/le plateau. On
    # redeclare le Z sauve puis on monte AVANT tout mouvement XY.
    # Le lift est borne par la tete restante sous Z_max (coupure en haut
    # de print => pas de collision en haut non plus).
    {% set z_max = printer.toolhead.axis_maximum.z|float %}
    {% set lift = [10.0, z_max - target_z - 5.0]|min %}
    {% if lift > 0 %}
      SET_KINEMATIC_POSITION Z={target_z}
      G91
      G1 Z{lift} F1200
      G90
      M118 Safety lift: +{lift|round(1)}mm before XY homing (was Z{target_z|round(1)})
    {% endif %}
    # Apres ce lift (+ le z_hop du homing), la position reelle sera
    # target_z + lift + z_hop : on passe SAVED_Z=target_z+lift pour que
    # _COMMON_HOME_Z_PLUS declare la bonne position.
    {% set z_for_plus = target_z + [lift, 0]|max|float %}

    # Homing XY avec macro centralisée
    _COMMON_HOME_XY
    
    # Arrêter LED homing
    STOP_LED_EFFECTS
    
    # Z position recovery SANS homing (pour éviter collision)
    # SKIP_HOMING=1 va forcer la position Z SANS faire de G28 Z
    # car G28 Z descendrait et entrerait en collision avec l'objet imprimé
    M118 ⚠️ Power loss recovery: Z will be set to {target_z}mm WITHOUT homing
    M118 ⚠️ This prevents collision with printed object
    _COMMON_HOME_Z_PLUS SAVED_Z={z_for_plus} SKIP_HOMING=1
    
    # Recharger bed mesh si disponible
    {% if printer.bed_mesh %}
      {% set mesh_profile = printer.bed_mesh.profile_name|default("") %}
      {% if mesh_profile != "" %}
        M118 Reloading bed mesh: {mesh_profile}
        BED_MESH_PROFILE LOAD={mesh_profile}
      {% else %}
        M118 No bed mesh to reload
      {% endif %}
    {% endif %}
    
    # ========================================
    # PARKING SAFE PENDANT CHAUFFAGE (CONVENTIONNEL)
    # ========================================
    
    M118 Parking toolhead at safe position during heating...
    _PARK_TOOLHEAD MODE=pause
    
    # ========================================
    # CHAUFFAGE PLATEAU UNIQUEMENT (extrudeur chauffé par RESUME)
    # ========================================
    
    M118 Heating bed to {bed_temp}°C...
    
    # LED: Chauffage (convention système)
    START_LED_HEATING_TEMPLATE
    
    M190 S{bed_temp}  # Attendre température plateau
    M118 Bed temperature reached
    
    # Arrêter LED chauffage
    STOP_LED_HEATING_TEMPLATE
    
    # ========================================
    # SAUVEGARDER POSITIONS POUR RESTAURATION
    # ========================================
    
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_x VALUE={target_x}
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_y VALUE={target_y}
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_z VALUE={target_z}
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=target_e VALUE={target_e}
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_RESTORE VARIABLE=fan_speed VALUE={fan_speed}
    
    # ========================================
    # UTILISER RESUME CONVENTIONNEL (purge + brush + chauffe extrudeur)
    # ========================================
    
    M118 Using conventional RESUME system (purge + brush + heating)...
    
    # Simuler état de pause pour que RESUME fonctionne
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_temp VALUE={extruder_temp}
    
    # Appeler RESUME qui va:
    # 1. Chauffer l'extrudeur avec stabilisation
    # 2. Purger à la position conventionnelle
    # 3. Nettoyer la buse (brush)
    # 4. Restaurer la position via _POWER_LOSS_RESTORE_POSITION
    RESUME EXTRUDER={extruder_temp}
    
    # Réactiver ventilateur
    M106 S{fan_speed * 255}
    
    M118 ========================================
    M118 REPOSITIONNEMENT TERMINÉ
    M118 ========================================
    
    # Validation utilisateur avant reprise
    _COMMON_VALIDATE_RESUME
    
    # Attendre validation (ou timeout)
    {% set validation_timeout = 300 %}  # 5 minutes
    {% set start_time = printer.system_stats.cputime %}
    {% set validated = 0 %}
    
    # Boucle d'attente validation (simplifié)
    M118 Waiting for user validation...
    M118 Type VALIDATE_RESUME_OK to continue
    
    # Note: Dans une vraie implémentation, utiliser delayed_gcode
    # Pour l'instant, on suppose que l'utilisateur valide
    
    M118 ========================================
    M118 REPOSITIONNEMENT TERMINÉ
    M118 ========================================
    
    # Récupérer informations fichier sauvegardé
    {% set saved_filename = svv.power_loss_filename|default("")|string %}
    {% set file_position = svv.power_loss_file_position|default(0)|int %}
    {% set progress = svv.power_loss_progress|default(0)|float %}
    
    {% if saved_filename != "" %}
      M118 ========================================
      M118 LANCEMENT REPRISE AUTOMATIQUE
      M118 ========================================
      M118 Fichier: {saved_filename}
      M118 Position: {file_position} bytes ({progress}%)
      M118 
      M118 🔄 Création automatique du fichier de reprise...
      
      # Exécuter le script d'extraction automatique
      RUN_SHELL_COMMAND CMD=auto_resume
      
      M118 
      M118 ✅ Fichier de reprise créé: RESUME_{saved_filename}
      M118 
      M118 🚀 Démarrage de l'impression...
      
      # Activer le flag pour skip PRINT_START dans le fichier de reprise
      SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=power_loss_recovery_active VALUE=1
      M118 Power loss recovery flag activated (PRINT_START will be skipped)
      
      # CRITIQUE: Forcer mode extrudeur relatif et reset E à 0
      # Le fichier G-code extrait utilise probablement des valeurs E relatives
      M83  # Extruder relatif
      G92 E0  # Reset E à 0
      M118 Extruder set to RELATIVE mode, E reset to 0
      
      # Lancer le fichier de reprise DIRECTEMENT
      SDCARD_PRINT_FILE FILENAME="RESUME_{saved_filename}"
      
      # NE PAS nettoyer l'état ici!
      # Le flag power_loss_recovery_active doit rester actif pour skip PRINT_START
      # Le nettoyage se fera automatiquement dans PRINT_END
      
      M118 ✅ Fichier de reprise lancé!
      M118 ⚠️ PRINT_START sera skippé automatiquement
      M118 ========================================
      
    {% else %}
      M118 ❌ Error: No saved file found
      POWER_CLEAR_STATE
    {% endif %}
  {% endif %}

[gcode_macro POWER_AUTO_RESUME]
description: Reprendre automatiquement l'impression avec le fichier extrait
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set saved_filename = svv.power_loss_filename|default("")|string %}
  
  {% if saved_filename == "" %}
    M118 ❌ Error: No saved filename found
  {% else %}
    M118 ========================================
    M118 LANCEMENT REPRISE AUTOMATIQUE
    M118 ========================================
    M118 Fichier: RESUME_{saved_filename}
    M118 
    M118 🚀 Démarrage de l'impression...
    
    # Lancer le fichier de reprise
    SDCARD_PRINT_FILE FILENAME="RESUME_{saved_filename}"
    
    # Nettoyer l'état après le lancement
    POWER_CLEAR_STATE
    
    M118 ✅ Impression reprise avec succès!
    M118 ========================================
  {% endif %}

[gcode_macro POWER_CLEAR_STATE]
description: Effacer l'état de power loss
gcode:
  SAVE_VARIABLE VARIABLE=power_loss_active VALUE=0
  SAVE_VARIABLE VARIABLE=print_active VALUE=0
  # Réinitialiser le flag de reprise pour permettre PRINT_START normal
  SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=power_loss_recovery_active VALUE=0
  M118 Power loss state cleared (PRINT_START re-enabled)

[gcode_macro EMERGENCY_STOP]
description: Arrêt d'urgence (action volontaire, pas de power loss recovery)
gcode:
  M118 Emergency stop - clearing power loss checkpoint
  
  # Retirer compensation Z température ambiante (réinitialise l'offset à 0)
  SET_GCODE_OFFSET Z=0 MOVE=0
  M118 Ambient temperature Z compensation removed
  
  POWER_CLEAR_STATE
  M112

[gcode_macro POWER_SAVE_CHECKPOINT]
description: Sauvegarde checkpoint à chaque couche (appelé par G-code)
gcode:
  {% set LAYER = params.LAYER|default(0)|int %}
  {% set STATE = params.STATE|default("printing")|string %}
  
  {% if printer.print_stats.state in ["printing", "paused"] %}
    {% set pos = printer.toolhead.position %}
    # Consignes reelles : si pause forcee par UPS, les cibles ont ete mises a
    # 0/50 AVANT le checkpoint -> recuperer les vraies cibles sauvees par le
    # watchdog (saved_ext/saved_bed) pour que la reprise rechauffe correctement
    {% set u = printer["gcode_macro _UPS_DATA"]|default({}) %}
    {% if u.paused_by_ups|default(0)|int == 1 %}
      {% set extruder_temp = u.saved_ext|default(printer.extruder.target)|int %}
      {% set bed_temp = u.saved_bed|default(printer.heater_bed.target)|int %}
    {% else %}
      {% set extruder_temp = printer.extruder.target|int %}
      {% set bed_temp = printer.heater_bed.target|int %}
    {% endif %}
    {% set fan_speed = printer.fan.speed|float %}
    
    # Détecter l'état réel et utiliser les bonnes positions
    {% if printer.print_stats.state == "paused" %}
      {% if STATE == "m600" %}
        {% set actual_state = "m600" %}
        # Utiliser les positions d'impression sauvegardées par M600 (avant parking)
        {% set save_x = printer["gcode_macro M600"].restore_x|float %}
        {% set save_y = printer["gcode_macro M600"].restore_y|float %}
        {% set save_z = printer["gcode_macro M600"].restore_z|float %}
        {% set save_e = printer["gcode_macro M600"].restore_e|float %}
      {% else %}
        {% set actual_state = "paused" %}
        # Utiliser les positions d'impression sauvegardées par PAUSE (avant parking)
        {% set save_x = printer["gcode_macro PAUSE"].restore_x|float %}
        {% set save_y = printer["gcode_macro PAUSE"].restore_y|float %}
        {% set save_z = printer["gcode_macro PAUSE"].restore_z|float %}
        {% set save_e = printer["gcode_macro PAUSE"].restore_e|float %}
      {% endif %}
    {% else %}
      {% set actual_state = STATE %}
      # Utiliser les positions actuelles (impression en cours)
      {% set save_x = pos.x %}
      {% set save_y = pos.y %}
      {% set save_z = pos.z %}
      {% set save_e = printer.gcode_move.position.e %}
    {% endif %}
    
    # Calculer progression du fichier
    {% set file_position = printer.virtual_sdcard.file_position|int %}
    {% set file_size = printer.virtual_sdcard.file_size|int %}
    {% set progress = (file_position / file_size * 100)|round(1) if file_size > 0 else 0 %}
    
    # Sauvegarde persistante immédiate
    SAVE_VARIABLE VARIABLE=power_loss_active VALUE=1
    SAVE_VARIABLE VARIABLE=power_loss_state VALUE='"{actual_state}"'
    SAVE_VARIABLE VARIABLE=power_loss_filename VALUE='"{printer.print_stats.filename}"'
    SAVE_VARIABLE VARIABLE=power_loss_file_position VALUE={file_position}
    SAVE_VARIABLE VARIABLE=power_loss_progress VALUE={progress}
    SAVE_VARIABLE VARIABLE=power_loss_layer VALUE={LAYER}
    SAVE_VARIABLE VARIABLE=power_loss_x VALUE={save_x}
    SAVE_VARIABLE VARIABLE=power_loss_y VALUE={save_y}
    SAVE_VARIABLE VARIABLE=power_loss_z VALUE={save_z}
    SAVE_VARIABLE VARIABLE=power_loss_e VALUE={save_e}
    SAVE_VARIABLE VARIABLE=power_loss_extruder VALUE={extruder_temp}
    SAVE_VARIABLE VARIABLE=power_loss_bed VALUE={bed_temp}
    SAVE_VARIABLE VARIABLE=power_loss_fan VALUE={fan_speed}

    # Flusher sur disque IMMEDIATEMENT : sans sync, une coupure electrique
    # dure perd le checkpoint reste dans le cache page du kernel
    RUN_SHELL_COMMAND CMD=sync_config

    # Message silencieux (seulement tous les 10 layers)
    {% if LAYER % 10 == 0 %}
      M118 Checkpoint: Layer {LAYER} ({actual_state})
    {% endif %}
  {% endif %}

[delayed_gcode LAYER_AUTO_MONITOR]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _POWER_LOSS_STATE"] %}
  {% set auto_monitor = state.auto_monitor|int %}
  
  {% if auto_monitor == 1 and printer.print_stats.state == "printing" %}
    {% set current_z = printer.toolhead.position.z|float %}
    {% set last_z = state.last_z|float %}
    {% set current_layer = state.last_layer|int %}
    {% set ticks = state.monitor_ticks|default(0)|int + 1 %}

    # Détecter changement de couche (Z a augmenté de plus de 0.05mm)
    {% if (current_z - last_z) > 0.05 %}
      {% set new_layer = current_layer + 1 %}
      SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=last_layer VALUE={new_layer}
      SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=last_z VALUE={current_z}
      SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=monitor_ticks VALUE=0

      # Sauvegarder checkpoint automatiquement
      POWER_SAVE_CHECKPOINT LAYER={new_layer}
    {% elif ticks >= 30 %}
      # Checkpoint periodique ~60s meme sans changement de couche :
      # un print mono-couche ou une longue couche ne declenche sinon rien
      SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=monitor_ticks VALUE=0
      POWER_SAVE_CHECKPOINT LAYER={current_layer}
    {% else %}
      SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=monitor_ticks VALUE={ticks}
    {% endif %}

    # Continuer le monitoring
    UPDATE_DELAYED_GCODE ID=LAYER_AUTO_MONITOR DURATION=2
  {% endif %}

[gcode_macro POWER_START_MONITORING]
description: Démarrer le monitoring automatique des couches
gcode:
  {% set current_z = printer.toolhead.position.z|float %}
  
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_monitor VALUE=1
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=last_z VALUE={current_z}
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=last_layer VALUE=0
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=monitor_ticks VALUE=0
  
  UPDATE_DELAYED_GCODE ID=LAYER_AUTO_MONITOR DURATION=2
  M118 Auto layer monitoring started

[gcode_macro POWER_STOP_MONITORING]
description: Arrêter le monitoring automatique des couches
gcode:
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_monitor VALUE=0
  UPDATE_DELAYED_GCODE ID=LAYER_AUTO_MONITOR DURATION=0
  M118 Auto layer monitoring stopped

[delayed_gcode AUTO_HEAT_TIMER]
initial_duration: 0
gcode:
  {% set state = printer["gcode_macro _POWER_LOSS_STATE"] %}
  {% set countdown = state.auto_heat_countdown|int %}
  {% set enabled = state.auto_heat_enabled|int %}
  
  {% if enabled == 1 and countdown > 0 %}
    {% set countdown = countdown - 1 %}
    {% set mins = (countdown // 60)|int %}
    {% set secs = (countdown % 60)|int %}
    
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_countdown VALUE={countdown}
    
    # Afficher message toutes les 60 secondes
    {% if countdown % 60 == 0 and countdown > 0 %}
      M118 ⏰ Réchauffage automatique dans {mins} minute(s)
    {% endif %}
    
    # Continuer le timer
    UPDATE_DELAYED_GCODE ID=AUTO_HEAT_TIMER DURATION=1
    
  {% elif enabled == 1 and countdown == 0 %}
    # Timer écoulé, démarrer le réchauffage automatique
    M118 ========================================
    M118 🔥 RÉCHAUFFAGE AUTOMATIQUE ACTIVÉ
    M118 ========================================
    M118 Aucune action détectée pendant 5 minutes.
    M118 Le plateau est réchauffé pour préserver l'objet.
    M118 ========================================
    
    {% set svv = printer.save_variables.variables %}
    {% set bed_temp = svv.power_loss_bed|default(60)|int %}
    
    M140 S{bed_temp}
    M118 Plateau en chauffe vers {bed_temp}°C...
    
    # Désactiver le timer
    SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_enabled VALUE=0
    
    { action_respond_info("🔥 Réchauffage automatique activé pour préserver l'objet.") }
  {% endif %}

[gcode_macro POWER_DISABLE_AUTO_HEAT]
description: Désactiver le réchauffage automatique
gcode:
  SET_GCODE_VARIABLE MACRO=_POWER_LOSS_STATE VARIABLE=auto_heat_enabled VALUE=0
  UPDATE_DELAYED_GCODE ID=AUTO_HEAT_TIMER DURATION=0
  M118 Réchauffage automatique désactivé
  M118 Le plateau restera froid jusqu'à votre action

# ============================================
# MACROS DE SUPPORT POUR RESTAURATION POSITION
# ============================================

[gcode_macro _POWER_LOSS_RESTORE]
description: Variables pour restauration position après power loss
variable_target_x: -1  # -1 = pas de reprise power loss en cours
variable_target_y: -1
variable_target_z: -1
variable_target_e: -1
variable_fan_speed: 0
gcode:
  # Macro de stockage uniquement

[gcode_macro _POWER_LOSS_RESTORE_POSITION]
description: Restaurer la position sauvegardée après purge
gcode:
  {% set restore = printer["gcode_macro _POWER_LOSS_RESTORE"] %}
  {% set target_x = restore.target_x|float %}
  {% set target_y = restore.target_y|float %}
  {% set target_z = restore.target_z|float %}
  {% set target_e = restore.target_e|float %}
  {% set current_z = printer.toolhead.position.z|float %}
  
  M118 ========================================
  M118 RESTORING SAVED POSITION
  M118 ========================================
  M118 Target: X{target_x} Y{target_y} Z{target_z}
  M118 Current Z: {current_z}mm
  
  # Repositionnement avec clearance intelligente
  G90  # Absolu
  
  # Si Z actuel < target_z + 10, monter pour clearance
  {% if current_z < (target_z + 10) %}
    M118 Raising Z to {target_z + 10}mm for clearance
    G1 Z{target_z + 10} F1200
  {% else %}
    M118 Z already at safe height ({current_z}mm), no need to raise
  {% endif %}
  
  # Déplacer XY
  G1 X{target_x} Y{target_y} F6000
  
  # Descendre à Z exact
  M118 Lowering to target Z: {target_z}mm
  G1 Z{target_z} F600
  
  # NE PAS restaurer position E ici
  # Le mode relatif sera activé avant le lancement du fichier
  # avec G92 E0 pour éviter les conflits
  M118 Position XYZ restored (E will be reset to 0 in relative mode)
  
  M118 Position restored successfully
  M118 ========================================
