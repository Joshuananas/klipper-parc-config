[gcode_macro LED_TEMP_REACHED]
description: 3 green flashes to indicate temperature reached
gcode:
  SET_LED_TEMPLATE LED=extruder TEMPLATE=""
  STOP_LED_EFFECTS
  G4 P100
  
  # Flash 1
  SET_LED LED=extruder RED=0 GREEN=1.0 BLUE=0
  G4 P150
  SET_LED LED=extruder RED=0 GREEN=0 BLUE=0
  G4 P100
  
  # Flash 2
  SET_LED LED=extruder RED=0 GREEN=1.0 BLUE=0
  G4 P150
  SET_LED LED=extruder RED=0 GREEN=0 BLUE=0
  G4 P100
  
  # Flash 3
  SET_LED LED=extruder RED=0 GREEN=1.0 BLUE=0
  G4 P150
  SET_LED LED=extruder RED=0 GREEN=0 BLUE=0
  G4 P100