# ============================================
# VALIDATION UTILITIES - MACROS CONSOLIDÉES
# ============================================
# Macros de validation, vérification et tests consolidées
# Créé le: 27 novembre 2025
# Consolidation de: 10+ fichiers sources dispersés
#
# Macros VALIDATE_*, CHECK_*, TEST_* regroupées ici
# pour faciliter la maintenance et réduire la fragmentation

# ============================================
# CONFIG VALIDATION
# ============================================

[gcode_macro SYSTEM_HEALTH_CHECK]
description: Comprehensive system health check
# Source: macros/utilities/system_health.cfg
gcode:
  M118 ========================================
  M118 SYSTEM HEALTH CHECK
  M118 ========================================
  
  # CPU
  {% set cpu_temp = printer.system_stats.cputime %}
  M118 CPU Time: {cpu_temp}s
  
  # Mémoire
  {% set memavail = printer.system_stats.memavail %}
  M118 Memory Available: {memavail}KB
  
  # Températures
  M118 
  M118 TEMPERATURES:
  M118 - Extruder: {printer.extruder.temperature}°C
  M118 - Bed: {printer.heater_bed.temperature}°C
  
  # Axes
  M118 
  M118 AXES:
  {% if 'x' in printer.toolhead.homed_axes %}
    M118 - X: ✅ Homed
  {% else %}
    M118 - X: ❌ Not homed
  {% endif %}
  {% if 'y' in printer.toolhead.homed_axes %}
    M118 - Y: ✅ Homed
  {% else %}
    M118 - Y: ❌ Not homed
  {% endif %}
  {% if 'z' in printer.toolhead.homed_axes %}
    M118 - Z: ✅ Homed
  {% else %}
    M118 - Z: ❌ Not homed
  {% endif %}
  
  M118 ========================================
  M118 Health check complete
  M118 ========================================

[gcode_macro CHECK_CRITICAL_BEFORE_PRINT]
description: Check critical parameters before print
# Source: macros/utilities/system_health.cfg
gcode:
  M118 Checking critical parameters...
  
  # Vérifier homing - WARNING seulement, pas d'erreur
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    M118 ⚠️  WARNING: Printer not homed
    M118 Print start will home automatically
  {% else %}
    M118 ✅ Printer homed
  {% endif %}
  
  # Vérifier bed mesh
  {% if not printer.bed_mesh.profile_name %}
    M118 ⚠️  WARNING: No bed mesh loaded
    M118 Print start will load mesh automatically
  {% else %}
    M118 ✅ Bed mesh loaded: {printer.bed_mesh.profile_name}
  {% endif %}
  
  # Vérifier Z-offset
  {% set offset = printer.gcode_move.homing_origin.z %}
  {% if offset == 0 %}
    M118 ⚠️  WARNING: Z-offset not set
  {% else %}
    M118 ✅ Z-offset: {offset}mm
  {% endif %}
  
  M118 ✅ Pre-print checks complete

# ============================================
# Z-OFFSET VALIDATION
# ============================================

[gcode_macro Z_CHECK_OFFSET]
description: Check Z-offset value and validity
# Source: macros/utilities/z_offset_debug.cfg
gcode:
  {% set offset = printer.gcode_move.homing_origin.z %}
  
  M118 ========================================
  M118 Z-OFFSET CHECK
  M118 ========================================
  M118 Current Offset: {offset}mm
  
  {% if offset > 0.5 %}
    M118 ⚠️  WARNING: Offset very high ({offset}mm)
    M118 Check if this is correct
  {% elif offset < -0.5 %}
    M118 ⚠️  WARNING: Offset very low ({offset}mm)
    M118 Risk of nozzle crash
  {% elif offset == 0 %}
    M118 ⚠️  No offset set
  {% else %}
    M118 ✅ Offset in normal range
  {% endif %}
  M118 ========================================

[gcode_macro Z_TEST_REPEATABILITY]
description: Test Z-offset repeatability
# Source: macros/utilities/z_offset_debug.cfg
gcode:
  M118 ========================================
  M118 Z-OFFSET REPEATABILITY TEST
  M118 ========================================
  M118 Testing probe repeatability (5 samples)...
  
  {% if printer.toolhead.homed_axes != 'xyz' %}
    G28
  {% endif %}
  
  PROBE_ACCURACY SAMPLES=5
  
  M118 ========================================
  M118 Check console for results
  M118 Standard deviation should be < 0.01mm
  M118 ========================================

# ============================================
# PROBE VALIDATION
# ============================================

[gcode_macro VALIDATE_RESUME_OK]
description: Validate that resume is safe
# Source: macros/utilities/common_actions.cfg
gcode:
  {% if printer.pause_resume.is_paused %}
    M118 ✅ Resume validation: OK
  {% else %}
    M118 ❌ ERROR: Print not paused
    {action_raise_error("Cannot resume - print not paused")}
  {% endif %}

