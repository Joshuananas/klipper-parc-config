# ============================================
# GESTION ONDULEUR — contrat _UPS_DATA + reactions (phases 2+3)
# ============================================
# Source de verite : ups_bridge.py (hote) pousse les valeurs NUT ici.
# Aucune macro ne parle a NUT directement.
#
# Machine a etats : watchdog delayed_gcode _UPS_WATCHDOG (2 s).
#   OB detecte (1er cycle)         -> chauffages reduits IMMEDIATEMENT (upsmon
#                                   peut declencher FSD en <5 s sous charge)
#   OB persistant > pause_delay_s  -> PAUSE (si printing)
#   Retour OL                      -> restaure consignes + RESUME si pause-UPS
#   Batterie faible/critique       -> garanties pause + notification (shutdown
#                                   systeme = affaire de upsmon/NUT, pas ici)
# Aucun mouvement non borne : le parking est delegue a PAUSE natif/existant.

[gcode_macro _UPS_DATA]
description: Donnees onduleur alimentees par ups_bridge (hote)
# --- poussees par le bridge (lecture seule pour les macros) ---
variable_ups_present: 0          # 1 si un onduleur est detecte et repond
variable_ups_status: "NO_UPS"    # OL | OB | NOCOMM | NO_UPS
variable_battery_charge: 0.0     # %
variable_runtime_s: 0            # secondes d'autonomie restante estimees
variable_load_pct: 0.0           # % de charge de l'onduleur
variable_input_voltage: 0.0      # tension secteur
# --- seuils locaux (profil, ajustables via SET_GCODE_VARIABLE) ---
variable_pause_delay_s: 10       # hysteresis avant reaction OB
variable_low_charge: 50.0        # % -> batterie faible
variable_low_runtime_s: 600      # s  -> batterie faible
variable_crit_charge: 20.0       # %  -> critique
variable_crit_runtime_s: 300     # s  -> critique
variable_keep_extruder: 50.0     # C  -> buse reduite sur batterie
variable_ups_resume_prime: 15.0  # mm -> extrusion supplementaire a la reprise
                               #    (compense l'ooze/retract pendant la pause UPS)
# --- budget de puissance (mesures SWX2 : repos 4%, lit 53, buse 7, maintien 23) ---
variable_heat_est_bed_pct: 55.0  # pts de load% estimes pour une rampe lit
variable_heat_est_ext_pct: 10.0  # pts de load% estimes pour une rampe buse
variable_budget_pct: 85.0        # plafond de charge secteur avant attente
variable_budget_wait_s: 300      # s max d'attente budget (puis on chauffe quand meme)
variable_stagger_s: 0            # s de decalage par machine avant restauration OL
# --- etat interne watchdog ---
variable_watch_active: 0         # 1 si reaction OB en cours
variable_ob_since: 0             # compteur de cycles OB consecutifs
variable_paused_by_ups: 0        # 1 si la pause a ete demandee par l'UPS
variable_saved_bed: 0.0          # consigne lit sauvegardee
variable_saved_ext: 0.0          # consigne buse sauvegardee
variable_crit_fired: 0           # 1 si passage en critique deja traite
variable_low_fired: 0            # 1 si avertissement faible deja emis
variable_resume_wait_s: 60       # s max d'attente retour en temperature avant RESUME
variable_ol_since: 0             # compteur de cycles OL consecutifs (attente reprise)
gcode:
    M117 Contrat UPS pret

[gcode_macro UPS_STATUS]
description: Affiche l'etat de l'onduleur
gcode:
    {% set u = printer["gcode_macro _UPS_DATA"] %}
    {% if u.ups_present|int == 1 %}
    RESPOND MSG="Onduleur : {u.ups_status}"
    RESPOND MSG="Batterie : {u.battery_charge|round(1)}% — autonomie ~{(u.runtime_s|float / 60)|round(0)} min"
    RESPOND MSG="Charge : {u.load_pct|round(1)}% — secteur : {u.input_voltage|round(1)}V"
    {% if u.watch_active|int == 1 %}
    RESPOND MSG="Reaction coupure active (pause UPS : {u.paused_by_ups})"
    {% endif %}
    {% else %}
    RESPOND MSG="Onduleur : {u.ups_status} (aucun onduleur actif)"
    {% endif %}

[delayed_gcode _UPS_WATCHDOG]
initial_duration: 10
gcode:
    {% set u = printer["gcode_macro _UPS_DATA"] %}
    {% set status = u.ups_status|string %}
    {% set printing = printer.idle_timeout.state == "Printing" %}
    # decalage par machine : variable locale OU valeur persistante save_variables
    {% set stagger = printer.save_variables.variables.ups_stagger_s|default(u.stagger_s|float)|float %}

    {% if u.ups_present|int == 1 and status == "OB" %}
        # ---- Sur batterie ----
        SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ob_since VALUE={u.ob_since|int + 1}
        {% set ob_cycles = u.ob_since|int + 1 %}

        {% if not u.watch_active|int %}
            # OB detecte : economie IMMEDIATE (upsmon peut FSD en quelques secondes)
            SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=watch_active VALUE=1
            SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=saved_bed VALUE={printer.heater_bed.target|float}
            SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=saved_ext VALUE={printer.extruder.target|float}
            RESPOND TYPE=error MSG="Coupure secteur : passage sur batterie onduleur"
            M117 UPS : sur batterie
            SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
            SET_HEATER_TEMPERATURE HEATER=extruder TARGET={u.keep_extruder|float}
        {% elif ob_cycles * 2 >= u.pause_delay_s|float and printing and not u.paused_by_ups|int %}
            # OB persistant : la coupure est reelle -> pause propre
            PAUSE
            SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=paused_by_ups VALUE=1
            {% if 'gcode_macro SET_RESUME_COMPENSATION' in printer %}
                # La buse va refroidir/oozer : prime supplementaire a la reprise
                SET_RESUME_COMPENSATION EXTRA_PRIME={u.ups_resume_prime|float}
            {% endif %}
        {% endif %}

        {% if u.watch_active|int %}
            {% set low = u.battery_charge|float <= u.low_charge|float or u.runtime_s|float <= u.low_runtime_s|float %}
            {% set crit = u.battery_charge|float <= u.crit_charge|float or u.runtime_s|float <= u.crit_runtime_s|float %}
            {% if crit and not u.crit_fired|int %}
                SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=crit_fired VALUE=1
                RESPOND TYPE=error MSG="Batterie onduleur CRITIQUE ({u.battery_charge|round(0)}% / {u.runtime_s}s) — arret propre imminent (upsmon)"
                {% if printing %}
                    # Garantit la pause si le cycle OB n'a pas encore declenche
                    {% if not u.paused_by_ups|int %}
                        PAUSE
                        SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=paused_by_ups VALUE=1
                        {% if 'gcode_macro SET_RESUME_COMPENSATION' in printer %}
                            SET_RESUME_COMPENSATION EXTRA_PRIME={u.ups_resume_prime|float}
                        {% endif %}
                    {% endif %}
                {% endif %}
            {% elif low and not u.low_fired|int %}
                SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=low_fired VALUE=1
                RESPOND TYPE=error MSG="Batterie onduleur faible ({u.battery_charge|round(0)}%)"
            {% endif %}
        {% endif %}

    {% else %}
        # ---- Secteur present (ou onduleur absent/NOCOMM) ----
        {% if u.watch_active|int and status == "OL" %}
            # Decalage par machine : evite que toutes les imprimantes
            # relancent leurs chauffages en meme temps au retour secteur
            {% if stagger > 0 and u.ol_since|int * 2 < stagger %}
                SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ol_since VALUE={u.ol_since|int + 1}
                M117 UPS : attente decalage {u.ol_since|int * 2}/{stagger|round(0)}s
            {% else %}
                # Cycle de restauration : ol_since*2 == stagger (0==0 si pas de decalage)
                {% if u.ol_since|int * 2 == stagger %}
                    RESPOND MSG="Secteur retabli"
                    M117 UPS : secteur retabli
                    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={u.saved_bed|float}
                    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={u.saved_ext|float}
                {% endif %}
                {% set ready = printer.extruder.temperature|float >= (u.saved_ext|float - 10) %}
                {% set waited = (u.ol_since|int * 2 - stagger) >= u.resume_wait_s|float %}
                {% if u.paused_by_ups|int and printer.pause_resume.is_paused and (ready or waited) %}
                    RESUME
                    {% if 'gcode_macro SET_RESUME_COMPENSATION' in printer %}
                        SET_RESUME_COMPENSATION EXTRA_PRIME=0
                    {% endif %}
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=watch_active VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=paused_by_ups VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=crit_fired VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=low_fired VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ol_since VALUE=0
                {% elif not u.paused_by_ups|int or not printer.pause_resume.is_paused %}
                    # Pas de pause-UPS, ou reprise deja faite manuellement
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=watch_active VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=paused_by_ups VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=crit_fired VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=low_fired VALUE=0
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ol_since VALUE=0
                {% else %}
                    # Buse pas encore a temperature : attendre le cycle suivant
                    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ol_since VALUE={u.ol_since|int + 1}
                    {% if (u.ol_since|int + 1) * 2 == 10 %}
                        M117 UPS : reattente buse ({printer.extruder.temperature|round(0)}/{u.saved_ext|round(0)}C)
                    {% endif %}
                {% endif %}
            {% endif %}
        {% elif status == "OL" %}
            SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ol_since VALUE=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ob_since VALUE=0
    {% endif %}

    UPDATE_DELAYED_GCODE ID=_UPS_WATCHDOG DURATION=2

[gcode_macro UPS_POWER_BUDGET]
description: Attend que le budget de puissance onduleur permette une chauffe
# Usage : UPS_POWER_BUDGET [STAGE=bed|extruder|both] [TARGET=temperature cible]
# Attend tant que load_pct + estime > budget_pct (max budget_wait_s, puis chauffe quand meme).
# L'estime est proportionnel au delta a chauffer : le PID tire ~100% loin de la
# cible puis module ; deja chaud = quasi gratuit. Rampe de reference : lit 40C,
# buse 50C (en-dessous de ce delta, l'estime diminue proportionnellement).
# Inerte si pas d'onduleur ou si onduleur sur batterie (UPS_PRINT_GUARD refuse OB).
gcode:
    {% set u = printer["gcode_macro _UPS_DATA"] %}
    {% set stage = params.STAGE|default('bed')|string %}
    {% set target = params.TARGET|default(0)|float %}
    {% if u.ups_present|int == 1 and u.ups_status|string == "OL" %}
        {% if stage == 'extruder' %}
            {% set est_full = u.heat_est_ext_pct|float %}
            {% set ramp_ref = 50.0 %}
            {% set current = printer.extruder.temperature|float %}
        {% elif stage == 'both' %}
            {% set est_full = u.heat_est_bed_pct|float + u.heat_est_ext_pct|float %}
            {% set ramp_ref = 90.0 %}
            {% set current = printer.heater_bed.temperature|float %}
        {% else %}
            {% set est_full = u.heat_est_bed_pct|float %}
            {% set ramp_ref = 40.0 %}
            {% set current = printer.heater_bed.temperature|float %}
        {% endif %}
        # Estime reduit selon le delta restant a chauffer (PID module pres de la cible)
        {% if target > 0 and target > current %}
            {% set est = est_full * [1.0, (target - current) / ramp_ref]|min %}
        {% elif target > 0 %}
            {% set est = 0.0 %}  # deja a temperature : rien a chauffer
        {% else %}
            {% set est = est_full %}  # cible inconnue : pessimisme (rampe complete)
        {% endif %}
        {% set max_iters = (u.budget_wait_s|float / 10)|int %}
        {% for i in range(max_iters) %}
            {% set u2 = printer["gcode_macro _UPS_DATA"] %}
            {% if u2.load_pct|float + est > u.budget_pct|float %}
                M117 UPS : budget {u2.load_pct|round(0)}%+{est|round(0)} > {u.budget_pct|round(0)}% - attente
                G4 P10000
            {% endif %}
        {% endfor %}
        {% set u3 = printer["gcode_macro _UPS_DATA"] %}
        {% if u3.load_pct|float + est > u.budget_pct|float %}
            RESPOND MSG="UPS : budget puissance depasse apres {u.budget_wait_s|round(0)}s d'attente — chauffe quand meme (risque surcharge)"
        {% else %}
            M118 UPS : budget puissance OK ({u3.load_pct|round(0)}% + {est|round(0)}% estime <= {u.budget_pct|round(0)}%)
        {% endif %}
    {% endif %}

[gcode_macro UPS_PRINT_GUARD]
description: Refuse de lancer une impression sur batterie (a appeler en tete de PRINT_START si souhaite)
gcode:
    {% set u = printer["gcode_macro _UPS_DATA"] %}
    {% if u.ups_present|int == 1 and u.ups_status|string == "OB" %}
        {action_raise_error("Impression refusee : onduleur sur batterie. Attendre le retour secteur.")}
    {% endif %}

[gcode_macro UPS_CLEAR]
description: Reinitialise l'etat de reaction UPS (apres intervention manuelle)
gcode:
    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=watch_active VALUE=0
    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ob_since VALUE=0
    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=paused_by_ups VALUE=0
    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=crit_fired VALUE=0
    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=low_fired VALUE=0
    SET_GCODE_VARIABLE MACRO=_UPS_DATA VARIABLE=ol_since VALUE=0
    {% if 'gcode_macro SET_RESUME_COMPENSATION' in printer %}
        SET_RESUME_COMPENSATION EXTRA_PRIME=0
    {% endif %}
    RESPOND MSG="Etat UPS reinitialise"
